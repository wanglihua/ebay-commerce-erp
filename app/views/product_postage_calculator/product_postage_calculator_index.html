<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta charset="utf-8"/>
    <title></title>
    <link rel="stylesheet" href="/static/lib/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/ace/css/bootstrap.min.css">
    <script type="text/javascript" src="/static/ace/js/jquery.min.js"></script>
    <script type="text/javascript" src="/static/ace/js/bootstrap.min.js"></script>

</head>
<body>
<div>
    <div>
        <input id="postcode" name="postcode" placeholder="Enter Postcode"/>
    </div>
    <div id="waiting" style="display: none;">
        <i class="fa fa-refresh fa-spin fa-2x fa-fw"></i>
        <span class="sr-only">Loading...</span>
    </div>
    <div>
        <span id="postage"></span>
    </div>
    <div>
        <button onclick="calculate_postage()">CALCULATE</button>
    </div>

    <script type="text/javascript">
        function calculate_postage() {
            $("#waiting").show();
            $.ajax({
                url: '{%url "ProductPostageCalculator.Post"%}',
                type: "POST",
                data: {
                    "sku": sku,
                    "postcode": $("#postcode").val()
                },
                success: function (data) {
                    $("#waiting").hide();
                    if (data.success === false) {
                        $("#postage").html(data.message);
                        return;
                    }
                    else {
                        $("#postage").html(data.fee);
                        return;
                    }
                }
            });
        }
    </script>

</div>
{%template "product_postage_calculator/product_postage_calculator_index.var" .%}
</body>
</html>
