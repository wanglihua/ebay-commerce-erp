{% site_header "登录" . %}
<div id="navbar" class="navbar navbar-default">
    <script type="text/javascript">
        try {
            ace.settings.check('navbar', 'fixed')
        } catch (e) {
        }
    </script>
    <div class="navbar-container" id="navbar-container">

        <div class="navbar-header pull-left" style="height: 80px;line-height: 80px;">
            <a href='{%url "Home.Index"%}' class="navbar-brand clearfix" style="font-size:36px;">
                <div class="pull-left" style="margin-left: 20px;margin-top: 15px;">
                    {% .sys_name %}
                </div>
            </a>
        </div>
    </div>
</div>
<div class="widget-box" style="width:600px;margin:50px auto 0 auto;">
    <div class="widget-header widget-header-blue widget-header-flat" style="height: 50px;">
        <h3 class="widget-title lighter" style="line-height:50px;">用户登录</h3>
    </div>
    <div class="widget-body">
        <div class="widget-main">
            <form class="form-horizontal" id="loginForm" style="margin: 20px 0 30px 0;" onsubmit="submitLogin();return false;">
                <div class="form-group">
                    <label for="loginName" class="col-xs-3 control-label" style="line-height: 30px;">姓名：</label>
                    <div class="col-xs-8">
                        <span class="block input-icon input-icon-left">
                         <i class="ace-icon fa fa-user" style="line-height: 40px;"></i>
                         <input id="loginName" name="form.LoginName" type="text" class="form-control" placeholder="请输入您的姓名" onkeydown="inputOnKeyDown(event)" style="height: 40px;"/>
                        </span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password" class="col-xs-3 control-label" style="line-height: 30px;">密码：</label>
                    <div class="col-xs-8">
                        <span class="block input-icon input-icon-left">
                         <i class="ace-icon fa fa-key" style="line-height: 40px;"></i>
                         <input id="password" name="form.Password" type="password" class="form-control" placeholder="请输入您的密码" onkeydown="inputOnKeyDown(event)" style="height: 40px;"/>
                        </span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="captcha" class="col-xs-3 control-label" style="line-height: 30px;">验证码：</label>
                    <div class="col-xs-4">
                        <span class="block input-icon input-icon-left">
                         <i class="ace-icon fa fa-asterisk" style="line-height: 40px;"></i>
                         <input id="captcha" name="form.Captcha" type="text" class="form-control" placeholder="请输入您的验证码" onkeydown="inputOnKeyDown(event)" style="height: 40px;"/>
                        </span>
                    </div>
                    <div class="col-xs-4" onclick="refreshCaptcha();" style="cursor: pointer;">
                        <img id="imgCaptcha" alt="验证码" src="" style="height: 40px;"/>
                        <span style="padding-left: 10px;line-height: 40px;color:lightgray;">点击刷新</span>
                    </div>
                </div>
            </form>
            <hr>
            <div class="wizard-actions">
                <button class="btn btn-primary" onclick="submitLogin()">
                    <i class="ace-icon fa fa-user"></i>
                    登录
                </button>
                <button class="btn btn-default" onclick="resetForm()">
                    <i class="ace-icon fa fa-undo"></i>
                    重置
                </button>
                <script type="text/javascript">

                    $(function () {
                        refreshCaptcha();
                    });

                    function refreshCaptcha() {
                        var timestamp = new Date().getTime();
                        $("#imgCaptcha").attr("src", "/captcha/image?" + timestamp);
                        $("#captcha").val("");
                    }

                    function inputOnKeyDown(e) {
                        var ev = window.event || e;
                        if (ev.keyCode == 13) {
                            submitLogin();
                        }
                    }

                    function submitLogin() {
                        var form = $("#loginForm");
                        var valid = validate(
                            form,
                            {
                                'form.LoginName': {
                                    required: true,
                                    minlength: 3,
                                    maxlength: 10
                                },
                                'form.Password': {
                                    required: true,
                                    minlength: 6,
                                    maxlength: 12
                                },
                                'form.Captcha': {
                                    required: true,
                                    digits: true,
                                    minlength: 4,
                                    maxlength: 4
                                }
                            },
                            function (error, element) {
                                error.appendTo(element.parent("span"));
                            }
                        );

                        if (valid) {
                            $.ajax({
                                    url: '{%url "Login.Login"%}',
                                    type: "POST",
                                    data: form.serialize(),
                                    success: function (data) {
                                        if (data.success == true) {
                                            window.location.href = '{%url "Home.Index"%}';
                                            //return;
                                        }
                                        else {
                                            refreshCaptcha();
                                            $.msg.error(data.message);
                                            //return;
                                        }
                                    }
                                }
                            );
                        }
                    }

                    function resetForm() {
                        $('#loginForm')[0].reset();
                    }
                </script>
            </div>
        </div>
    </div>
</div>
{% site_footer %}
