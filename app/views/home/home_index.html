{%header "Home" .%}

<div class="breadcrumbs" id="breadcrumbs">
    <ul class="breadcrumb">
        <li>
            <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
        </li>
        <li class="active">Home</li>
    </ul>
</div>
<div class="page-content">
    <div class="row">
        <div id="page" class="col-xs-12" style="padding: 0;">
            <div id="div_notice_list">
                <table id="notice_list" class="table table-striped table-bordered table-hover">
                    <caption style="font-size: 14px;font-weight: bold;">通知公告</caption>
                    <thead>
                    <tr>
                        <th>标题</th>
                        <th style="width: 100px;">发布人</th>
                        <th style="width: 120px;">发布时间</th>
                    </tr>
                    </thead>
                    <tbody>
                    <template v-for="notice in notice_list">
                        <tr>
                            <td>
                                <a :href='"/notice/view/detail/" + notice.id' target="notice_view_detail">
                                    <span v-if="notice.list_top == 1">
                                        [置顶]
                                    </span>
                                    <span v-if="notice.important == 0">
                                        {{notice.title}}
                                    </span>
                                    <span v-else style="color:red;">
                                        {{notice.title}}
                                    </span>
                                </a>
                            </td>
                            <td>{{notice.login_name}}</td>
                            <td>{{notice.create_time}}</td>
                        </tr>
                    </template>
                    </tbody>
                </table>

            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "notice_list": []
        },
        mounted: function () {

        }
    });

    $(function () {
        loadNoticeData();
    });

    function loadNoticeData() {
        $.ajax({
            url: '{%url "ErpNotice.GetNoticeDataForHomePage" %}',
            type: "POST",
            success: function (result) {
                if (result.success === false) {
                    $.msg.error(result.message);
                    return;
                }
                vm.notice_list = result.notice_list;
            }
        });
    }

</script>
{%footer%}
