                <div style="margin-top:10px;padding-left:5px; font-size: 13px;font-weight: bold;">通知公告</div>

<script type="text/javascript">

    $(function () {
        initDataTable(
            '#notice_list_data',
            {
                "sAjaxSource": '{%url "ErpNotice.GetNoticeListDataForHomePage" %}',
                "aaSorting": [[0, "desc"]],
                "lengthMenu": [[5, 10, 15, 20, 25, 50, 100, 300, 500, 1000, 2000, 3000, 5000, 10000], [5, 10, 15, 20, 25, 50, 100, 300, 500, 1000, 2000, 3000, 5000, 10000]],
                "iDisplayLength": 20,
                "aoColumns": [
                    {"mDataProp": "n.id", "title": "ID", "bSearchable": false, "bSortable": false, "bVisible": false},
                    {
                        "mDataProp": "n.title", "title": "标题", "bSearchable": true, "bSortable": false, "sClass": "wrap-word",
                        "render": function (data, type, row) {
                            var title_str = "<a href='/notice/view/detail/" + row.n.id + "'" + " target='notice_view_detail'>";
                            if (row.n.list_top === 1) {
                                title_str += "<span>[置顶]</span>";
                            }

                            if (row.n.important === 0) {
                                title_str += "<span>" + row.n.title + "</span>";
                            } else {
                                title_str += "<span style='color:red;'>" + row.n.title + "</span>";
                            }

                            title_str += "</a>";

                            return title_str;
                        }
                    },
                    {
                        "mDataProp": "n.is_read", "title": "阅读", "bSearchable": false, "sClass": "center", "bSortable": false, "width": 60,
                        "render": function (data, type, row) {
                            if (row.n.is_read === true) {
                                return '<span style="color: blue;">已阅</span>';
                            } else {
                                return '<span style="color:red;font-weight: bold;"><i class="fa fa-sticky-note"></i>&nbsp;未阅</span>';
                            }
                        }
                    },
                    {"mDataProp": "u.nick_name", "title": "发布人", "bSearchable": false, "bSortable": false, "sClass": "center", "width": 100},
                    {"mDataProp": "n.create_time", "title": "发布时间", "bSearchable": false, "bSortable": false, "sClass": "center", "width": 120}
                ],
                "fnServerData": function (sSource, aoData, fnCallback) {
                    showMask("数据加载中，请稍候");

                    $.ajax({
                        "dataType": 'json',
                        "url": sSource,
                        "data": aoData,
                        "success": function (data) {
                            hideMask();
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            fnCallback(data);
                        }
                    });
                }
            }
        );
    });

    var vm = new Vue({
        el: "#page",
        data: {
            "notice_list": []
        },
        mounted: function () {

        }
    });
