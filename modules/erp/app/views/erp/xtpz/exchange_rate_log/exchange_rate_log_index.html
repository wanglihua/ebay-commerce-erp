{%header "货币汇率操作日志" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xtpz-menu">系统配置</li>
            <li class="active" data-menu="xtpz-exchangerate-menu"><a href='{%url "ErpExchangeRate.Index"%}'>货币汇率</a>
            </li>
            <li>操作日志</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#exchangeRateLogList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div>
                    <table id="exchangeRateLogList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "rate_log": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#exchangeRateLogList',
                {
                    "sAjaxSource": '{%url "ErpExchangeRateLog.ListData"%}',
                    "aaSorting": [[4, "desc"]],
                    "aoColumns": [
                        {"mDataProp": "id", "title": '编号', "bSearchable": false, "sClass": "center", "width": 50},
                        {"mDataProp": "name", "title": "名称", "bSearchable": true, "width": 180},
                        {"mDataProp": "desc", "title": "操作", "bSearchable": true},
                        {"mDataProp": "login_name", "title": "工号", "bSearchable": true, "width": 120},
                        {"mDataProp": "create_time", "title": "操作时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#exchangeRateLogList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showExchangeRateLogDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#exchangeRateLogList');
            }
        }
    });
</script>
{%footer%}
