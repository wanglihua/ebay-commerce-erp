{%header "店铺账号修改日志" .%}
<div id="page">
   <div class="breadcrumbs" id="breadcrumbs">
       <ul class="breadcrumb">
           <li>
               <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
           </li>
           <li class="parent" data-menu="xtpz-menu">ERP</li>
           <li class="active" data-menu="xtpz-shopaccountlog-menu">店铺账号修改日志</li>
       </ul>
   </div>
   <div class="page-content">
       <div class="row">
           <div class="col-xs-12" style="padding: 0;">
               <div class="gridToolBar clearfix">
                   <button class="btn btn-primary btn-sm" @click="reloadList('#shopAccountLogList')">
                       <i class="ace-icon fa fa-refresh"></i>
                       刷新
                   </button>
               </div>
               <div>
                   <table id="shopAccountLogList" class="table table-striped table-bordered table-hover"></table>
               </div>
           </div>
       </div>
   </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "shop_account_log": {}
            }
        },
        mounted: function () {
            initDataTable(
                    '#shopAccountLogList',
                    {
                        "sAjaxSource": '{%url "ErpShopAccountLog.ListData"%}',
                        "aaSorting": [[1, "asc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "shop_code", "title": "店铺编号", "bSearchable": true },
                            {"mDataProp": "login_name", "title": "用户工号", "bSearchable": true },
                            {"mDataProp": "operation", "title": "操作", "bSearchable": true },
                            {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120 }
                        ]
                   }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#shopAccountLogList');
            }
        }
    });
</script>
{%footer%}
