{%header "系统日志" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xtpz-menu">系统配置</li>
            <li class="active" data-menu="xtpz-loginlog-menu">系统日志</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList()">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div class="row" style="margin-top: 20px;margin-bottom: 20px;">
                    <div id="query" class="col-xs-12 query" style="line-height: 28px;">
                        <label class="control-label no-padding-right" for="login_name_query">工号</label>
                        <input id="login_name_query" class="input-sm" onkeydown="queryOnKeyDown(event);" onchange="reloadLoginLogList();" name="login_name_query" placeholder="工号查询" type="text" style="width: 100px;"/>
                        <label class="control-label no-padding-right" for="begin_time_query">开始时间</label>
                        <input class="input-sm" id="begin_time_query" onkeydown="queryOnKeyDown(event);" onchange="reloadLoginLogList();" name="begin_time_query" placeholder="2018-08-08 08:08:08" type="text" style="width: 130px;"/>
                        <label class="control-label no-padding-right" for="end_time_query">结束时间</label>
                        <input class="input-sm" id="end_time_query" onkeydown="queryOnKeyDown(event);" onchange="reloadLoginLogList();" name="end_time_query" placeholder="2018-08-28 08:28:28" type="text" style="width: 130px;"/>
                        <button class="btn btn-mini btn-primary" @click="reloadList()">
                            &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                        </button>
                    </div>
                </div>
                <div>
                    <table id="loginLogList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    function queryOnKeyDown(e) {
        var ev = window.event || e;
        if (ev.keyCode == 13) {
            reloadLoginLogList();
        }
    }

    function reloadLoginLogList() {
        reloadList('#loginLogList');
    }

    $(function () {
        /*
         $('#begin_time_query').datetimepicker({
         locale: "zh-cn"
         }).on("dp.change", function (e) {
         reloadLoginLogList();
         });

         $('#end_time_query').datetimepicker({
         locale: "zh-cn"
         }).on("dp.change", function (e) {
         reloadLoginLogList();
         });
         */
        $('#begin_time_query').datetimepicker({
            locale: "zh-cn"
        });

        $('#end_time_query').datetimepicker({
            locale: "zh-cn"
        });
    });

    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "login_log": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#loginLogList',
                {
                    "sAjaxSource": '{%url "ErpLoginLog.ListData"%}',
                    "aaSorting": [[0, "desc"]],
                    "aoColumns": [
                        {"mDataProp": "id", "title": "记录编号", "bSearchable": false, "sClass": "center", "width": 80},
                        {"mDataProp": "login_name", "title": "工号", "bSearchable": true, "width": 150},
                        {"mDataProp": "ip_address", "title": "IP", "bSearchable": true, "width": 150},
                        {"mDataProp": "create_time", "title": "操作时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "content", "title": "内容", "bSearchable": true, "width": 200},
                        {"mDataProp": "desc", "title": "描述", "bSearchable": true}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        aoData.push({'name': 'login_name_query', 'value': $('#login_name_query').val()});
                        aoData.push({'name': 'begin_time_query', 'value': $('#begin_time_query').val()});
                        aoData.push({'name': 'end_time_query', 'value': $('#end_time_query').val()});

                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    return;
                                }

                                fnCallback(data);
                            }
                        });
                    }
                }
            );
        },
        methods: {
            reloadList: function () {
                reloadLoginLogList();
            }
        }
    });
</script>
{%footer%}
