{%header "系统日志" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xtpz-menu">系统配置</li>
            <li class="active" data-menu="xtpz-loginlog-menu">系统日志</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList()">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div class="row" style="margin-top: 20px;margin-bottom: 20px;">
                    <div id="query" class="col-xs-12" style="line-height: 28px;">
                        <fieldset>
                            <legend style="font-size: 14px;">
                                查询&nbsp;<span style="color: #D5D5D5;">(输入查询条件后点击 刷新 按钮)</span></legend>
                            <div class="col-xs-4">
                                <div class="form-group">
                                    <label class="col-xs-3 control-label no-padding-right" for="login_name_query">工号</label>
                                    <div class="col-xs-8">
                                        <input class="input-sm form-control" id="login_name_query" onkeydown="queryOnKeyDown(event);" onchange="reloadLoginLogList();" name="login_name_query" placeholder="工号查询" type="text">
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-4">
                                <div class="form-group">
                                    <label class="col-xs-3 control-label no-padding-right" for="begin_time_query">开始时间</label>
                                    <div class="col-xs-8">
                                        <input class="input-sm form-control" id="begin_time_query" onkeydown="queryOnKeyDown(event);" onchange="reloadLoginLogList();" name="begin_time_query" placeholder="时间格式2018-08-08 08:08:08" type="text" />
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-4">
                                <div class="form-group">
                                    <label class="col-xs-3 control-label no-padding-right" for="end_time_query">结束时间</label>
                                    <div class="col-xs-8">
                                        <input class="input-sm form-control" id="end_time_query" onkeydown="queryOnKeyDown(event);" onchange="reloadLoginLogList();" name="end_time_query" placeholder="时间格式2018-08-28 08:28:28" type="text" />
                                    </div>
                                </div>
                            </div>
                        </fieldset>
                    </div>
                </div>
                <div>
                    <table id="loginLogList" class="table table-striped table-bordered table-hover"></table>

                    <div class="todo">按工号和时间段查询</div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    function queryOnKeyDown(e) {
        var ev = window.event || e;
        if (ev.keyCode == 13) {
            reloadLoginLogList();
        }
    }

    function reloadLoginLogList() {
        reloadList('#loginLogList');
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "login_log": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#loginLogList',
                {
                    "sAjaxSource": '{%url "ErpLoginLog.ListData"%}',
                    "aaSorting": [[0, "desc"]],
                    "aoColumns": [
                        {"mDataProp": "id", "title": "记录编号", "bSearchable": false, "sClass": "center", "width": 80},
                        {"mDataProp": "login_name", "title": "工号", "bSearchable": true, "width": 150},
                        {"mDataProp": "ip_address", "title": "IP", "bSearchable": true, "width": 150},
                        {"mDataProp": "create_time", "title": "操作时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "content", "title": "内容", "bSearchable": true, "width": 200},
                        {"mDataProp": "desc", "title": "描述", "bSearchable": true}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        aoData.push({'name': 'login_name_query', 'value': $('#login_name_query').val()});
                        aoData.push({'name': 'begin_time_query', 'value': $('#begin_time_query').val()});
                        aoData.push({'name': 'end_time_query', 'value': $('#end_time_query').val()});

                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    return;
                                }

                                fnCallback(data);
                            }
                        });
                    }
                }

            );
        },
        methods: {
            reloadList: function () {
                reloadLoginLogList();
            }
        }
    });
</script>
{%footer%}
