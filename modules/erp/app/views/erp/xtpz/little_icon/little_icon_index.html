{%header "图标管理" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xtpz-menu">系统配置</li>
            <li class="active" data-menu="xtpz-little-icon-menu">图标管理</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" onclick="reloadList('#littleIconList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" onclick="showLittleIconDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="deleteLittleIcon()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="littleIconList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="littleIconDetailDialogWrapper"></div>

<script type="text/javascript" src="/static/lib/plupload/moxie.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/plupload.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/zh_CN.js"></script>

<script type="text/javascript">
    function showLittleIconDetail(id) {
        $.ajax({
                url: '{%url "ErpLittleIcon.Detail" %}',
                type: "POST",
                data: {
                    "id": id
                },
                success: function (result) {
                    if (result.success == false) {
                        $.msg.error(result.message);
                        return;
                    }
                    $("#littleIconDetailDialogWrapper").html(result);
                    $('#littleIconDetailDialog').modal(modalOptions);
                }
            }
        );
    }

    function deleteLittleIcon() {
        var id_list = [];
        $('#littleIconList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length == 0) {
            $.msg.alert("请选择数据！");
            return;
        }

        $.msg.confirm("确认要删除吗？", function () {
            $.ajax({
                url: '{%url "ErpLittleIcon.Delete"%}',
                type: "POST",
                data: {"id_list": id_list},
                success: function (data) {
                    if (data.success == false) {
                        $.msg.error(data.message);
                        return;
                    }
                    else {
                        $.msg.show(data.message);
                    }
                    reloadList('#littleIconList');
                }
            });
        });
    }

    $(function () {
        initDataTable(
            '#littleIconList',
            {
                "sAjaxSource": '{%url "ErpLittleIcon.ListData"%}',
                "aaSorting": [[1, "asc"]],
                "aoColumns": [
                    {
                        "mDataProp": "id",
                        "bSearchable": false,
                        "orderable": false,
                        "sClass": "center",
                        "width": 50,
                        "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                        "render": function (data, type, row) {
                            return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                        }
                    },
                    {
                        "mDataProp": "icon_file", "title": "图标", "bSearchable": true,
                        "render": function (data, type, row) {
                            return '<img style="width:20px;height:20px;" src="{%.icon_path%}' + data + '" alt="' + data + '" />&nbsp;&nbsp;' + '<a target="_blank" href="{%.icon_path%}' + data + '">' + data + '</a>';
                        }
                    },
                    {
                        "mDataProp": "create_time",
                        "title": "创建时间",
                        "bSearchable": false,
                        "width": 120
                    }
                ]
            }
        );

        $('#littleIconList tbody').on('dblclick', 'tr', function () {
            var id = $(this).find('td:first-child input:checkbox').val();
            showLittleIconDetail(id);
        });
    });
</script>
{%footer%}
