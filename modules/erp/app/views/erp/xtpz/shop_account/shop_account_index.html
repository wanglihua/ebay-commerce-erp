{%header "店铺账号" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xtpz-menu">系统配置</li>
            <li class="active" data-menu="xtpz-shopaccount-menu">店铺账号</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#shopAccountList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showShopAccountDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-purple btn-sm" @click="showEBayAPIConfigDetail()">
                        <i class="ace-icon fa fa-list-ul"></i>
                        API 配置
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteShopAccount()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                    <button class="btn btn-info btn-sm" @click="showShopAccountLog()">
                        <i class="ace-icon fa fa-book"></i>
                        操作日志
                    </button>
                </div>
                <div>
                    <table id="shopAccountList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="shopAccountDetailDialog">
        <div class="modal-dialog" style="width: 580px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">店铺账号详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="shopAccountDetailForm">
                                <input id="shop_account_id" name="detail.shop_account.id" type="hidden" v-model.number="detail.shop_account.id"/>
                                <input id="shop_account_version" name="detail.shop_account.version" type="hidden" v-model.number="detail.shop_account.version"/>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="code" class="col-xs-2 control-label">编号</label>
                                            <div class="col-xs-10">
                                                <input id="code" name="detail.shop_account.code" type="text" class="input-sm form-control" v-model="detail.shop_account.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="name" class="col-xs-2 control-label">名称</label>
                                            <div class="col-xs-10">
                                                <input id="name" name="detail.shop_account.name" type="text" class="input-sm form-control" v-model="detail.shop_account.name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="platform" class="col-xs-2 control-label">平台</label>
                                            <div class="col-xs-10">
                                                <select id="platform" name="detail.shop_account.platform_id" class="input-sm form-control" v-model="detail.shop_account.platform_id">
                                                    <template v-for="platform in detail.platform_list">
                                                        <option :value="platform.id">{{platform.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-2 control-label">描述</label>
                                            <div class="col-xs-10">
                                                <textarea id="desc" name="detail.shop_account.desc" rows="2" class="input-sm form-control" v-model="detail.shop_account.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="paypal_account" class="col-xs-2 control-label">Paypal账号</label>
                                            <div class="col-xs-10">
                                                <textarea id="paypal_account" name="detail.shop_account.paypal_account" rows="2" class="input-sm form-control" placeholder='Paypal账号,多个账号以逗号","隔开' v-model="detail.shop_account.paypal_account"></textarea>
                                                <span class="help-block">Paypal账号,多个账号以逗号","隔开</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="manager" class="col-xs-2 control-label">负责人</label>
                                            <div class="col-xs-10">
                                                <input id="manager" name="detail.shop_account.manager" type="text" class="input-sm form-control" v-model="detail.shop_account.manager"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="status_id" class="col-xs-2 control-label">状态</label>
                                            <div class="col-xs-10">
                                                <select id="status_id" name="detail.shop_account.status_id" class="input-sm form-control" v-model.number="detail.shop_account.status_id">
                                                    <template v-for="status in detail.status_list">
                                                        <option :value="status.id">{{status.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveShopAccount()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="eBayAPIConfigDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">店铺 ebay API 配置详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="eBayAPIConfigDetailForm">
                                <input id="ebay_api_config_id" name="config_detail.api_config.id" type="hidden" v-model.number="config_detail.api_config.id"/>
                                <input id="ebay_api_config_version" name="config_detail.api_config.version" type="hidden" v-model.number="config_detail.api_config.version"/>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="ebay_api_shop_name" class="col-xs-2 control-label">店铺</label>
                                            <div class="col-xs-10">
                                                <input id="ebay_api_shop_id" name="config_detail.api_config.shop_id" type="hidden" v-model="config_detail.api_config.shop_id"/>
                                                <input id="ebay_api_shop_name" name="config_detail.shop_name" type="text" disabled="disabled" class="input-sm form-control" v-model="config_detail.shop_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="ebay_api_app_id" class="col-xs-2 control-label">AppID</label>
                                            <div class="col-xs-10">
                                                <input id="ebay_api_app_id" name="config_detail.api_config.app_id" type="text" class="input-sm form-control" v-model="config_detail.api_config.app_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="ebay_api_cert_id" class="col-xs-2 control-label">CertID</label>
                                            <div class="col-xs-10">
                                                <input id="ebay_api_cert_id" name="config_detail.api_config.cert_id" type="text" class="input-sm form-control" v-model="config_detail.api_config.cert_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="ebay_api_dev_id" class="col-xs-2 control-label">DevID</label>
                                            <div class="col-xs-10">
                                                <input id="ebay_api_dev_id" name="config_detail.api_config.dev_id" type="text" class="input-sm form-control" v-model="config_detail.api_config.dev_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="ebay_api_token" class="col-xs-2 control-label">Token</label>
                                            <div class="col-xs-10">
                                                <textarea id="ebay_api_token" name="config_detail.api_config.token" rows="6" class="input-sm form-control" v-model="config_detail.api_config.token"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger btn-sm" :disabled="config_detail.api_config.id == 0" @click="deleteEBayAPIConfig()">
                        <i class="ace-icon fa fa-floppy-o"></i>删除配置
                    </button>
                    <button type="button" class="btn btn-success btn-sm" @click="saveEBayAPIConfig()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "shop_account": {},
                "platform_list": [],
                "status_list": []
            },
            "config_detail": {
                "api_config": {},
                "shop_name": ""
            }
        },
        mounted: function () {
            initDataTable(
                '#shopAccountList',
                {
                    "sAjaxSource": '{%url "ErpShopAccount.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "a.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "a.code", "title": "编号", "bSearchable": true, "width": 100},
                        {"mDataProp": "a.name", "title": "名称", "bSearchable": true, "width": 150},
                        {"mDataProp": "p.name", "title": "平台", "bSearchable": true, "width": 150},
                        {"mDataProp": "a.desc", "title": "描述", "bSearchable": true},
                        {"mDataProp": "a.manager", "title": "负责人", "bSearchable": true, "width": 150},
                        {"mDataProp": "a.token_expire", "title": "Token过期时间", "bSearchable": false, "width": 150},
                        {"mDataProp": "a.token_result", "title": "Token验证结果", "bSearchable": true, "width": 150},
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": true, "width": 80},
                        {"mDataProp": "a.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "a.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#shopAccountList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showShopAccountDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#shopAccountList');
            },
            showShopAccountLog: function () {
                window.location.href = "/erp/shop/account/log";
            },
            showShopAccountDetail: function (id) {
                showMask("加载中...");
                $("#shopAccountDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpShopAccount.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#shopAccountDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveShopAccount: function () {
                showMask("提交中...");
                var form = $("#shopAccountDetailForm");
                var valid = validate(form, {
                    'detail.shop_account.code': {
                        required: true, minlength: 2, maxlength: 10
                    },
                    'detail.shop_account.name': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.shop_account.platform': {
                        required: true
                    },
                    'detail.shop_account.desc': {
                        required: false, maxlength: 500
                    },
                    'detail.shop_account.manager': {
                        required: false, maxlength: 30
                    },
                    'detail.shop_account.token_result': {
                        required: false
                    },
                    'detail.shop_account.status_id': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpShopAccount.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#shopAccountDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteShopAccount: function () {
                var id_list = [];
                $('#shopAccountList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpShopAccount.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            },
            showEBayAPIConfigDetail: function () {
                var id_list = [];
                $('#shopAccountList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length != 1) {
                    $.msg.alert("请选择一行数据！");
                    return;
                }

                var shop_id = id_list[0];

                showMask("加载中...");
                $("#eBayAPIConfigDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpEBayAPIConfig.DetailData" %}',
                        type: "POST",
                        data: {
                            "shop_id": shop_id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.config_detail = result;
                            $('#eBayAPIConfigDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveEBayAPIConfig: function () {
                showMask("提交中...");
                var form = $("#eBayAPIConfigDetailForm");
                var valid = validate(form, {
                    'config_detail.api_config.shop_id': {
                        required: true
                    },
                    'config_detail.api_config.app_id': {
                        required: true
                    },
                    'config_detail.api_config.cert_id': {
                        required: true
                    },
                    'config_detail.api_config.dev_id': {
                        required: true
                    },
                    'config_detail.api_config.token': {
                        required: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpEBayAPIConfig.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.config_detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    vm.reloadList();
                                    $('#eBayAPIConfigDetailDialog').modal('hide');
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteEBayAPIConfig: function () {
                var id = vm.config_detail.api_config.id;
                $.msg.confirm("确认要删除该店铺的API配置吗？", function () {
                    $.ajax({
                        url: '{%url "ErpEBayAPIConfig.Delete"%}',
                        type: "POST",
                        data: {"id": id},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                //return;
                            }
                            else {
                                $.msg.show(data.message);
                                $('#eBayAPIConfigDetailDialog').modal('hide');
                                //return;
                            }
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
