{%header "电商平台" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xtpz-menu">系统配置</li>
            <li class="active" data-menu="xtpz-ecommerceplatform-menu">电商平台</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#eCommercePlatformList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <!--
                    <button class="btn btn-success btn-sm" @click="showECommercePlatformDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteECommercePlatform()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                    -->
                </div>
                <div>
                    <table id="eCommercePlatformList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="eCommercePlatformDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">电商平台详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="eCommercePlatformDetailForm">
                                <input id="e_commerce_platform_id" name="detail.platform.id" type="hidden" v-model.number="detail.platform.id"/>
                                <input id="e_commerce_platform_version" name="detail.platform.version" type="hidden" v-model.number="detail.platform.version"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="name" class="col-xs-2 control-label">名称</label>
                                            <div class="col-xs-10">
                                                <input id="name" name="detail.platform.name" type="text" class="input-sm form-control" v-model="detail.platform.name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-2 control-label">描述</label>
                                            <div class="col-xs-10">
                                                <input id="desc" name="detail.platform.desc" type="text" class="input-sm form-control" v-model="detail.platform.desc"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveECommercePlatform()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "platform": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#eCommercePlatformList',
                {
                    "sAjaxSource": '{%url "ErpECommercePlatform.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "name", "title": "名称", "bSearchable": true, "width": 280},
                        {"mDataProp": "desc", "title": "描述", "bSearchable": true},
                        {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#eCommercePlatformList');
            }
        }
    });
</script>
{%footer%}
