{%header "集装箱调拨" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="hgbg-menu">海关报关</li>
            <li class="active" data-menu="hgbg-container-transfer-menu">集装箱调拨</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" onclick="reloadContainerTransferList()">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" onclick="showContainerTransferDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="deleteContainerTransfer()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                    <button class="btn btn-pink btn-sm" onclick="departContainerTransfer()" {% .to_zt_stock_disabled %}>
                        <i class="ace-icon fa fa-ship"></i>
                        调拨至在途仓
                    </button>
                    <button class="btn btn-pink btn-sm" onclick="stockContainerTransfer()" {% .to_au_stock_disabled %}>
                        <i class="ace-icon fa fa-bank"></i>
                        调拨至澳洲仓
                    </button>
                </div>
                <div>
                    <table id="containerTransferList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "transfer": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#containerTransferList',
                {
                    "sAjaxSource": '{%url "ErpContainerTransfer.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "ct.id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {
                            "mDataProp": "ct.batch_code", "title": "批次号", "bSearchable": true,
                            "render": function (data, type, row) {
                                return "<a href='javascript:showContainerTransferDetail(" + row.ct.id + ")'>" + data + "</a>";
                            }
                        },
                        {"mDataProp": "ct.start_port_name", "title": "起始港口", "bSearchable": true, "width": 150},
                        {"mDataProp": "ct.dest_port_name", "title": "目的港口", "bSearchable": true, "width": 150},
                        {"mDataProp": "ct.packing_time", "title": "装箱时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "ct.departure_time", "title": "预计到港时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "ct.stock_time", "title": "预计到仓时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": true, "width": 80},
                        {
                            "mDataProp": "ct.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 100,
                            "title": '操作',
                            "render": function (data, type, row) {
                                return "<a class='btn btn-xs btn-info btn-inline pull-left' onclick='show_log_dialog(" + data + ");' ><i class='ace-icon fa fa-list'></i>查看历史</a>";
                            }
                        }
                    ]
                }
            );

            $('#containerTransferList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                showContainerTransferDetail(id);
            });
        },
        methods: {}
    });


    function reloadContainerTransferList() {
        reloadList('#containerTransferList');
    }

    function showContainerTransferDetail(id) {
        window.open("/container/transfer/detail/" + id);
    }

    function deleteContainerTransfer() {
        var id_list = [];
        $('#containerTransferList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length === 0) {
            $.msg.alert("请选择数据！");
            return;
        }

        $.msg.confirm("确认要删除吗？", function () {
            $.ajax({
                url: '{%url "ErpContainerTransfer.Delete"%}',
                type: "POST",
                data: {"id_list": id_list},
                success: function (data) {
                    if (data.success === false) {
                        $.msg.error(data.message);
                        return;
                    }
                    else {
                        $.msg.show(data.message);
                    }
                    reloadContainerTransferList();
                }
            });
        });
    }

    function departContainerTransfer() {
        var id_list = [];
        $('#containerTransferList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length !== 1) {
            $.msg.alert("请选择一条数据！");
            return;
        }

        var transfer_id = id_list[0];

        $.msg.confirm("设置为调拨至在途仓状态后，将不能修改调拨和明细，并会更新仓库库存，是否继续？", function () {
            $.ajax({
                url: '{% url "ErpContainerTransfer.Depart" %}',
                type: "POST",
                data: {"transfer_id": transfer_id},
                success: function (data) {
                    if (data.success === false) {
                        $.msg.error(data.message);
                        return;
                    }
                    else {
                        $.msg.show(data.message);
                    }
                    reloadContainerTransferList();
                }
            });
        });
    }

    function stockContainerTransfer() {
        var id_list = [];
        $('#containerTransferList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length !== 1) {
            $.msg.alert("请选择一条数据！");
            return;
        }

        var transfer_id = id_list[0];

        $.msg.confirm("设置为调拨至澳洲仓状态后，将会更新仓库库存，是否继续？", function () {
            $.ajax({
                url: '{% url "ErpContainerTransfer.Stock" %}',
                type: "POST",
                data: {"transfer_id": transfer_id},
                success: function (data) {
                    if (data.success === false) {
                        $.msg.error(data.message);
                        return;
                    }
                    else {
                        $.msg.show(data.message);
                    }
                    reloadContainerTransferList();
                }
            });
        });
    }

    function show_log_dialog(transfer_id) {
        function load_container_transfer_log(transfer_id) {
            var history_vm = new Vue({
                el: "#container_transfer_log_dialog",
                data: {}
            });

            initDataTable(
                '#containerTransferLogList',
                {
                    "sAjaxSource": '{%url "ErpContainerTransferLog.ListData"%}',
                    "aaSorting": [[0, "desc"]],
                    "aoColumns": [
                        {"mDataProp": "create_time", "title": "时间", "sClass": "center", "bSearchable": false, "bSortable": false, "width": 120},
                        {"mDataProp": "login_name", "title": "工号", "sClass": "center", "bSearchable": false, "bSortable": false, "width": 120},
                        {
                            "mDataProp": "operation", "title": "描述", "bSearchable": true, "bSortable": false,
                            "render": function (data, type, row) {
                                return "<div style='white-space:normal; word-break: break-all; word-wrap:break-word;'>" + data + "</div>";
                            }
                        }

                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'transfer_id', 'value': transfer_id});

                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                hideMask();

                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    return;
                                }

                                fnCallback(data);
                            }
                        });
                    }
                }
            );
        }

        $("#container_transfer_log_wrapper").html("");

        $.ajax({
            url: '{%url "ErpContainerTransferLog.Index" %}',
            type: "POST",
            data: {"transfer_id": transfer_id},
            success: function (result) {
                $("#container_transfer_log_wrapper").html(result);
                load_container_transfer_log(transfer_id);
                $("#container_transfer_log_dialog").modal();
            }
        });
    }
</script>
<div id="container_transfer_log_wrapper"></div>
{%footer%}
