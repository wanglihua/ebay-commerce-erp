{%header "集装箱调拨" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="hgbg-menu">海关报关</li>
            <li class="active" data-menu="hgbg-container-transfer-menu">集装箱调拨</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" onclick="reloadContainerTransferList()">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" onclick="showContainerTransferDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="deleteContainerTransfer()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="containerTransferList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "transfer": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#containerTransferList',
                {
                    "sAjaxSource": '{%url "ErpContainerTransfer.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {
                            "mDataProp": "batch_code", "title": "批次号", "bSearchable": true, "width": 150,
                            "render": function (data, type, row) {
                                return "<a href='javascript:showContainerTransferDetail(" + row.id + ")'>" + data + "</a>";
                            }
                        },
                        {"mDataProp": "container_code", "title": "集装箱号", "bSearchable": true, "width": 150},
                        {"mDataProp": "bl_no", "title": "提单号", "bSearchable": true, "width": 150},
                        {"mDataProp": "seal_no", "title": "铅封号", "bSearchable": true},
                        {"mDataProp": "start_port_name", "title": "起始港口", "bSearchable": true, "width": 150},
                        {"mDataProp": "dest_port_name", "title": "目的港口", "bSearchable": true, "width": 150},
                        {"mDataProp": "packing_time", "title": "装箱时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#containerTransferList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                showContainerTransferDetail(id);
            });
        },
        methods: {}
    });


    function reloadContainerTransferList() {
        reloadList('#containerTransferList');
    }

    function showContainerTransferDetail(id) {
        window.open("/container/transfer/detail/" + id);
    }

    function deleteContainerTransfer() {
        var id_list = [];
        $('#containerTransferList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length === 0) {
            $.msg.alert("请选择数据！");
            return;
        }

        $.msg.confirm("确认要删除吗？", function () {
            $.ajax({
                url: '{%url "ErpContainerTransfer.Delete"%}',
                type: "POST",
                data: {"id_list": id_list},
                success: function (data) {
                    if (data.success === false) {
                        $.msg.error(data.message);
                        return;
                    }
                    else {
                        $.msg.show(data.message);
                    }
                    reloadContainerTransferList();
                }
            });
        });
    }
</script>
{%footer%}
