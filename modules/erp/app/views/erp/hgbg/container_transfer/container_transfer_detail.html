{%header "集装箱调拨" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="hgbg-menu">海关报关</li>
            <li class="active" data-menu="hgbg-container-transfer-menu">
                <a href='{%url "ErpContainerTransfer.Index" %}'>集装箱调拨</a>
            </li>
            <li>集装箱调拨详细</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div id="detail">
                    <div class="gridToolBar clearfix">
                        <button class="btn btn-primary btn-sm" onclick="reloadPageData()">
                            <i class="ace-icon fa fa-refresh"></i>
                            刷新
                        </button>
                        <button class="btn btn-purple btn-sm" onclick="addContainerTransfer()">
                            <i class="ace-icon fa fa-plus"></i>
                            新增
                        </button>
                        <button class="btn btn-success btn-sm" onclick="saveContainerTransfer()">
                            <i class="ace-icon fa fa-floppy-o"></i>保存
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="deleteContainerTransfer()">
                            <i class="ace-icon fa fa-trash-o"></i>
                            删除
                        </button>
                        <button class="btn btn-pink btn-sm">
                            <i class="ace-icon fa fa-file-excel-o"></i>
                            导出中国海关申报元素
                        </button>
                    </div>
                    <div style="margin-top: 25px;">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="containerTransferDetailForm">
                                <input id="container_transfer_id" name="detail.transfer.id" type="hidden" v-model.number="detail.transfer.id"/>
                                <div class="row">
                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="batch_code" class="col-xs-4 control-label">批次号</label>
                                            <div class="col-xs-8">
                                                <input id="batch_code" name="detail.transfer.batch_code" type="text" class="input-sm form-control" v-model="detail.transfer.batch_code"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="container_code" class="col-xs-4 control-label">集装箱号</label>
                                            <div class="col-xs-8">
                                                <input id="container_code" name="detail.transfer.container_code" type="text" class="input-sm form-control" v-model="detail.transfer.container_code"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="bl_no" class="col-xs-4 control-label">提单号</label>
                                            <div class="col-xs-8">
                                                <input id="bl_no" name="detail.transfer.bl_no" type="text" class="input-sm form-control" v-model="detail.transfer.bl_no"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="seal_no" class="col-xs-4 control-label">铅封号</label>
                                            <div class="col-xs-8">
                                                <input id="seal_no" name="detail.transfer.seal_no" type="text" class="input-sm form-control" v-model="detail.transfer.seal_no"/>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                                <div class="row">

                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="dest_stock_id" class="col-xs-4 control-label">目的仓库</label>
                                            <div class="col-xs-8">
                                                <select id="dest_stock_id" name="detail.transfer.dest_stock_id" class="input-sm form-control" v-model.number="detail.transfer.dest_stock_id" @change="getL2ParentCateList">
                                                    <template v-for="stock in detail.au_stock_list">
                                                        <option :value="stock.id">{{stock.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="price_up_rate" class="col-xs-4 control-label">非征品上调</label>
                                            <div class="col-xs-8">
                                                <input id="price_up_rate" name="detail.transfer.price_up_rate" type="text" class="input-sm form-control" v-model.number="detail.transfer.price_up_rate"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="price_down_rate" class="col-xs-4 control-label">征税品下调</label>
                                            <div class="col-xs-8">
                                                <input id="price_down_rate" name="detail.transfer.price_down_rate" type="text" class="input-sm form-control" v-model.number="detail.transfer.price_down_rate"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="cost_up_rate" class="col-xs-4 control-label">成本上调</label>
                                            <div class="col-xs-8">
                                                <input id="cost_up_rate" name="detail.transfer.cost_up_rate" type="text" class="input-sm form-control" v-model.number="detail.transfer.cost_up_rate"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="total_volumn" class="col-xs-4 control-label">总体积</label>
                                            <div class="col-xs-8">
                                                <input id="total_volumn" name="detail.transfer.total_volumn" type="text" class="input-sm form-control" disabled="disabled" v-model.number="detail.transfer.total_volumn"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="total_weight" class="col-xs-4 control-label">总重量</label>
                                            <div class="col-xs-8">
                                                <input id="total_weight" name="detail.transfer.total_weight" type="text" class="input-sm form-control" disabled="disabled" v-model.number="detail.transfer.total_weight"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="total_amount1" class="col-xs-4 control-label">总金额1</label>
                                            <div class="col-xs-8">
                                                <input id="total_amount1" name="detail.transfer.total_amount1" type="text" class="input-sm form-control" disabled="disabled" v-model.number="detail.transfer.total_amount1"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="total_amount2" class="col-xs-4 control-label">总金额2</label>
                                            <div class="col-xs-8">
                                                <input id="total_amount2" name="detail.transfer.total_amount2" type="text" class="input-sm form-control" disabled="disabled" v-model.number="detail.transfer.total_amount2"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="packing_time" class="col-xs-4 control-label">装箱时间</label>
                                            <div class="col-xs-8">
                                                <input id="packing_time" name="detail.transfer.packing_time" type="text" class="input-sm form-control" v-model="detail.transfer.packing_time"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="departure_time" class="col-xs-4 control-label">到港时间</label>
                                            <div class="col-xs-8">
                                                <input id="departure_time" name="detail.transfer.departure_time" type="text" class="input-sm form-control" v-model="detail.transfer.departure_time"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-3">
                                        <div class="form-group">
                                            <label for="stock_time" class="col-xs-4 control-label">到仓时间</label>
                                            <div class="col-xs-8">
                                                <input id="stock_time" name="detail.transfer.stock_time" type="text" class="input-sm form-control" v-model="detail.transfer.stock_time"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div id="entries">
                    <div class="row">
                        <div class="col-xs-6">
                            <h5 class="modal-title" style="font-size:13px; margin-top: 15px;">集装箱调拨明细</h5>
                        </div>
                    </div>
                    <hr style="margin-top: 5px;margin-bottom: 15px;"/>

                    <div class="gridToolBar clearfix">
                        <button class="btn btn-primary btn-sm" onclick="reloadEntryList()">
                            <i class="ace-icon fa fa-refresh"></i>
                            刷新
                        </button>
                        <button class="btn btn-success btn-sm" onclick="showEntryDetail(0)">
                            <i class="ace-icon fa fa-plus"></i>
                            新增
                        </button>
                        <button id="btnImportEntries" class="btn btn-purple btn-sm">
                            <i class="ace-icon fa fa-plus"></i>
                            导入
                        </button>
                        <button class="btn btn-purple btn-sm">
                            <i class="ace-icon fa fa-file-excel-o"></i>
                            导出
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="deleteEntry()">
                            <i class="ace-icon fa fa-trash-o"></i>
                            删除
                        </button>
                    </div>
                    <div>
                        <table id="entry_list" class="table table-striped table-bordered table-hover"></table>
                    </div>
                    <div class="modal fade" id="containerTransferEntryDetailDialog">
                        <div class="modal-dialog" style="width: 580px;">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                                    <h4 class="modal-title">集装箱调拨明细详细</h4>
                                </div>
                                <div class="modal-body clearfix">
                                    <div class="row">
                                        <div class="col-xs-12">
                                            <form class="form-horizontal" role="form" id="containerTransferEntryDetailForm">
                                                <input id="container_transfer_entry_id" name="detail.transfer_entry.id" type="hidden" v-model.number="detail.transfer_entry.id"/>
                                                <input id="transfer_id" name="detail.transfer_entry.transfer_id" type="hidden" class="input-sm form-control" v-model.number="detail.transfer_entry.transfer_id"/>
                                                <input id="product_id" name="detail.transfer_entry.product_id" type="hidden" class="input-sm form-control" v-model.number="detail.transfer_entry.product_id"/>

                                                <div class="row">
                                                    <div class="col-xs-12">
                                                        <div class="form-group">
                                                            <label for="product_sku" class="col-xs-2 control-label">SKU</label>
                                                            <div class="col-xs-10">
                                                                <input id="product_sku" name="detail.transfer_entry.product_sku" type="text" class="input-sm form-control" v-model="detail.transfer_entry.product_sku"/>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div class="row">
                                                    <div class="col-xs-12">
                                                        <div class="form-group">
                                                            <label for="qty" class="col-xs-2 control-label">数量</label>
                                                            <div class="col-xs-10">
                                                                <input id="qty" name="detail.transfer_entry.qty" type="text" class="input-sm form-control" v-model.number="detail.transfer_entry.qty"/>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div class="row">
                                                    <div class="col-xs-12">
                                                        <div class="form-group">
                                                            <label for="box_qty" class="col-xs-2 control-label">箱数</label>
                                                            <div class="col-xs-10">
                                                                <input id="box_qty" name="detail.transfer_entry.box_qty" type="text" class="input-sm form-control" v-model.number="detail.transfer_entry.box_qty"/>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div class="row">
                                                    <div class="col-xs-12">
                                                        <div class="form-group">
                                                            <label for="price" class="col-xs-2 control-label">价格</label>
                                                            <div class="col-xs-10">
                                                                <input id="price" name="detail.transfer_entry.price" type="text" class="input-sm form-control" v-model.number="detail.transfer_entry.price"/>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>

                                            </form>
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-success btn-sm" onclick="saveEntry()">
                                        <i class="ace-icon fa fa-floppy-o"></i>保存
                                    </button>
                                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                                        <i class="ace-icon fa fa-times"></i>关闭
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{%template "erp/hgbg/container_transfer/container_transfer_detail.var" .%}
<script type="text/javascript">
    var detai_vm = new Vue({
        el: "#detail",
        data: {
            "detail": {
                "transfer": {}
            }
        },
        mounted: function () {
        },
        methods: {}
    });

    var entries_vm = new Vue({
        el: "#entries",
        data: {
            "detail": {
                "transfer_entry": {}
            }
        },
        mounted: function () {
        },
        methods: {}
    });

    $(function () {

        $('#packing_time').datetimepicker({
            locale: "zh-cn"
        });

        $('#departure_time').datetimepicker({
            locale: "zh-cn"
        });

        $('#stock_time').datetimepicker({
            locale: "zh-cn"
        });

        initDataTable(
            '#entry_list',
            {
                "sAjaxSource": '{%url "ErpContainerTransferEntry.ListData"%}',
                "aaSorting": [[1, "asc"]],
                "aoColumns": [
                    {
                        "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                        "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                        "render": function (data, type, row) {
                            return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                        }
                    },
                    {"mDataProp": "batch_code", "title": "批次号", "bSearchable": false, "width": 150},
                    {"mDataProp": "product_sku", "title": "SKU", "bSearchable": true},
                    {"mDataProp": "qty", "title": "数量", "bSearchable": false, "width": 100},
                    {"mDataProp": "box_qty", "title": "箱数", "bSearchable": false, "width": 100},
                    {"mDataProp": "price", "title": "价格", "bSearchable": true, "width": 100},
                    {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                    {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                ],
                "fnServerData": function (sSource, aoData, fnCallback) {
                    showMask("数据加载中，请稍候");

                    aoData.push({'name': 'transfer_id', 'value': transfer_id});

                    $.ajax({
                        "dataType": 'json',
                        "url": sSource,
                        "data": aoData,
                        "success": function (data) {
                            hideMask();

                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }

                            fnCallback(data);
                        }
                    });
                }
            }
        );

        $('#entry_list tbody').on('dblclick', 'tr', function () {
            var id = $(this).find('td:first-child input:checkbox').val();
            showEntryDetail(id);
        });

        reloadTransferDetail();
        //reloadPageData();
    });

    function reloadPageData() {
        // 刷新 详细 和 明细
        reloadTransferDetail();
        reloadEntryList();
    }

    function reloadTransferDetail() {
        //详细
        $.ajax({
                url: '{%url "ErpContainerTransfer.DetailData" %}',
                type: "POST",
                data: {
                    "id": transfer_id
                },
                success: function (result) {
                    if (result.success === false) {
                        $.msg.error(result.message);
                        return;
                    }
                    detai_vm.detail = result;

                    if (detai_vm.detail.transfer.packing_time < '2000-01-01 00:00') {
                        detai_vm.detail.transfer.packing_time = null;
                    }
                    if (detai_vm.detail.transfer.departure_time < '2000-01-01 00:00') {
                        detai_vm.detail.transfer.departure_time = null;
                    }
                    if (detai_vm.detail.transfer.stock_time < '2000-01-01 00:00') {
                        detai_vm.detail.transfer.stock_time = null;
                    }
                }
            }
        );
    }

    function addContainerTransfer() {
        window.location.href = "/container/transfer/detail/0";
    }

    function saveContainerTransfer() {
        showMask("提交中...");
        var form = $("#containerTransferDetailForm");
        var valid = validate(form, {
            'detail.transfer.batch_code': {
                required: true
            },
            'detail.transfer.dest_stock_id': {
                required: true, digits: true
            },
            'detail.transfer.dest_stock_name': {
                required: true
            },
            'detail.transfer.container_code': {
                required: true, minlength: 2, maxlength: 100
            },
            'detail.transfer.bl_no': {
                required: true, minlength: 2, maxlength: 100
            },
            'detail.transfer.seal_no': {
                required: true, minlength: 2, maxlength: 100
            },
            'detail.transfer.price_up_rate': {
                required: true
            },
            'detail.transfer.price_down_rate': {
                required: true
            },
            'detail.transfer.cost_up_rate': {
                required: true
            },
            'detail.transfer.packing_time': {
                required: true
            },
            'detail.transfer.departure_time': {
                required: true
            },
            'detail.transfer.stock_time': {
                required: true
            }
        });

        if (!valid) {
            hideMask();
        } else {
            detai_vm.detail.transfer.packing_time = $("#packing_time").val();
            detai_vm.detail.transfer.departure_time = $("#departure_time").val();
            detai_vm.detail.transfer.stock_time = $("#stock_time").val();

            $.ajax({
                    url: '{%url "ErpContainerTransfer.Save"%}',
                    type: "POST",
                    processData: false,
                    contentType: 'application/json',
                    data: JSON.stringify(detai_vm.detail),
                    success: function (data) {
                        hideMask();
                        if (data.success === false) {
                            $.msg.error(data.message);
                            //return;
                        }
                        else {
                            $.msg.show(data.message);

                            reloadContainerTransferList();

                            if (data.is_create === true) {
                                setTimeout("window.location.href = '/container/transfer/detail/" + data.transfer_id + "';", 1000);
                                //return;
                            }
                            else {
                                reloadPageData();
                                //return;
                            }
                        }
                    }
                }
            );
        }
    }

    function deleteContainerTransfer() {
        var id_list = [transfer_id];

        $.msg.confirm("确认要删除吗？", function () {
            $.ajax({
                url: '{%url "ErpContainerTransfer.Delete"%}',
                type: "POST",
                data: {"id_list": id_list},
                success: function (data) {
                    if (data.success === false) {
                        $.msg.error(data.message);
                        return;
                    }
                    else {
                        $.msg.show(data.message);
                        reloadContainerTransferList();
                        setTimeout("window.close();", 1000);
                        return;
                    }

                }
            });
        });
    }

    function reloadContainerTransferList() {
        try {
            window.opener.reloadContainerTransferList();
        } catch (e) {

        }
    }

    function reloadEntryList() {
        reloadList('#entry_list');
    }

    function showEntryDetail(id) {
        showMask("加载中...");
        $("#containerTransferEntryDetailForm").clearValidation();
        $.ajax({
                url: '{%url "ErpContainerTransferEntry.DetailData" %}',
                type: "POST",
                data: {
                    "id": id
                },
                success: function (result) {
                    hideMask();
                    if (result.success === false) {
                        $.msg.error(result.message);
                        return;
                    }
                    entries_vm.detail = result;
                    entries_vm.detail.transfer_entry.transfer_id = transfer_id; // 每次加载数据就设置 这个 transfer_id
                    $('#containerTransferEntryDetailDialog').modal(modalOptions);
                }
            }
        );
    }

    function saveEntry() {
        showMask("提交中...");
        var form = $("#containerTransferEntryDetailForm");
        var valid = validate(form, {
            'detail.transfer_entry.transfer_id': {
                required: true, digits: true
            },
            'detail.transfer_entry.product_id': {
                required: true, digits: true
            },
            'detail.transfer_entry.product_sku': {
                required: true
            },
            'detail.transfer_entry.qty': {
                required: true, digits: true
            },
            'detail.transfer_entry.box_qty': {
                required: true, digits: true
            },
            'detail.transfer_entry.price': {
                required: true
            }
        });

        if (!valid) {
            hideMask();
        } else {
            $.ajax({
                    url: '{%url "ErpContainerTransferEntry.Save"%}',
                    type: "POST",
                    processData: false,
                    contentType: 'application/json',
                    data: JSON.stringify(entries_vm.detail),
                    success: function (data) {
                        hideMask();
                        if (data.success === false) {
                            $.msg.error(data.message);
                            //return;
                        }
                        else {
                            $.msg.show(data.message);
                            $('#containerTransferEntryDetailDialog').modal('hide');
                            reloadPageData();
                            //return;
                        }
                    }
                }
            );
        }
    }

    function deleteEntry() {
        var id_list = [];
        $('#entry_list tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length === 0) {
            $.msg.alert("请选择数据！");
            return;
        }

        $.msg.confirm("确认要删除吗？", function () {
            $.ajax({
                url: '{%url "ErpContainerTransferEntry.Delete"%}',
                type: "POST",
                data: {"id_list": id_list},
                success: function (data) {
                    if (data.success === false) {
                        $.msg.error(data.message);
                        return;
                    }
                    else {
                        $.msg.show(data.message);
                    }
                    reloadPageData();
                }
            });
        });
    }
</script>
{%footer%}
