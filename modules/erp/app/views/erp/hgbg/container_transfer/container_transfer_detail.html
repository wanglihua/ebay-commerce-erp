{%header "集装箱调拨" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="hgbg-menu">ERP</li>
            <li class="active" data-menu="hgbg-container-transfer-menu">
                <a href='{%url "ErpContainerTransfer.Index" %}'>集装箱调拨</a>
            </li>
            <li>集装箱调拨明细</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" onclick="reloadContainerTransfer()">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" onclick="addContainerTransfer()">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="deleteContainerTransfer()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="containerTransferList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>

    <div style="margin-top: 25px;">
        <div class="col-xs-12">
            <form class="form-horizontal" role="form" id="containerTransferDetailForm">
                <input id="container_transfer_id" name="detail.transfer.id" type="hidden" v-model.number="detail.transfer.id"/>
                <input id="container_transfer_version" name="detail.transfer.version" type="hidden" v-model.number="detail.transfer.version"/>
                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="batch_code" class="col-xs-2 control-label">批次号</label>
                            <div class="col-xs-10">
                                <input id="batch_code" name="detail.transfer.batch_code" type="text" class="input-sm form-control" v-model="detail.transfer.batch_code"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="dest_stock_id" class="col-xs-2 control-label">目的仓库</label>
                            <div class="col-xs-10">
                                <input id="dest_stock_id" name="detail.transfer.dest_stock_id" type="text" class="input-sm form-control" v-model.number="detail.transfer.dest_stock_id"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="dest_stock_name" class="col-xs-2 control-label">目的仓库</label>
                            <div class="col-xs-10">
                                <input id="dest_stock_name" name="detail.transfer.dest_stock_name" type="text" class="input-sm form-control" v-model="detail.transfer.dest_stock_name"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="container_code" class="col-xs-2 control-label">集装箱号</label>
                            <div class="col-xs-10">
                                <input id="container_code" name="detail.transfer.container_code" type="text" class="input-sm form-control" v-model="detail.transfer.container_code"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="bl_no" class="col-xs-2 control-label">提单号</label>
                            <div class="col-xs-10">
                                <input id="bl_no" name="detail.transfer.bl_no" type="text" class="input-sm form-control" v-model="detail.transfer.bl_no"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="seal_no" class="col-xs-2 control-label">铅封号</label>
                            <div class="col-xs-10">
                                <input id="seal_no" name="detail.transfer.seal_no" type="text" class="input-sm form-control" v-model="detail.transfer.seal_no"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="total_volumn" class="col-xs-2 control-label">总体积</label>
                            <div class="col-xs-10">
                                <input id="total_volumn" name="detail.transfer.total_volumn" type="text" class="input-sm form-control" v-model.number="detail.transfer.total_volumn"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="total_weight" class="col-xs-2 control-label">总重量</label>
                            <div class="col-xs-10">
                                <input id="total_weight" name="detail.transfer.total_weight" type="text" class="input-sm form-control" v-model.number="detail.transfer.total_weight"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="total_amount1" class="col-xs-2 control-label">总金额1</label>
                            <div class="col-xs-10">
                                <input id="total_amount1" name="detail.transfer.total_amount1" type="text" class="input-sm form-control" v-model.number="detail.transfer.total_amount1"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="total_amount2" class="col-xs-2 control-label">总金额2</label>
                            <div class="col-xs-10">
                                <input id="total_amount2" name="detail.transfer.total_amount2" type="text" class="input-sm form-control" v-model.number="detail.transfer.total_amount2"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="price_up_rate" class="col-xs-2 control-label">非征品上调</label>
                            <div class="col-xs-10">
                                <input id="price_up_rate" name="detail.transfer.price_up_rate" type="text" class="input-sm form-control" v-model.number="detail.transfer.price_up_rate"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="price_down_rate" class="col-xs-2 control-label">征税品下调</label>
                            <div class="col-xs-10">
                                <input id="price_down_rate" name="detail.transfer.price_down_rate" type="text" class="input-sm form-control" v-model.number="detail.transfer.price_down_rate"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="cost_up_rate" class="col-xs-2 control-label">成本上调</label>
                            <div class="col-xs-10">
                                <input id="cost_up_rate" name="detail.transfer.cost_up_rate" type="text" class="input-sm form-control" v-model.number="detail.transfer.cost_up_rate"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="packing_time" class="col-xs-2 control-label">装箱时间</label>
                            <div class="col-xs-10">
                                <input id="packing_time" name="detail.transfer.packing_time" type="text" class="input-sm form-control" v-model="detail.transfer.packing_time"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="departure_time" class="col-xs-2 control-label">到港时间</label>
                            <div class="col-xs-10">
                                <input id="departure_time" name="detail.transfer.departure_time" type="text" class="input-sm form-control" v-model="detail.transfer.departure_time"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="form-group">
                            <label for="stock_time" class="col-xs-2 control-label">到仓时间</label>
                            <div class="col-xs-10">
                                <input id="stock_time" name="detail.transfer.stock_time" type="text" class="input-sm form-control" v-model="detail.transfer.stock_time"/>
                            </div>
                        </div>
                    </div>
                </div>

            </form>
        </div>
    </div>

</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "transfer": {}
            }
        },
        mounted: function () {
        },
        methods: {
            showContainerTransferDetail: function (id) {
                showMask("加载中...");
                $("#containerTransferDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpContainerTransfer.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#containerTransferDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveContainerTransfer: function () {
                showMask("提交中...");
                var form = $("#containerTransferDetailForm");
                var valid = validate(form, {
                    'detail.transfer.batch_code': {
                        required: true
                    },
                    'detail.transfer.dest_stock_id': {
                        required: true, digits: true
                    },
                    'detail.transfer.dest_stock_name': {
                        required: true
                    },
                    'detail.transfer.container_code': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.transfer.bl_no': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.transfer.seal_no': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.transfer.total_volumn': {
                        required: true
                    },
                    'detail.transfer.total_weight': {
                        required: true
                    },
                    'detail.transfer.total_amount1': {
                        required: true
                    },
                    'detail.transfer.total_amount2': {
                        required: true
                    },
                    'detail.transfer.price_up_rate': {
                        required: true
                    },
                    'detail.transfer.price_down_rate': {
                        required: true
                    },
                    'detail.transfer.cost_up_rate': {
                        required: true
                    },
                    'detail.transfer.packing_time': {
                        required: true
                    },
                    'detail.transfer.departure_time': {
                        required: true
                    },
                    'detail.transfer.stock_time': {
                        required: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpContainerTransfer.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#containerTransferDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            }
        }
    });

    function reloadContainerTransfer() {
        // 刷新 详细 和 明细
    }

    function deleteContainerTransfer() {
        var id_list = [transfer_id];

        $.msg.confirm("确认要删除吗？", function () {
            $.ajax({
                url: '{%url "ErpContainerTransfer.Delete"%}',
                type: "POST",
                data: {"id_list": id_list},
                success: function (data) {
                    if (data.success === false) {
                        $.msg.error(data.message);
                        return;
                    }
                    else {
                        $.msg.show(data.message);
                        reloadContainerTransferList();
                        setTimeout("window.close();", 1000);
                        return;
                    }

                }
            });
        });
    }

    function reloadContainerTransferList() {
        try {
            window.opener.reloadContainerTransferList();
        } catch (e) {

        }
    }
</script>
{%footer%}
