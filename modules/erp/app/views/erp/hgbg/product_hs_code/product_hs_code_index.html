{%header "商品海关编码" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="hgbg-menu">海关报关</li>
            <li class="active" data-menu="hgbg-product-hs-code-menu">商品海关编码</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <div class="btn-group">
                        <button data-toggle="dropdown" class="btn btn-info btn-sm dropdown-toggle" aria-expanded="false" style="border-width: 4px;">
                            <i class="ace-icon fa fa-filter"></i><span id="dataFilter" data-status="0">全部</span>
                            <span class="ace-icon fa fa-caret-down icon-on-right"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-danger">
                            <li>
                                <a onclick="filterByZeroData('0','全部')" style="cursor: pointer;">全部</a>
                            </li>
                            <li>
                                <a onclick="filterByZeroData('1', '有空数据记录')" style="cursor: pointer;">有空数据记录</a>
                            </li>
                        </ul>
                    </div>

                    <button class="btn btn-primary btn-sm" @click="reloadList('#hs_code_list')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button id="btnImport" class="btn btn-success btn-sm">
                        <i class="ace-icon fa fa-plus"></i>
                        导入
                    </button>
                    <button class="btn btn-purple btn-sm" @click="export_hs_code()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出
                    </button>
                    <div style="margin-top: 10px;">
                        <a href="/static/excel-template/product_hs_code_import.xlsx">下载商品海关编码导入Excel模板</a>
                    </div>
                </div>
                <div>
                    <table id="hs_code_list" class="table table-striped table-bordered table-hover"></table>
                    <table id="error_data_list" class="table table-striped table-bordered table-hover" style="display: none;">
                        <caption>错误列表</caption>
                        <thead>
                        <tr>
                            <th>商品SKU</th>
                            <th>中国申报品名</th>
                            <th>澳洲申报品名</th>
                            <th>错误信息</th>
                        </tr>
                        </thead>
                        <tbody>
                        <template v-for="error_data in error_data_list">
                            <tr>
                                <td>{{error_data.sku}}</td>
                                <td>{{error_data.cn_decl_name}}</td>
                                <td>{{error_data.au_decl_name}}</td>
                                <td>{{error_data.error_message}}</td>
                            </tr>
                        </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="hs_code_detail_dialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">商品海关编码详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="hs_code_detail_form">
                                <input id="product_id" name="detail.product.id" type="hidden" v-model.number="detail.product.id"/>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="sku" class="col-xs-2 control-label">商品SKU</label>
                                            <div class="col-xs-10">
                                                <input id="sku" name="detail.product.sku" type="text" class="input-sm form-control" disabled="disabled" v-model.number="detail.product.sku"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="cn_name" class="col-xs-2 control-label">商品名称</label>
                                            <div class="col-xs-10">
                                                <input id="cn_name" name="detail.product.cn_name" type="text" class="input-sm form-control" disabled="disabled" v-model="detail.product.cn_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="cn_decl_name" class="col-xs-2 control-label">中国申报品名</label>
                                            <div class="col-xs-10">
                                                <input id="cn_decl_name" name="detail.product.cn_decl_name" type="text" class="input-sm form-control" v-model="detail.product.cn_decl_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="au_decl_name" class="col-xs-2 control-label">澳洲申报品名</label>
                                            <div class="col-xs-10">
                                                <input id="au_decl_name" name="detail.product.au_decl_name" type="text" class="input-sm form-control" v-model="detail.product.au_decl_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveProductHsCode()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/static/lib/plupload/moxie.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/plupload.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/zh_CN.js"></script>

<script type="text/javascript">

    function filterByZeroData(filter_type, filter_name) {
        vm.filter_type = filter_type;
        var dataFilter = $("#dataFilter");
        dataFilter.html(filter_name);
        reloadList('#hs_code_list');
    }

    function init_uploader() {
        var uploader = new plupload.Uploader({
            runtimes: 'html5,flash,html4',
            multi_selection: false,

            browse_button: 'btnImport',
            file_data_name: "excel_file",

            url: '{%url "ErpProductHsCodeExcel.Import"%}',
            max_file_size: '10000kb',

            filters: [
                {title: "Excel文件", extensions: "xlsx"}
            ],

            flash_swf_url: '/plupload/js/Moxie.swf',

            init: {
                FilesAdded: function () {
                    showMask("上传中，请稍候...");
                    uploader.start();
                },
                FileUploaded: function (up, file, response) {
                    hideMask();
                    var result = JSON.parse(response.response);
                    if (result.success !== true) {
                        $.msg.error(result.message);
                        vm.error_data_list = result.error_data_list;
                        $("table#error_data_list").show();
                    } else {
                        reloadList('#hs_code_list');
                        $.msg.show(result.message);
                        $("table#error_data_list").hide();
                    }
                },
                Error: function (up, err) {
                    $.msg.error("上传发生错误：" + err.code + ", " + err.message);
                }
            }
        });

        uploader.init();
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "filter_type": 0, // 0：全部数据； 1: 有空值的数据
            "detail": {
                "product": {}
            },
            "error_data_list": []
        },
        mounted: function () {
            var this_vm = this;

            initDataTable(
                '#hs_code_list',
                {
                    "sAjaxSource": '{%url "ErpProductHsCode.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "p.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "p.sku", "title": "商品SKU", "bSearchable": true, "width": 150},
                        {
                            "mDataProp": "p.cn_name", "title": "商品名称", "bSearchable": true, "sClass": "wrap-word",
                            "render": function (data, type, row) {
                                return '<div>' + data + '</div>';
                            }
                        },
                        {
                            "mDataProp": "p.cn_decl_name", "title": "中国申报品名", "bSearchable": true, "width": 200,
                            "render": function (data, type, row) {
                                return data;
                            }
                        },
                        {
                            "mDataProp": "p.au_decl_name", "title": "澳洲申报品名", "bSearchable": true, "width": 200,
                            "render": function (data, type, row) {
                                return data;
                            }
                        },
                        {"mDataProp": "s.name", "title": "商品状态", "bSearchable": true, "width": 80}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({name: 'filter_type', value: this_vm.filter_type});

                        $.ajax(
                            {
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();

                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data);
                                }
                            });
                    }
                }
            );

            $('#hs_code_list tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showProductDetail(id);
            });

            init_uploader();
        },
        methods: {
            reloadList: function () {
                reloadList('#hs_code_list');
            },
            showProductDetail: function (product_id) {
                showMask("加载中...");
                $("#hs_code_detail_form").clearValidation();
                $.ajax({
                        url: '{%url "ErpProductHsCode.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": product_id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success === false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;

                            $('#hs_code_detail_dialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveProductHsCode: function () {
                showMask("提交中...");
                var form = $("#hs_code_detail_form");
                var valid = validate(form, {
                    'detail.product.cn_hs_code': {
                        required: false
                    },
                    'detail.product.au_hs_code': {
                        required: false
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpProductHsCode.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#hs_code_detail_dialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            export_hs_code: function () {
                var id_list = [];
                $('#hs_code_list tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                var params = $.param({
                    "filter_type": vm.filter_type,
                    "id_list": id_list
                });
                var url = '{%url "ErpProductHsCodeExcel.Export"%}' + "?" + params;
                $('<form method="post" action="' + url + '"></form>').appendTo('body').submit().remove();
            }
        }
    });
</script>
{%footer%}
