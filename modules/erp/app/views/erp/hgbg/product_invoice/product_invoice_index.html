{%header "商品是否开票" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="hgbg-menu">海关报关</li>
            <li class="active" data-menu="hgbg-product-invoice-menu">商品是否开票</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#productList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button id="btnImport" class="btn btn-success btn-sm">
                        <i class="ace-icon fa fa-plus"></i>
                        导入
                    </button>
                    <button class="btn btn-purple btn-sm" @click="exportProduct()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出
                    </button>
                    <div style="margin-top: 10px;">
                        <a href="/static/excel-template/hgbg/product_invoice.xlsx">下载商品是否开票导入Excel模板</a>
                    </div>
                </div>
                <div>
                    <table id="productList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="productDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">商品是否开票详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="productDetailForm">
                                <input id="product_id" name="detail.product.id" type="hidden" v-model.number="detail.product.id"/>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="sku" class="col-xs-2 control-label">商品SKU</label>
                                            <div class="col-xs-10">
                                                <input id="sku" name="detail.product.sku" type="text" class="input-sm form-control" disabled="disabled" v-model.number="detail.product.sku"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="cn_name" class="col-xs-2 control-label">商品名称</label>
                                            <div class="col-xs-10">
                                                <input id="sku" name="detail.product.cn_name" type="text" class="input-sm form-control" disabled="disabled" v-model="detail.product.cn_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="need_invoice" class="col-xs-2 control-label">是否开票：</label>
                                            <div class="col-xs-10">
                                                <select id="need_invoice" name="detail.product.need_invoice" class="input-sm form-control" v-model.number="detail.product.need_invoice">
                                                    <option :value="0">否</option>
                                                    <option :value="1">是</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="tax_point" class="col-xs-2 control-label">收取税点</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="tax_point" name="detail.product.tax_point" type="text" class="input-sm form-control" v-model.number="detail.product.tax_point"/>
                                                    <span class="input-group-addon">%</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="drawback_point" class="col-xs-2 control-label">退税点</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="drawback_point" name="detail.product.drawback_point" type="text" class="input-sm form-control" v-model.number="detail.product.drawback_point"/>
                                                    <span class="input-group-addon">%</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveProductNeedInvoice()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/static/lib/plupload/moxie.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/plupload.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/zh_CN.js"></script>

<script type="text/javascript">

    function filterByZeroData(filter_type, filter_name) {
        vm.filter_type = filter_type;
        var dataFilter = $("#dataFilter");
        dataFilter.html(filter_name);
        reloadList('#productList');
    }

    function init_uploader() {
        var uploader = new plupload.Uploader({
            runtimes: 'html5,flash,html4',
            multi_selection: false,

            browse_button: 'btnImport',
            file_data_name: "excel_file",

            url: '{%url "ErpProductInvoice.Import"%}',
            max_file_size: '10000kb',

            filters: [
                {title: "Excel文件", extensions: "xlsx"}
            ],

            flash_swf_url: '/plupload/js/Moxie.swf',

            init: {
                FilesAdded: function () {
                    showMask("上传中，请稍候...");
                    uploader.start();
                },
                FileUploaded: function (up, file, response) {
                    hideMask();
                    var result = JSON.parse(response.response);
                    if (result.success !== true) {
                        $.msg.error(result.message);
                    } else {
                        reloadList('#productList');
                        $.msg.show(result.message);
                    }
                },
                Error: function (up, err) {
                    $.msg.error("上传发生错误：" + err.code + ", " + err.message);
                }
            }
        });

        uploader.init();
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "filter_type": 0, // 0：全部数据； 1: 有空值的数据
            "detail": {
                "product": {}
            }
        },
        mounted: function () {
            var this_vm = this;

            initDataTable(
                    '#productList',
                    {
                        "sAjaxSource": '{%url "ErpProductInvoice.ListData"%}',
                        "aaSorting": [[1, "asc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "p.id",
                                "bSearchable": false,
                                "orderable": false,
                                "sClass": "center",
                                "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "p.sku", "title": "商品SKU", "bSearchable": true, "width": 150},
                            {"mDataProp": "p.cn_name", "title": "商品名称", "bSearchable": true},
                            {
                                "mDataProp": "p.need_invoice", "title": "是否开票", "bSearchable": false, "width": 80, "sClass": "center",
                                "render": function (data, type, row) {
                                    if (data === 0) {
                                        return "否"
                                    }
                                    else {
                                        return "是";
                                    }
                                }
                            },
                            {
                                "mDataProp": "p.tax_point", "title": "收取税点", "bSearchable": false, "width": 80, "sClass": "center",
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data) + "%";
                                }
                            },
                            {
                                "mDataProp": "p.drawback_point", "title": "退税点", "bSearchable": false, "width": 80, "sClass": "center",
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data) + "%";
                                }
                            },
                            {"mDataProp": "s.name", "title": "状态", "bSearchable": true, "width": 80}
                        ],
                        "fnServerData": function (sSource, aoData, fnCallback) {
                            showMask("数据加载中，请稍候");

                            $.ajax({
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();

                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data);
                                }
                            });
                        }
                    }
            );

            $('#productList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showProductDetail(id);
            });

            init_uploader();
        },
        methods: {
            reloadList: function () {
                reloadList('#productList');
            },
            showProductDetail: function (product_id) {
                showMask("加载中...");
                $("#productDetailDialog").clearValidation();
                $.ajax({
                    url: '{%url "ErpProductInvoice.DetailData" %}',
                    type: "POST",
                    data: {
                        "id": product_id
                    },
                    success: function (result) {
                        hideMask();
                        if (result.success === false) {
                            $.msg.error(result.message);
                            return;
                        }
                        vm.detail = result;

                        $('#productDetailDialog').modal(modalOptions);
                    }
                });
            },
            saveProductNeedInvoice: function () {
                showMask("提交中...");
                var form = $("#productDetailForm");
                var valid = validate(form, {
                    'detail.product.sku': {
                        required: true
                    },
                    'detail.product.need_invoice': {
                        required: false, number: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                        url: '{%url "ErpProductInvoice.Save"%}',
                        type: "POST",
                        processData: false,
                        contentType: 'application/json',
                        data: JSON.stringify(vm.detail),
                        success: function (data) {
                            hideMask();
                            if (data.success === false) {
                                $.msg.error(data.message);
                                //return;
                            }
                            else {
                                $.msg.show(data.message);
                                $('#productDetailDialog').modal('hide');
                                vm.reloadList();
                                //return;
                            }
                        }
                    });
                }
            },
            exportProduct: function () {
                var id_list = [];
                $('#productList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                var params = $.param({
                    "id_list": id_list
                });
                var url = '{%url "ErpProductInvoice.Export"%}' + "?" + params;
                $('<form method="post" action="' + url + '"></form>').appendTo('body').submit().remove();
            }
        }
    });
</script>
{%footer%}
