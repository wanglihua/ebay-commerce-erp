{%header "澳洲海关编码" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="hgbg-menu">海关报关</li>
            <li class="active" data-menu="hgbg-hs-code-au-duty-menu">澳洲海关编码</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#hsCodeAuDutyList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showHsCodeAuDutyDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteHsCodeAuDuty()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="hsCodeAuDutyList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="hsCodeAuDutyDetailDialog">
        <div class="modal-dialog" style="width: 580px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">澳洲海关编码详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="hsCodeAuDutyDetailForm">
                                <input id="hs_code_au_duty_id" name="detail.hs_code_au.id" type="hidden" v-model.number="detail.hs_code_au.id"/>
                                <input id="hs_code_au_duty_version" name="detail.hs_code_au.version" type="hidden" v-model.number="detail.hs_code_au.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="hs_code" class="col-xs-2 control-label">海关编码</label>
                                            <div class="col-xs-10">
                                                <input id="hs_code" name="detail.hs_code_au.hs_code" type="text" class="input-sm form-control" v-model="detail.hs_code_au.hs_code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="cn_name" class="col-xs-2 control-label">中文品名</label>
                                            <div class="col-xs-10">
                                                <input id="cn_name" name="detail.hs_code_au.cn_name" type="text" class="input-sm form-control" v-model="detail.hs_code_au.cn_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="en_name" class="col-xs-2 control-label">英文品名</label>
                                            <div class="col-xs-10">
                                                <input id="en_name" name="detail.hs_code_au.en_name" type="text" class="input-sm form-control" v-model="detail.hs_code_au.en_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="duty_rate" class="col-xs-2 control-label">关税税率</label>
                                            <div class="col-xs-10">
                                                <input id="duty_rate" name="detail.hs_code_au.duty_rate" type="text" class="input-sm form-control" v-model.number="detail.hs_code_au.duty_rate"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveHsCodeAuDuty()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "hs_code_au": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#hsCodeAuDutyList',
                {
                    "sAjaxSource": '{%url "ErpHsCodeAuDuty.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "hs_code", "title": "海关编码", "bSearchable": true, "width": 120},
                        {
                            "mDataProp": "cn_name", "title": "中文品名", "bSearchable": true, "sClass": "wrap-word",
                            "render": function (data, type, row) {
                                return "<div>" + data + "</div>";
                            }
                        },
                        {
                            "mDataProp": "en_name", "title": "英文品名", "bSearchable": true, "sClass": "wrap-word",
                            "render": function (data, type, row) {
                                return "<div>" + data + "</div>";
                            }
                        },
                        {"mDataProp": "duty_rate", "title": "关税税率", "bSearchable": false, "width": 100},
                        {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#hsCodeAuDutyList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showHsCodeAuDutyDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#hsCodeAuDutyList');
            },
            showHsCodeAuDutyDetail: function (id) {
                showMask("加载中...");
                $("#hsCodeAuDutyDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpHsCodeAuDuty.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#hsCodeAuDutyDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveHsCodeAuDuty: function () {
                showMask("提交中...");
                var form = $("#hsCodeAuDutyDetailForm");
                var valid = validate(form, {
                    'detail.hs_code_au.hs_code': {
                        required: true, minlength: 1, maxlength: 10
                    },
                    'detail.hs_code_au.cn_name': {
                        required: true
                    },
                    'detail.hs_code_au.en_name': {
                        required: true
                    },
                    'detail.hs_code_au.duty_rate': {
                        required: true, number: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpHsCodeAuDuty.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#hsCodeAuDutyDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteHsCodeAuDuty: function () {
                var id_list = [];
                $('#hsCodeAuDutyList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpHsCodeAuDuty.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
