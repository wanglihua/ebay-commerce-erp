{%header "退款报表" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ppgl-menu">付款退款</li>
            <li class="active" data-menu="ppgl-refund-report-menu">退款报表</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#refundReportList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-purple btn-sm">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出
                    </button>
                </div>
                <div class="row" style="margin-top: 20px;margin-bottom: 20px;">
                    <div id="query" class="col-xs-12" style="line-height: 28px;">
                        <div class="col-xs-12">
                            <label class="control-label no-padding-right" for="reportType">报表类型</label>
                            <select id="reportType" style="width: 100px;">
                                <option value="{%.report_type_day%}">日报表</option>
                                <option value="{%.report_type_month%}">月报表</option>
                            </select>

                            <label class="control-label no-padding-right" for="shop_id">店铺</label>
                            <select id="shop_id" class="input-sm">
                                <option value="0">--店铺--</option>
                                {% range $index, $shop := .shop_list%}
                                <option value="{% $shop.Id %}">{% $shop.Name %}</option>
                                {%end%}
                            </select>

                            <label class="control-label no-padding-right" for="reportType">销售人员</label>
                            <select id="sales_user_id" name="user_query_value" style="height: 30px;width: 120px;">
                                <option :value="0">--销售人员--</option>
                                {% range $index, $user := .user_list %}
                                <option :value="{% $user.Id %}">{% $user.LoginName %}（{% $user.NickName %}）</option>
                                {% end %}
                            </select>

                            <label for="begin_time_query">时间</label>
                            <input id="begin_time_query" name="begin_time_query" style="width: 135px;height:30px;" placeholder="开始时间如2016-01-02"/>
                            <input id="end_time_query" name="end_time_query" style="width: 135px;height:30px;" placeholder="结束时间如2016-01-02"/>

                            <button class="btn btn-primary btn-sm" @click="refreshList();">
                                <i class="ace-icon fa fa-search"></i>
                                查询
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="refundReportList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $(function () {
        $('#begin_time_query').datetimepicker({
            locale: "zh-cn"
        });

        $('#end_time_query').datetimepicker({
            locale: "zh-cn"
        });
    });

    function exportReport() {
        var params = $.param({
            "begin_time": $("#begin_time_query").val(),
            "end_time": $("#end_time_query").val()
        });

        var url = '{%url "ErpRefundReport.Export"%}' + "?" + params;
        $('<form method="post" action="' + url + '"></form>').appendTo('body').submit().remove();
    }

    var vm = new Vue({
        el: "#page",
        data: {},
        mounted: function () {
        },
        methods: {
            reloadList: function () {
                reloadList('#refundReportList');
            },
            refreshList: function () {
                refreshList('#refundReportList');
            }
        }
    });

    $(function () {
        initDataTable(
                '#refundReportList',
                {
                    "sAjaxSource": '{%url "ErpRefundReport.ListData"%}',
                    "aaSorting": [[0, "desc"]],
                    "aoColumns": [
                        {"mDataProp": "month_date", "title": "日期", "bSearchable": false, "width": 100},
                        {
                            "mDataProp": "refund_amount_sum", "title": "退款金额", "bSearchable": false, "sClass": "dtRight",
                            "render": function (data, type, row) {
                                return dtFormatFloat(data);
                            }
                        }
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        aoData.push({'name': 'report_type', 'value': $("#reportType").val()});
                        aoData.push({'name': 'shop_id', 'value': $("#shop_id").val()});
                        aoData.push({'name': 'sales_user_id', 'value': $("#sales_user_id").val()});
                        aoData.push({'name': 'begin_time', 'value': $("#begin_time_query").val()});
                        aoData.push({'name': 'end_time', 'value': $("#end_time_query").val()});

                        showMask("数据加载中，请稍候");
                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                hideMask();
                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    return;
                                }

                                fnCallback(data);
                            }
                        });
                    }
                }
        );
    });

</script>
{%footer%}
