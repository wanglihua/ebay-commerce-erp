{%header "Paypal付款" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ppgl-menu">Paypal管理</li>
            <li class="active" data-menu="ppgl-paypal-payment-menu">Paypal付款</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#paypalPaymentList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div>
                    <table id="paypalPaymentList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "paypal_recon": {}
            }
        },
        mounted: function () {
            initDataTable(
                    '#paypalPaymentList',
                    {
                        "sAjaxSource": '{%url "ErpPaypalPayment.ListData"%}',
                        "aaSorting": [[4, "desc"]],
                        "aoColumns": [
                            {"mDataProp": "id", "title": "Id", "bVisible": false, "width": 0},
                            {"mDataProp": "paypal_account", "title": "Paypal Account", "bSearchable": false, "width": 180},
                            {"mDataProp": "transaction_id", "title": "Transaction ID", "bSearchable": false, "width": 120},
                            {"mDataProp": "type", "title": "Type", "bSearchable": true, "width": 100},
                            {"mDataProp": "pay_time", "title": "Time", "bSearchable": false, "width": 120},
                            {
                                "mDataProp": "gross_amount",
                                "title": "Gross Amount",
                                "bSearchable": false,
                                "sClass": "dtRight",
                                "width": 120,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "fee_amount",
                                "title": "Fee Amount",
                                "bSearchable": false,
                                "sClass": "dtRight",
                                "width": 120,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "net_amount",
                                "title": "Net Amount",
                                "bSearchable": false,
                                "sClass": "dtRight",
                                "width": 120,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },

                            {"mDataProp": "status", "title": "Status", "bSearchable": true, "width": 100},
                            {"mDataProp": "payer", "title": "Payer", "bSearchable": true, "width": 120},
                            {"mDataProp": "payer_display_name", "title": "Payer Display Name", "bSearchable": true}
                        ]
                    }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#paypalPaymentList');
            }
        }
    });
</script>
{%footer%}
