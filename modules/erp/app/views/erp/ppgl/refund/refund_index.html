{%header "订单退款" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ppgl-menu">付款退款</li>
            <li class="active" data-menu="ppgl-refund-menu">订单退款</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#refundList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-pink btn-sm" onclick="approve()">
                        <i class="ace-icon fa fa-check"></i>
                        审核
                    </button>
                    <button class="btn btn-purple btn-sm" onclick="paypalRefund()">
                        <i class="ace-icon fa fa-paypal"></i>
                        PayPal退款
                    </button>
                    <button class="btn btn-success btn-sm" onclick="complete()">
                        <i class="ace-icon fa fa-check-square"></i>
                        完结
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="cancel()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        作废
                    </button>
                    <button class="btn btn-purple btn-sm" onclick="exportPaymentList()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出
                    </button>
                </div>
                <div class="row" style="margin-top: 20px;margin-bottom: 20px;">
                    <div id="query" class="col-xs-12" style="line-height: 28px;">
                        <div class="col-xs-12">

                            <label for="begin_time_query">时间</label>
                            <input id="begin_time_query" name="begin_time_query" style="width: 135px;height:30px;" placeholder="开始时间如2016-01-02"/>
                            <input id="end_time_query" name="end_time_query" style="width: 135px;height:30px;" placeholder="结束时间如2016-01-02"/>

                            <button class="btn btn-primary btn-sm" @click="refreshList();">
                                <i class="ace-icon fa fa-search"></i>
                                查询
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="refundList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $(function () {
        $('#begin_time_query').datetimepicker({
            locale: "zh-cn"
        });

        $('#end_time_query').datetimepicker({
            locale: "zh-cn"
        });
    });

    function exportPaymentList() {
        var params = $.param({
            "begin_time_query": $("#begin_time_query").val(),
            "end_time_query": $("#end_time_query").val()
        });

        var url = '{%url "ErpRefundExcel.Export"%}' + "?" + params;
        $('<form method="post" action="' + url + '"></form>').appendTo('body').submit().remove();
    }

    function approve() {
        var id_list = [];
        $('#refundList').find('tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length !== 1) {
            $.msg.alert("请选择一行数据！");
            return;
        }

        $.msg.confirm("确认要审核通过吗？", function () {
            $.ajax({
                url: '{%url "ErpRefund.Approve"%}',
                type: "POST",
                data: {"order_refund_id": id_list[0]},
                success: function (data) {
                    if (data.success === false) {
                        $.msg.error(data.message);
                        return;
                    }
                    else {
                        $.msg.show(data.message);
                    }
                    reloadList('#refundList');
                }
            });
        });
    }

    function paypalRefund() {
        var id_list = [];
        $('#refundList').find('tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length !== 1) {
            $.msg.alert("请选择一行数据！");
            return;
        }

        $.msg.confirm("确认要通过PayPal退款吗？", function () {
            $.ajax({
                url: '{%url "ErpRefund.PaypalRefund"%}',
                type: "POST",
                data: {"order_refund_id": id_list[0]},
                success: function (data) {
                    if (data.success === false) {
                        $.msg.error(data.message);
                    }
                    else {
                        $.msg.show(data.message);
                    }
                    reloadList('#refundList');
                }
            });
        });
    }

    function complete() {
        var id_list = [];
        $('#refundList').find('tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length !== 1) {
            $.msg.alert("请选择一行数据！");
            return;
        }

        $.msg.confirm("确认要通过完结退款吗？", function () {
            $.ajax({
                url: '{%url "ErpRefund.Complete"%}',
                type: "POST",
                data: {"order_refund_id": id_list[0]},
                success: function (data) {
                    if (data.success === false) {
                        $.msg.error(data.message);
                        return;
                    }
                    else {
                        $.msg.show(data.message);
                    }
                    reloadList('#refundList');
                }
            });
        });
    }

    function cancel() {
        var id_list = [];
        $('#refundList').find('tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length !== 1) {
            $.msg.alert("请选择一行数据！");
            return;
        }

        $.msg.confirm("确认要通过作废退款申请吗？", function () {
            $.ajax({
                url: '{%url "ErpRefund.Cancel"%}',
                type: "POST",
                data: {"order_refund_id": id_list[0]},
                success: function (data) {
                    if (data.success === false) {
                        $.msg.error(data.message);
                        return;
                    }
                    else {
                        $.msg.show(data.message);
                    }
                    reloadList('#refundList');
                }
            });
        });
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "paypal_recon": {}
            }
        },
        mounted: function () {
            initDataTable(
                    '#refundList',
                    {
                        "sAjaxSource": '{%url "ErpRefund.ListData"%}',
                        "aaSorting": [[5, "desc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id",
                                "bSearchable": false,
                                "orderable": false,
                                "sClass": "center",
                                "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "shop_name", "title": "店铺", "bSearchable": true, "width": 80},
                            {
                                "mDataProp": "order_code", "title": "订单编号", "bSearchable": true, "width": 120,
                                "render": function (data, type, row) {
                                    return "<a target='order_detail' href='/order/detail/" + row.order_id + "'>" + row.order_code + "</a>"
                                }
                            },
                            {
                                "mDataProp": "product_code", "title": "SKU", "bSearchable": true, "width": 120,
                                "render": function (data, type, row) {
                                    return "<a target='order_detail' href='/product/detail/" + row.product_id + "'>" + row.product_code + "</a>"
                                }
                            },
                            {
                                "mDataProp": "product_name", "title": "品名", "bSearchable": true, "sClass": "wrap-word", "width": 180,
                                "render": function (data, type, row) {
                                    return "<a target='order_detail' href='/product/detail/" + row.product_id + "'>" + row.product_name + "</a>"
                                }
                            },
                            {"mDataProp": "sales_user_name", "title": "销售员", "bSearchable": true, "width": 80},
                            {
                                "mDataProp": "order_amount",
                                "title": "订单金额",
                                "bSearchable": false,
                                "sClass": "dtRight",
                                "width": 75,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "refund_amount",
                                "title": "退款金额",
                                "bSearchable": false,
                                "sClass": "dtRight",
                                "width": 75,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {"mDataProp": "method_name", "title": "退款方式", "bSearchable": true, "width": 80},
                            {"mDataProp": "type_name", "title": "退款类型", "bSearchable": true, "width": 120},
                            {"mDataProp": "reason", "title": "退款原因", "bSearchable": true, "width": 80},
                            {"mDataProp": "status_name", "title": "状态", "bSearchable": true, "width": 60},
                            {"mDataProp": "apply_user_name", "title": "申请人", "bSearchable": true, "width": 80},
                            {"mDataProp": "apply_time", "title": "申请时间", "bSearchable": false, "width": 120},
                            {"mDataProp": "description", "title": "备注", "bSearchable": true}
                        ],
                        "fnServerData": function (sSource, aoData, fnCallback) {
                            aoData.push({'name': 'account_id_query', 'value': $("#account_id_query").val()});
                            aoData.push({'name': 'begin_time_query', 'value': $("#begin_time_query").val()});
                            aoData.push({'name': 'end_time_query', 'value': $("#end_time_query").val()});

                            showMask("数据加载中，请稍候");
                            $.ajax({
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }

                                    fnCallback(data);
                                }
                            });
                        }
                    }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#refundList');
            },
            refreshList: function () {
                refreshList('#refundList');
            }
        }
    });
</script>
{%footer%}
