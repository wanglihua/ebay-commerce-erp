{%header "Paypal付款" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ppgl-menu">付款退款</li>
            <li class="active" data-menu="ppgl-refund-menu">订单退款</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#refundList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-purple btn-sm" onclick="exportPaymentList()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出
                    </button>
                </div>
                <div class="row" style="margin-top: 20px;margin-bottom: 20px;">
                    <div id="query" class="col-xs-12" style="line-height: 28px;">
                        <div class="col-xs-12">

                            <label for="account_id_query">PayPal账户</label>
                            <select id="account_id_query" name="account_id_query" style="height: 30px; width: 130px;" @change="refreshList();">
                                <option value="0">--PayPal账户--</option>
                                {% range $index, $account := .account_list %}
                                <option value="{% $account.Id %}">{% $account.PaypalAccount %}</option>
                                {% end %}
                            </select>

                            <label for="begin_time_query">时间</label>
                            <input id="begin_time_query" name="begin_time_query" style="width: 135px;height:30px;" placeholder="开始时间如2016-01-02"/>
                            <input id="end_time_query" name="end_time_query" style="width: 135px;height:30px;" placeholder="结束时间如2016-01-02"/>

                            <button class="btn btn-primary btn-sm" @click="refreshList();">
                                <i class="ace-icon fa fa-search"></i>
                                查询
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="refundList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $(function () {
        $('#begin_time_query').datetimepicker({
            locale: "zh-cn"
        });

        $('#end_time_query').datetimepicker({
            locale: "zh-cn"
        });
    });

    function exportPaymentList() {
        var params = $.param({
            "account_id_query": $("#account_id_query").val(),
            "begin_time_query": $("#begin_time_query").val(),
            "end_time_query": $("#end_time_query").val()
        });

        var url = '{%url "ErpRefundExcel.Export"%}' + "?" + params;
        $('<form method="post" action="' + url + '"></form>').appendTo('body').submit().remove();
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "paypal_recon": {}
            }
        },
        mounted: function () {
            initDataTable(
                    '#refundList',
                    {
                        "sAjaxSource": '{%url "ErpRefund.ListData"%}',
                        "aaSorting": [[5, "desc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id",
                                "bSearchable": false,
                                "orderable": false,
                                "sClass": "center",
                                "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "shop_name", "title": "店铺", "bSearchable": true, "width": 120},
                            {
                                "mDataProp": "order_code", "title": "订单编号", "bSearchable": true, "width": 180,
                                "render": function (data, type, row) {
                                    return "<a target='order_detail' href='/order/detail/" + row.order_id + "'>" + row.order_code + "</a>"
                                }
                            },
                            // {"mDataProp": "pay_tran_id", "title": "付款流水号", "bSearchable": true, "width": 120},
                            // {"mDataProp": "transaction_id", "title": "退款流水号", "bSearchable": true, "width": 120},
                            {
                                "mDataProp": "order_amount",
                                "title": "订单金额",
                                "bSearchable": false,
                                "sClass": "dtRight",
                                "width": 90,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "refund_amount",
                                "title": "退款金额",
                                "bSearchable": false,
                                "sClass": "dtRight",
                                "width": 90,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {"mDataProp": "type_name", "title": "退款类型", "bSearchable": true, "width": 120},
                            {"mDataProp": "reason", "title": "退款原因", "bSearchable": true, "width": 150},
                            {"mDataProp": "status_name", "title": "状态", "bSearchable": true, "width": 80},
                            {"mDataProp": "apply_user_name", "title": "申请人", "bSearchable": true, "width": 80},
                            {"mDataProp": "apply_time", "title": "申请时间", "bSearchable": false, "width": 120},
                            {"mDataProp": "description", "title": "备注", "bSearchable": true}
                        ],
                        "fnServerData": function (sSource, aoData, fnCallback) {
                            aoData.push({'name': 'account_id_query', 'value': $("#account_id_query").val()});
                            aoData.push({'name': 'begin_time_query', 'value': $("#begin_time_query").val()});
                            aoData.push({'name': 'end_time_query', 'value': $("#end_time_query").val()});

                            showMask("数据加载中，请稍候");
                            $.ajax({
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }

                                    fnCallback(data);
                                }
                            });
                        }
                    }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#refundList');
            },
            refreshList: function () {
                refreshList('#refundList');
            }
        }
    });
</script>
{%footer%}
