{%header "通知公告" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xtgl-menu">系统管理</li>
            <li class="active" data-menu="xtgl-notice-menu">通知公告</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#noticeList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showNoticeDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteNotice()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="noticeList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="noticeDetailDialog">
        <div class="modal-dialog" style="width: 780px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">通知公告详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="noticeDetailForm">
                                <input id="notice_id" name="detail.notice.id" type="hidden" v-model.number="detail.notice.id"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="title" class="col-xs-1 control-label">标题</label>
                                            <div class="col-xs-11">
                                                <input id="title" name="detail.notice.title" type="text" class="input-sm form-control" v-model="detail.notice.title"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="body" class="col-xs-1 control-label">内容</label>
                                            <div class="col-xs-11">
                                                <textarea id="body" name="detail.notice.body" style="padding: 0;border: 0; width: 694px;height: 400px;" rows="10" v-model="detail.notice.body"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="list_top" class="col-xs-2 control-label">置顶</label>
                                            <div class="col-xs-10">
                                                <select id="list_top" name="detail.notice.list_top" type="text" class="input-sm form-control" v-model="detail.notice.list_top">
                                                    <option :value="0">否</option>
                                                    <option :value="1">是</option>
                                                </select>

                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="important" class="col-xs-2 control-label">重要</label>
                                            <div class="col-xs-10">
                                                <select id="important" name="detail.notice.important" type="text" class="input-sm form-control" v-model="detail.notice.important">
                                                    <option :value="0">否</option>
                                                    <option :value="1">是</option>
                                                </select>

                                            </div>
                                        </div>
                                    </div>

                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveNotice()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" charset="utf-8" src="/static/ueditor/ueditor.config.js"></script>
<script type="text/javascript" charset="utf-8" src="/static/ueditor/ueditor.all.min.js"></script>
<script type="text/javascript">
    $(function () {
        var ue = UE.getEditor('body');
    });

    function reloadNoticeList() {
        reloadList('#noticeList');
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "notice": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#noticeList',
                {
                    "sAjaxSource": '{%url "ErpNotice.ListData"%}',
                    "aaSorting": [[3, "desc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {
                            "mDataProp": "title", "title": "通知公告标题", "bSearchable": true,
                            "render": function (data, type, row) {
                                var data_str = data;
                                if (row.important === 1) {
                                    data_str = "<span style='color: red;'>" + data + "</span>";
                                }

                                if (row.list_top === 1) {
                                    return "[置顶]" + data_str;
                                } else {
                                    return data_str;
                                }
                            }
                        },
                        {"mDataProp": "login_name", "title": "发布人", "bSearchable": true, "width": 120},
                        {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#noticeList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showNoticeDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#noticeList');
            },
            showNoticeDetail: function (id) {
                window.open("/notice/detail/" + id, "notice_detail");
                /*
                showMask("加载中...");
                $("#noticeDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpNotice.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            UE.getEditor('body').setContent(result.notice.body);
                            $('#noticeDetailDialog').modal(modalOptions);
                        }
                    }
                );
                */
            },
            saveNotice: function () {
                showMask("提交中...");

                vm.detail.notice.body = UE.getEditor('body').getContent();

                var form = $("#noticeDetailForm");

                var valid = validate(form, {
                    'detail.notice.title': {
                        required: true
                    },
                    'detail.notice.body': {
                        required: true
                    },
                    'detail.notice.user_id': {
                        required: true
                    },
                    'detail.notice.login_name': {
                        required: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpNotice.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#noticeDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteNotice: function () {
                var id_list = [];
                $('#noticeList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpNotice.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
