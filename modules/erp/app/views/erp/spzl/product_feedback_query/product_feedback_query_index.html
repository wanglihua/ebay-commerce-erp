{%header "商品质量反馈" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="spzl-menu">商品质量反馈</li>
            <li class="active" data-menu="spzl-product-feedback-query-menu">商品质量反馈查询</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#productFeedbackList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-pink btn-sm" onclick="exportFeedback()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出
                    </button>
                </div>

                <div class="row" style="margin-top:10px;margin-bottom:5px;">
                    <div id="query" class="col-xs-12" style="line-height: 28px;">
                        <div class="col-xs-12">
                            <label for="sku">SKU</label>
                            <input id="sku" name="sku" v-model.number="page.sku" style="width: 180px;height: 28px;"/>&nbsp;&nbsp;
                            <label for="feedback_cate_id">反馈类别</label>
                            <select id="feedback_cate_id" name="feedback_cate_id" v-model.number="page.feedback_cate_id" style="width: 180px;height: 28px;" @change="reloadList()">
                                <option :value="0">反馈类别</option>
                                <template v-for="cate in page.feedback_cate_list">
                                    <option :value="cate.id">{{cate.name}}</option>
                                </template>
                            </select>&nbsp;&nbsp;
                            <label for="feedback_supplier_id">供应商</label>
                            <select id="feedback_supplier_id" name="feedback_supplier_id" v-model.number="page.feedback_supplier_id" style="width: 180px;height: 28px;" @change="reloadList()">
                                <option :value="0">供应商</option>
                                <template v-for="supplier in page.supplier_list">
                                    <option :value="supplier.id">{{supplier.name}}</option>
                                </template>
                            </select>&nbsp;&nbsp;
                            <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" @click="refreshList()">
                                &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="productFeedbackList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">

    $(function () {
        loadPageData();

        initDataTable(
            '#productFeedbackList',
            {
                "sAjaxSource": '{%url "ErpProductFeedbackQuery.ListData"%}',
                "aaSorting": [[0, "desc"]],
                "aoColumns": [
                    {
                        "mDataProp": "pf.id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                        "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                        "render": function (data, type, row) {
                            return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                        }
                    },
                    {
                        "mDataProp": "c.name", "title": "反馈类别", "bSearchable": false, "sClass": "wrap-word", "width": 100,
                        "render": function (data, type, row) {
                            return "<div>" + data + "</div>";
                        }
                    },

                    {
                        "mDataProp": "sup.name", "title": "供应商", "bSearchable": false, "sClass": "wrap-word", "width": 100,
                        "render": function (data, type, row) {
                            return "<div>" + data + "</div>";
                        }
                    },
                    {
                        "mDataProp": "pf.description", "title": "描述", "bSearchable": true, "sClass": "wrap-word",
                        "render": function (data, type, row) {
                            return "<div>" + data + "</div>";
                        }
                    },
                    {"mDataProp": "pf.user_login_name", "title": "反馈人", "bSearchable": true, "sClass": "center", "width": 80},
                    {
                        "mDataProp": "pf.solution", "title": "解决方案", "bSearchable": true, "sClass": "wrap-word",
                        "render": function (data, type, row) {
                            return "<div>" + data + "</div>";
                        }
                    },
                    {"mDataProp": "pf.slu_user_login_name", "title": "解决人", "bSearchable": true, "sClass": "center", "width": 80},
                    {"mDataProp": "pf.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                    {"mDataProp": "pf.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                ],
                "fnServerData": function (sSource, aoData, fnCallback) {
                    showMask("数据加载中，请稍候");

                    aoData.push({'name': 'sku', 'value': vm.page.sku});
                    aoData.push({'name': 'feedback_cate_id', 'value': vm.page.feedback_cate_id});
                    aoData.push({'name': 'feedback_supplier_id', 'value': vm.page.feedback_supplier_id});

                    $.ajax({
                        "dataType": 'json',
                        "url": sSource,
                        "data": aoData,
                        "success": function (data) {
                            hideMask();
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            fnCallback(data);
                        }
                    });
                }
            }
        );
    });

    function loadPageData() {
        $.ajax({
                url: '{%url "ErpProductFeedbackQuery.PageData" %}',
                type: "POST",
                data: {},
                success: function (result) {
                    if (result.success === false) {
                        $.msg.error(result.message);
                        return;
                    }
                    vm.page = result;
                }
            }
        );
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "page": {
                "sku": "",
                "feedback_cate_id": 0,
                "feedback_cate_list": [],
                "feedback_supplier_id": 0,
                "feedback_supplier_list": []
            },
            "product_feedback_cate_list": []
        },
        mounted: function () {
        },
        methods: {
            reloadList: function () {
                reloadList('#productFeedbackList');
            },
            refreshList: function () {
                refreshList('#productFeedbackList');
            }
        }
    });

    function exportFeedback() {
        var id_list = [];
        $('#productFeedbackList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        var params = $.param({
            "id_list": id_list
        });
        var url = '{%url "ErpProductFeedbackExcel.Export"%}' + "?" + params;
        $('<form method="post" action="' + url + '"></form>').appendTo('body').submit().remove();
    }
</script>
{%footer%}
