{%header "商品质量反馈" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="spzl-menu">商品质量反馈</li>
            <li class="active" data-menu="spzl-product-feedback-menu"><a href='{% url "ErpProductFeedback.SkuList" %}'>反馈SKU列表</a></li>
            <li>商品质量反馈列表</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#productFeedbackList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showProductFeedbackDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteProductFeedback()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>

                <div class="row" style="margin-top:10px;margin-bottom:5px;">
                    <div class="col-xs-12" style="line-height: 28px;">
                        <div class="col-xs-12">
                            <a href="/product/detail/{%.product_id%}" target="product_detail"><span style="font-weight: bold;">{% .product.Sku %}&nbsp;&nbsp;{% .product.CnName %}</span></a>
                        </div>
                    </div>
                </div>

                <div class="row" style="margin-top:10px;margin-bottom:5px;">
                    <div id="query" class="col-xs-12" style="line-height: 28px;">
                        <div class="col-xs-12">
                            <label for="feedback_cate_id">反馈类别</label>
                            <select id="feedback_cate_id" name="feedback_cate_id" v-model.number="page.feedback_cate_id" style="width: 180px;height: 28px;" @change="reloadList()">
                                <option :value="0">反馈类别</option>
                                <template v-for="cate in page.feedback_cate_list">
                                    <option :value="cate.id">{{cate.name}}</option>
                                </template>
                            </select>&nbsp;&nbsp;
                            <label for="feedback_supplier_id">供应商</label>
                            <select id="feedback_supplier_id" name="feedback_supplier_id" v-model.number="page.feedback_supplier_id" style="width: 180px;height: 28px;" @change="reloadList()">
                                <option :value="0">供应商</option>
                                <template v-for="supplier in page.feedback_supplier_list">
                                    <option :value="supplier.id">{{supplier.name}}</option>
                                </template>
                            </select>&nbsp;&nbsp;
                            <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" @click="refreshList()">
                                &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="cate_sum_list" style="width: 450px;" class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>反馈分类</th>
                            <th style="width: 120px;">反馈数量</th>
                        </tr>
                        </thead>
                        <tbody>
                        <template v-for="cate_sum in cate_sum_list">
                            <tr>
                                <td><a @click="show_cate(cate_sum.cate_id)" style="cursor:pointer;">{{cate_sum.cate_name}}</a></td>
                                <td>{{cate_sum.count}}</td>
                            </tr>
                        </template>
                        </tbody>
                    </table>
                </div>
                <div>
                    <table id="productFeedbackList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="productFeedbackDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">商品质量反馈详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="productFeedbackDetailForm">
                                <input id="product_feedback_id" name="detail.product_feedback.id" type="hidden" v-model.number="detail.product_feedback.id"/>
                                <input id="product_feedback_product_id" name="detail.product_feedback.product_id" type="hidden" v-model.number="detail.product_feedback.product_id"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="sku" class="col-xs-2 control-label">商品SKU</label>
                                            <div class="col-xs-10">
                                                <input id="sku" name="detail.product_feedback.sku" type="text" class="input-sm form-control" v-model.number="detail.product_feedback.sku" disabled="disabled"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="cate_id" class="col-xs-2 control-label">反馈类别</label>
                                            <div class="col-xs-10">
                                                <select id="cate_id" name="detail.product_feedback.cate_id" type="text" class="input-sm form-control" v-model.number="detail.product_feedback.cate_id">
                                                    <template v-for="cate in product_feedback_cate_list">
                                                        <option :value="cate.id">{{cate.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="supplier_id" class="col-xs-2 control-label">供应商</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="supplier_id" name="detail.product_feedback.supplier_id" type="hidden" class="input-sm form-control" v-model.number="detail.product_feedback.supplier_id"/>
                                                    <input id="supplier_name" name="detail.supplier_name" type="text" class="input-sm form-control" readonly="readonly" v-model="detail.supplier_name"/>
                                                    <span class="input-group-btn">
                                                        <button type="button" class="btn btn-purple btn-sm" onclick="showSupplierSelect()">
                                                            <span class="ace-icon fa fa-search icon-on-right"></span>&nbsp;选择
                                                        </button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>


                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="description" class="col-xs-2 control-label">描述</label>
                                            <div class="col-xs-10">
                                                <textarea id="description" name="detail.product_feedback.description" rows="4" class="input-sm form-control" v-model="detail.product_feedback.description"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="solution" class="col-xs-2 control-label">解决方案</label>
                                            <div class="col-xs-10">
                                                <textarea id="solution" name="detail.product_feedback.solution" rows="4" class="input-sm form-control" v-model="detail.product_feedback.solution"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveProductFeedback()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="supplierSelectDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">供应商选择</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="supplierList" class="table table-striped table-bordered table-hover"></table>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" onclick="acceptSupplierSelect()">
                        <i class="ace-icon fa fa-floppy-o"></i>选择
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{%template "erp/spzl/product_feedback/product_feedback_index.var" .%}
<script type="text/javascript">

    $(function () {
        loadPageData();

        initDataTable(
            '#productFeedbackList',
            {
                "sAjaxSource": '{%url "ErpProductFeedback.ListData"%}',
                "aaSorting": [[0, "asc"]],
                "aoColumns": [
                    {
                        "mDataProp": "pf.id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                        "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                        "render": function (data, type, row) {
                            return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                        }
                    },
                    {
                        "mDataProp": "c.name", "title": "反馈类别", "bSearchable": false, "sClass": "wrap-word", "width": 100,
                        "render": function (data, type, row) {
                            return "<div>" + data + "</div>";
                        }
                    },

                    {
                        "mDataProp": "sup.name", "title": "供应商", "bSearchable": false, "sClass": "wrap-word", "width": 100,
                        "render": function (data, type, row) {
                            return "<div>" + data + "</div>";
                        }
                    },
                    {
                        "mDataProp": "pf.description", "title": "描述", "bSearchable": true, "sClass": "wrap-word",
                        "render": function (data, type, row) {
                            return "<div>" + data + "</div>";
                        }
                    },
                    {
                        "mDataProp": "pf.solution", "title": "解决方案", "bSearchable": true, "sClass": "wrap-word",
                        "render": function (data, type, row) {
                            return "<div>" + data + "</div>";
                        }
                    },
                    {"mDataProp": "pf.user_login_name", "title": "反馈人", "bSearchable": true, "width": 120},
                    {"mDataProp": "pf.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                    {"mDataProp": "pf.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                ],
                "fnServerData": function (sSource, aoData, fnCallback) {
                    showMask("数据加载中，请稍候");

                    aoData.push({'name': 'product_id', 'value': product_id});
                    aoData.push({'name': 'feedback_cate_id', 'value': vm.page.feedback_cate_id});
                    aoData.push({'name': 'feedback_supplier_id', 'value': vm.page.feedback_supplier_id});

                    $.ajax(
                        {
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                hideMask();
                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    return;
                                }
                                fnCallback(data.grid_data);
                                vm.cate_sum_list = data.cate_sum_list;
                            }
                        });
                }
            }
        );

        $('#productFeedbackList tbody').on('dblclick', 'tr', function () {
            var id = $(this).find('td:first-child input:checkbox').val();
            vm.showProductFeedbackDetail(id);
        });

        initSingleSelectDataTable(
            '#supplierList',
            {
                "sAjaxSource": '{%url "ErpProductFeedback.SupplierSelectListData"%}',
                "aaSorting": [[1, "asc"]],
                "aoColumns": [
                    {
                        "mDataProp": "s.id",
                        "bSearchable": false,
                        "orderable": false,
                        "sClass": "center",
                        "width": 50,
                        "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                        "render": function (data, type, row) {
                            return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                        }
                    },
                    {"mDataProp": "s.name", "title": "名称", "bSearchable": true},
                    {"mDataProp": "s.contact", "title": "联系人", "bSearchable": true, "width": 90},
                    {"mDataProp": "s.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                    {"mDataProp": "s.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                ]
            }
        );
    });

    function loadPageData() {
        $.ajax({
                url: '{%url "ErpProductFeedback.PageData" %}',
                type: "POST",
                data: {
                    "product_id": product_id
                },
                success: function (result) {
                    if (result.success === false) {
                        $.msg.error(result.message);
                        return;
                    }
                    vm.page = result;
                }
            }
        );
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "page": {
                "feedback_cate_id": 0,
                "feedback_cate_list": [],
                "feedback_supplier_id": 0,
                "feedback_supplier_list": []
            },
            "detail": {
                "supplier_name": "",
                "product_feedback": {}
            },
            "product_feedback_cate_list": [],
            "cate_sum_list": []
        },
        mounted: function () {
        },
        methods: {
            reloadList: function () {
                reloadList('#productFeedbackList');
            },
            refreshList: function () {
                refreshList('#productFeedbackList');
            },
            show_cate: function (cate_id) {
                vm.page.feedback_cate_id = cate_id;
                vm.reloadList();
            },
            showProductFeedbackDetail: function (id) {
                showMask("加载中...");
                $("#productFeedbackDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpProductFeedback.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id,
                            "product_id": product_id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success === false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result.detail;
                            vm.product_feedback_cate_list = result.product_feedback_cate_list;

                            $('#productFeedbackDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveProductFeedback: function () {
                showMask("提交中...");
                var form = $("#productFeedbackDetailForm");
                var valid = validate(form, {
                    'detail.product_feedback.sku': {
                        required: true
                    },
                    'detail.product_feedback.description': {
                        required: false, maxlength: 800
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpProductFeedback.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#productFeedbackDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteProductFeedback: function () {
                var id_list = [];
                $('#productFeedbackList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length === 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpProductFeedback.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });

    function showSupplierSelect() {
        $('#supplierSelectDialog').modal(modalOptions);
    }

    function acceptSupplierSelect() {
        var id_list = [];
        $('#supplierList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length === 0 || id_list.length > 1) {
            $.msg.alert("请选择一行数据！");
            return;
        }

        var supplier_id = parseInt(id_list[0]);
        vm.detail.product_feedback.supplier_id = supplier_id;

        $.ajax({
            url: '{%url "ErpSupplier.GetSupplierInfo"%}',
            type: "POST",
            data: {"supplier_id": supplier_id},
            success: function (data) {
                vm.detail.supplier_name = data.supplier.name;
                //$("#supplier_name").val(data.supplier.name);
            }
        });

        $('#supplierSelectDialog').modal('hide');
    }
</script>
{%footer%}
