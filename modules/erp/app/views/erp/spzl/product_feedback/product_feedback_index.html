{%header "商品质量反馈" .%}
<div id="page">
   <div class="breadcrumbs" id="breadcrumbs">
       <ul class="breadcrumb">
           <li>
               <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
           </li>
           <li class="parent" data-menu="spzl-menu">商品质量反馈</li>
           <li class="active" data-menu="spzl-product-feedback-menu">商品质量反馈</li>
       </ul>
   </div>
   <div class="page-content">
       <div class="row">
           <div class="col-xs-12" style="padding: 0;">
               <div class="gridToolBar clearfix">
                   <button class="btn btn-primary btn-sm" @click="reloadList('#productFeedbackList')">
                       <i class="ace-icon fa fa-refresh"></i>
                       刷新
                   </button>
                   <button class="btn btn-success btn-sm" @click="showProductFeedbackDetail(0)">
                       <i class="ace-icon fa fa-plus"></i>
                       新增
                   </button>
                   <button class="btn btn-danger btn-sm" @click="deleteProductFeedback()">
                       <i class="ace-icon fa fa-trash-o"></i>
                       删除
                   </button>
               </div>
               <div>
                   <table id="productFeedbackList" class="table table-striped table-bordered table-hover"></table>
               </div>
           </div>
       </div>
   </div>
    <div class="modal fade" id="productFeedbackDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">商品质量反馈详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="productFeedbackDetailForm">
                                <input id="product_feedback_id" name="detail.product_feedback.id" type="hidden" v-model.number="detail.product_feedback.id"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="cate_id" class="col-xs-2 control-label">反馈类别</label>
                                            <div class="col-xs-10">
                                                <input id="cate_id" name="detail.product_feedback.cate_id" type="text" class="input-sm form-control" v-model.number="detail.product_feedback.cate_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="supplier_id" class="col-xs-2 control-label">供应商</label>
                                            <div class="col-xs-10">
                                                <input id="supplier_id" name="detail.product_feedback.supplier_id" type="text" class="input-sm form-control" v-model.number="detail.product_feedback.supplier_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="code" class="col-xs-2 control-label">反馈编码</label>
                                            <div class="col-xs-10">
                                                <input id="code" name="detail.product_feedback.code" type="text" class="input-sm form-control" v-model="detail.product_feedback.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="description" class="col-xs-2 control-label">描述</label>
                                            <div class="col-xs-10">
                                                <input id="description" name="detail.product_feedback.description" type="text" class="input-sm form-control" v-model="detail.product_feedback.description"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="user_id" class="col-xs-2 control-label">反馈人id</label>
                                            <div class="col-xs-10">
                                                <input id="user_id" name="detail.product_feedback.user_id" type="text" class="input-sm form-control" v-model.number="detail.product_feedback.user_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="user_login_name" class="col-xs-2 control-label">反馈人工号</label>
                                            <div class="col-xs-10">
                                                <input id="user_login_name" name="detail.product_feedback.user_login_name" type="text" class="input-sm form-control" v-model="detail.product_feedback.user_login_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveProductFeedback()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "product_feedback": {}
            }
        },
        mounted: function () {
            initDataTable(
                    '#productFeedbackList',
                    {
                        "sAjaxSource": '{%url "ErpProductFeedback.ListData"%}',
                        "aaSorting": [[1, "asc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "cate_id", "title": "反馈类别", "bSearchable": false },
                            {"mDataProp": "supplier_id", "title": "供应商", "bSearchable": false },
                            {"mDataProp": "code", "title": "反馈编码", "bSearchable": true },
                            {"mDataProp": "description", "title": "描述", "bSearchable": true },
                            {"mDataProp": "user_id", "title": "反馈人id", "bSearchable": false },
                            {"mDataProp": "user_login_name", "title": "反馈人工号", "bSearchable": true },
                            {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120 },
                            {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120 }
                        ]
                   }
            );

            $('#productFeedbackList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showProductFeedbackDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#productFeedbackList');
            },
            showProductFeedbackDetail: function (id) {
                showMask("加载中...");
                $("#productFeedbackDetailForm").clearValidation();
                $.ajax({
                           url: '{%url "ErpProductFeedback.DetailData" %}',
                           type: "POST",
                           data: {
                               "id": id
                           },
                           success: function (result) {
                               hideMask();
                               if (result.success == false) {
                                   $.msg.error(result.message);
                                   return;
                               }
                               vm.detail = result;
                               $('#productFeedbackDetailDialog').modal(modalOptions);
                           }
                       }
                );
            },
            saveProductFeedback: function () {
                showMask("提交中...");
                var form = $("#productFeedbackDetailForm");
                var valid = validate(form, {  
                    'detail.product_feedback.cate_id': {
                        required: true, digits: true
                    },
                    'detail.product_feedback.supplier_id': {
                        required: true, digits: true
                    },
                    'detail.product_feedback.code': {
                        required: true
                    },
                    'detail.product_feedback.description': {
                        required: false, maxlength: 800
                    },
                    'detail.product_feedback.user_id': {
                        required: true, digits: true
                    },
                    'detail.product_feedback.user_login_name': {
                        required: true, minlength: 2, maxlength: 100
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                               url: '{%url "ErpProductFeedback.Save"%}',
                               type: "POST",
                               processData: false,
                               contentType: 'application/json',
                               data: JSON.stringify(vm.detail),
                               success: function (data) {
                                   hideMask();
                                   if (data.success == false) {
                                       $.msg.error(data.message);
                                       //return;
                                   }
                                   else {
                                       $.msg.show(data.message);
                                       $('#productFeedbackDetailDialog').modal('hide');
                                       vm.reloadList();
                                       //return;
                                   }
                               }
                           }
                    );
                }
            },
            deleteProductFeedback: function () {
                var id_list = [];
                $('#productFeedbackList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                               url: '{%url "ErpProductFeedback.Delete"%}',
                               type: "POST",
                               data: {"id_list": id_list},
                               success: function (data) {
                                   if (data.success == false) {
                                       $.msg.error(data.message);
                                       return;
                                   }
                                   else {
                                       $.msg.show(data.message);
                                   }
                                   vm.reloadList();
                               }
                           });
                });
            }
        }
    });
</script>
{%footer%}
