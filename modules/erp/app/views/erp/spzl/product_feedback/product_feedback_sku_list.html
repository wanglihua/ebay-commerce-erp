{%header "商品质量反馈" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="spzl-menu">商品质量反馈</li>
            <li class="active" data-menu="spzl-product-feedback-menu">反馈SKU列表</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#productList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showProductFeedbackDetail()">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                </div>
                <div class="row" style="margin-top:10px;margin-bottom:5px;">
                    <div id="query" class="col-xs-12" style="line-height: 28px;">
                        <div class="col-xs-12">
                            <label for="feedback_sku">SKU</label>
                            <input id="feedback_sku" name="feedback_sku" v-model="page.feedback_sku" style="width: 130px;height: 28px;"/>&nbsp;&nbsp;
                            <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" @click="reloadList()">
                                &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="productList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="productFeedbackDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">商品质量反馈详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="productFeedbackDetailForm">
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="sku" class="col-xs-2 control-label">商品SKU</label>
                                            <div class="col-xs-10">
                                                <input id="sku" name="detail.product_feedback.sku" type="text" class="input-sm form-control" v-model.number="detail.product_feedback.sku"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="cate_id" class="col-xs-2 control-label">反馈类别</label>
                                            <div class="col-xs-10">
                                                <select id="cate_id" name="detail.product_feedback.cate_id" type="text" class="input-sm form-control" v-model.number="detail.product_feedback.cate_id">
                                                    <template v-for="cate in product_feedback_cate_list">
                                                        <option :value="cate.id">{{cate.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="supplier_id" class="col-xs-2 control-label">供应商</label>
                                            <div class="col-xs-10">
                                                <select id="supplier_id" name="detail.product_feedback.supplier_id" class="input-sm form-control" v-model.number="detail.product_feedback.supplier_id">
                                                    <template v-for="supplier in supplier_list">
                                                        <option :value="supplier.id">{{supplier.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="description" class="col-xs-2 control-label">描述</label>
                                            <div class="col-xs-10">
                                                <textarea id="description" name="detail.product_feedback.description" rows="4" class="input-sm form-control" v-model="detail.product_feedback.description"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveProductFeedback()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $(function () {
        initDataTable(
            '#productList',
            {
                "sAjaxSource": '{%url "ErpProductFeedback.SkuListData"%}',
                "aaSorting": [[0, "asc"]],
                "aoColumns": [
                    {
                        "mDataProp": "p.sku", "title": "SKU", "bSearchable": false, "width": 150,
                        "render": function (data, type, row) {
                            return "<a style='cursor: pointer;' onclick='show_sku_feedback(" + row.p.id + ");' >" + data + "</a>";
                        }
                    },
                    {
                        "mDataProp": "p.cn_name", "title": "商品名称", "bSearchable": false, "sClass": "wrap-word",
                        "render": function (data, type, row) {
                            return "<div>" + data + "</div>";
                        }
                    },
                    {
                        "mDataProp": "p.id", "title": "操作", "bSearchable": false, "sClass": "wrap-word", "width": 100,
                        "render": function (data, type, row) {
                            return "<a class='btn btn-xs btn-info btn-inline pull-left' onclick='show_sku_feedback(" + data + ");' ><i class='ace-icon fa fa-list'></i>查看反馈</a>";
                        }
                    },
                    {"mDataProp": "pfu.last_create", "title": "最近创建", "bSearchable": false, "width": 120},
                    {"mDataProp": "pfu.last_update", "title": "最近修改", "bSearchable": false, "width": 120}
                ],
                "fnServerData": function (sSource, aoData, fnCallback) {
                    showMask("数据加载中，请稍候");

                    aoData.push({'name': 'feedback_sku', 'value': vm.page.feedback_sku});

                    $.ajax(
                        {
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                hideMask();
                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    return;
                                }
                                fnCallback(data);
                            }
                        });
                }
            }
        );
    });

    function show_sku_feedback(sku_id) {
        window.location.href = "/product/feedback/sku/" + sku_id
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "product_feedback": {}
            },
            "product_feedback_cate_list": [],
            "supplier_list": [],
            "page": {
                "feedback_sku": ""
            }
        },
        mounted: function () {
        },
        methods: {
            reloadList: function () {
                reloadList('#productList');
            },
            showProductFeedbackDetail: function () {
                showMask("加载中...");
                $("#productFeedbackDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpProductFeedback.DetailData" %}',
                        type: "POST",
                        success: function (result) {
                            hideMask();
                            if (result.success === false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result.detail;
                            vm.product_feedback_cate_list = result.product_feedback_cate_list;
                            vm.supplier_list = result.supplier_list;

                            $('#productFeedbackDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveProductFeedback: function () {
                showMask("提交中...");
                var form = $("#productFeedbackDetailForm");
                var valid = validate(form, {
                    'detail.product_feedback.cate_id': {
                        required: true, digits: true
                    },
                    'detail.product_feedback.sku': {
                        required: true
                    },
                    'detail.product_feedback.supplier_id': {
                        required: true, digits: true
                    },
                    'detail.product_feedback.code': {
                        required: true
                    },
                    'detail.product_feedback.description': {
                        required: false, maxlength: 800
                    },
                    'detail.product_feedback.user_id': {
                        required: true, digits: true
                    },
                    'detail.product_feedback.user_login_name': {
                        required: true, minlength: 2, maxlength: 100
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpProductFeedback.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#productFeedbackDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            }
        }
    });
</script>
{%footer%}
