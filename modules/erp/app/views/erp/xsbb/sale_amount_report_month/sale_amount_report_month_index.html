{%header "月销售额报表" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xsbb-menu">销售报表</li>
            <li class="active" data-menu="xsbb-sale-amount-report-month-menu">月销售额报表</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#saleAmountReportMonthList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-purple btn-sm" @click="viewChart()">
                        <i class="ace-icon fa fa-line-chart"></i>
                        图表分析
                    </button>
                    <button class="btn btn-success btn-sm" onclick="exportReport()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出
                    </button>
                    <button class="btn btn-pink btn-sm" @click="calculate()">
                        <i class="ace-icon fa fa-refresh"></i>
                        立即分析销售情况
                    </button>
                </div>
                <div id="query" class="col-xs-12" style="line-height: 28px;">
                    <div class="col-xs-12" style="margin-top: 20px;margin-bottom: 20px;">
                        <div>
                            <label class="control-label no-padding-right" for="begin_time_query">日期开始</label>
                            <input class="input-sm" id="begin_time_query" name="begin_time_query" placeholder="日期开始" type="text" style="width: 80px;"/>
                            <label class="control-label no-padding-right" for="end_time_query">日期结束</label>
                            <input class="input-sm" id="end_time_query" name="end_time_query" placeholder="日期结束" type="text" style="width: 80px;"/>

                            <label class="control-label no-padding-right" for="shop_id_query">店铺</label>
                            <select id="shop_id_query" class="input-sm">
                                <option value="0">--店铺--</option>
                                {% range $index, $shop := .shop_list%}
                                <option value="{% $shop.Id %}">{% $shop.Name %}</option>
                                {%end%}
                            </select>

                            <label class="control-label no-padding-right" for="user_type_query">人员类型</label>
                            <select id="user_type_query" class="input-sm">
                                <option value="0">--人员类型--</option>
                                {% range $index, $user_type := .user_type_list%}
                                <option value="{% $user_type.Id %}">{% $user_type.Name %}</option>
                                {% end %}
                            </select>

                            <label class="control-label no-padding-right" for="user_id_query">人员</label>
                            <select id="user_id_query" class="input-sm">
                                <option value="0">--人员--</option>
                                {% range $index, $user := .user_list %}
                                <option value="{% $user.Id %}">{% $user.LoginName %}（{% $user.NickName %}）</option>
                                {% end %}
                            </select>

                            <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" @click="reloadList()">
                                &nbsp;<i class="ace-icon fa fa-search"></i>显&nbsp;示&nbsp;
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="saleAmountReportMonthList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">

    $(function () {
        $('#begin_time_query').datetimepicker({
            locale: "zh-cn"
        });

        $('#end_time_query').datetimepicker({
            locale: "zh-cn"
        });
    });

    var vm = new Vue({
        el: "#page",
        data: {},
        mounted: function () {
            initDataTable(
                    '#saleAmountReportMonthList',
                    {
                        "sAjaxSource": '{%url "ErpSaleAmountReportMonth.ListData"%}',
                        "aaSorting": [[1, "desc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {
                                "mDataProp": "paid_time", "title": "月份", "sClass": "center", "bSearchable": false, "width": 80,
                                "render": function (data, type, row) {
                                    return data;
                                }
                            },
                            {
                                "mDataProp": "paid_amount", "title": "交易金额(澳币)", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "express_fee", "title": "运费收入(澳币)", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "income", "title": "收入小计", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "cost_amount", "title": "商品澳仓成本(澳币)", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "estimate_logistics_fee", "title": "预估运费(澳币)", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "actual_logistics_fee", "title": "实际运费(澳币)", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "jyfy_amount", "title": "交易费用(澳币)", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "ptfy_amount", "title": "平台费用(澳币)", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "pick_fee", "title": "拣货费(澳币)", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "gst_fee", "title": "GST费用(澳币)", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "outcome", "title": "支出小计", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "order_qty", "title": "订单数量", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return data;
                                }
                            },
                            {
                                "mDataProp": "product_qty", "title": "商品销量", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return data;
                                }
                            },
                            {
                                "mDataProp": "profit", "title": "利润(澳币)", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "profit_rate", "title": "利润率", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data) + "%";
                                }
                            }
                        ],
                        "fnServerData": function (sSource, aoData, fnCallback) {
                            showMask("数据加载中，请稍候");

                            aoData.push({'name': 'begin_time_query', 'value': $("#begin_time_query").val()});
                            aoData.push({'name': 'end_time_query', 'value': $("#end_time_query").val()});
                            aoData.push({'name': 'platform_id_query', 'value': $("#platform_id_query").val()});
                            aoData.push({'name': 'shop_id_query', 'value': $("#shop_id_query").val()});
                            aoData.push({'name': 'user_type_query', 'value': $("#user_type_query").val()});
                            aoData.push({'name': 'user_id_query', 'value': $("#user_id_query").val()});

                            $.ajax({
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();

                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }

                                    fnCallback(data);
                                }
                            });
                        }
                    }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#saleAmountReportMonthList');
            },
            refreshList: function () {
                refreshList('#saleAmountReportMonthList');
            },
            viewChart: function () {
                var url = '{% url "ErpSaleAmountReportMonth.Chart" %}';
                window.open(url, "sale_amount_report_month_chart");
            },
            calculate: function () {
                $.msg.confirm("将立即启动销售后台分析任务！", function () {
                    $.ajax({
                        "dataType": 'json',
                        "url": '{% url "ErpSaleAmountReportMonth.Calculate" %}',
                        "success": function (data) {

                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                                return;
                            }
                        }
                    });
                });
            }
        }
    });

    function exportReport() {
        var params = $.param({});
        var url = '{%url "ErpSaleAmountReportMonthExcel.Export"%}' + "?" + params;
        $('<form method="post" action="' + url + '"></form>').appendTo('body').submit().remove();
    }
</script>
{%footer%}
