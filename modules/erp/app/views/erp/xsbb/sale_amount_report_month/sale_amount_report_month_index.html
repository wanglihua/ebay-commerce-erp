{%header "月销售额报表" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xsbb-menu">销售报表</li>
            <li class="active" data-menu="xsbb-sale-amount-report-month-menu">月销售额报表</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#saleAmountReportMonthList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div>
                    <table id="saleAmountReportMonthList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {},
        mounted: function () {
            initDataTable(
                    '#saleAmountReportMonthList',
                    {
                        "sAjaxSource": '{%url "ErpSaleAmountReportMonth.ListData"%}',
                        "aaSorting": [[1, "desc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {
                                "mDataProp": "report_month", "title": "月份", "sClass": "center", "bSearchable": false, "width": 80,
                                "render": function (data, type, row) {
                                    return dtFormatMonth(data);
                                }
                            },
                            {"mDataProp": "amount", "title": "销售额", "bSearchable": false}
                        ]
                    }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#saleAmountReportMonthList');
            }
        }
    });
</script>
{%footer%}
