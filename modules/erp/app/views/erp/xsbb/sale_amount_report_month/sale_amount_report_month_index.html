{%header "月销售额报表" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xsbb-menu">销售报表</li>
            <li class="active" data-menu="xsbb-sale-amount-report-month-menu">月销售额报表</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#saleAmountReportMonthList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-purple btn-sm" @click="viewChart()">
                        <i class="ace-icon fa fa-line-chart"></i>
                        图表分析
                    </button>
                    <button class="btn btn-success btn-sm" onclick="exportReport()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出
                    </button>
                    <button class="btn btn-pink btn-sm" @click="calculate()">
                        <i class="ace-icon fa fa-refresh"></i>
                        立即分析销售情况
                    </button>
                </div>
                <div>
                    <table id="saleAmountReportMonthList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {},
        mounted: function () {
            initDataTable(
                    '#saleAmountReportMonthList',
                    {
                        "sAjaxSource": '{%url "ErpSaleAmountReportMonth.ListData"%}',
                        "aaSorting": [[1, "desc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {
                                "mDataProp": "report_month", "title": "月份", "sClass": "center", "bSearchable": false, "width": 80,
                                "render": function (data, type, row) {
                                    return dtFormatMonth(data);
                                }
                            },
                            {
                                "mDataProp": "paid_amount", "title": "交易金额", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data) + " AUD";
                                }
                            },
                            {
                                "mDataProp": "express_fee", "title": "运费收入", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data) + " AUD";
                                }
                            },
                            {
                                "mDataProp": "cost_price", "title": "商品澳仓成本", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data) + " AUD";
                                }
                            },
                            {
                                "mDataProp": "estimate_logistics_fee", "title": "预估运费", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data) + " AUD";
                                }
                            },
                            {
                                "mDataProp": "actual_logistics_fee", "title": "实际运费", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data) + " AUD";
                                }
                            },
                            {
                                "mDataProp": "jyfy_amount", "title": "交易费用", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data) + " AUD";
                                }
                            },
                            {
                                "mDataProp": "ptfy_amount", "title": "平台费用", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data) + " AUD";
                                }
                            },
                            {
                                "mDataProp": "pick_fee", "title": "拣货费", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data) + " AUD";
                                }
                            },
                            {
                                "mDataProp": "gst_fee", "title": "GST费用", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data) + " AUD";
                                }
                            },
                            {
                                "mDataProp": "product_qty", "title": "商品销量", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return data + " 件";
                                }
                            },
                            {
                                "mDataProp": "profit", "title": "利润", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data) + " AUD";
                                }
                            },
                            {
                                "mDataProp": "profit_rate", "title": "利润率", "bSearchable": false, "sClass": "dtRight", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data) + "%";
                                }
                            }
                        ]
                    }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#saleAmountReportMonthList');
            },
            refreshList: function () {
                refreshList('#saleAmountReportMonthList');
            },
            viewChart: function () {
                var url = '{% url "ErpSaleAmountReportMonth.Chart" %}';
                window.open(url, "sale_amount_report_month_chart");
            },
            calculate: function () {
                $.msg.confirm("将立即启动销售后台分析任务！", function () {
                    $.ajax({
                        "dataType": 'json',
                        "url": '{% url "ErpSaleAmountReportMonth.Calculate" %}',
                        "success": function (data) {

                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                                return;
                            }
                        }
                    });
                });
            }
        }
    });

    function exportReport() {
        var params = $.param({});
        var url = '{%url "ErpSaleAmountReportMonthExcel.Export"%}' + "?" + params;
        $('<form method="post" action="' + url + '"></form>').appendTo('body').submit().remove();
    }
</script>
{%footer%}
