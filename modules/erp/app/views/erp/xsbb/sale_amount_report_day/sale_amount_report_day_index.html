{%header "日销售额报表" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xsbb-menu">销售报表</li>
            <li class="active" data-menu="xsbb-sale-amount-report-day-menu">日销售额报表</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#saleAmountReportDayList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-purple btn-sm" @click="viewChart()">
                        <i class="ace-icon fa fa-line-chart"></i>
                        图表分析
                    </button>
                    <button class="btn btn-pink btn-sm" @click="calculate()">
                        <i class="ace-icon fa fa-refresh"></i>
                        立即分析销售情况
                    </button>
                </div>
                <div id="query" class="col-xs-12" style="line-height: 28px;">
                    <div class="col-xs-12" style="margin-top: 20px;margin-bottom: 20px;">
                        <div>
                            <label class="control-label no-padding-right" for="begin_time_query">日期开始</label>
                            <input class="input-sm" id="begin_time_query" name="begin_time_query" placeholder="日期开始" type="text" style="width: 80px;"/>
                            <label class="control-label no-padding-right" for="end_time_query">日期结束</label>
                            <input class="input-sm" id="end_time_query" name="end_time_query" placeholder="日期结束" type="text" style="width: 80px;"/>
                            <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" @click="reloadList()">
                                &nbsp;<i class="ace-icon fa fa-search"></i>显&nbsp;示&nbsp;
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="saleAmountReportDayList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">

    $(function () {
        $('#begin_time_query').datetimepicker({
            locale: "zh-cn"
        });

        $('#end_time_query').datetimepicker({
            locale: "zh-cn"
        });
    });

    var vm = new Vue({
        el: "#page",
        data: {},
        mounted: function () {
            initDataTable(
                    '#saleAmountReportDayList',
                    {
                        "sAjaxSource": '{%url "ErpSaleAmountReportDay.ListData"%}',
                        "aaSorting": [[1, "desc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {
                                "mDataProp": "report_day", "title": "日期", "bSearchable": false, "sClass": "center", "width": 100,
                                "render": function (data, type, row) {
                                    return dtFormatDate(data);
                                }
                            },
                            {
                                "mDataProp": "paid_amount", "title": "交易金额", "bSearchable": false, "width": 100,
                                "render": function (data, type, row) {
                                    return data + " AUD";
                                }
                            },
                            {
                                "mDataProp": "express_fee", "title": "运费收入", "bSearchable": false, "width": 100,
                                "render": function (data, type, row) {
                                    return data + " AUD";
                                }
                            },
                            {
                                "mDataProp": "cost_price", "title": "商品澳仓成本", "bSearchable": false, "width": 100,
                                "render": function (data, type, row) {
                                    return data + " AUD";
                                }
                            },
                            {
                                "mDataProp": "estimate_logistics_fee", "title": "预估运费", "bSearchable": false, "width": 100,
                                "render": function (data, type, row) {
                                    return data + " AUD";
                                }
                            },
                            {
                                "mDataProp": "actual_logistics_fee", "title": "实际运费", "bSearchable": false, "width": 100,
                                "render": function (data, type, row) {
                                    return data + " AUD";
                                }
                            },
                            {
                                "mDataProp": "jyfy_amount", "title": "交易费用", "bSearchable": false, "width": 100,
                                "render": function (data, type, row) {
                                    return data + " AUD";
                                }
                            },
                            {
                                "mDataProp": "ptfy_amount", "title": "平台费用", "bSearchable": false, "width": 100,
                                "render": function (data, type, row) {
                                    return data + " AUD";
                                }
                            },
                            {
                                "mDataProp": "pick_fee", "title": "拣货费", "bSearchable": false, "width": 100,
                                "render": function (data, type, row) {
                                    return data + " AUD";
                                }
                            },
                            {
                                "mDataProp": "gst_fee", "title": "GST费用", "bSearchable": false, "width": 100,
                                "render": function (data, type, row) {
                                    return data + " AUD";
                                }
                            },
                            {
                                "mDataProp": "product_qty", "title": "商品销量", "bSearchable": false, "width": 100,
                                "render": function (data, type, row) {
                                    return data + " 件";
                                }
                            },
                            {
                                "mDataProp": "profit", "title": "利润", "bSearchable": false, "width": 100,
                                "render": function (data, type, row) {
                                    return data + " AUD";
                                }
                            }

                        ],
                        "fnServerData": function (sSource, aoData, fnCallback) {
                            showMask("数据加载中，请稍候");

                            aoData.push({'name': 'begin_time_query', 'value': $("#begin_time_query").val()});
                            aoData.push({'name': 'end_time_query', 'value': $("#end_time_query").val()});

                            $.ajax({
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();

                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }

                                    fnCallback(data);
                                }
                            });
                        }

                    }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#saleAmountReportDayList');
            },
            refreshList: function () {
                refreshList('#saleAmountReportDayList');
            },
            viewChart: function () {
                var url = '{% url "ErpSaleAmountReportDay.Chart" %}';
                window.open(url, "sale_amount_report_day_chart");
            },
            calculate: function () {
                $.msg.confirm("将立即启动销售后台分析任务！", function () {
                    $.ajax({
                        "dataType": 'json',
                        "url": '{% url "ErpSaleAmountReportDay.Calculate" %}',
                        "success": function (data) {

                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                                return;
                            }
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
