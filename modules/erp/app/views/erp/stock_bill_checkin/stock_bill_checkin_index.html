{%header "手工入库" .%}
<div id="page">
   <div class="breadcrumbs" id="breadcrumbs">
       <ul class="breadcrumb">
           <li>
               <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
           </li>
           <li class="parent" data-menu="kcgl-menu">库存管理</li>
           <li class="active" data-menu="kcgl-stockbill-checkin-menu">手工入库</li>
       </ul>
   </div>
   <div class="page-content">
       <div class="row">
           <div class="col-xs-12" style="padding: 0;">
               <div class="gridToolBar clearfix">
                   <button class="btn btn-primary btn-sm" @click="reloadList('#stockBillList')">
                       <i class="ace-icon fa fa-refresh"></i>
                       刷新
                   </button>
                   <button class="btn btn-success btn-sm" @click="showStockBillDetail(0)">
                       <i class="ace-icon fa fa-plus"></i>
                       新增
                   </button>
                   <button class="btn btn-danger btn-sm" @click="deleteStockBill()">
                       <i class="ace-icon fa fa-trash-o"></i>
                       删除
                   </button>
               </div>
               <div>
                   <table id="stockBillList" class="table table-striped table-bordered table-hover"></table>
                   <div class="todo">1、批次号生成规则；2、其它需求明确，待实现；3、入库单明细等。</div>
               </div>
           </div>
       </div>
   </div>
    <div class="modal fade" id="stockBillDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">手工入库单详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="stockBillDetailForm">
                                <input id="stock_bill_id" name="detail.stock_bill.id" type="hidden" v-model.number="detail.stock_bill.id"/>
                                <input id="stock_bill_version" name="detail.stock_bill.version" type="hidden" v-model.number="detail.stock_bill.version"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="code" class="col-xs-2 control-label no-padding-right">批次号</label>
                                            <div class="col-xs-10">
                                                <input id="code" name="detail.stock_bill.code" type="text" class="input-sm form-control" v-model="detail.stock_bill.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="stock_id" class="col-xs-2 control-label no-padding-right">仓库</label>
                                            <div class="col-xs-10">
                                                <input id="stock_id" name="detail.stock_bill.stock_id" type="text" class="input-sm form-control" v-model.number="detail.stock_bill.stock_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-2 control-label no-padding-right">备注</label>
                                            <div class="col-xs-10">
                                                <input id="desc" name="detail.stock_bill.desc" type="text" class="input-sm form-control" v-model="detail.stock_bill.desc"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="date" class="col-xs-2 control-label no-padding-right">日期</label>
                                            <div class="col-xs-10">
                                                <input id="date" name="detail.stock_bill.date" type="text" class="input-sm form-control" v-model="detail.stock_bill.date"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="check_user_id" class="col-xs-2 control-label no-padding-right">操作人</label>
                                            <div class="col-xs-10">
                                                <input id="check_user_id" name="detail.stock_bill.check_user_id" type="text" class="input-sm form-control" v-model.number="detail.stock_bill.check_user_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveStockBill()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "stock_bill": {}
            }
        },
        mounted: function () {
            initDataTable(
                    '#stockBillList',
                    {
                        "sAjaxSource": '{%url "ErpStockBillCheckin.ListData"%}',
                        "aaSorting": [[1, "asc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "code", "title": "批次号", "bSearchable": true },
                            {"mDataProp": "stock_id", "title": "仓库", "bSearchable": false },
                            {"mDataProp": "desc", "title": "备注", "bSearchable": true },
                            {"mDataProp": "date", "title": "日期", "bSearchable": false },
                            {"mDataProp": "check_user_id", "title": "操作人", "bSearchable": false },
                            {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120 },
                            {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120 }
                        ]
                   }
            );

            $('#stockBillList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showStockBillDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#stockBillList');
            },
            showStockBillDetail: function (id) {
                showMask("加载中...");
                $("#stockBillDetailForm").clearValidation();
                $.ajax({
                           url: '{%url "ErpStockBillCheckin.DetailData" %}',
                           type: "POST",
                           data: {
                               "id": id
                           },
                           success: function (result) {
                               hideMask();
                               if (result.success == false) {
                                   $.msg.error(result.message);
                                   return;
                               }
                               vm.detail = result;
                               $('#stockBillDetailDialog').modal(modalOptions);
                           }
                       }
                );
            },
            saveStockBill: function () {
                showMask("提交中...");
                var form = $("#stockBillDetailForm");
                var valid = validate(form, {  
                    'detail.stock_bill.code': {
                        required: false
                    },
                    'detail.stock_bill.stock_id': {
                        required: true, digits: true
                    },
                    'detail.stock_bill.desc': {
                        required: false, minlength: 2, maxlength: 400
                    },
                    'detail.stock_bill.date': {
                        required: true
                    },
                    'detail.stock_bill.check_user_id': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                               url: '{%url "ErpStockBillCheckin.Save"%}',
                               type: "POST",
                               processData: false,
                               contentType: 'application/json',
                               data: JSON.stringify(vm.detail),
                               success: function (data) {
                                   hideMask();
                                   if (data.success == false) {
                                       $.msg.error(data.message);
                                       //return;
                                   }
                                   else {
                                       $.msg.show(data.message);
                                       $('#stockBillDetailDialog').modal('hide');
                                       vm.reloadList();
                                       //return;
                                   }
                               }
                           }
                    );
                }
            },
            deleteStockBill: function () {
                var id_list = [];
                $('#stockBillList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                               url: '{%url "ErpStockBillCheckin.Delete"%}',
                               type: "POST",
                               data: {"id_list": id_list},
                               success: function (data) {
                                   if (data.success == false) {
                                       $.msg.error(data.message);
                                       return;
                                   }
                                   else {
                                       $.msg.show(data.message);
                                   }
                                   vm.reloadList();
                               }
                           });
                });
            }
        }
    });
</script>
{%footer%}
