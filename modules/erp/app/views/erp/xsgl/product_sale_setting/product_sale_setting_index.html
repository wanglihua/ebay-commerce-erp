{%header "商品销售设置" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xsgl-menu">销售管理</li>
            <li class="active" data-menu="xsgl-product-sale-setting-menu">商品销售设置</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" onclick="loadProductSaleSettingDetail()">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="saveProductSaleSetting()">
                        <i class="ace-icon fa fa-floppy-o"></i>
                        保存
                    </button>
                </div>
                <div>
                    <div class="widget-box" style="border-style:none;width:780px; ">
                        <div class="widget-body">
                            <div class="widget-main">
                                <form class="form-horizontal" role="form" id="ProductSaleSettingDetailForm">
                                    <input id="product_sale_setting_id" name="detail.product_sale_setting.id" type="hidden" v-model.number="detail.product_sale_setting.id"/>

                                    <div class="row">
                                        <div class="col-xs-6">
                                            <div class="form-group">
                                                <label for="postage_cal_weight" class="col-xs-4 control-label">运费权重</label>
                                                <div class="col-xs-8">
                                                    <input id="postage_cal_weight" name="detail.product_sale_setting.postage_cal_weight" type="text" class="input-sm form-control" v-model.number="detail.product_sale_setting.postage_cal_weight"/>
                                                    <div class="help-block">客户端运费计算权重</div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-xs-6">
                                            <div class="form-group">
                                                <label for="dim_weight_formula" class="col-xs-4 control-label">体积重公式分母</label>
                                                <div class="col-xs-8">
                                                    <input id="dim_weight_formula" name="detail.product_sale_setting.dim_weight_formula" type="text" class="input-sm form-control" v-model.number="detail.product_sale_setting.dim_weight_formula"/>
                                                    <div class="help-block">通用的体积重公式分母，计算商品体积重，用于计算商品预估售价等</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <hr/>
                <div>
                    <div>
                        <button class="btn btn-primary btn-sm" @click="reloadList('#productList')" style="border-width: 4px;">
                            <i class="ace-icon fa fa-refresh"></i>
                            刷新
                        </button>
                        <button id="btnImport" class="btn btn-success btn-sm">
                            <i class="ace-icon fa fa-plus"></i>
                            导入
                        </button>
                        <button class="btn btn-purple btn-sm" onclick="exportProduct()">
                            <i class="ace-icon fa fa-file-excel-o"></i>
                            导出
                        </button>
                        <div style="margin-top: 10px;">
                            <a href="/static/excel-template/product_postage_cal_weight_import.xlsx">下载商品运费权重导入Excel模板</a>
                        </div>
                    </div>
                    <div>
                        <table id="productList" class="table table-striped table-bordered table-hover"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="productDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">商品运费权重详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="productDetailForm">
                                <input id="product_id" name="product_detail.product.id" type="hidden" v-model.number="product_detail.product.id"/>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="sku" class="col-xs-2 control-label">商品SKU</label>
                                            <div class="col-xs-10">
                                                <input id="sku" name="product_detail.product.sku" type="text" class="input-sm form-control" disabled="disabled" v-model.number="product_detail.product.sku"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="cn_name" class="col-xs-2 control-label">商品名称</label>
                                            <div class="col-xs-10">
                                                <input id="cn_name" name="product_detail.product.cn_name" type="text" class="input-sm form-control" disabled="disabled" v-model="product_detail.product.cn_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="product_postage_cal_weight" class="col-xs-2 control-label">运费权重</label>
                                            <div class="col-xs-10">
                                                <input id="product_postage_cal_weight" name="product_detail.product.postage_cal_weight" type="text" class="input-sm form-control" v-model.number="product_detail.product.postage_cal_weight"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" onclick="saveProductPostageCalWeight()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>
<script type="text/javascript" src="/static/lib/plupload/moxie.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/plupload.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/zh_CN.js"></script>
<script type="text/javascript">

    $(function () {
        init_uploader();
        loadProductSaleSettingDetail(this);

        initDataTable(
            '#productList',
            {
                "sAjaxSource": '{%url "ErpProductPostageCalWeight.ListData"%}',
                "aaSorting": [[1, "asc"]],
                "aoColumns": [
                    {
                        "mDataProp": "p.id",
                        "bSearchable": false,
                        "orderable": false,
                        "sClass": "center",
                        "width": 50,
                        "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                        "render": function (data, type, row) {
                            return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                        }
                    },
                    {
                        "mDataProp": "p.sku", "title": "商品SKU", "bSearchable": true, "width": 150,
                        "render": function (data, type, row) {
                            return '<a href="/product/detail/' + row.p.id + '" target="product_detail">' + row.p.sku + '</a>';
                        }
                        //<div class="tdSkuNameSup"><a href="/product/detail/' + row.prd.id + '" target="_blank">' + row.prd.sku + '</a></div>
                    },
                    {
                        "mDataProp": "p.cn_name", "title": "商品名称", "bSearchable": true, "sClass": "wrap-word",
                        "render": function (data, type, row) {
                            return "<div>" + data + "</div>";
                        }
                    },
                    {
                        "mDataProp": "p.postage_cal_weight", "title": "运费权重", "bSearchable": false, "width": 80, "sClass": "center",
                        "render": function (data, type, row) {
                            if (data !== 0) {
                                return dtFormatFloat(data);
                            }
                            else {
                                return "";
                            }
                        }
                    },
                    {"mDataProp": "s.name", "title": "状态", "bSearchable": true, "width": 80},
                    {"mDataProp": "p.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                    {"mDataProp": "p.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                ],
                "fnServerData": function (sSource, aoData, fnCallback) {
                    showMask("数据加载中，请稍候");

                    $.ajax(
                        {
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                hideMask();

                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    return;
                                }
                                fnCallback(data);
                            }
                        });
                }
            }
        );

        $('#productList tbody').on('dblclick', 'tr', function () {
            var id = $(this).find('td:first-child input:checkbox').val();
            showProductDetail(id);
        });
    });

    function init_uploader() {
        var uploader = new plupload.Uploader({
            runtimes: 'html5,flash,html4',
            multi_selection: false,

            browse_button: 'btnImport',
            file_data_name: "excel_file",

            url: '{%url "ErpProductPostageCalWeight.Import"%}',
            max_file_size: '10000kb',

            filters: [
                {title: "Excel文件", extensions: "xlsx"}
            ],

            flash_swf_url: '/plupload/js/Moxie.swf',

            init: {
                FilesAdded: function () {
                    showMask("上传中，请稍候...");
                    uploader.start();
                },
                FileUploaded: function (up, file, response) {
                    hideMask();
                    var result = JSON.parse(response.response);
                    if (result.success !== true) {
                        $.msg.error(result.message);
                    } else {
                        reloadList('#productList');
                        $.msg.show(result.message);
                    }
                },
                Error: function (up, err) {
                    $.msg.error("上传发生错误：" + err.code + ", " + err.message);
                }
            }
        });

        uploader.init();
    }

    function showProductDetail(product_id) {
        showMask("加载中...");
        $("#productDetailDialog").clearValidation();
        $.ajax({
                url: '{%url "ErpProductPostageCalWeight.DetailData" %}',
                type: "POST",
                data: {
                    "id": product_id
                },
                success: function (result) {
                    hideMask();
                    if (result.success === false) {
                        $.msg.error(result.message);
                        return;
                    }
                    vm.product_detail = result;
                    vm.product_detail.product.postage_cal_weight = parseFloat(dtFormatFloat1(result.product.postage_cal_weight));

                    $('#productDetailDialog').modal(modalOptions);
                }
            }
        );
    }

    function saveProductPostageCalWeight() {
        showMask("提交中...");
        var form = $("#productDetailForm");
        var valid = validate(form, {
            'detail.product.postage_cal_weight': {
                required: true, number: true
            }
        });

        if (!valid) {
            hideMask();
        } else {
            $.ajax({
                    url: '{%url "ErpProductPostageCalWeight.Save"%}',
                    type: "POST",
                    processData: false,
                    contentType: 'application/json',
                    data: JSON.stringify(vm.product_detail),
                    success: function (data) {
                        hideMask();
                        if (data.success === false) {
                            $.msg.error(data.message);
                            //return;
                        }
                        else {
                            $.msg.show(data.message);
                            $('#productDetailDialog').modal('hide');
                            vm.reloadList();
                            //return;
                        }
                    }
                }
            );
        }
    }

    function exportProduct() {
        var id_list = [];
        $('#productList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        var params = $.param({
            "id_list": id_list
        });
        var url = '{%url "ErpProductPostageCalWeight.Export"%}' + "?" + params;
        $('<form method="post" action="' + url + '"></form>').appendTo('body').submit().remove();
    }

    function loadProductSaleSettingDetail(this_vm) {
        showMask("加载中...");
        $("#ProductSaleSettingDetailForm").clearValidation();
        $.ajax({
                url: '{%url "ErpProductSaleSetting.DetailData" %}',
                type: "POST",
                success: function (result) {
                    hideMask();
                    if (result.success === false) {
                        $.msg.error(result.message);
                        return;
                    }

                    if (this_vm === void(0) || this_vm.detail === void(0)) {
                        vm.detail = result;
                    }
                    else {
                        this_vm.detail = result;
                    }
                }
            }
        );
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "product_sale_setting": {}
            },
            "product_detail": {
                "product": {}
            }
        },
        mounted: function () {
        },
        methods: {
            reloadList: function () {
                reloadList('#productList');
            },
            saveProductSaleSetting: function () {
                showMask("提交中...");
                var form = $("#ProductSaleSettingDetailForm");
                var valid = validate(form, {
                    'detail.product_sale_setting.postage_cal_weight': {
                        required: true, number: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax(
                        {
                            url: '{%url "ErpProductSaleSetting.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    vm.detail = data.detail;
                                    $.msg.show(data.message);
                                    //return;
                                }
                            }
                        }
                    );
                }
            }
        }
    });
</script>
{%footer%}
