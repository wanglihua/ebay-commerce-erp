<div class="modal fade" id="productSelectDialog">
    <div class="modal-dialog" style="width: 680px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                <h4 class="modal-title">产品选择</h4>
            </div>
            <div class="modal-body clearfix">
                <div class="row">
                    <div class="col-xs-12">
                        <table id="productList" class="table table-striped table-bordered table-hover"></table>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success btn-sm" onclick="acceptProductSelect()">
                    <i class="ace-icon fa fa-floppy-o"></i>选择
                </button>
                <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                    <i class="ace-icon fa fa-times"></i>关闭
                </button>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $(function () {
        // product
        initDataTable(
            '#productList',
            {
                "sAjaxSource": '{%url "ErpSalesManager.ProductSelectListData"%}',
                "aaSorting": [[1, "asc"]],
                "aoColumns": [
                    {
                        "mDataProp": "prd.id",
                        "bSearchable": false,
                        "orderable": false,
                        "sClass": "center",
                        "width": 50,
                        "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                        "render": function (data, type, row) {
                            return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                        }
                    },
                    {"mDataProp": "prd.sku", "title": "SKU", "bSearchable": true, "width": 150},
                    {
                        "mDataProp": "prd.cn_name", "title": "商品名称", "bSearchable": true,
                        "render": function (data, type, row) {
                            return data;
                            //return "<div style='min-width: 280px;white-space:normal; word-break: break-all; word-wrap:break-word;'>" + row.prd.cn_name + "<br/>" + row.prd.name + "</div>";
                        }
                    },
                    {"mDataProp": "st.name", "title": "状态", "bSearchable": false, "width": 80}
                ]
            }
        );
    });

    function acceptProductSelect() {
        var id_str_list = [];
        $('#productList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_str_list.push($(this).val());
            }
        });

        if (id_str_list.length == 0) {
            $.msg.alert("请选择一行或多行数据！");
            return;
        }

         var product_id_list = []; //parseInt(id_str_list[0]);
         for (var index in id_str_list) {
         product_id_list.push(parseInt(id_str_list[index]));
         }

         vm.detail.product_id_list = product_id_list;

        $.ajax({
            url: '{%url "ErpProduct.GetProductListSkus"%}',
            type: "POST",
            data: {"product_id_list": product_id_list},
            success: function (data) {
                vm.detail.product_skus = data.product_skus;
                //todo: 为什么一定要下面的用户名修改了之后,这个设值的效果才能看到
                vm.detail.user_name = vm.detail.user_name + " ";
            }
        });

        $('#productSelectDialog').modal('hide');
    }
</script>
