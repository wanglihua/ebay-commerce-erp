<div class="modal fade" id="userSelectDialog">
    <div class="modal-dialog" style="width: 680px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                <h4 class="modal-title">销售人员选择</h4>
            </div>
            <div class="modal-body clearfix">
                <div class="row">
                    <div class="col-xs-12">
                        <table id="userList" class="table table-striped table-bordered table-hover"></table>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success btn-sm" onclick="acceptUserSelect()">
                    <i class="ace-icon fa fa-floppy-o"></i>选择
                </button>
                <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                    <i class="ace-icon fa fa-times"></i>关闭
                </button>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $(function () {
        initSingleSelectDataTable(
            '#userList',
            {
                "sAjaxSource": '{%url "ErpSalesManager.UserSelectListData"%}',
                "aaSorting": [[1, "asc"]],
                "aoColumns": [
                    {
                        "mDataProp": "id",
                        "bSearchable": false,
                        "orderable": false,
                        "sClass": "center",
                        "width": 50,
                        "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                        "render": function (data, type, row) {
                            return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                        }
                    },
                    {"mDataProp": "login_name", "title": "工号", "bSearchable": true, "width": 120},
                    {"mDataProp": "nick_name", "title": "姓名", "bSearchable": true, "width": 120},
                    {"mDataProp": "sex", "title": "性别", "bSearchable": true, "width": 70},
                    {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                    {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                ]
            }
        );
    });

    function acceptUserSelect() {
        var id_list = [];
        $('#userList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length == 0 || id_list.length > 1) {
            $.msg.alert("请选择一行数据！");
            return;
        }

        var user_id = parseInt(id_list[0]);
        vm.detail.sales_manager.user_id = user_id;

        $.ajax({
            url: '{%url "AuthUser.GetUserInfo"%}',
            type: "POST",
            data: {"user_id": user_id},
            success: function (data) {
                vm.detail.user_name = data.user.login_name + " " + data.user.nick_name;
            }
        });

        $('#userSelectDialog').modal('hide');
    }
</script>
