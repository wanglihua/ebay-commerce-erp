{%header "销售负责人" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xsgl-menu">销售管理</li>
            <li class="active" data-menu="erp-salesmanager-menu">销售负责人</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#salesManagerList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showSalesManagerDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteSalesManager()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="salesManagerList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="salesManagerDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">销售负责人详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="salesManagerDetailForm">
                                <input id="sales_manager_id" name="detail.sales_manager.id" type="hidden" v-model.number="detail.sales_manager.id"/>
                                <input id="sales_manager_version" name="detail.sales_manager.version" type="hidden" v-model.number="detail.sales_manager.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="shop_id" class="col-xs-2 control-label">店铺</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="shop_id" name="detail.sales_manager.shop_id" type="hidden" class="input-sm form-control" v-model.number="detail.sales_manager.shop_id"/>
                                                    <input id="shop_shop_name" name="detail.shop_name" type="text" class="input-sm form-control" readonly="readonly" v-model="detail.shop_account_name"/>
                                                    <span class="input-group-btn">
                                                        <button type="button" class="btn btn-purple btn-sm" @click="showShopSelect()">
                                                            <span class="ace-icon fa fa-search icon-on-right"></span>&nbsp;选择
                                                        </button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="product_skus" class="col-xs-2 control-label">商品</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="product_id" name="detail.sales_manager.product_id" type="hidden" v-model.number="detail.sales_manager.product_id"/><!--这个没用了的-->
                                                    <input id="product_skus" name="detail.product_skus" type="text" readonly="readonly" class="input-sm form-control" v-model="detail.product_skus"/>
                                                    <span class="input-group-btn">
                                                        <button type="button" class="btn btn-purple btn-sm" @click="showProductSelect()">
                                                            <span class="ace-icon fa fa-search icon-on-right"></span>&nbsp;选择
                                                        </button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="user_id" class="col-xs-2 control-label">销售</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="user_id" name="detail.sales_manager.user_id" type="hidden" class="input-sm form-control" v-model.number="detail.sales_manager.user_id"/>
                                                    <input id="user_name" name="detail.user_name" type="text" class="input-sm form-control" readonly="readonly" v-model="detail.user_name"/>
                                                    <span class="input-group-btn">
                                                        <button type="button" class="btn btn-purple btn-sm" @click="showUserSelect()">
                                                            <span class="ace-icon fa fa-search icon-on-right"></span>&nbsp;选择
                                                        </button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveSalesManager()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div id="productSelectDialogWrapper"></div>
    <div id="shopSelectDialogWrapper"></div>
    <div id="userSelectDialogWrapper"></div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "sales_manager": {},
                "shop_account_name": "",
                "user_name": "",
                "product_id_list": [],
                "product_skus": ""
            }
        },
        mounted: function () {
            initDataTable(
                '#salesManagerList',
                {
                    "sAjaxSource": '{%url "ErpSalesManager.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "sm.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "ep.name", "title": "平台", "bSearchable": false, "width": 100},
                        {"mDataProp": "sa.name", "title": "店铺", "bSearchable": false, "width": 180},
                        {"mDataProp": "p.sku", "title": "SKU", "bSearchable": false, "width": 150},
                        {"mDataProp": "p.cn_name", "title": "商品名称", "bSearchable": false},
                        {"mDataProp": "u.nick_name", "title": "销售", "bSearchable": false, "width": 100},
                        {"mDataProp": "sm.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "sm.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#salesManagerList');
            },
            showSalesManagerDetail: function (id) {
                showMask("加载中...");
                $("#salesManagerDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpSalesManager.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#salesManagerDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveSalesManager: function () {
                showMask("提交中...");
                var form = $("#salesManagerDetailForm");
                var valid = validate(form, {
                    'detail.sales_manager.shop_id': {
                        required: true, digits: true
                    },
                    'detail.sales_manager.product_id': {
                        required: true, digits: true
                    },
                    'detail.sales_manager.user_id': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpSalesManager.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#salesManagerDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteSalesManager: function () {
                var id_list = [];
                $('#salesManagerList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpSalesManager.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            },
            showShopSelect: function () {
                $.ajax({
                    url: '{%url "ErpSalesManager.ShowShopAccountSelect"%}',
                    type: "POST",
                    success: function (data) {
                        $("#shopSelectDialogWrapper").html(data);
                        $('#shopSelectDialog').modal(modalOptions);
                    }
                });
            },
            showProductSelect: function () {
                $.ajax({
                    url: '{%url "ErpSalesManager.ShowProductSelect"%}',
                    type: "POST",
                    success: function (data) {
                        $("#productSelectDialogWrapper").html(data);
                        $('#productSelectDialog').modal(modalOptions);
                    }
                });
            },
            showUserSelect: function () {
                $.ajax({
                    url: '{%url "ErpSalesManager.ShowUserSelect"%}',
                    type: "POST",
                    success: function (data) {
                        $("#userSelectDialogWrapper").html(data);
                        $('#userSelectDialog').modal(modalOptions);
                    }
                });
            }
        }
    });
</script>
{%footer%}
