<div class="modal fade" id="shopSelectDialog">
    <div class="modal-dialog" style="width: 780px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                <h4 class="modal-title">店铺选择</h4>
            </div>
            <div class="modal-body clearfix">
                <div class="row">
                    <div class="col-xs-12">
                        <table id="shopAccountList" class="table table-striped table-bordered table-hover"></table>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success btn-sm" onclick="acceptShopSelect()">
                    <i class="ace-icon fa fa-floppy-o"></i>选择
                </button>
                <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                    <i class="ace-icon fa fa-times"></i>关闭
                </button>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $(function () {
        initSingleSelectDataTable(
            '#shopAccountList',
            {
                "sAjaxSource": '{%url "ErpSalesManager.ShopAccountSelectListData"%}',
                "aaSorting": [[1, "asc"]],
                "aoColumns": [
                    {
                        "mDataProp": "a.id",
                        "bSearchable": false,
                        "orderable": false,
                        "sClass": "center",
                        "width": 50,
                        "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                        "render": function (data, type, row) {
                            return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                        }
                    },
                    {"mDataProp": "a.name", "title": "名称", "bSearchable": true, "width": 150},
                    {"mDataProp": "a.platform", "title": "平台", "bSearchable": true, "width": 150},
                    {"mDataProp": "a.desc", "title": "描述", "bSearchable": true},
                    {"mDataProp": "s.name", "title": "状态", "bSearchable": true, "width": 80},
                    {"mDataProp": "a.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                    {"mDataProp": "a.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                ]
            }
        );
    });

    function acceptShopSelect() {
        var id_list = [];
        $('#shopAccountList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length == 0 || id_list.length > 1) {
            $.msg.alert("请选择一行数据！");
            return;
        }

        var shop_account_id = parseInt(id_list[0]);
        vm.detail.sales_manager.shop_id = shop_account_id;

        $.ajax({
            url: '{%url "ErpShopAccount.GetShopAccountInfo"%}',
            type: "POST",
            data: {"shop_account_id": shop_account_id},
            success: function (data) {
                vm.detail.shop_account_name = data.shop_account.platform + " " + data.shop_account.name;
            }
        });

        $('#shopSelectDialog').modal('hide');
    }
</script>
