{%header "商品运费预估" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xsgl-menu">销售管理</li>
            <li class="active" data-menu="xsgl-product-logistics-menu">商品运费预估</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#productLogisticsList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="addProductLogistics()">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteProductLogistics()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="productLogisticsList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="productLogisticsAddDialog">
        <div class="modal-dialog" style="width: 580px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">商品运费预估添加</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="productLogisticsForm">

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="product_code" class="col-xs-2 control-label">SKU</label>
                                            <div class="col-xs-10">
                                                <input id="product_code" name="detail.product_logistics.product_code" type="text" class="input-sm form-control" v-model="detail.product_logistics.product_code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="qty" class="col-xs-2 control-label">数量</label>
                                            <div class="col-xs-10">
                                                <input id="qty" name="detail.product_logistics.qty" type="text" class="input-sm form-control" v-model.number="detail.product_logistics.qty"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="postal_code" class="col-xs-2 control-label">地址邮编</label>
                                            <div class="col-xs-10">
                                                <input id="postal_code" name="detail.product_logistics.postal_code" type="text" class="input-sm form-control" v-model="detail.product_logistics.postal_code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveProductLogistics()">
                        <i class="ace-icon fa fa-floppy-o"></i>匹配
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>取消
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "product_logistics": {}
            }
        },
        mounted: function () {
            initDataTable(
                    '#productLogisticsList',
                    {
                        "sAjaxSource": '{%url "ErpProductLogistics.ListData"%}',
                        "aaSorting": [[1, "asc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id",
                                "bSearchable": false,
                                "orderable": false,
                                "sClass": "center",
                                "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "product_code", "title": "SKU", "bSearchable": true, "width": 130},
                            {"mDataProp": "qty", "title": "数量", "bSearchable": false, "sClass": "center", "width": 60},
                            {"mDataProp": "postal_code", "title": "地址邮编", "bSearchable": true, "sClass": "center", "width": 80},
                            {"mDataProp": "stock_name", "title": "发货仓库", "bSearchable": true, "width": 120},
                            {"mDataProp": "mode_name", "title": "物流方式", "bSearchable": true},
                            {"mDataProp": "fee_postal_code", "title": "费率邮编", "bSearchable": true, "sClass": "center", "width": 80},
                            {
                                "mDataProp": "fee", "title": "物流费用", "bSearchable": false, "sClass": "dtRight", "width": 75,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {
                                "mDataProp": "cost", "title": "拣货费用", "bSearchable": false, "sClass": "dtRight", "width": 75,
                                "render": function (data, type, row) {
                                    return dtFormatFloat(data);
                                }
                            },
                            {"mDataProp": "result_type", "title": "匹配类型", "bSearchable": true, "sClass": "center", "width": 80},
                            {"mDataProp": "success", "title": "匹配结果", "bSearchable": true, "sClass": "center", "width": 80},
                            {"mDataProp": "create_time", "title": "匹配时间", "bSearchable": false, "sClass": "center", "width": 120}
                        ]
                    }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#productLogisticsList');
            },
            addProductLogistics: function () {
                showMask("加载中...");
                $("#productLogisticsForm").clearValidation();
                $.ajax({
                    url: '{%url "ErpProductLogistics.DetailData" %}',
                    type: "POST",
                    success: function (result) {
                        hideMask();
                        if (result.success === false) {
                            $.msg.error(result.message);
                            return;
                        }
                        vm.detail = result;
                        $('#productLogisticsAddDialog').modal(modalOptions);
                    }
                });
            },
            saveProductLogistics: function () {
                showMask("提交中...");
                var form = $("#productLogisticsForm");
                var valid = validate(form, {
                    'detail.product_logistics.product_code': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.product_logistics.qty': {
                        required: true, digits: true
                    },
                    'detail.product_logistics.postal_code': {
                        required: true, minlength: 2, maxlength: 10
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                        url: '{%url "ErpProductLogistics.Save"%}',
                        type: "POST",
                        processData: false,
                        contentType: 'application/json',
                        data: JSON.stringify(vm.detail),
                        success: function (data) {
                            hideMask();
                            if (data.success === false) {
                                $.msg.error(data.message);
                                //return;
                            }
                            else {
                                $.msg.show(data.message);
                                $('#productLogisticsAddDialog').modal('hide');
                                vm.reloadList();
                                //return;
                            }
                        }
                    });
                }
            },
            deleteProductLogistics: function () {
                var id_list = [];
                $('#productLogisticsList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length === 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpProductLogistics.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
