{%header "库存盘点" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="kcgl-menu">库存管理</li>
            <li class="active" data-menu="kcgl-inventorycheck-menu">库存盘点</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#inventoryCheckList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showInventoryCheckDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteInventoryCheck()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="inventoryCheckList" class="table table-striped table-bordered table-hover"></table>
                    <div class="todo">
                        1、批次号生成规则；
                        2、盘点单状态的问题，如何区分“保存未提交”和“提交未审核”的状态。保存过程中，被人审批了的问题。新建保存的也用“未通过”的状态？
                        3、其它需求明确，待实现；
                        4、提交并审核；
                        5、盘点明细等。
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="inventoryCheckDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">库存盘点详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="inventoryCheckDetailForm">
                                <input id="inventory_check_id" name="detail.inventory_check.id" type="hidden" v-model.number="detail.inventory_check.id"/>
                                <input id="inventory_check_version" name="detail.inventory_check.version" type="hidden" v-model.number="detail.inventory_check.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="code" class="col-xs-2 control-label no-padding-right">批次号</label>
                                            <div class="col-xs-10">
                                                <input id="code" name="detail.inventory_check.code" type="text" class="input-sm form-control" v-model="detail.inventory_check.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="stock_id" class="col-xs-2 control-label no-padding-right">仓库</label>
                                            <div class="col-xs-10">
                                                <select id="stock_id" name="detail.inventory_check.stock_id" class="input-sm form-control" v-model.number="detail.inventory_check.stock_id">
                                                    <template v-for="stock in detail.stock_list">
                                                        <option :value="stock.id">{{stock.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="check_date" class="col-xs-2 control-label no-padding-right">盘点日期</label>
                                            <div class="col-xs-10">
                                                <input id="check_date" name="detail.inventory_check.check_date" type="text" class="input-sm form-control" v-model="detail.inventory_check.check_date"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-2 control-label no-padding-right">备注</label>
                                            <div class="col-xs-10">
                                                <textarea id="desc" name="detail.inventory_check.desc" rows="2" class="input-sm form-control" v-model="detail.inventory_check.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveInventoryCheck()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "inventory_check": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#inventoryCheckList',
                {
                    "sAjaxSource": '{%url "ErpInventoryCheck.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "ic.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "ic.code", "title": "批次号", "bSearchable": true, "width": 160},
                        {"mDataProp": "st.name", "title": "仓库", "bSearchable": false, "width": 160},
                        {"mDataProp": "ic.desc", "title": "备注", "bSearchable": true},
                        {"mDataProp": "ic.check_date", "title": "盘点日期", "bSearchable": false, "width": 85},
                        {"mDataProp": "cu.nick_name", "title": "盘点人", "bSearchable": true, "width": 75},
                        {"mDataProp": "au.nick_name", "title": "审批人", "bSearchable": true, "width": 75},
                        {"mDataProp": "ss.name", "title": "状态", "bSearchable": true, "width": 80},
                        {"mDataProp": "ic.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "ic.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#inventoryCheckList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showInventoryCheckDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#inventoryCheckList');
            },
            showInventoryCheckDetail: function (id) {
                showMask("加载中...");
                $("#inventoryCheckDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpInventoryCheck.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#inventoryCheckDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveInventoryCheck: function () {
                showMask("提交中...");
                var form = $("#inventoryCheckDetailForm");
                var valid = validate(form, {
                    'detail.inventory_check.code': {
                        required: false
                    },
                    'detail.inventory_check.stock_id': {
                        required: true, digits: true
                    },
                    'detail.inventory_check.desc': {
                        required: false, minlength: 2, maxlength: 400
                    },
                    'detail.inventory_check.check_date': {
                        required: true
                    },
                    'detail.inventory_check.check_user_id': {
                        required: true, digits: true
                    },
                    'detail.inventory_check.approve_user_id': {
                        required: false, digits: true
                    },
                    'detail.inventory_check.status_id': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpInventoryCheck.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#inventoryCheckDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteInventoryCheck: function () {
                var id_list = [];
                $('#inventoryCheckList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpInventoryCheck.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
