{%header "采购单" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="erp-menu">ERP</li>
            <li class="active" data-menu="erp-purchasebillentry-menu">采购单</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadEntryList('#purchaseBillEntryList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showPurchaseBillEntryDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deletePurchaseBillEntry()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="purchaseBillEntryList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="purchaseBillEntryDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">采购单详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="purchaseBillEntryDetailForm">
                                <input id="purchase_bill_entry_id" name="detail.purchase_bill_entry.id" type="hidden" v-model.number="detail.purchase_bill_entry.id"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="bill_id" class="col-xs-2 control-label">批次</label>
                                            <div class="col-xs-10">
                                                <input id="bill_id" name="detail.purchase_bill_entry.bill_id" type="text" class="input-sm form-control" v-model.number="detail.purchase_bill_entry.bill_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="product_id" class="col-xs-2 control-label">商品</label>
                                            <div class="col-xs-10">
                                                <input id="product_id" name="detail.purchase_bill_entry.product_id" type="text" class="input-sm form-control" v-model.number="detail.purchase_bill_entry.product_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="qty" class="col-xs-2 control-label">数量</label>
                                            <div class="col-xs-10">
                                                <input id="qty" name="detail.purchase_bill_entry.qty" type="text" class="input-sm form-control" v-model.number="detail.purchase_bill_entry.qty"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="price" class="col-xs-2 control-label">单价</label>
                                            <div class="col-xs-10">
                                                <input id="price" name="detail.purchase_bill_entry.price" type="text" class="input-sm form-control" v-model.number="detail.purchase_bill_entry.price"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="amount" class="col-xs-2 control-label">金额</label>
                                            <div class="col-xs-10">
                                                <input id="amount" name="detail.purchase_bill_entry.amount" type="text" class="input-sm form-control" v-model.number="detail.purchase_bill_entry.amount"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="purchase_date" class="col-xs-2 control-label">采购日期</label>
                                            <div class="col-xs-10">
                                                <input id="purchase_date" name="detail.purchase_bill_entry.purchase_date" type="text" class="input-sm form-control" v-model="detail.purchase_bill_entry.purchase_date"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="checkin_date" class="col-xs-2 control-label">入库日期</label>
                                            <div class="col-xs-10">
                                                <input id="checkin_date" name="detail.purchase_bill_entry.checkin_date" type="text" class="input-sm form-control" v-model="detail.purchase_bill_entry.checkin_date"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-2 control-label">备注</label>
                                            <div class="col-xs-10">
                                                <input id="desc" name="detail.purchase_bill_entry.desc" type="text" class="input-sm form-control" v-model="detail.purchase_bill_entry.desc"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="savePurchaseBillEntry()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "purchase_bill_entry": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#purchaseBillEntryList',
                {
                    "sAjaxSource": '{%url "ErpPurchaseBillEntry.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "bill_id", "title": "批次", "bSearchable": false},
                        {"mDataProp": "product_id", "title": "商品", "bSearchable": false},
                        {"mDataProp": "qty", "title": "数量", "bSearchable": false},
                        {"mDataProp": "price", "title": "单价", "bSearchable": false},
                        {"mDataProp": "amount", "title": "金额", "bSearchable": false},
                        {"mDataProp": "purchase_date", "title": "采购日期", "bSearchable": false},
                        {"mDataProp": "checkin_date", "title": "入库日期", "bSearchable": false},
                        {"mDataProp": "desc", "title": "备注", "bSearchable": true},
                        {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#purchaseBillEntryList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showPurchaseBillEntryDetail(id);
            });
        },
        methods: {
            reloadEntryList: function () {
                reloadList('#purchaseBillEntryList');
            },
            showPurchaseBillEntryDetail: function (id) {
                showMask("加载中...");
                $("#purchaseBillEntryDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpPurchaseBillEntry.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#purchaseBillEntryDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            savePurchaseBillEntry: function () {
                showMask("提交中...");
                var form = $("#purchaseBillEntryDetailForm");
                var valid = validate(form, {
                    'detail.purchase_bill_entry.bill_id': {
                        required: true, digits: true
                    },
                    'detail.purchase_bill_entry.product_id': {
                        required: true, digits: true
                    },
                    'detail.purchase_bill_entry.qty': {
                        required: true, digits: true
                    },
                    'detail.purchase_bill_entry.price': {
                        required: true, number: true
                    },
                    'detail.purchase_bill_entry.amount': {
                        required: true, number: true
                    },
                    'detail.purchase_bill_entry.purchase_date': {
                        required: false
                    },
                    'detail.purchase_bill_entry.checkin_date': {
                        required: false
                    },
                    'detail.purchase_bill_entry.desc': {
                        required: false, minlength: 2, maxlength: 400
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpPurchaseBillEntry.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#purchaseBillEntryDetailDialog').modal('hide');
                                    vm.reloadEntryList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deletePurchaseBillEntry: function () {
                var id_list = [];
                $('#purchaseBillEntryList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpPurchaseBillEntry.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadEntryList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
