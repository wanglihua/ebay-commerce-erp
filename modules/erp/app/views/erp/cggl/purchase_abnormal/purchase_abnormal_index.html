{%header "异常采购单" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="cggl-menu">采购管理</li>
            <li class="active" data-menu="cggl-purchase-abnormal-menu">异常采购单</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadEntryList('#purchaseBillEntryList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-pink btn-sm" onclick="showProcess()">
                        <i class="ace-icon fa fa-share"></i>
                        处理异常
                    </button>
                </div>
                <div id="query" class="col-xs-12" style="line-height: 28px;">
                    <select id="bill_code_query" name="bill_code_query" style="width: 140px;" v-model.number="page.bill_code_query" @change="querySelectChange()">
                        <option :value="0">采购单批次号查询</option>
                        {% range $index, $bill_query := .bill_query_list %}
                        <option :value="{% $bill_query.BillCode %}">{% $bill_query.BillCode %}({% $bill_query.BillStatus %})</option>
                        {% end %}
                    </select>
                    <select id="status_id_query" name="status_id_query" style="width: 130px;" v-model.number="page.status_id_query" @change="querySelectChange()">
                        <option :value="0">采购项目状态查询</option>
                        {% range $index, $status := .status_list %}
                        <option :value="{% $status.Id %}">{% $status.Name %}</option>
                        {% end %}
                    </select>
                    <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" onclick="search()">
                        &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                    </button>
                    <hr style="margin-top:10px;margin-bottom:10px;"/>
                </div>
                <div>
                    <table id="purchaseBillEntryList" class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>id</th>
                            <th>采购批次号</th>
                            <th>状态</th>
                            <th>异常类型</th>
                            <th>SKU</th>
                            <th>名称</th>
                            <th>数量/入库数量/异常数量</th>
                            <th id="th_apply_time">采购时间</th>
                            <th id="th_checkin_time">入库时间</th>
                            <th>备注</th>
                        </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="purchaseProcessDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">采购商品入库</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="purchaseProcessForm">
                                <input id="purchase_bill_entry_id" name="purchase_bill_entry_detail.purchase_bill_entry.id" type="hidden" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.id"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="bill_id" class="col-xs-2 control-label">批次</label>
                                            <div class="col-xs-10">
                                                <input id="bill_id" name="purchase_bill_entry_detail.purchase_bill.id" type="hidden" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill.id"/>
                                                <input id="bill_code" name="purchase_bill_entry_detail.purchase_bill.code" type="text" class="input-sm form-control" readonly="readonly" v-model.number="purchase_bill_entry_detail.purchase_bill.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="product_id" class="col-xs-2 control-label">商品</label>
                                            <div class="col-xs-10">
                                                <input id="product_id" name="purchase_bill_entry_detail.purchase_bill_entry.product_id" type="hidden" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.product_id"/>
                                                <input id="product_name" name="purchase_bill_entry_detail.product_name" type="text" class="input-sm form-control" readonly="readonly" v-model="purchase_bill_entry_detail.product_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="mel_qty" class="col-xs-2 control-label">MEL数量</label>
                                            <div class="col-xs-10">
                                                <input id="mel_qty" name="purchase_bill_entry_detail.purchase_bill_entry.mel_qty" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.mel_qty" disabled="disabled"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="bne_qty" class="col-xs-2 control-label">BNE数量</label>
                                            <div class="col-xs-10">
                                                <input id="bne_qty" name="purchase_bill_entry_detail.purchase_bill_entry.bne_qty" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.bne_qty" disabled="disabled"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="qty" class="col-xs-2 control-label">采购数量</label>
                                            <div class="col-xs-10">
                                                <input id="qty" name="purchase_bill_entry_detail.purchase_bill_entry.qty" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.qty" disabled="disabled"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="checkin_qty" class="col-xs-2 control-label">入库数量</label>
                                            <div class="col-xs-10">
                                                <input id="checkin_qty" name="purchase_bill_entry_detail.purchase_bill_entry.checkin_qty" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.checkin_qty" disabled="disabled"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="abnormal_process_result_id" class="col-xs-2 control-label">处理结果</label>
                                            <div class="col-xs-10">
                                                <select id="abnormal_process_result_id" name="purchase_bill_entry_detail.purchase_bill_entry.abnormal_process_result_id" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.abnormal_process_result_id">
                                                    <template v-for="abnormal_process_result in purchase_bill_entry_detail.abnormal_process_result_list">
                                                        <option :value="abnormal_process_result.id">{{abnormal_process_result.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="diff_amount" class="col-xs-2 control-label">偏差金额</label>
                                            <div class="col-xs-10">
                                                <input id="diff_amount" name="purchase_bill_entry_detail.purchase_bill_entry.diff_amount" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.diff_amount"/>
                                                <div class="help-block">如果是供应商退款，输入正数的金额；如果是损失，输入负数的金额。</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="purchase_bill_entry_desc" class="col-xs-2 control-label">备注</label>
                                            <div class="col-xs-10">
                                                <textarea id="purchase_bill_entry_desc" name="purchase_bill_entry_detail.purchase_bill_entry.desc" rows="2" class="input-sm form-control" v-model="purchase_bill_entry_detail.purchase_bill_entry.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" onclick="process()">
                        <i class="ace-icon fa fa-floppy-o"></i>确认
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">

    function search() {
        refreshList("#purchaseBillEntryList");
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "page": {
                "bill_code_query": "0",
                "status_id_query": 0
            },
            "purchase_bill_entry_detail": {
                "purchase_bill_entry": {},
                "purchase_bill": {}
            }
        },
        mounted: function () {
            var this_vm = this;

            initDataTable(
                    '#purchaseBillEntryList',
                    {
                        "sAjaxSource": '{%url "ErpPurchaseAbnormal.ListData"%}',
                        "aaSorting": [[1, "asc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "pbe.id",
                                "bSearchable": false,
                                "orderable": false,
                                "sClass": "center",
                                "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "pb.code", "title": "采购批次号", "bSearchable": true, "width": 100},
                            {"mDataProp": "s.name", "title": "状态", "bSearchable": true, "width": 60},
                            {"mDataProp": "at.name", "title": "异常类型", "bSearchable": true, "width": 80},
                            {"mDataProp": "p.sku", "title": "SKU", "bSearchable": true, "width": 100},
                            {
                                "mDataProp": "p.cn_name", "title": "名称", "bSearchable": true, "sClass": "wrap-word",
                                "render": function (data, type, row) {
                                    return "<div>" + data + "</div>";
                                }
                            },
                            {
                                "mDataProp": "pbe.qty", "title": "数量/入库数量/异常数量", "bSearchable": false, "sClass": "center", "width": 160,
                                "render": function (data, type, row) {
                                    return "<div>" + data + "/" + row.pbe.checkin_qty + "/" + (row.pbe.qty - row.pbe.checkin_qty) + "</div>";
                                }
                            },
                            {
                                "mDataProp": "pb.apply_time", "title": "采购时间", "bSearchable": false, "width": 120, "sClass": "center",
                                "render": function (data, type, row) {
                                    return "<div class='div_apply_time'>" + row.pb.apply_time + "</div><div>" + row.pbe.checkin_time + "</div>";
                                }
                            },
                            {
                                "mDataProp": "pbe.checkin_time", "title": "入库时间", "bSearchable": false, "width": 120, "sClass": "center",
                                "render": function (data, type, row) {
                                    return "<div class='div_checkin_time'>" + data + "</div>";
                                }
                            },
                            {
                                "mDataProp": "pbe.desc", "title": "备注", "bSearchable": true, "sClass": "wrap-word",
                                "render": function (data, type, row) {
                                    if (data === null) {
                                        return ""
                                    }
                                    else {
                                        return "<div>" + data + "</div>";
                                    }
                                }
                            }
                        ],
                        "fnServerData": function (sSource, aoData, fnCallback) {
                            showMask("数据加载中，请稍候");

                            aoData.push({'name': 'bill_code_query', 'value': this_vm.page.bill_code_query});
                            aoData.push({'name': 'status_id_query', 'value': this_vm.page.status_id_query});

                            $.ajax(
                                    {
                                        "dataType": 'json',
                                        "url": sSource,
                                        "data": aoData,
                                        "success": function (data) {
                                            hideMask();
                                            if (data.success === false) {
                                                $.msg.error(data.message);
                                                return;
                                            }
                                            fnCallback(data);

                                            $("#purchaseBillEntryList div.div_apply_time").parent().css("width", "120px");
                                            $("#purchaseBillEntryList div.div_checkin_time").parent().css("display", "none");
                                        }
                                    });
                        }
                    }
            );
            $("#th_apply_time").before("<th id='th_apply_time_ext'></th>");
            $("#th_apply_time").wrap("<div id='div_apply_time'></div>");
            $("#th_checkin_time").wrap("<div id='div_checkin_time'></div>");
            $("#th_apply_time_ext").append($("#div_apply_time")).append($("#div_checkin_time"));
        },
        methods: {
            reloadEntryList: function () {
                reloadList('#purchaseBillEntryList');
            },
            querySelectChange: function () {
                search();
            }
        }
    });


    function showProcess() {
        var id_list = [];
        $('#purchaseBillEntryList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length !== 1) {
            $.msg.alert("请选择一行数据，进行入库！");
            return;
        }

        var id = id_list[0];

        showMask("加载中...");
        $("#purchaseProcessForm").clearValidation();
        $.ajax({
                    url: '{%url "ErpPurchaseAbnormal.DetailData" %}',
                    type: "POST",
                    data: {
                        "id": id
                    },
                    success: function (result) {
                        hideMask();
                        if (result.success === false) {
                            $.msg.error(result.message);
                            return;
                        }
                        vm.purchase_bill_entry_detail = result;
                        $('#purchaseProcessDialog').modal(modalOptions);
                    }
                }
        );
    }

    function process() {
        showMask("提交中...");
        var form = $("#purchaseProcessForm");
        var valid = validate(form, {
            'purchase_bill_entry_detail.purchase_bill_entry.checkin_qty': {
                required: true, digits: true
            },
            'purchase_bill_entry_detail.purchase_bill_entry.desc': {
                required: false, maxlength: 400
            }
        });

        if (!valid) {
            hideMask();
        } else {
            $.ajax({
                        url: '{%url "ErpPurchaseAbnormal.Process"%}',
                        type: "POST",
                        processData: false,
                        contentType: 'application/json',
                        data: JSON.stringify(vm.purchase_bill_entry_detail),
                        success: function (data) {
                            hideMask();
                            if (data.success === false) {
                                $.msg.error(data.message);
                                //return;
                            }
                            else {
                                $.msg.show(data.message);
                                $('#purchaseProcessDialog').modal('hide');
                                vm.reloadEntryList();
                                //return;
                            }
                        }
                    }
            );
        }
    }
</script>
{%footer%}
