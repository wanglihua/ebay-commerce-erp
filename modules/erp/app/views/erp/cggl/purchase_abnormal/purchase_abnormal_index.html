{%header "异常采购单" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="cggl-menu">采购管理</li>
            <li class="active" data-menu="cggl-purchase-abnormal-menu">异常采购单</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadEntryList('#purchaseBillEntryList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div>
                    <table id="purchaseBillEntryList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {},
        mounted: function () {
            initDataTable(
                '#purchaseBillEntryList',
                {
                    "sAjaxSource": '{%url "ErpPurchaseAbnormal.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "pbe.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "pb.code", "title": "采购批次号", "bSearchable": true, "width": 100},
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": true, "width": 60},
                        {"mDataProp": "at.name", "title": "异常类型", "bSearchable": true, "width": 80},
                        {"mDataProp": "p.sku", "title": "SKU", "bSearchable": true, "width": 100},
                        {
                            "mDataProp": "p.cn_name", "title": "名称", "bSearchable": true, "sClass": "wrap-word",
                            "render": function (data, type, row) {
                                return "<div>" + data + "</div>";
                            }
                        },
                        {"mDataProp": "pbe.qty", "title": "数量", "bSearchable": false, "width": 80},
                        {"mDataProp": "pbe.purchase_time", "title": "采购时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "pbe.checkin_time", "title": "入库时间", "bSearchable": false, "width": 120},
                        {
                            "mDataProp": "pbe.desc", "title": "备注", "bSearchable": true, "sClass": "wrap-word",
                            "render": function (data, type, row) {
                                if (data === null) {
                                    return ""
                                }
                                else {
                                    return "<div>" + data + "</div>";
                                }
                            }
                        }
                    ]
                }
            );
        },
        methods: {
            reloadEntryList: function () {
                reloadList('#purchaseBillEntryList');
            }
        }
    });
</script>
{%footer%}
