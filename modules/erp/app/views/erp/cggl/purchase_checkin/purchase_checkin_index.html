{%header "入库管理" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="cggl-menu">采购管理</li>
            <li class="active" data-menu="cggl-purchase-checkin-menu">入库管理</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadEntryList('#purchaseBillEntryList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-pink btn-sm" onclick="showCheckin()">
                        <i class="ace-icon fa fa-share"></i>
                        入库
                    </button>
                </div>
                <div id="query" class="col-xs-12" style="line-height: 28px;">
                    <select id="bill_code_query" name="bill_code_query" style="width: 120px;" v-model.number="page.bill_code_query" @change="billCodeQuerySelectChange()">
                        <option :value="0">采购单批次号</option>
                        {% range $index, $bill_code := .bill_code_list %}
                        <option :value="{% $bill_code %}">{% $bill_code %}</option>
                        {% end %}
                    </select>
                    <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" onclick="search()">
                        &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                    </button>
                    <hr style="margin-top:10px;margin-bottom:10px;"/>
                </div>
                <div>
                    <table id="purchaseBillEntryList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="purchaseCheckinDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">采购商品入库</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="purchaseCheckinForm">
                                <input id="purchase_bill_entry_id" name="purchase_bill_entry_detail.purchase_bill_entry.id" type="hidden" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.id"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="bill_id" class="col-xs-2 control-label">批次</label>
                                            <div class="col-xs-10">
                                                <input id="bill_id" name="purchase_bill_entry_detail.purchase_bill.id" type="hidden" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill.id"/>
                                                <input id="bill_code" name="purchase_bill_entry_detail.purchase_bill.code" type="text" class="input-sm form-control" readonly="readonly" v-model.number="purchase_bill_entry_detail.purchase_bill.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="product_id" class="col-xs-2 control-label">商品</label>
                                            <div class="col-xs-10">
                                                <input id="product_id" name="purchase_bill_entry_detail.purchase_bill_entry.product_id" type="hidden" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.product_id"/>
                                                <input id="product_name" name="purchase_bill_entry_detail.product_name" type="text" class="input-sm form-control" readonly="readonly" v-model="purchase_bill_entry_detail.product_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="qty" class="col-xs-2 control-label">采购数量</label>
                                            <div class="col-xs-10">
                                                <input id="qty" name="purchase_bill_entry_detail.purchase_bill_entry.qty" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.qty" disabled="disabled"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="checkin_qty" class="col-xs-2 control-label">入库数量</label>
                                            <div class="col-xs-10">
                                                <input id="checkin_qty" name="purchase_bill_entry_detail.purchase_bill_entry.checkin_qty" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.checkin_qty"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="abnormal_type_id" class="col-xs-2 control-label">异常类型</label>
                                            <div class="col-xs-10">
                                                <select id="abnormal_type_id" name="purchase_bill_entry_detail.purchase_bill_entry.abnormal_type_id" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.abnormal_type_id">
                                                    <template v-for="abnormal_type in purchase_bill_entry_detail.abnormal_type_list">
                                                        <option :value="abnormal_type.id">{{abnormal_type.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="purchase_bill_entry_desc" class="col-xs-2 control-label">备注</label>
                                            <div class="col-xs-10">
                                                <textarea id="purchase_bill_entry_desc" name="purchase_bill_entry_detail.purchase_bill_entry.desc" rows="2" class="input-sm form-control" v-model="purchase_bill_entry_detail.purchase_bill_entry.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" onclick="checkin()">
                        <i class="ace-icon fa fa-floppy-o"></i>确认
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">

    function search() {
        refreshList("#purchaseBillEntryList");
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "page": {},
            "purchase_bill_entry_detail": {
                "purchase_bill_entry": {},
                "purchase_bill": {}
            }
        },
        mounted: function () {
            var this_vm = this;

            initDataTable(
                '#purchaseBillEntryList',
                {
                    "sAjaxSource": '{%url "ErpPurchaseCheckin.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "pbe.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "pb.code", "title": "采购批次号", "bSearchable": false, "width": 120},
                        {"mDataProp": "p.sku", "title": "SKU", "bSearchable": false, "width": 160},
                        {
                            "mDataProp": "p.cn_name", "title": "名称", "bSearchable": false, "sClass": "word-wrap", "width": 200,
                            "render": function (data, type, row) {
                                return "<div>" + data + "</div>"
                            }
                        },
                        {"mDataProp": "pbe.qty", "title": "数量", "bSearchable": false, "width": 80, "sClass": "center"},
                        {"mDataProp": "pbe.purchase_date", "title": "采购日期", "bSearchable": false, "sClass": "center", "width": 120},
                        {"mDataProp": "pbe.checkin_date", "title": "入库日期", "bSearchable": false, "sClass": "center", "width": 120},
                        {"mDataProp": "pbe.desc", "title": "备注", "bSearchable": true},
                        {"mDataProp": "pbe.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "pbe.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'bill_code_query', 'value': this_vm.page.bill_code_query});

                        $.ajax(
                            {
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data);
                                }
                            });
                    }
                }
            );
        },
        methods: {
            reloadEntryList: function () {
                reloadList('#purchaseBillEntryList');
            },
            billCodeQuerySelectChange: function () {
                search();
            }
        }
    });

    function showCheckin() {
        var id_list = [];
        $('#purchaseBillEntryList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length !== 1) {
            $.msg.alert("请选择一行数据，进行入库！");
            return;
        }

        var id = id_list[0];

        showMask("加载中...");
        $("#purchaseCheckinForm").clearValidation();
        $.ajax({
                url: '{%url "ErpPurchaseCheckin.DetailData" %}',
                type: "POST",
                data: {
                    "id": id
                },
                success: function (result) {
                    hideMask();
                    if (result.success === false) {
                        $.msg.error(result.message);
                        return;
                    }
                    vm.purchase_bill_entry_detail = result;
                    $('#purchaseCheckinDialog').modal(modalOptions);
                }
            }
        );
    }

    function checkin() {
        showMask("提交中...");
        var form = $("#purchaseCheckinForm");
        var valid = validate(form, {
            'purchase_bill_entry_detail.purchase_bill_entry.checkin_qty': {
                required: true, digits: true
            },
            'purchase_bill_entry_detail.purchase_bill_entry.desc': {
                required: false, maxlength: 400
            }
        });

        if (!valid) {
            hideMask();
        } else {
            $.ajax({
                    url: '{%url "ErpPurchaseCheckin.Checkin"%}',
                    type: "POST",
                    processData: false,
                    contentType: 'application/json',
                    data: JSON.stringify(vm.purchase_bill_detail),
                    success: function (data) {
                        hideMask();
                        if (data.success === false) {
                            $.msg.error(data.message);
                            //return;
                        }
                        else {
                            $.msg.show(data.message);
                            $('#purchaseCheckinDialog').modal('hide');
                            vm.reloadList();
                            //return;
                        }
                    }
                }
            );
        }
    }

</script>
{%footer%}
