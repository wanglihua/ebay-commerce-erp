{%header "入库管理" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="cggl-menu">采购管理</li>
            <li class="active" data-menu="cggl-purchase-checkin-menu">入库管理</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadEntryList('#purchaseBillEntryList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
					<button class="btn btn-pink btn-sm" @click="checkin()">
                        <i class="ace-icon fa fa-share"></i>
                        入库
                    </button>
                </div>
                <div id="query" class="col-xs-12" style="line-height: 28px;">
                    <select id="bill_code_query" name="bill_code_query" style="width: 120px;" v-model.number="page.bill_code_query" @change="billCodeQuerySelectChange()">
                        <option :value="0">采购单批次号</option>
                        {% range $index, $bill_code := .bill_code_list %}
                        <option :value="{% $bill_code %}">{% $bill_code %}</option>
                        {% end %}
                    </select>
                    <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" onclick="search()">
                        &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                    </button>
                    <hr style="margin-top:10px;margin-bottom:10px;"/>
                </div>
                <div>
                    <table id="purchaseBillEntryList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">

    function search() {
        refreshList("#purchaseBillEntryList");
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "page": {}
        },
        mounted: function () {
            initDataTable(
                '#purchaseBillEntryList',
                {
                    "sAjaxSource": '{%url "ErpPurchaseCheckin.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "pbe.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "pb.code", "title": "采购批次号", "bSearchable": false, "width": 120},
                        {"mDataProp": "p.sku", "title": "SKU", "bSearchable": false, "width": 160},
                        {
                            "mDataProp": "p.cn_name", "title": "名称", "bSearchable": false, "sClass": "word-wrap", "width": 200,
                            "render": function (data, type, row) {
                                return "<div>" + data + "</div>"
                            }
                        },
                        {"mDataProp": "pbe.qty", "title": "数量", "bSearchable": false, "width": 80, "sClass": "center"},
                        {"mDataProp": "pbe.purchase_date", "title": "采购日期", "bSearchable": false, "sClass": "center", "width": 120},
                        {"mDataProp": "pbe.checkin_date", "title": "入库日期", "bSearchable": false, "sClass": "center", "width": 120},
                        {"mDataProp": "pbe.desc", "title": "备注", "bSearchable": true},
                        {"mDataProp": "pbe.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "pbe.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );
        },
        methods: {
            reloadEntryList: function () {
                reloadList('#purchaseBillEntryList');
            },
            billCodeQuerySelectChange: function () {
                search();
            },
            checkin: function () {
                var id_list = [];
                $('#purchaseBillEntryList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length === 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要入库吗？", function () {
                    $.ajax({
                        url: '{%url "ErpPurchaseCheckin.Checkin"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                                vm.reloadList();
                                return;
                            }
                        }
                    });
                });
            }			
        }
    });
</script>
{%footer%}
