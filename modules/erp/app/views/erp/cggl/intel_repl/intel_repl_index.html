{%header "智能补货" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="cggl-menu">采购管理</li>
            <li class="active" data-menu="cggl-intel-repl-menu">智能补货</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#intelReplList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" onclick="genPurchaseBill()">
                        <i class="ace-icon fa fa-plus"></i>
                        生成采购单
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteIntelRepl()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                    <button class="btn btn-pink btn-sm" @click="calculate()">
                        <i class="ace-icon fa fa-refresh"></i>
                        立即计算智能补货
                    </button>
                </div>
                <div id="query" style="line-height: 28px;">
                    <label for="sku_query">SKU</label>
                    <input id="sku_query" name="sku_query" style="width: 120px;height: 30px;" placeholder="SKU查询"/>
                    &nbsp;
                    <label for="product_status_id_query">商品状态</label>
                    <select id="product_status_id_query" name="product_status_id_query" style="height: 30px;">
                        <option :value="0">商品状态</option>
                        {% range $index, $status := .product_status_list %}
                        <option :value="{% $status.Id %}">{% $status.Name %}</option>
                        {% end %}
                    </select>
                    &nbsp;
                    <label for="stock_id_query">仓库</label>
                    <select id="stock_id_query" name="stock_id_query" style="height: 30px;">
                        <option :value="0">仓库列表</option>
                        {% range $index, $stock := .stock_list %}
                        <option :value="{% $stock.Id %}">{% $stock.Name %}</option>
                        {% end %}
                    </select>
                    &nbsp;
                    <label for="min_profit_query">毛利率区间</label>
                    <input id="min_profit_query" name="min_profit_query" style="width: 70px;height:30px;" placeholder="最小毛利率"/>~
                    <input id="max_profit_query" name="max_profit_query" style="width: 70px;height:30px;" placeholder="最大毛利率"/>
                    &nbsp;
                    <label for="stock_id_query">状态</label>
                    <select id="status_id_query" name="stock_id_query" style="height: 30px;">
                        <option :value="0">状态</option>
                        {% range $index, $status := .status_list %}
                        <option :value="{% $status.Id %}">{% $status.Name %}</option>
                        {% end %}
                    </select>
                    &nbsp;
                    <label for="sale_user_id_query">销售负责人</label>
                    <select id="sale_user_id_query" name="sale_user_id_query" style="height: 30px; width: 130px;">
                        <option value="0">销售负责人</option>
                        {% range $index, $user := .sale_user_list %}
                        <option value="{% $user.Id %}">{% $user.LoginName %}（{% $user.NickName %}）</option>
                        {% end %}
                    </select>
                    &nbsp;
                    <label for="dev_user_id_query">开发负责人</label>
                    <select id="dev_user_id_query" name="dev_user_id_query" style="height: 30px; width: 130px;">
                        <option value="0">开发负责人</option>
                        {% range $index, $user := .dev_user_list %}
                        <option value="{% $user.Id %}">{% $user.LoginName %}（{% $user.NickName %}）</option>
                        {% end %}
                    </select>
                    &nbsp;
                    <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" onclick="search()"> &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                    </button>
                    <hr style="margin-top:10px;margin-bottom:10px;"/>
                </div>
                <div>
                    <table id="intelReplList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="intelReplDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">智能补货详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="intelReplDetailForm">
                                <input id="intel_repl_id" name="detail.intel_repl.id" type="hidden" v-model.number="detail.intel_repl.id"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="product_id" class="col-xs-2 control-label">商品</label>
                                            <div class="col-xs-10">
                                                <input id="product_id" name="detail.intel_repl.product_id" type="text" class="input-sm form-control" v-model.number="detail.intel_repl.product_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="stock_id" class="col-xs-2 control-label">仓库</label>
                                            <div class="col-xs-10">
                                                <input id="stock_id" name="detail.intel_repl.stock_id" type="text" class="input-sm form-control" v-model.number="detail.intel_repl.stock_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="qty" class="col-xs-2 control-label">数量</label>
                                            <div class="col-xs-10">
                                                <input id="qty" name="detail.intel_repl.qty" type="text" class="input-sm form-control" v-model.number="detail.intel_repl.qty"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="profit" class="col-xs-2 control-label">毛利率</label>
                                            <div class="col-xs-10">
                                                <input id="profit" name="detail.intel_repl.profit" type="text" class="input-sm form-control" v-model.number="detail.intel_repl.profit"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="status_id" class="col-xs-2 control-label">状态</label>
                                            <div class="col-xs-10">
                                                <input id="status_id" name="detail.intel_repl.status_id" type="text" class="input-sm form-control" v-model.number="detail.intel_repl.status_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveIntelRepl()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">

    function search() {
        refreshList('#intelReplList');
    }

    function genPurchaseBill() {
        var id_list = [];
        $('#intelReplList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length === 0) {
            $.msg.alert("请选择数据！");
            return;
        }

        $.msg.confirm("确认要生成采购单吗？", function () {
            $.ajax({
                url: '{%url "ErpIntelRepl.Purchase"%}',
                type: "POST",
                data: {"id_list": id_list},
                success: function (data) {
                    if (data.success === false) {
                        $.msg.error(data.message);
                        return;
                    }
                    else {
                        $.msg.tip(data.message);
                        vm.reloadList();
                        return;
                    }
                }
            });
        });
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "intel_repl": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#intelReplList',
                {
                    "sAjaxSource": '{%url "ErpIntelRepl.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "ir.id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {
                            "mDataProp": "p.sku", "title": "SKU", "bSearchable": true, "width": 150,
                            "render": function (data, type, row) {
                                return '<a href="/product/detail/' + row.p.id + '" target="product_detail">' + row.p.sku + '</a>';
                            }
                        },
                        {"mDataProp": "p.cn_name", "title": "商品", "bSearchable": true},
                        {"mDataProp": "ps.name", "title": "商品状态", "bSearchable": true, "width": 80},
                        {"mDataProp": "st.name", "title": "仓库", "bSearchable": true, "width": 150},
                        {"mDataProp": "ir.qty", "title": "数量", "bSearchable": false, "width": 80},
                        {"mDataProp": "ir.profit", "title": "毛利率", "bSearchable": false, "width": 80},
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": true, "width": 80},
                        {"mDataProp": "ir.create_time", "title": "创建时间", "bSearchable": false, "width": 120}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'sku_query', 'value': $("#sku_query").val()});
                        aoData.push({'name': 'stock_id_query', 'value': $("#stock_id_query").val()});
                        aoData.push({'name': 'min_profit_query', 'value': $("#min_profit_query").val()});
                        aoData.push({'name': 'max_profit_query', 'value': $("#max_profit_query").val()});
                        aoData.push({'name': 'product_status_id_query', 'value': $("#product_status_id_query").val()});
                        aoData.push({'name': 'status_id_query', 'value': $("#status_id_query").val()});

                        aoData.push({name: 'sale_user_id_query', value: $("#sale_user_id_query").val()});
                        aoData.push({name: 'dev_user_id_query', value: $("#dev_user_id_query").val()});

                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                hideMask();
                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    return;
                                }
                                fnCallback(data);
                            }
                        });
                    }
                }
            );

            /*
            $('#intelReplList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showIntelReplDetail(id);
            });
            */
        },
        methods: {
            reloadList: function () {
                reloadList('#intelReplList');
            },
            showIntelReplDetail: function (id) {
                showMask("加载中...");
                $("#intelReplDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpIntelRepl.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success === false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#intelReplDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveIntelRepl: function () {
                showMask("提交中...");
                var form = $("#intelReplDetailForm");
                var valid = validate(form, {
                    'detail.intel_repl.product_id': {
                        required: true, digits: true
                    },
                    'detail.intel_repl.stock_id': {
                        required: true, digits: true
                    },
                    'detail.intel_repl.qty': {
                        required: true, digits: true
                    },
                    'detail.intel_repl.profit': {
                        required: true, number: true
                    },
                    'detail.intel_repl.status_id': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpIntelRepl.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#intelReplDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteIntelRepl: function () {
                var id_list = [];
                $('#intelReplList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length === 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpIntelRepl.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            },
            calculate: function () {
                $.ajax({
                    "dataType": 'json',
                    "url": '{% url "ErpIntelRepl.Calculate" %}',
                    "success": function (data) {
                        if (data.success === false) {
                            $.msg.error(data.message);
                            return;
                        }
                        else {
                            $.msg.show(data.message);
                            return;
                        }
                    }
                });
            }
        }
    });
</script>
{%footer%}
