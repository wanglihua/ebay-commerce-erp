<div class="modal fade" id="purchase_entry_pay_final_amount_dialog">
    <div class="modal-dialog" style="width: 360px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                <h4 class="modal-title">商品付款与尾款</h4>
            </div>
            <div class="modal-body clearfix">
                <div class="row">
                    <div class="col-xs-12">
                        <form class="form-horizontal" role="form" id="purchase_entry_pay_final_amount_form">
                            <input id="pf_entry_id" name="entry_id" type="hidden" value="{% .entry.Id %}"/>

                            <div class="row">

                                <div class="col-xs-12">
                                    <div class="form-group">
                                        <label for="pf_entry_pay_amount" class="col-xs-2 control-label">付款金额</label>
                                        <div class="col-xs-10">
                                            <input id="pf_entry_pay_amount" name="pay_amount" type="text" class="input-sm form-control" value="{% .entry.PayAmount %}"/>
                                        </div>
                                    </div>
                                </div>

                            </div>

                            <div class="row">

                                <div class="col-xs-12">
                                    <div class="form-group">
                                        <label for="pf_entry_final_amount" class="col-xs-2 control-label">尾款</label>
                                        <div class="col-xs-10">
                                            <input id="pf_entry_final_amount" name="final_amount" type="text" class="input-sm form-control" value="{% .entry.FinalAmount %}"/>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success btn-sm" onclick="save_entry_pay_final_amount()">
                    <i class="ace-icon fa fa-floppy-o"></i>保存
                </button>

                <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                    <i class="ace-icon fa fa-times"></i>关闭
                </button>
            </div>
        </div>
    </div>
</div>
