<div class="modal fade" id="purchase_bill_entry_list_dialog">
    <div class="modal-dialog" style="width: 1000px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                <h4 class="modal-title">采购单明细（{% .bill_code %}）</h4>
            </div>
            <div class="modal-body clearfix">
                <div class="row">
                    <div class="col-xs-12">
                        <div>
                            <table id="purchaseBillEntryList" class="table table-striped table-bordered table-hover"></table>
                        </div>
                        <div>
                            <table class="table table-bordered">
                                <thead>
                                <tr>
                                    <th style="text-align: center; width:100px;"></th>
                                    <th style="text-align: right;width:100px;">金额</th>
                                    <th style="text-align: right;width:100px;">运费</th>
                                    <th style="text-align: right;width:100px;">付款</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr style="text-align: right;">
                                    <td style="text-align: center;">合计</td>
                                    <td style="text-align: right;"><span id="span_amount_sum"></span></td>
                                    <td style="text-align: right;"><span id="freight_charge_sum"></span></td>
                                    <td style="text-align: right;"><span id="pay_amount_sum"></span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
