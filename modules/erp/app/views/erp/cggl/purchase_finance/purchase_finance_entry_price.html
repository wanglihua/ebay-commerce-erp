<div class="modal fade" id="purchase_entry_price_dialog">
    <div class="modal-dialog" style="width: 720px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                <h4 class="modal-title">商品单价与付款金额</h4>
            </div>
            <div class="modal-body clearfix">
                <div class="row">
                    <div class="col-xs-12">
                        <form class="form-horizontal" role="form" id="purchase_entry_price_form">
                            <input id="entry_id" name="entry_id" type="hidden" value="{% .entry.Id %}"/>

                            <div class="row">

                                <div class="col-xs-6">
                                    <div class="form-group">
                                        <label for="entry_price" class="col-xs-2 control-label">单价</label>
                                        <div class="col-xs-10">
                                            <input id="entry_price" name="price" type="text" class="input-sm form-control" value="{% .entry.Price %}"/>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-xs-6">
                                    <div class="form-group">
                                        <label for="entry_qty" class="col-xs-2 control-label">数量</label>
                                        <div class="col-xs-10">
                                            <input id="entry_qty" name="qty" type="text" class="input-sm form-control" value="{% .entry.Qty %}"/>
                                        </div>
                                    </div>
                                </div>

                            </div>

                            <div class="row">

                                <div class="col-xs-6">
                                    <div class="form-group">
                                        <label for="entry_amount" class="col-xs-2 control-label">金额</label>
                                        <div class="col-xs-10">
                                            <input id="entry_amount" name="amount" type="text" class="input-sm form-control" value="{% .entry.Amount %}" disabled="disabled"/>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-xs-6">
                                    <div class="form-group">
                                        <label for="entry_pay_amount" class="col-xs-2 control-label">付款金额</label>
                                        <div class="col-xs-10">
                                            <input id="entry_pay_amount" name="pay_amount" type="text" class="input-sm form-control" value="{% .entry.PayAmount %}"/>
                                        </div>
                                    </div>
                                </div>

                            </div>

                            <div class="row">

                                <div class="col-xs-6">
                                    <div class="form-group">
                                        <label for="entry_freight_charge" class="col-xs-2 control-label">运费</label>
                                        <div class="col-xs-10">
                                            <input id="entry_freight_charge" name="freight_charge" type="text" class="input-sm form-control" value="{% .entry.FreightCharge %}"/>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-xs-6">
                                </div>

                            </div>

                        </form>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary btn-sm" onclick="entry_purchase()">
                    <i class="ace-icon fa fa-share"></i>保存并下单
                </button>

                <button type="button" class="btn btn-success btn-sm" onclick="save_entry_price()">
                    <i class="ace-icon fa fa-floppy-o"></i>保存
                </button>

                <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                    <i class="ace-icon fa fa-times"></i>关闭
                </button>
            </div>
        </div>
    </div>
</div>
