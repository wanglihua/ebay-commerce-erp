{%header "财务管理" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="cggl-menu">采购管理</li>
            <li class="active" data-menu="cggl-purchase-finance-menu">财务管理</li>
        </ul>
    </div>
    <div class="page-content">
        <div style="margin-left: -5px; margin-right: -5px;">
            <div class="col-xs-12">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#purchaseBillList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-pink btn-sm" @click="purchase()">
                        <i class="ace-icon fa fa-share"></i>
                        下单
                    </button>
                </div>
                <div id="query" class="col-xs-12" style="line-height: 28px;">
                    <select id="status_id_query" name="status_id_query" style="width: 120px;" v-model.number="page.status_id_query" @change="querySelectChange()">
                        <option :value="0">采购单状态查询</option>
                        {% range $index, $status := .status_list %}
                        <option :value="{% $status.Id %}">{% $status.Name %}</option>
                        {% end %}
                    </select>
                    <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" onclick="search()">
                        &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                    </button>

                    {% if gt .purchase_bill_to_pay_count 0 %}
                    <div style="color:red;margin: 5px 0;">
                        <span>下列采购批次号账期即将到期或已到期：</span>
                        {% range $index, $purchase_bill := .purchase_bill_to_pay_list %}
                        <span>{% $purchase_bill.Code %}</span>
                        {% if ne $index $.purchase_bill_to_pay_max_index %}
                        <span>,</span>
                        {% end %}
                        {% end %}
                    </div>
                    {% end %}

                    <hr style="margin-top:10px;margin-bottom:10px;"/>
                </div>
                <div>
                    <table id="purchaseBillList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">

    function search() {
        refreshList("#purchaseBillList");
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "page": {
                "status_id_query": 0
            }
        },
        mounted: function () {
            var this_vm = this;

            // purchaseBillList
            initDataTable(
                '#purchaseBillList',
                {
                    "sAjaxSource": '{%url "ErpPurchaseFinance.ListData"%}',
                    "aaSorting": [[1, "desc"]],
                    "iDisplayLength": 5,
                    "aoColumns": [
                        {
                            "mDataProp": "pb.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "pb.code", "title": "批次号", "bSearchable": true, "width": 160},
                        {
                            "mDataProp": "sup.name", "title": "供应商", "bSearchable": true, "sClass": "wrap-word", "width": 180,
                            "render": function (data, type, row) {
                                return "<div>" + data + "</div>";
                            }
                        },
                        {"mDataProp": "pb.approve_time", "title": "采购时间", "bSearchable": false, "sClass": "center", "width": 120},
                        {"mDataProp": "pb.pay_time", "title": "付款时间", "bSearchable": false, "sClass": "center", "width": 120},
                        {
                            "mDataProp": "pb.pay_days", "title": "账期", "bSearchable": false, "sClass": "center", "width": 80,
                            "render": function (data, type, row) {
                                return data + '&nbsp;天';
                            }
                        },
                        {
                            "mDataProp": "pb.desc", "title": "备注", "bSearchable": true, "sClass": "wrap-word",
                            "render": function (data, type, row) {
                                if (data === null) {
                                    return "";
                                } else {
                                    return "<div>" + data + "</div>";
                                }
                            }
                        },
                        {"mDataProp": "ayu.nick_name", "title": "操作人", "bSearchable": false, "width": 75},
                        {"mDataProp": "pb.total_amount", "title": "金额", "bSearchable": false, "width": 75},
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": false, "width": 90},
                        {"mDataProp": "pb.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "pb.update_time", "title": "修改时间", "bSearchable": false, "width": 120},
                        {
                            "mDataProp": "pb.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 100,
                            "title": '操作',
                            "render": function (data, type, row) {
                                return "<a class='btn btn-xs btn-info btn-inline pull-left' onclick='show_entry_list_dialog(" + data + ");' ><i class='ace-icon fa fa-list'></i>查看明细</a>";
                            }
                        }
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'status_id_query', 'value': this_vm.page.status_id_query});

                        $.ajax(
                            {
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data);
                                }
                            });
                    }
                }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#purchaseBillList');
            },
            querySelectChange: function () {
                search();
            },
            purchase: function () {
                var id_list = [];
                $('#purchaseBillList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length === 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要下单吗？", function () {
                    $.ajax({
                        url: '{%url "ErpPurchaseFinance.Purchase"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                                vm.reloadList();
                                return;
                            }
                        }
                    });
                });
            }
        }
    });

    function show_entry_list_dialog(bill_id) {
        function load_purchase_bill_entry_list(bill_id) {
            var history_vm = new Vue({
                el: "#purchase_bill_entry_list_dialog",
                data: {}
            });

            initDataTable(
                '#purchaseBillEntryList',
                {
                    "sAjaxSource": '{%url "ErpPurchaseBillEntry.ListData"%}',
                    "aaSorting": [[0, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "pbe.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "p.sku", "title": "SKU", "bSearchable": false, "width": 150},
                        {
                            "mDataProp": "p.cn_name", "title": "商品名称", "bSearchable": false, "sClass": "word-wrap",
                            "render": function (data, type, row) {
                                return "<div>" + data + "</div>"
                            }
                        },
                        {"mDataProp": "pbe.price", "title": "单价", "bSearchable": false, "sClass": "center", "width": 50},
                        {"mDataProp": "pbe.qty", "title": "总数量", "bSearchable": false, "sClass": "center", "width": 70},
                        {"mDataProp": "pbe.amount", "title": "金额", "bSearchable": false, "sClass": "center", "width": 50},
                        {
                            "mDataProp": "pbe.desc", "title": "备注", "bSearchable": true, "sClass": "word-wrap",
                            "render": function (data, type, row) {
                                if (data === null) {
                                    return "";
                                } else {
                                    return "<div>" + data + "</div>"
                                }
                            }
                        },
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": true, "sClass": "center", "width": 50}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'purchase_bill_id', 'value': bill_id});

                        $.ajax(
                            {
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data.list_data);

                                    vm.purchase_bill_code = data.purchase_bill_code
                                }
                            });
                    }
                }
            );
        }

        $("#purchase_bill_entry_list_wrapper").html("");

        $.ajax({
            url: '{%url "ErpPurchaseBillEntry.Index" %}',
            type: "POST",
            data: {"purchase_bill_id": bill_id},
            success: function (result) {
                $("#purchase_bill_entry_list_wrapper").html(result);
                load_purchase_bill_entry_list(bill_id);
                $("#purchase_bill_entry_list_dialog").modal();
            }
        });
    }
</script>
<div id="purchase_bill_entry_list_wrapper"></div>
{%footer%}
