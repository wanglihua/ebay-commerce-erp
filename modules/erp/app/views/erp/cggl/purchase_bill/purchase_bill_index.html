{%header "采购单" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="cggl-menu">采购管理</li>
            <li class="active" data-menu="cggl-purchase-bill-menu">采购单</li>
        </ul>
    </div>

    <div class="page-content">
        <div style="margin-left: -5px; margin-right: -5px;">
            <div id="query" class="col-xs-12" style="line-height: 28px;">
                <select id="status_id_query" name="status_id_query" style="width: 120px;" v-model.number="page.status_id_query" @change="statusSelectChange()">
                    <option :value="0">采购单状态</option>
                    {% range $index, $status := .status_list %}
                    <option :value="{% $status.Id %}">{% $status.Name %}</option>
                    {% end %}
                </select>
                <input id="code_query" name="code_query" type="text" v-model="page.code_query" placeholder="采购单批次号" style="height: 30px;"/>
                <label for="supplier_query">供应商</label>
                <input id="supplier_query" name="supplier_query" style="width: 120px;height:30px;" v-model="page.supplier_query" placeholder="供应商"/>&nbsp;

                <select id="user_query_id" name="user_query_id" v-model="page.user_query_id" style="height: 30px;">
                    <option :value="0">人员查询</option>
                    {% range $index, $user_query := .user_query_list %}
                    <option :value="{% $user_query.Id %}">{% $user_query.Name %}</option>
                    {% end %}
                </select>

                <select id="user_query_value" name="user_query_value" v-model="page.user_query_value" style="height: 30px;">
                    <option :value="0">人员列表</option>
                    {% range $index, $user := .user_list %}
                    <option :value="{% $user.Id %}">{% $user.LoginName %}（{% $user.NickName %}）</option>
                    {% end %}
                </select>

                <select id="time_query_id" name="time_query_id" v-model="page.time_query_id" style="height: 30px;">
                    <option :value="0">时间段查询</option>
                    {% range $index, $time_query := .time_query_list %}
                    <option :value="{% $time_query.Id %}">{% $time_query.Name %}</option>
                    {% end %}
                </select>
                <input id="query_time_begin" name="query_time_begin" style="width: 120px;height:30px;" v-model="page.query_time_begin" placeholder="查询时间开始"/>&nbsp;
                <input id="query_time_end" name="query_time_end" style="width: 120px;height:30px;" v-model="page.query_time_end" placeholder="查询时间结束"/>
                <label for="sku_query">SKU查询</label>
                <input id="sku_query" name="sku_query" style="width: 120px;height: 30px;" v-model="page.sku_query" placeholder="SKU查询"/>
                <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" onclick="search()"> &nbsp;
                    &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                </button>
                <hr style="margin-top:10px;margin-bottom:10px;"/>
            </div>
            <div class="col-xs-12">
                <fieldset>
                    <legend style="font-size: 14px;line-height: 28px;">
                        采购单
                    </legend>
                </fieldset>
            </div>
            <div class="col-xs-12">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#purchaseBillList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showPurchaseBillDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-pink btn-sm" @click="submitPurchaseBill()">
                        <i class="ace-icon fa fa-arrow-circle-up"></i>
                        提交
                    </button>
                    {% if .user_has_approve_pass %}
                    <button class="btn btn-pink btn-sm" @click="approvePurchaseBill()">
                        <i class="ace-icon fa fa-share"></i>
                        审批
                    </button>
                    {% end %}
                    <button class="btn btn-danger btn-sm" @click="deletePurchaseBill()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                    <button class="btn btn-purple btn-sm" onclick="exportBillsEntryList()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出
                    </button>
                    <button class="btn btn-pink btn-sm" onclick="update_product_inventory_price()">
                        <i class="ace-icon fa fa-refresh"></i>
                        更新商品采购价和中国仓成本价
                    </button>
                </div>
                <div>
                    <table id="purchaseBillList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>

            <div class="col-xs-12" style="margin-top: 30px;">
                <fieldset>
                    <legend style="font-size: 14px;line-height: 28px;">
                        采购单明细（批次号： {{purchase_bill_code}}）
                    </legend>
                </fieldset>
            </div>
            <div class="col-xs-12">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadEntryList('#purchaseBillEntryList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showPurchaseBillEntryDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deletePurchaseBillEntry()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                    <button id="btnImportEntries" class="btn btn-purple btn-sm">
                        <i class="ace-icon fa fa-plus"></i>
                        导入
                    </button>
                    <button class="btn btn-purple btn-sm" onclick="exportEntryList()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出
                    </button>
                    <button class="btn btn-pink btn-sm" onclick="show_purchase_in_turn()">
                        <i class="ace-icon fa fa-share"></i>
                        分批采购
                    </button>
                    {% if .user_has_approve_pass %}
                    <button class="btn btn-pink btn-sm" @click="approvePurchaseBillEntry()">
                        <i class="ace-icon fa fa-share"></i>
                        审批
                    </button>
                    {% end %}
                </div>
                <div style="margin-top: 10px;">
                    <a href="/static/excel-template/purchase_bill_entry_import.xlsx">下载采购单明细导入Excel模板</a>
                </div>
                <div>
                    <table id="purchaseBillEntryList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="purchaseBillDetailDialog">
        <div class="modal-dialog" style="width: 880px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">采购单详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="purchaseBillDetailForm">
                                <input id="purchase_bill_id" name="purchase_bill_detail.purchase_bill.id" type="hidden" v-model.number="purchase_bill_detail.purchase_bill.id"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="code" class="col-xs-2 control-label">批次号</label>
                                            <div class="col-xs-10">
                                                <input id="code" name="purchase_bill_detail.purchase_bill.code" type="text" class="input-sm form-control" disabled="disabled" v-model="purchase_bill_detail.purchase_bill.code"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="supplier_id" class="col-xs-2 control-label">供应商</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="supplier_id" name="purchase_bill_detail.purchase_bill.supplier_id" type="hidden" class="input-sm form-control" v-model.number="purchase_bill_detail.purchase_bill.supplier_id"/>
                                                    <input id="supplier_name" name="purchase_bill_detail.supplier_name" type="text" class="input-sm form-control" disabled="disabled" v-model="purchase_bill_detail.supplier_name"/>
                                                    <span class="input-group-btn">
                                                        <button type="button" class="btn btn-purple btn-sm" onclick="showSupplierSelect()">
                                                            <span class="ace-icon fa fa-search icon-on-right"></span>&nbsp;选择
                                                        </button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="total_amount" class="col-xs-2 control-label">总金额</label>
                                            <div class="col-xs-10">
                                                <input id="total_amount" name="purchase_bill_detail.purchase_bill.total_amount" type="text" class="input-sm form-control" disabled="disabled" v-model="purchase_bill_detail.purchase_bill.total_amount"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="pay_method_id" class="col-xs-2 control-label">付款方式</label>
                                            <div class="col-xs-10">
                                                <select id="pay_method_id" name="purchase_bill_detail.purchase_bill.pay_method_id" class="input-sm form-control" v-model="purchase_bill_detail.purchase_bill.pay_method_id">
                                                    <option :value="0"></option>
                                                    <template v-for="pay_method in purchase_bill_detail.pay_method_list">
                                                        <option :value="pay_method.id">{{pay_method.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="advance_amount" class="col-xs-2 control-label">预付款</label>
                                            <div class="col-xs-10">
                                                <input id="advance_amount" name="purchase_bill_detail.purchase_bill.advance_amount" type="text" class="input-sm form-control" v-model.number="purchase_bill_detail.purchase_bill.advance_amount" disabled="disabled"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <div class="form-group">
                                                <label for="final_amount" class="col-xs-2 control-label">尾款</label>
                                                <div class="col-xs-10">
                                                    <input id="final_amount" name="purchase_bill_detail.purchase_bill.final_amount" type="text" class="input-sm form-control" v-model.number="purchase_bill_detail.purchase_bill.final_amount" disabled="disabled"/>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="advance_expenses" class="col-xs-2 control-label">预付运费</label>
                                            <div class="col-xs-10">
                                                <input id="advance_expenses" name="purchase_bill_detail.purchase_bill.advance_expenses" type="text" class="input-sm form-control" v-model.number="purchase_bill_detail.purchase_bill.advance_expenses" disabled="disabled"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <div class="form-group">
                                                <label for="final_expenses" class="col-xs-2 control-label">提货费</label>
                                                <div class="col-xs-10">
                                                    <input id="final_expenses" name="purchase_bill_detail.purchase_bill.final_expenses" type="text" disabled="disabled" class="input-sm form-control" v-model.number="purchase_bill_detail.purchase_bill.final_expenses"/>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="arrival_days" class="col-xs-2 control-label">到货天数</label>
                                            <div class="col-xs-10">
                                                <input id="arrival_days" name="purchase_bill_detail.purchase_bill.arrival_days" type="text" class="input-sm form-control" v-model.number="purchase_bill_detail.purchase_bill.arrival_days"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <div class="form-group">
                                                <label for="pay_days" class="col-xs-2 control-label">账期</label>
                                                <div class="col-xs-10">
                                                    <input id="pay_days" name="purchase_bill_detail.purchase_bill.pay_days" type="text" class="input-sm form-control" v-model.number="purchase_bill_detail.purchase_bill.pay_days"/>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="purchase_bill_desc" class="col-xs-1 control-label">备注</label>
                                            <div class="col-xs-11">
                                                <textarea id="purchase_bill_desc" name="purchase_bill_detail.purchase_bill.desc" rows="2" class="input-sm form-control" v-model="purchase_bill_detail.purchase_bill.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="savePurchaseBill()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="purchaseBillEntryDetailDialog">
        <div class="modal-dialog" style="width: 880px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">采购单明细详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="purchaseBillEntryDetailForm">
                                <input id="purchase_bill_entry_id" name="purchase_bill_entry_detail.purchase_bill_entry.id" type="hidden" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.id"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="bill_id" class="col-xs-2 control-label">批次</label>
                                            <div class="col-xs-10">
                                                <input id="bill_id" name="purchase_bill_entry_detail.purchase_bill.id" type="hidden" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill.id"/>
                                                <input id="bill_code" name="purchase_bill_entry_detail.purchase_bill.code" type="text" class="input-sm form-control" disabled="disabled" v-model.number="purchase_bill_entry_detail.purchase_bill.code"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="product_id" class="col-xs-2 control-label">商品</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="product_id" name="purchase_bill_entry_detail.purchase_bill_entry.product_id" type="hidden" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.product_id"/>
                                                    <input id="product_name" name="purchase_bill_entry_detail.product_name" type="text" class="input-sm form-control" disabled="disabled" v-model="purchase_bill_entry_detail.product_name"/>
                                                    <span class="input-group-btn">
                                                        <button type="button" class="btn btn-purple btn-sm" onclick="showProductSelect()">
                                                            <span class="ace-icon fa fa-search icon-on-right"></span>&nbsp;选择
                                                        </button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="mel_qty" class="col-xs-2 control-label">MEL数量</label>
                                            <div class="col-xs-10">
                                                <input id="mel_qty" name="purchase_bill_entry_detail.purchase_bill_entry.mel_qty" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.mel_qty"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="bne_qty" class="col-xs-2 control-label">BNE数量</label>
                                            <div class="col-xs-10">
                                                <input id="bne_qty" name="purchase_bill_entry_detail.purchase_bill_entry.bne_qty" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.bne_qty"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="qty" class="col-xs-2 control-label">总数量</label>
                                            <div class="col-xs-10">
                                                <input id="qty" name="purchase_bill_entry_detail.purchase_bill_entry.qty" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.qty" disabled="disabled"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="price" class="col-xs-2 control-label">单价</label>
                                            <div class="col-xs-10">
                                                <input id="price" name="purchase_bill_entry_detail.purchase_bill_entry.price" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.price"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="amount" class="col-xs-2 control-label">金额</label>
                                            <div class="col-xs-10">
                                                <input id="amount" name="purchase_bill_entry_detail.purchase_bill_entry.amount" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.amount" disabled="disabled"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="pay_amount" class="col-xs-2 control-label">付款金额</label>
                                            <div class="col-xs-10">
                                                <input id="pay_amount" name="purchase_bill_entry_detail.purchase_bill_entry.pay_amount" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.pay_amount"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="final_amount" class="col-xs-2 control-label">尾款金额</label>
                                            <div class="col-xs-10">
                                                <div v-if="purchase_bill_entry_detail.purchase_bill_entry.final_amount_status_id == 5900">
                                                    <input id="amount" name="purchase_bill_entry_detail.purchase_bill_entry.final_amount" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.final_amount"/>
                                                </div>
                                                <div v-else>
                                                    <input id="amount" name="purchase_bill_entry_detail.purchase_bill_entry.final_amount" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.final_amount" disabled="disabled"/>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                    </div>

                                    {%/*
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="pay_amount" class="col-xs-2 control-label">尾款状态</label>
                                            <div class="col-xs-10">
                                                <select id="final_amount_status_id" name="purchase_bill_entry_detail.purchase_bill_entry.final_amount_status_id" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.final_amount_status_id" disabled="disabled">
                                                    <template v-for="status in purchase_bill_entry_detail.final_amount_status_list">
                                                        <option :value="status.id">{{status.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    */%}
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="need_invoice" class="col-xs-2 control-label">是否开票</label>
                                            <div class="col-xs-10">
                                                <select id="need_invoice" name="purchase_bill_entry_detail.purchase_bill_entry.need_invoice" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.need_invoice" disabled="disabled">
                                                    <option :value="0">否</option>
                                                    <option :value="1">是</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="tax_point" class="col-xs-2 control-label">收税点</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="tax_point" name="purchase_bill_entry_detail.purchase_bill_entry.tax_point" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.tax_point" disabled="disabled"/>
                                                    <span class="input-group-addon">%</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="drawback_point" class="col-xs-2 control-label">退税点</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="drawback_point" name="purchase_bill_entry_detail.purchase_bill_entry.drawback_point" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.drawback_point" disabled="disabled"/>
                                                    <span class="input-group-addon">%</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">

<script type="text/javascript">

    $(function () {
        init_uploader();

        // 查询时间
        $('#query_time_begin').datetimepicker({
            locale: "zh-cn"
        }).on('dp.change', function (ev) {
            vm.page.query_time_begin = $("#query_time_begin").val();
        });

        $('#query_time_end').datetimepicker({
            locale: "zh-cn"
        }).on('dp.change', function (ev) {
            vm.page.query_time_end = $("#query_time_end").val();
        });
    });

    function init_uploader() {
        var params = $.param({"bill_id": vm.purchase_bill_id});
        var upload_url = '{%url "ErpPurchaseBillEntryExcel.Import"%}' + "?" + params;

        var uploader = new plupload.Uploader({
            runtimes: 'html5,flash,html4',
            multi_selection: false,

            browse_button: 'btnImportEntries',
            file_data_name: "excel_file",

            url: upload_url,
            max_file_size: '10000kb',

            filters: [
                {title: "Excel文件", extensions: "xlsx"}
            ],

            flash_swf_url: '/plupload/js/Moxie.swf',

            init: {
                FilesAdded: function () {
                    if (!vm.purchase_bill_id || vm.purchase_bill_id === 0) {
                        $.msg.error("请先选择采购单！");
                        return;
                    }

                    showMask("上传中，请稍候...");
                    uploader.start();
                },
                FileUploaded: function (up, file, response) {

                    hideMask();
                    var result = JSON.parse(response.response);
                    if (result.success !== true) {
                        $.msg.error(result.message);
                    } else {
                        refreshList('#purchaseBillEntryList');
                        $.msg.show(result.message);
                    }
                },
                Error: function (up, err) {
                    $.msg.error("上传发生错误：" + err.code + ", " + err.message);
                }
            }
        });

        uploader.bind('BeforeUpload', function (up, file) {
            var params = $.param({"bill_id": vm.purchase_bill_id});
            up.settings.url = '{%url "ErpPurchaseBillEntryExcel.Import"%}' + "?" + params;
        });

        uploader.init();
    }

    function search() {
        refreshList('#purchaseBillList');
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "purchase_bill_id": 0,
            "purchase_bill_code": "",
            "purchase_bill_detail": {
                "purchase_bill": {},
                "supplier_name": "",
                "pay_method_list": []
            },
            "purchase_bill_entry_detail": {
                "purchase_bill": {},
                "purchase_bill_entry": {
                    "product_id": 0
                },
                "product_name": ""
            },
            "page": {
                "status_id_query": 0,
                "code_query": "",
                "supplier_query": "",
                "user_query_id": 0,
                "user_query_value": 0,
                "time_query_id": 0,
                "query_time_begin": '',
                "query_time_end": '',
                "sku_query": ''
            }
        },
        mounted: function () {
            var this_vm = this;

            // purchaseBillList
            initDataTable(
                    '#purchaseBillList',
                    {
                        "sAjaxSource": '{%url "ErpPurchaseBill.ListData"%}',
                        "aaSorting": [[1, "desc"]],
                        "iDisplayLength": 5,
                        "aoColumns": [
                            {
                                "mDataProp": "pb.id",
                                "bSearchable": false,
                                "orderable": false,
                                "sClass": "center",
                                "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "pb.code", "title": "批次号", "bSearchable": true, "width": 120},
                            {
                                "mDataProp": "sup.name", "title": "供应商", "bSearchable": true, "sClass": "wrap-word",
                                "render": function (data, type, row) {
                                    return "<div>" + data + "</div>";
                                }
                            },
                            {
                                "mDataProp": "pb.id", "title": "流程信息", "bSearchable": false, "bSortable": false, "sClass": "center", "width": 200,
                                "render": function (data, type, row) {
                                    var flow_info = "<table>";

                                    flow_info += "<tr><td>申请：</td><td>&nbsp;" + row.ayu.nick_name;
                                    if (row.pb.apply_time != null) {
                                        flow_info += "&nbsp;" + row.pb.apply_time;
                                    }
                                    flow_info += "</td></tr>";

                                    flow_info += "<tr><td>审批：</td><td>";
                                    if (row.pb.approve_time != null) {
                                        flow_info += "&nbsp;" + row.avu.nick_name + "&nbsp;" + row.pb.approve_time;
                                    } else {
                                        flow_info += "---";
                                    }
                                    flow_info += "</td></tr>";

                                    flow_info += "<tr><td>付款：</td><td>";
                                    if (row.pb.pay_time != null) {
                                        flow_info += "&nbsp;" + row.pu.nick_name + "&nbsp;" + row.pb.pay_time;
                                    } else {
                                        flow_info += "---";
                                    }
                                    flow_info += "</td></tr>";

                                    flow_info += "<tr><td>入库：</td><td>";
                                    if (row.pb.checkin_time != null) {
                                        flow_info += "&nbsp;" + row.cu.nick_name + "&nbsp;" + row.pb.checkin_time;
                                    } else {
                                        flow_info += "---";
                                    }
                                    flow_info += "</td></tr>";

                                    flow_info += "</table>";

                                    return flow_info;
                                }
                            },
                            {"mDataProp": "s.name", "title": "状态", "bSearchable": false, "width": 90},
                            {
                                "mDataProp": "pb.create_time", "title": "创建时间<br />修改时间", "bSearchable": false, "width": 120,
                                "render": function (data, type, row) {
                                    return "<div>" + row.pb.create_time + "</div><div>" + row.pb.update_time + "</div>";
                                }
                            },
                            {
                                "mDataProp": "pb.id",
                                "bSearchable": false,
                                "orderable": false,
                                "sClass": "center",
                                "width": 100,
                                "title": '操作',
                                "render": function (data, type, row) {
                                    return "<a class='btn btn-xs btn-info btn-inline pull-left' onclick='show_log_dialog(" + data + ");' ><i class='ace-icon fa fa-list'></i>查看历史</a>";
                                }
                            }
                        ],
                        "fnServerData": function (sSource, aoData, fnCallback) {
                            showMask("数据加载中，请稍候");

                            aoData.push({'name': 'status_id_query', 'value': this_vm.page.status_id_query});
                            aoData.push({'name': 'code_query', 'value': this_vm.page.code_query});
                            aoData.push({'name': 'supplier_query', 'value': this_vm.page.supplier_query});
                            aoData.push({'name': 'user_query_id', 'value': this_vm.page.user_query_id});
                            aoData.push({'name': 'user_query_value', 'value': this_vm.page.user_query_value});
                            aoData.push({'name': 'time_query_id', 'value': this_vm.page.time_query_id});
                            aoData.push({'name': 'query_time_begin', 'value': this_vm.page.query_time_begin});
                            aoData.push({'name': 'query_time_end', 'value': this_vm.page.query_time_end});
                            aoData.push({'name': 'sku_query', 'value': this_vm.page.sku_query});

                            $.ajax({
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data);
                                }
                            });
                        }
                    }
            );

            $('#purchaseBillList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showPurchaseBillDetail(id);
            });

            $('#purchaseBillList').on('click', 'tbody tr', function () {

                $("#purchaseBillList").find('tbody tr').each(function () {
                    var tableRow = $(this).closest('tr');
                    var checkbox = tableRow.find('td:first-child input:checkbox')[0];
                    if (checkbox) {
                        checkbox.checked = false;
                        tableRow.removeClass('hilight');
                    }
                });

                var tableRow = $(this);
                var checkbox = tableRow.find('td:first-child input:checkbox')[0];
                if (checkbox) {
                    checkbox.checked = true;
                    tableRow.addClass('hilight');

                    var id = $(this).find('td:first-child input:checkbox').val();
                    vm.purchase_bill_id = id;
                    vm.reloadEntryList();
                }
            });

            initDataTable(
                    '#purchaseBillEntryList',
                    {
                        "sAjaxSource": '{%url "ErpPurchaseBillEntry.ListData"%}',
                        "aaSorting": [[0, "asc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "pbe.id",
                                "bSearchable": false,
                                "orderable": false,
                                "sClass": "center",
                                "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {
                                "mDataProp": "p.sku", "title": "SKU", "bSearchable": false, "width": 150,
                                "render": function (data, type, row) {
                                    return "<a target='product_detail' href='/product/detail/" + row.p.id + "'>" + data + "</a>"
                                }
                            },
                            {
                                "mDataProp": "p.cn_name", "title": "商品名称", "bSearchable": false, "sClass": "wrap-word",
                                "render": function (data, type, row) {
                                    return "<div>" + data + "</div>"
                                }
                            },
                            {"mDataProp": "pbe.price", "title": "单价", "bSearchable": false, "sClass": "center", "width": 50},
                            {
                                "mDataProp": "pbe.qty", "title": "总数量", "bSearchable": false, "sClass": "center", "width": 80,
                                "render": function (data, type, row) {
                                    return "" + row.pbe.mel_qty + "&nbsp;MEL" + " + " + row.pbe.bne_qty + "&nbsp;BNE" + " = " + row.pbe.qty;
                                }
                            },
                            {
                                "mDataProp": "pbe.amount", "title": "金额/付款/运费", "bSearchable": false, "bSortable": false, "sClass": "center", "width": 100,

                vm.purchase_bill_entry_detail.purchase_bill_entry.tax_point = data.product.tax_point;
                vm.purchase_bill_entry_detail.purchase_bill_entry.drawback_point = data.product.drawback_point;
                vm.purchase_bill_entry_detail.purchase_bill_entry.drawback_amount = data.drawback_amount;
                vm.purchase_bill_entry_detail.purchase_bill_entry.fitting_cost = data.fitting_cost;
                vm.purchase_bill_entry_detail.purchase_bill_entry.other_cost = data.other_cost;
            }
        });

        $('#productSelectDialog').modal('hide');
    }

                vm.purchase_bill_entry_detail = result;
                $('#purchaseBillEntryPurchaseInTurnDialog').modal(modalOptions);
            }
        });
    }

    function purchase_in_turn() {
        showMask("提交中...");
        var form = $("#purchaseBillEntryPurchaseInTurnForm");
        var valid = validate(form, {
            'purchase_bill_entry_detail.purchase_bill_entry.checkin_qty': {
                required: true, min: 1
            },
            'purchase_bill_entry_detail.purchase_bill_entry.desc': {
                required: false, minlength: 2, maxlength: 400
            }
        });

        if (!valid) {
            hideMask();
        } else {
            $.ajax({
                url: '{%url "ErpPurchaseBillEntry.PurchaseInTurn"%}',
                type: "POST",
                processData: false,
                contentType: 'application/json',
                data: JSON.stringify(vm.purchase_bill_entry_detail),
                success: function (data) {
                    hideMask();
                    if (data.success === false) {
                        $.msg.error(data.message);
                        //return;
                    }
                    else {
                        $.msg.show(data.message);
                        $('#purchaseBillEntryPurchaseInTurnDialog').modal('hide');
                        vm.reloadEntryList();
                        //return;
                    }
                }
            });
        }
    }

    function update_product_inventory_price() {
        showMask("提交中...");
        $.ajax({
            url: '{%url "ErpPurchaseBill.UpdateProductPriceAndCnInventoryCostPrice"%}',
            type: "POST",
            processData: false,
            contentType: 'application/json',
            data: JSON.stringify(vm.purchase_bill_entry_detail),
            success: function (data) {
                hideMask();
                if (data.success === false) {
                    $.msg.error(data.message);
                    //return;
                }
                else {
                    $.msg.show(data.message);
                    $('#purchaseBillEntryPurchaseInTurnDialog').modal('hide');
                    vm.reloadEntryList();
                    //return;
                }
            }
        });
    }
</script>
