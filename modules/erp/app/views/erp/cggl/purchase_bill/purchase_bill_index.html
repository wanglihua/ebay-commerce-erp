{%header "采购单" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="cggl-menu">采购管理</li>
            <li class="active" data-menu="cggl-purchasebill-menu">采购单</li>
        </ul>
    </div>
    <div class="page-content">
        <div style="margin-left: -5px; margin-right: -5px;">
            <div class="col-xs-12">
                <fieldset>
                    <legend style="font-size: 14px;line-height: 28px;">
                        采购单
                    </legend>
                </fieldset>
            </div>
            <div class="col-xs-12">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#purchaseBillList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showPurchaseBillDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deletePurchaseBill()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="purchaseBillList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
            <div class="col-xs-12" style="margin-top: 30px;">
                <fieldset>
                    <legend style="font-size: 14px;line-height: 28px;">
                        采购单明细（批次号： {{purchase_bill_code}}）
                    </legend>
                </fieldset>
            </div>
            <div class="col-xs-12">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadEntryList('#purchaseBillEntryList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showPurchaseBillEntryDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deletePurchaseBillEntry()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="purchaseBillEntryList" class="table table-striped table-bordered table-hover"></table>
                    <div class="todo">1、新建时默认选中采购单；2、明细列表，sku和名称合并，数量和价格、金额合并等。</div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="purchaseBillDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">采购单详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="purchaseBillDetailForm">
                                <input id="purchase_bill_id" name="purchase_bill_detail.purchase_bill.id" type="hidden" v-model.number="purchase_bill_detail.purchase_bill.id"/>
                                <input id="purchase_bill_version" name="purchase_bill_detail.purchase_bill.version" type="hidden" v-model.number="purchase_bill_detail.purchase_bill.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="code" class="col-xs-2 control-label">批次号</label>
                                            <div class="col-xs-10">
                                                <input id="code" name="purchase_bill_detail.purchase_bill.code" type="text" class="input-sm form-control" disabled="disabled" v-model="purchase_bill_detail.purchase_bill.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="purchase_bill_desc" class="col-xs-2 control-label">备注</label>
                                            <div class="col-xs-10">
                                                <textarea id="purchase_bill_desc" name="purchase_bill_detail.purchase_bill.desc" rows="2" class="input-sm form-control" v-model="purchase_bill_detail.purchase_bill.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="date" class="col-xs-2 control-label">日期</label>
                                            <div class="col-xs-10">
                                                <input id="date" name="purchase_bill_detail.purchase_bill.date" type="text" class="input-sm form-control" disabled="disabled" v-model="purchase_bill_detail.purchase_bill.date"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="trans_expenses" class="col-xs-2 control-label">运费</label>
                                            <div class="col-xs-10">
                                                <input id="trans_expenses" name="purchase_bill_detail.purchase_bill.trans_expenses" type="text" class="input-sm form-control" v-model.number="purchase_bill_detail.purchase_bill.trans_expenses"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="savePurchaseBill()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="purchaseBillEntryDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">采购单详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="purchaseBillEntryDetailForm">
                                <input id="purchase_bill_entry_id" name="purchase_bill_entry_detail.purchase_bill_entry.id" type="hidden" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.id"/>
                                <input id="purchase_bill_entry_version" name="purchase_bill_entry_detail.purchase_bill_entry.version" type="hidden" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="bill_id" class="col-xs-2 control-label">批次</label>
                                            <div class="col-xs-10">
                                                <input id="bill_id" name="purchase_bill_entry_detail.purchase_bill.id" type="hidden" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill.id"/>
                                                <input id="bill_code" name="purchase_bill_entry_detail.purchase_bill.code" type="text" class="input-sm form-control" readonly="readonly" v-model.number="purchase_bill_entry_detail.purchase_bill.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="product_id" class="col-xs-2 control-label">商品</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="product_id" name="purchase_bill_entry_detail.purchase_bill_entry.product_id" type="hidden" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.product_id"/>
                                                    <input id="product_name" name="purchase_bill_entry_detail.product_name" type="text" class="input-sm form-control" readonly="readonly" v-model="purchase_bill_entry_detail.product_name"/>
                                                    <span class="input-group-btn">
                                                        <button type="button" class="btn btn-purple btn-sm" @click="showProductSelect()">
                                                            <span class="ace-icon fa fa-search icon-on-right"></span>&nbsp;选择
                                                        </button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="price" class="col-xs-2 control-label">单价</label>
                                            <div class="col-xs-10">
                                                <input id="price" name="purchase_bill_entry_detail.purchase_bill_entry.price" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.price"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="qty" class="col-xs-2 control-label">数量</label>
                                            <div class="col-xs-10">
                                                <input id="qty" name="purchase_bill_entry_detail.purchase_bill_entry.qty" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.qty"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="purchase_bill_entry_desc" class="col-xs-2 control-label">备注</label>
                                            <div class="col-xs-10">
                                                <textarea id="purchase_bill_entry_desc" name="purchase_bill_entry_detail.purchase_bill_entry.desc" rows="2" class="input-sm form-control" v-model="purchase_bill_entry_detail.purchase_bill_entry.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="savePurchaseBillEntry()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="productSelectDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">产品选择</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="productList" class="table table-striped table-bordered table-hover"></table>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="acceptProductSelect()">
                        <i class="ace-icon fa fa-floppy-o"></i>选择
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "purchase_bill_id": 0,
            "purchase_bill_code": "",
            "purchase_bill_detail": {
                "purchase_bill": {}
            },
            "purchase_bill_entry_detail": {
                "purchase_bill": {},
                "purchase_bill_entry": {
                    "product_id": 0
                },
                "product_name": ""
            }
        },
        mounted: function () {
            var this_vm = this;

            // purchaseBillList
            initDataTable(
                '#purchaseBillList',
                {
                    "sAjaxSource": '{%url "ErpPurchaseBill.ListData"%}',
                    "aaSorting": [[1, "desc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "pb.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "pb.code", "title": "批次号", "bSearchable": true, "width": 160},
                        {"mDataProp": "pb.desc", "title": "备注", "bSearchable": true},
                        {"mDataProp": "pb.date", "title": "日期", "bSearchable": false, "width": 85},
                        {"mDataProp": "u.nick_name", "title": "操作人", "bSearchable": false, "width": 75},
                        {"mDataProp": "pb.trans_expenses", "title": "运费", "bSearchable": false, "width": 75},
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": false, "width": 90},
                        {"mDataProp": "pb.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "pb.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#purchaseBillList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showPurchaseBillDetail(id);
            });

            $('#purchaseBillList').on('click', 'tbody tr', function () {

                $("#purchaseBillList").find('tbody tr').each(function () {
                    var tableRow = $(this).closest('tr');
                    var checkbox = tableRow.find('td:first-child input:checkbox')[0];
                    checkbox.checked = false;
                    tableRow.removeClass('hilight');
                });

                var tableRow = $(this);
                var checkbox = tableRow.find('td:first-child input:checkbox')[0];
                checkbox.checked = true;
                tableRow.addClass('hilight');

                var id = $(this).find('td:first-child input:checkbox').val();
                vm.purchase_bill_id = id;
                vm.reloadEntryList();
            });

            // purchaseBillEntryList
            initDataTable(
                '#purchaseBillEntryList',
                {
                    "sAjaxSource": '{%url "ErpPurchaseBillEntry.ListData"%}',
                    "aaSorting": [[0, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "pbe.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "p.sku", "title": "SKU", "bSearchable": false},
                        {"mDataProp": "p.name", "title": "商品名称", "bSearchable": false},
                        {"mDataProp": "pbe.price", "title": "单价", "bSearchable": false},
                        {"mDataProp": "pbe.qty", "title": "数量", "bSearchable": false},
                        {"mDataProp": "pbe.amount", "title": "金额", "bSearchable": false},
                        {"mDataProp": "pbe.purchase_date", "title": "采购日期", "bSearchable": false},
                        {"mDataProp": "pbe.checkin_date", "title": "入库日期", "bSearchable": false},
                        {"mDataProp": "pbe.desc", "title": "备注", "bSearchable": true},
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": true},
                        {"mDataProp": "pbe.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "pbe.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'purchase_bill_id', 'value': this_vm.purchase_bill_id});

                        $.ajax(
                            {
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success == false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data.list_data);

                                    vm.purchase_bill_code = data.purchase_bill_code
                                }
                            });
                    }
                }
            );

            $('#purchaseBillEntryList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showPurchaseBillEntryDetail(id);
            });

            // Product
            initSingleSelectDataTable(
                '#productList',
                {
                    "sAjaxSource": '{%url "ErpPurchaseBillEntry.ProductSelectListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "prd.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "prd.sku", "title": "SKU", "bSearchable": true},
                        {"mDataProp": "prd.name", "title": "商品名称", "bSearchable": true},
                        {"mDataProp": "prd.desc", "title": "备注", "bSearchable": true},
                        {"mDataProp": "st.name", "title": "状态", "bSearchable": false, "width": 60}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");
                        $.ajax(
                            {
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success == false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data);
                                }
                            }
                        );
                    }
                }
            );

        },
        methods: {
            // purchaseBillList
            reloadList: function () {
                reloadList('#purchaseBillList');
            },
            showPurchaseBillDetail: function (id) {
                showMask("加载中...");
                $("#purchaseBillDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpPurchaseBill.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.purchase_bill_detail = result;
                            $('#purchaseBillDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            savePurchaseBill: function () {
                showMask("提交中...");
                var form = $("#purchaseBillDetailForm");
                var valid = validate(form, {
                    'purchase_bill_detail.purchase_bill.code': {
                        required: false
                    },
                    'purchase_bill_detail.purchase_bill.desc': {
                        required: false, minlength: 2, maxlength: 400
                    },
                    'purchase_bill_detail.purchase_bill.date': {
                        required: true
                    },
                    'purchase_bill_detail.purchase_bill.user_id': {
                        required: true, digits: true
                    },
                    'purchase_bill_detail.purchase_bill.trans_expenses': {
                        required: true, number: true
                    },
                    'purchase_bill_detail.purchase_bill.status_id': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpPurchaseBill.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.purchase_bill_detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#purchaseBillDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deletePurchaseBill: function () {
                var id_list = [];
                $('#purchaseBillList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpPurchaseBill.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            },

            // purchaseBillEntryList
            reloadEntryList: function () {
                reloadList('#purchaseBillEntryList');
            },
            showPurchaseBillEntryDetail: function (id) {
                showMask("加载中...");
                $("#purchaseBillEntryDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpPurchaseBillEntry.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id,
                            "purchase_bill_id": vm.purchase_bill_id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.purchase_bill_entry_detail = result;
                            $('#purchaseBillEntryDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            savePurchaseBillEntry: function () {
                showMask("提交中...");
                var form = $("#purchaseBillEntryDetailForm");
                var valid = validate(form, {
                    'purchase_bill_entry_detail.purchase_bill_entry.bill_id': {
                        required: true, digits: true
                    },
                    'purchase_bill_entry_detail.purchase_bill_entry.product_id': {
                        required: true, digits: true
                    },
                    'purchase_bill_entry_detail.purchase_bill_entry.qty': {
                        required: true, digits: true
                    },
                    'purchase_bill_entry_detail.purchase_bill_entry.price': {
                        required: true, number: true
                    },
                    'purchase_bill_entry_detail.purchase_bill_entry.amount': {
                        required: true, number: true
                    },
                    'purchase_bill_entry_detail.purchase_bill_entry.purchase_date': {
                        required: false
                    },
                    'purchase_bill_entry_detail.purchase_bill_entry.checkin_date': {
                        required: false
                    },
                    'purchase_bill_entry_detail.purchase_bill_entry.desc': {
                        required: false, minlength: 2, maxlength: 400
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpPurchaseBillEntry.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.purchase_bill_entry_detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#purchaseBillEntryDetailDialog').modal('hide');
                                    vm.reloadEntryList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deletePurchaseBillEntry: function () {
                var id_list = [];
                $('#purchaseBillEntryList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpPurchaseBillEntry.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadEntryList();
                        }
                    });
                });
            },
            showProductSelect: function () {
                $('#productSelectDialog').modal(modalOptions);
            },
            acceptProductSelect: function () {
                var id_list = [];
                $('#productList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0 || id_list.length > 1) {
                    $.msg.alert("请选择一行数据！");
                    return;
                }

                var product_id = parseInt(id_list[0]);
                vm.purchase_bill_entry_detail.purchase_bill_entry.product_id = product_id;

                $.ajax({
                    url: '{%url "ErpProduct.GetProductInfo"%}',
                    type: "POST",
                    data: {"product_id": product_id},
                    success: function (data) {
                        vm.purchase_bill_entry_detail.product_name = data.product.sku + "  " + data.product.name;
                    }
                });

                $('#productSelectDialog').modal('hide');
            }
        }
    });
</script>
{%footer%}
