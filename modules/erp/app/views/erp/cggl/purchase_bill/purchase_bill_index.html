{%header "采购单" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="cggl-menu">采购管理</li>
            <li class="active" data-menu="cggl-purchase-bill-menu">采购单</li>
        </ul>
    </div>

    <div class="page-content">
        <div style="margin-left: -5px; margin-right: -5px;">
            <div id="query" class="col-xs-12" style="line-height: 28px;">
                <select id="status_id_query" name="status_id_query" style="width: 120px;" v-model.number="page.status_id_query" @change="statusSelectChange()">
                    <option :value="0">采购单状态</option>
                    {% range $index, $status := .status_list %}
                    <option :value="{% $status.Id %}">{% $status.Name %}</option>
                    {% end %}
                </select>
                <input id="code_query" name="code_query" type="text" v-model="page.code_query" placeholder="采购单批次号" style="height: 30px;"/>
                <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" onclick="search()">
                    &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                </button>
                <hr style="margin-top:10px;margin-bottom:10px;"/>
            </div>
            <div class="col-xs-12">
                <fieldset>
                    <legend style="font-size: 14px;line-height: 28px;">
                        采购单
                    </legend>
                </fieldset>
            </div>
            <div class="col-xs-12">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#purchaseBillList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showPurchaseBillDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-pink btn-sm" @click="submitPurchaseBill()">
                        <i class="ace-icon fa fa-arrow-circle-up"></i>
                        提交
                    </button>
                    <button class="btn btn-pink btn-sm" @click="approvePurchaseBill()">
                        <i class="ace-icon fa fa-share"></i>
                        审批
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deletePurchaseBill()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="purchaseBillList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>

            <div class="col-xs-12" style="margin-top: 30px;">
                <fieldset>
                    <legend style="font-size: 14px;line-height: 28px;">
                        采购单明细（批次号： {{purchase_bill_code}}）
                    </legend>
                </fieldset>
            </div>
            <div class="col-xs-12">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadEntryList('#purchaseBillEntryList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showPurchaseBillEntryDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deletePurchaseBillEntry()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                    <button id="btnImportEntries" class="btn btn-purple btn-sm">
                        <i class="ace-icon fa fa-plus"></i>
                        导入
                    </button>
                    <button class="btn btn-purple btn-sm" onclick="exportEntryList()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出
                    </button>
                </div>
                <div style="margin-top: 10px;">
                    <a href="/static/excel-template/purchase_bill_entry_import.xlsx">下载采购单明细导入Excel模板</a>
                </div>
                <div>
                    <table id="purchaseBillEntryList" class="table table-striped table-bordered table-hover"></table>
                    <div class="todo">1、新建时默认选中采购单；2、明细列表，sku和名称合并，数量和价格、金额合并等；3、采购单的明细里面可不可以加上一个仓库的字段，分仓库添加采购明细；4、如果一个采购单里面的明细不多的话，在明细显示的时候可以换种表格的方式进行。</div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="purchaseBillDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">采购单详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="purchaseBillDetailForm">
                                <input id="purchase_bill_id" name="purchase_bill_detail.purchase_bill.id" type="hidden" v-model.number="purchase_bill_detail.purchase_bill.id"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="code" class="col-xs-2 control-label">批次号</label>
                                            <div class="col-xs-10">
                                                <input id="code" name="purchase_bill_detail.purchase_bill.code" type="text" class="input-sm form-control" disabled="disabled" v-model="purchase_bill_detail.purchase_bill.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="supplier_id" class="col-xs-2 control-label">供应商</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="supplier_id" name="purchase_bill_detail.purchase_bill.supplier_id" type="hidden" class="input-sm form-control" v-model.number="purchase_bill_detail.purchase_bill.supplier_id"/>
                                                    <input id="supplier_name" name="purchase_bill_detail.supplier_name" type="text" class="input-sm form-control" readonly="readonly" v-model="purchase_bill_detail.supplier_name"/>
                                                    <span class="input-group-btn">
                                                        <button type="button" class="btn btn-purple btn-sm" onclick="showSupplierSelect()">
                                                            <span class="ace-icon fa fa-search icon-on-right"></span>&nbsp;选择
                                                        </button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="purchase_bill_desc" class="col-xs-2 control-label">备注</label>
                                            <div class="col-xs-10">
                                                <textarea id="purchase_bill_desc" name="purchase_bill_detail.purchase_bill.desc" rows="2" class="input-sm form-control" v-model="purchase_bill_detail.purchase_bill.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="trans_expenses" class="col-xs-2 control-label">运费</label>
                                            <div class="col-xs-10">
                                                <input id="trans_expenses" name="purchase_bill_detail.purchase_bill.trans_expenses" type="text" class="input-sm form-control" v-model.number="purchase_bill_detail.purchase_bill.trans_expenses"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="savePurchaseBill()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="purchaseBillEntryDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">采购单详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="purchaseBillEntryDetailForm">
                                <input id="purchase_bill_entry_id" name="purchase_bill_entry_detail.purchase_bill_entry.id" type="hidden" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.id"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="bill_id" class="col-xs-2 control-label">批次</label>
                                            <div class="col-xs-10">
                                                <input id="bill_id" name="purchase_bill_entry_detail.purchase_bill.id" type="hidden" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill.id"/>
                                                <input id="bill_code" name="purchase_bill_entry_detail.purchase_bill.code" type="text" class="input-sm form-control" readonly="readonly" v-model.number="purchase_bill_entry_detail.purchase_bill.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="product_id" class="col-xs-2 control-label">商品</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="product_id" name="purchase_bill_entry_detail.purchase_bill_entry.product_id" type="hidden" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.product_id"/>
                                                    <input id="product_name" name="purchase_bill_entry_detail.product_name" type="text" class="input-sm form-control" readonly="readonly" v-model="purchase_bill_entry_detail.product_name"/>
                                                    <span class="input-group-btn">
                                                        <button type="button" class="btn btn-purple btn-sm" onclick="showProductSelect()">
                                                            <span class="ace-icon fa fa-search icon-on-right"></span>&nbsp;选择
                                                        </button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="price" class="col-xs-2 control-label">单价</label>
                                            <div class="col-xs-10">
                                                <input id="price" name="purchase_bill_entry_detail.purchase_bill_entry.price" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.price"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="mel_qty" class="col-xs-2 control-label">MEL数量</label>
                                            <div class="col-xs-10">
                                                <input id="mel_qty" name="purchase_bill_entry_detail.purchase_bill_entry.mel_qty" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.mel_qty"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="bne_qty" class="col-xs-2 control-label">BNE数量</label>
                                            <div class="col-xs-10">
                                                <input id="bne_qty" name="purchase_bill_entry_detail.purchase_bill_entry.bne_qty" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.bne_qty"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="qty" class="col-xs-2 control-label">总数量</label>
                                            <div class="col-xs-10">
                                                <input id="qty" name="purchase_bill_entry_detail.purchase_bill_entry.qty" type="text" class="input-sm form-control" v-model.number="purchase_bill_entry_detail.purchase_bill_entry.qty" disabled="disabled"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="purchase_bill_entry_desc" class="col-xs-2 control-label">备注</label>
                                            <div class="col-xs-10">
                                                <textarea id="purchase_bill_entry_desc" name="purchase_bill_entry_detail.purchase_bill_entry.desc" rows="2" class="input-sm form-control" v-model="purchase_bill_entry_detail.purchase_bill_entry.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="savePurchaseBillEntry()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="supplierSelectDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">供应商选择</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="supplierList" class="table table-striped table-bordered table-hover"></table>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" onclick="acceptSupplierSelect()">
                        <i class="ace-icon fa fa-floppy-o"></i>选择
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="productSelectDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">产品选择</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="productList" class="table table-striped table-bordered table-hover"></table>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" onclick="acceptProductSelect()">
                        <i class="ace-icon fa fa-floppy-o"></i>选择
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="/static/lib/plupload/moxie.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/plupload.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/zh_CN.js"></script>

<script type="text/javascript">

    $(function () {
        init_uploader();
    });

    function init_uploader() {
        var params = $.param({"bill_id": vm.purchase_bill_id});
        var upload_url = '{%url "ErpPurchaseBillEntryExcel.Import"%}' + "?" + params;

        var uploader = new plupload.Uploader({
            runtimes: 'html5,flash,html4',
            multi_selection: false,

            browse_button: 'btnImportEntries',
            file_data_name: "excel_file",

            url: upload_url,
            max_file_size: '10000kb',

            filters: [
                {title: "Excel文件", extensions: "xlsx"}
            ],

            flash_swf_url: '/plupload/js/Moxie.swf',

            init: {
                FilesAdded: function () {
                    if (!vm.purchase_bill_id || vm.purchase_bill_id === 0) {
                        $.msg.error("请先选择采购单！");
                        return;
                    }

                    showMask("上传中，请稍候...");
                    uploader.start();
                },
                FileUploaded: function (up, file, response) {

                    hideMask();
                    var result = JSON.parse(response.response);
                    if (result.success !== true) {
                        $.msg.error(result.message);
                    } else {
                        refreshList('#purchaseBillEntryList');
                        $.msg.show(result.message);
                    }
                },
                Error: function (up, err) {
                    $.msg.error("上传发生错误：" + err.code + ", " + err.message);
                }
            }
        });

        uploader.bind('BeforeUpload', function (up, file) {
            var params = $.param({"bill_id": vm.purchase_bill_id});
            up.settings.url = '{%url "ErpPurchaseBillEntryExcel.Import"%}' + "?" + params;
        });

        uploader.init();
    }

    function search() {
        refreshList('#purchaseBillList');
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "purchase_bill_id": 0,
            "purchase_bill_code": "",
            "purchase_bill_detail": {
                "purchase_bill": {},
                "supplier_name": ""
            },
            "purchase_bill_entry_detail": {
                "purchase_bill": {},
                "purchase_bill_entry": {
                    "product_id": 0
                },
                "product_name": ""
            },
            "page": {
                "status_id_query": 0
            }
        },
        mounted: function () {
            var this_vm = this;

            // purchaseBillList
            initDataTable(
                '#purchaseBillList',
                {
                    "sAjaxSource": '{%url "ErpPurchaseBill.ListData"%}',
                    "aaSorting": [[1, "desc"]],
                    "iDisplayLength": 5,
                    "aoColumns": [
                        {
                            "mDataProp": "pb.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "pb.code", "title": "批次号", "bSearchable": true, "width": 120},
                        {
                            "mDataProp": "sup.name", "title": "供应商", "bSearchable": true, "sClass": "wrap-word",
                            "render": function (data, type, row) {
                                return "<div>" + data + "</div>";
                            }
                        },
                        {"mDataProp": "pb.pay_time", "title": "付款时间", "bSearchable": false, "sClass": "center", "width": 120},
                        {"mDataProp": "u.nick_name", "title": "操作人", "bSearchable": false, "width": 75},
                        {"mDataProp": "pb.trans_expenses", "title": "运费", "bSearchable": false, "width": 75},
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": false, "width": 90},
                        {"mDataProp": "pb.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "pb.update_time", "title": "修改时间", "bSearchable": false, "width": 120},
                        {
                            "mDataProp": "pb.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 100,
                            "title": '操作',
                            "render": function (data, type, row) {
                                return "<a class='btn btn-xs btn-info btn-inline pull-left' onclick='show_log_dialog(" + data + ");' ><i class='ace-icon fa fa-list'></i>查看历史</a>";
                            }
                        }
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'status_id_query', 'value': this_vm.page.status_id_query});
                        aoData.push({'name': 'code_query', 'value': this_vm.page.code_query});

                        $.ajax(
                            {
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data);
                                }
                            });
                    }
                }
            );

            $('#purchaseBillList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showPurchaseBillDetail(id);
            });

            $('#purchaseBillList').on('click', 'tbody tr', function () {

                $("#purchaseBillList").find('tbody tr').each(function () {
                    var tableRow = $(this).closest('tr');
                    var checkbox = tableRow.find('td:first-child input:checkbox')[0];
                    checkbox.checked = false;
                    tableRow.removeClass('hilight');
                });

                var tableRow = $(this);
                var checkbox = tableRow.find('td:first-child input:checkbox')[0];

                checkbox.checked = true;
                tableRow.addClass('hilight');

                var id = $(this).find('td:first-child input:checkbox').val();
                vm.purchase_bill_id = id;
                vm.reloadEntryList();
            });

            initDataTable(
                '#purchaseBillEntryList',
                {
                    "sAjaxSource": '{%url "ErpPurchaseBillEntry.ListData"%}',
                    "aaSorting": [[0, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "pbe.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "p.sku", "title": "SKU", "bSearchable": false, "width": 150},
                        {
                            "mDataProp": "p.cn_name", "title": "商品名称", "bSearchable": false, "sClass": "word-wrap",
                            "render": function (data, type, row) {
                                return "<div>" + data + "</div>"
                            }
                        },
                        {"mDataProp": "pbe.price", "title": "单价", "bSearchable": false, "sClass": "center", "width": 50},
                        {"mDataProp": "pbe.mel_qty", "title": "MEL数量", "bSearchable": false, "sClass": "center", "width": 80},
                        {"mDataProp": "pbe.bne_qty", "title": "BNE数量", "bSearchable": false, "sClass": "center", "width": 80},
                        {"mDataProp": "pbe.qty", "title": "总数量", "bSearchable": false, "sClass": "center", "width": 70},
                        {"mDataProp": "pbe.amount", "title": "金额", "bSearchable": false, "sClass": "center", "width": 50},
                        {"mDataProp": "pbe.purchase_time", "title": "采购时间", "bSearchable": false, "sClass": "center", "width": 120},

    function showProductSelect() {
        $('#productSelectDialog').modal(modalOptions);
    }

    function acceptProductSelect() {
        var id_list = [];
        $('#productList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length === 0 || id_list.length > 1) {
            $.msg.alert("请选择一行数据！");
            return;
        }

        var product_id = parseInt(id_list[0]);
        vm.purchase_bill_entry_detail.purchase_bill_entry.product_id = product_id;

        $.ajax({
            url: '{%url "ErpProduct.GetProductInfo"%}',
            type: "POST",
            data: {"product_id": product_id},
            success: function (data) {
                vm.purchase_bill_entry_detail.product_name = data.product.sku + "  " + data.product.cn_name;
            }
        });

        $('#productSelectDialog').modal('hide');
    }

    function showSupplierSelect() {
        $('#supplierSelectDialog').modal(modalOptions);
    }

    function acceptSupplierSelect() {
        var id_list = [];
        $('#supplierList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length === 0 || id_list.length > 1) {
            $.msg.alert("请选择一行数据！");
            return;
        }

        var supplier_id = parseInt(id_list[0]);
        vm.purchase_bill_detail.purchase_bill.supplier_id = supplier_id;

        $.ajax({
            url: '{%url "ErpSupplier.GetSupplierInfo"%}',
            type: "POST",
            data: {"supplier_id": supplier_id},
            success: function (data) {
                vm.purchase_bill_detail.supplier_name = data.supplier.name;
            }
        });

        $('#supplierSelectDialog').modal('hide');
    }

    function show_log_dialog(bill_id) {
        function load_purchase_bill_log(bill_id) {
            var history_vm = new Vue({
                el: "#purchase_bill_log_dialog",
                data: {}
            });

            initDataTable(
                '#purchaseBillLogList',
                {
                    "sAjaxSource": '{%url "ErpPurchaseBillLog.ListData"%}',
                    "aaSorting": [[0, "desc"]],
                    "aoColumns": [
                        {"mDataProp": "create_time", "title": "时间", "sClass": "center", "bSearchable": false, "bSortable": false, "width": 120},

                            }
                        }

                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'bill_id', 'value': bill_id});

                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                hideMask();

                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    return;
                                }

                                fnCallback(data);
                            }
                        });
                    }
                }
            );
        }

        $("#purchase_bill_log_wrapper").html("");

        $.ajax({
            url: '{%url "ErpPurchaseBillLog.Index" %}',
            type: "POST",
            data: {"bill_id": bill_id},
            success: function (result) {
                $("#purchase_bill_log_wrapper").html(result);
                load_purchase_bill_log(bill_id);
                $("#purchase_bill_log_dialog").modal();
            }
        });
    }
