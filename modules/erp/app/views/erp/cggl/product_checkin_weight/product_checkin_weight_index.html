{%header "商品入库长宽高重量" .%}
<div id="page">
   <div class="breadcrumbs" id="breadcrumbs">
       <ul class="breadcrumb">
           <li>
               <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
           </li>
           <li class="parent" data-menu="erp-menu">ERP</li>
           <li class="active" data-menu="erp-productcheckinweight-menu">商品入库长宽高重量</li>
       </ul>
   </div>
   <div class="page-content">
       <div class="row">
           <div class="col-xs-12" style="padding: 0;">
               <div class="gridToolBar clearfix">
                   <button class="btn btn-primary btn-sm" @click="reloadList('#productCheckinWeightList')">
                       <i class="ace-icon fa fa-refresh"></i>
                       刷新
                   </button>
                   <button class="btn btn-success btn-sm" @click="showProductCheckinWeightDetail(0)">
                       <i class="ace-icon fa fa-plus"></i>
                       新增
                   </button>
                   <button class="btn btn-danger btn-sm" @click="deleteProductCheckinWeight()">
                       <i class="ace-icon fa fa-trash-o"></i>
                       删除
                   </button>
               </div>
               <div>
                   <table id="productCheckinWeightList" class="table table-striped table-bordered table-hover"></table>
               </div>
           </div>
       </div>
   </div>
    <div class="modal fade" id="productCheckinWeightDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">商品入库长宽高重量详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="productCheckinWeightDetailForm">
                                <input id="product_checkin_weight_id" name="detail.product_checkin_weight.id" type="hidden" v-model.number="detail.product_checkin_weight.id"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="bill_id" class="col-xs-2 control-label">采购单</label>
                                            <div class="col-xs-10">
                                                <input id="bill_id" name="detail.product_checkin_weight.bill_id" type="text" class="input-sm form-control" v-model.number="detail.product_checkin_weight.bill_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="entry_id" class="col-xs-2 control-label">采购单明细</label>
                                            <div class="col-xs-10">
                                                <input id="entry_id" name="detail.product_checkin_weight.entry_id" type="text" class="input-sm form-control" v-model.number="detail.product_checkin_weight.entry_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="product_id" class="col-xs-2 control-label">商品</label>
                                            <div class="col-xs-10">
                                                <input id="product_id" name="detail.product_checkin_weight.product_id" type="text" class="input-sm form-control" v-model.number="detail.product_checkin_weight.product_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="length" class="col-xs-2 control-label">长度</label>
                                            <div class="col-xs-10">
                                                <input id="length" name="detail.product_checkin_weight.length" type="text" class="input-sm form-control" v-model.number="detail.product_checkin_weight.length"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="width" class="col-xs-2 control-label">宽度</label>
                                            <div class="col-xs-10">
                                                <input id="width" name="detail.product_checkin_weight.width" type="text" class="input-sm form-control" v-model.number="detail.product_checkin_weight.width"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="height" class="col-xs-2 control-label">高度</label>
                                            <div class="col-xs-10">
                                                <input id="height" name="detail.product_checkin_weight.height" type="text" class="input-sm form-control" v-model.number="detail.product_checkin_weight.height"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="weight" class="col-xs-2 control-label">重量</label>
                                            <div class="col-xs-10">
                                                <input id="weight" name="detail.product_checkin_weight.weight" type="text" class="input-sm form-control" v-model.number="detail.product_checkin_weight.weight"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveProductCheckinWeight()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "product_checkin_weight": {}
            }
        },
        mounted: function () {
            initDataTable(
                    '#productCheckinWeightList',
                    {
                        "sAjaxSource": '{%url "ErpProductCheckinWeight.ListData"%}',
                        "aaSorting": [[1, "asc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "bill_id", "title": "采购单", "bSearchable": false },
                            {"mDataProp": "entry_id", "title": "采购单明细", "bSearchable": false },
                            {"mDataProp": "product_id", "title": "商品", "bSearchable": false },
                            {"mDataProp": "length", "title": "长度", "bSearchable": false },
                            {"mDataProp": "width", "title": "宽度", "bSearchable": false },
                            {"mDataProp": "height", "title": "高度", "bSearchable": false },
                            {"mDataProp": "weight", "title": "重量", "bSearchable": false },
                            {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120 },
                            {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120 }
                        ]
                   }
            );

            $('#productCheckinWeightList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showProductCheckinWeightDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#productCheckinWeightList');
            },
            showProductCheckinWeightDetail: function (id) {
                showMask("加载中...");
                $("#productCheckinWeightDetailForm").clearValidation();
                $.ajax({
                           url: '{%url "ErpProductCheckinWeight.DetailData" %}',
                           type: "POST",
                           data: {
                               "id": id
                           },
                           success: function (result) {
                               hideMask();
                               if (result.success == false) {
                                   $.msg.error(result.message);
                                   return;
                               }
                               vm.detail = result;
                               $('#productCheckinWeightDetailDialog').modal(modalOptions);
                           }
                       }
                );
            },
            saveProductCheckinWeight: function () {
                showMask("提交中...");
                var form = $("#productCheckinWeightDetailForm");
                var valid = validate(form, {
                    'detail.product_checkin_weight.bill_id': {
                        required: true, digits: true
                    },
                    'detail.product_checkin_weight.entry_id': {
                        required: true, digits: true
                    },
                    'detail.product_checkin_weight.product_id': {
                        required: true, digits: true
                    },
                    'detail.product_checkin_weight.length': {
                        required: true, number: true
                    },
                    'detail.product_checkin_weight.width': {
                        required: true, number: true
                    },
                    'detail.product_checkin_weight.height': {
                        required: true, number: true
                    },
                    'detail.product_checkin_weight.weight': {
                        required: true, number: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                               url: '{%url "ErpProductCheckinWeight.Save"%}',
                               type: "POST",
                               processData: false,
                               contentType: 'application/json',
                               data: JSON.stringify(vm.detail),
                               success: function (data) {
                                   hideMask();
                                   if (data.success == false) {
                                       $.msg.error(data.message);
                                       //return;
                                   }
                                   else {
                                       $.msg.show(data.message);
                                       $('#productCheckinWeightDetailDialog').modal('hide');
                                       vm.reloadList();
                                       //return;
                                   }
                               }
                           }
                    );
                }
            },
            deleteProductCheckinWeight: function () {
                var id_list = [];
                $('#productCheckinWeightList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                               url: '{%url "ErpProductCheckinWeight.Delete"%}',
                               type: "POST",
                               data: {"id_list": id_list},
                               success: function (data) {
                                   if (data.success == false) {
                                       $.msg.error(data.message);
                                       return;
                                   }
                                   else {
                                       $.msg.show(data.message);
                                   }
                                   vm.reloadList();
                               }
                           });
                });
            }
        }
    });
</script>
{%footer%}
