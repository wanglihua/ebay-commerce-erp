<div class="modal fade" id="orderSplitDialog">
    <div class="modal-dialog" style="width: 680px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                <h4 class="modal-title">订单分割</h4>
            </div>
            <div class="modal-body clearfix">
                <div class="row">
                    <div class="col-xs-12">
                        <form class="form-horizontal" role="form" id="orderSplitForm">
                            <input id="order_item_order_id" name="order_id" type="hidden" value="{% .order_id %}"/>

                            {% range $index, $order_item := .order_item_list %}
                            <div class="row">
                                <div class="col-xs-6">
                                    <div class="form-group">
                                        <label for="order_item_sku" class="col-xs-4 control-label">SKU</label>
                                        <div class="col-xs-8">
                                            <input id="order_item_sku" name="order_split.sku" type="text" class="input-sm form-control" value="{% $order_item.ItemSku %}" disabled="disabled"/>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-xs-6">
                                    <div class="form-group">
                                        <label for="order_item_qty" class="col-xs-4 control-label">数量</label>
                                        <div class="col-xs-8">
                                            <input id="order_item_qty" name="{% $order_item.Id %}_qty" type="text" class="input-sm form-control" value="{% $order_item.Quantity %}"/>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            {% end %}

                        </form>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success btn-sm" onclick="saveOrderSplit()">
                    <i class="ace-icon fa fa-floppy-o"></i>保存
                </button>
                <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                    <i class="ace-icon fa fa-times"></i>关闭
                </button>
            </div>
        </div>
    </div>
</div>
