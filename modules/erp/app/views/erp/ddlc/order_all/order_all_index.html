{%header "所有订单" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddlc-menu">订单流程</li>
            <li class="active" data-menu="ddlc-order-all-menu">所有订单</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#orderList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showOrderDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteOrder()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="orderList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "order": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#orderList',
                {
                    "sAjaxSource": '{%url "ErpOrderAll.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "shop_id", "title": "店铺", "bSearchable": false},
                        {"mDataProp": "code", "title": "编码", "bSearchable": true},
                        {"mDataProp": "desc", "title": "备注", "bSearchable": true},
                        {"mDataProp": "type_id", "title": "类型", "bSearchable": false},
                        {"mDataProp": "ebay_status", "title": "ebay状态", "bSearchable": true},
                        {"mDataProp": "status_id", "title": "状态", "bSearchable": false},
                        {"mDataProp": "adjustment_amount_currency", "title": "调整金额货种", "bSearchable": true},
                        {"mDataProp": "adjustment_amount", "title": "调整金额", "bSearchable": false},
                        {"mDataProp": "amount_paid_currency", "title": "支付金额货种", "bSearchable": true},
                        {"mDataProp": "amount_paid", "title": "支付金额", "bSearchable": false},
                        {"mDataProp": "amount_saved_currency", "title": "节省金额货种", "bSearchable": true},
                        {"mDataProp": "amount_saved", "title": "节省金额", "bSearchable": false},
                        {"mDataProp": "total_amount_currency", "title": "总计金额币种", "bSearchable": true},
                        {"mDataProp": "total_amount", "title": "总计金额", "bSearchable": false},
                        {"mDataProp": "subtotal_amount_currency", "title": "小计金额币种", "bSearchable": true},
                        {"mDataProp": "subtotal_amount", "title": "小计金额", "bSearchable": false},
                        {"mDataProp": "payment_methods", "title": "支付方式", "bSearchable": true},
                        {"mDataProp": "seller_email", "title": "卖家邮件", "bSearchable": true},
                        {"mDataProp": "seller_user_id", "title": "卖家用户id", "bSearchable": true},
                        {"mDataProp": "buyer_user_id", "title": "买家用户id", "bSearchable": true},
                        {"mDataProp": "buyer_checkout_message", "title": "买家留言", "bSearchable": true},
                        {"mDataProp": "created_time", "title": "创建时间", "bSearchable": false},
                        {"mDataProp": "modified_time", "title": "修改时间", "bSearchable": false},
                        {"mDataProp": "paid_time", "title": "支付时间", "bSearchable": false},
                        {"mDataProp": "shipped_time", "title": "创建时间", "bSearchable": false},
                        {"mDataProp": "hold_type_id", "title": "Hold类型", "bSearchable": false},
                        {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#orderList');
            }
        }
    });
</script>
{%footer%}
