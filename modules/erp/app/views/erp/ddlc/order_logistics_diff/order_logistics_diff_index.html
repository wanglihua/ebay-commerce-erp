{%header "订单物流费用偏差" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddlc-menu">订单流程</li>
            <li class="active" data-menu="ddlc-order-logistics-diff-menu">最佳仓次佳仓偏差</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#orderLogisticsList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div>
                    <table id="orderLogisticsList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">

    $(function () {

    });

    var vm = new Vue({
        el: "#page",
        data: {},
        mounted: function () {
            var this_vm = this;

            initDataTable(
                '#orderLogisticsList',
                {
                    "sAjaxSource": '{%url "ErpOrderLogisticsDiff.ListData"%}',
                    "aaSorting": [[0, "desc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "oll.id",
                            "bSearchable": false,
                            "orderable": true,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {
                            "mDataProp": "o.code", "title": "订单编号", "bSearchable": true, "width": 120,
                            "render": function (data, type, row) {
                                return "<div style='min-width: 100px;white-space:normal; word-break: break-all; word-wrap:break-word;'><a href='/order/detail/" + row.o.id + "' target='_blank'>" + data + "</a></div>";
                            }
                        },
                        {
                            "mDataProp": "o.full_tran_id", "title": "订单代码", "bSearchable": true, "width": 120,
                            "render": function (data, type, row) {
                                return "<div style='min-width: 80px;white-space:normal; word-break: break-all; word-wrap:break-word;'>" + data + "</div>";
                            }
                        },
                        {
                            "mDataProp": "lm.name",
                            "title": "最佳仓物流",
                            "bSearchable": true,
                            "bSortable": true
                        },
                        {
                            "mDataProp": "oll.total_fee", "title": "最佳仓费用", "bSearchable": false, "width": 100,
                            "render": function (data, type, row) {
                                if (data !== "" && data !== 0) {
                                    return "AU " + dtFormatFloat(data);
                                }
                                else {
                                    return "";
                                }
                            }
                        },
                        {
                            "mDataProp": "lm_sec.name",
                            "title": "次佳仓物流",
                            "bSearchable": true,
                            "bSortable": true
                        },
                        {
                            "mDataProp": "oll.total_fee_second", "title": "次佳仓费用", "bSearchable": false, "width": 100,
                            "render": function (data, type, row) {
                                if (data !== "" && data !== 0) {
                                    return "AU " + dtFormatFloat(data);
                                }
                                else {
                                    return "";
                                }
                            }
                        },
                        {
                            "mDataProp": "oll.fee_diff", "title": "费用偏差", "bSearchable": false, "width": 100,
                            "render": function (data, type, row) {
                                if (data !== "" && data !== 0) {
                                    return "AU " + dtFormatFloat(data);
                                }
                                else {
                                    return "";
                                }
                            }
                        }
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                hideMask();

                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    return;
                                }

                                fnCallback(data);
                            }
                        });
                    }
                }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#orderLogisticsList');
            },
            refreshList: function () {
                refreshList('#orderLogisticsList');
            }
        }
    });
</script>
{%footer%}
