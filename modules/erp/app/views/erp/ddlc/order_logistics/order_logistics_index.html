{%header "订单物流" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddlc-menu">订单流程</li>
            <li class="active" data-menu="ddlc-orderlogistics-menu">订单物流</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#orderLogisticsList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-pink btn-sm" @click="exportOrderLogistics1()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出预估物流
                    </button>
                    <button class="btn btn-pink btn-sm" @click="exportOrderLogistics2()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出API对接模板
                    </button>
                    <button class="btn btn-pink btn-sm" @click="showExportOrderLogisticsCompany()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出物流公司模板
                    </button>
                    <button class="btn btn-success btn-sm" @click="showLogisticsImport()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        物流信息导入
                    </button>

                    {%/*
                    <button class="btn btn-success btn-sm" @click="showOrderLogisticsDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteOrderLogistics()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                    */%}
                </div>
                <form id="formExport1" method="post" action='{%url "ErpOrderLogistics.Export1" %}'>
                    <input type="hidden" name="stock_id" v-model="page.stock_id"/>
                    <input type="hidden" name="logistics_company_id" v-model="page.logistics_company_id"/>
                    <input type="hidden" name="batch_code" v-model="page.batch_code"/>
                    <input type="hidden" name="begin_time_query" v-model="page.begin_time_query"/>
                    <input type="hidden" name="end_time_query" v-model="page.end_time_query"/>
                </form>
                <form id="formExport2" method="post" action='{%url "ErpOrderLogistics.Export2" %}'>
                    <input type="hidden" name="stock_id" v-model="page.stock_id"/>
                    <input type="hidden" name="logistics_company_id" v-model="page.logistics_company_id"/>
                    <input type="hidden" name="batch_code" v-model="page.batch_code"/>
                    <input type="hidden" name="begin_time_query" v-model="page.begin_time_query"/>
                    <input type="hidden" name="end_time_query" v-model="page.end_time_query"/>
                </form>
                <div class="row" style="margin-top: 10px;margin-bottom: 20px;">
                    <div id="query" class="col-xs-12 query" style="line-height: 28px;">
                        <div class="col-xs-12">
                            {%/*
                            <select id="stock_id" name="page.stock_id" v-model.number="page.stock_id" style="width: 120px;" @change="reloadList()">
                                <option :value="0">-发货仓库-</option>
                                <template v-for="stock in page.stock_list">
                                    <option :value="stock.id">{{stock.name}}</option>
                                </template>
                            </select>
                            <select id="logistics_company_id" name="page.logistics_company_id" v-model.number="page.logistics_company_id" style="width: 120px;" @change="reloadList()">
                                <option :value="0">-物流公司-</option>
                                <template v-for="logistics_company in page.logistics_company_list">
                                    <option :value="logistics_company.id">{{logistics_company.name}}</option>
                                </template>
                            </select>
                            */%}
                            <div class="link_query_list">
                                <a :class="page.stock_id == 0 ? 'selected' : ''" href="#" @click="selectStock(0)"><img style="border: none;height: 24px;" src="/static/images/icons/all_check.png" class="link_icon" alt="全部仓库"/>全部仓库</a>
                                <template v-for="stock in page.stock_list">
                                    <a :class="page.stock_id == stock.id ? 'selected' : ''" href="#" @click="selectStock(stock.id)"><img v-if="stock.icon_file != ''" :src="'{%.icon_path%}/' + stock.icon_file" :alt="stock.name" class="link_icon"/>{{stock.name}}</a>
                                </template>
                                <span style="margin-top:5px; padding: 0 10px;color:lightgray;display: block;float: left;">|</span>
                                <a :class="page.logistics_company_id == 0 ? 'selected' : ''" href="#" @click="selectLogisticsCompany(0)"><img style="border: none;height: 24px;" src="/static/images/icons/all_check.png" class="link_icon" alt="全部物流公司"/>全部物流公司</a>
                                <template v-for="logistics_company in page.logistics_company_list">
                                    <a :class="page.logistics_company_id == logistics_company.id ? 'selected' : ''" href="#" @click="selectLogisticsCompany(logistics_company.id)"><img v-if="logistics_company.icon_file != ''" :src="'{%.icon_path%}/' + logistics_company.icon_file" :alt="logistics_company.name" class="link_icon"/>&nbsp;<span>{{logistics_company.name}}</span></a>
                                </template>
                                <div style="clear:both;"></div>
                            </div>
                            <div style="padding-top: 15px;">
                                <label class="control-label no-padding-right" for="batch_code">导入批次号</label>
                                <select id="batch_code" name="page.batch_code" v-model.number="page.batch_code" style="width: 130px;" @change="refreshList()">
                                    <option :value="0">-导入批次号-</option>
                                    <template v-for="batch_code in page.batch_code_list">
                                        <option :value="batch_code">{{batch_code}}</option>
                                    </template>
                                </select>
                                <label class="control-label no-padding-right" for="order_code_query">订单编号</label>
                                <input class="input-sm" id="order_code_query" name="order_code_query" placeholder="订单编号" type="text" v-model="page.order_code_query" style="width: 130px;"/>
                                <label class="control-label no-padding-right" for="begin_time_query">开始时间</label>
                                <input class="input-sm" id="begin_time_query" name="begin_time_query" placeholder="开始时间查询" type="text" v-model="page.begin_time_query" style="width: 130px;"/>
                                <label class="control-label no-padding-right" for="end_time_query">结束时间</label>
                                <input class="input-sm" id="end_time_query" name="end_time_query" placeholder="结束时间查询" type="text" v-model="page.end_time_query" style="width: 130px;"/>
                                <button class="btn btn-mini btn-primary" @click="refreshList()">
                                    &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="orderLogisticsList" class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr>
                            <th></th>
                            <th id="th_tran_id">订单代码</th>
                            <th id="th_stock_name">发货仓库</th>
                            <th id="th_delivery_person">发货人员</th>

                            <th id="th_company_name">货运公司</th>
                            <th id="th_mode_name">货运方式</th>
                            <th id="th_waybill_number">货运单号</th>


                            <th id="th_length">长(cm)</th>
                            <th id="th_width">宽(cm)</th>
                            <th id="th_height">高(cm)</th>

                            <th id="th_actual_weight">实际重量（Kg)</th>
                            <th id="th_dim_weight">体积重量（Kg)</th>
                            <th id="th_sfkltjz">考虑体积重</th>

                            <th id="th_products">订单商品</th>

                            <th id="th_paid_time">支付时间</th>
                            <th id="th_modify_time">修改时间</th>
                            <th id="th_shipped_time">发货时间</th>
                        </tr>
                        </thead>
                    </table>
                    <div class="todo">
                        1、按物流公司导出需要的模板； 2、手工新增和修改；
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="orderLogisticsDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">订单物流详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="orderLogisticsDetailForm">
                                <input id="order_logistics_id" name="detail.order_logistics.id" type="hidden" v-model.number="detail.order_logistics.id"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="order_id" class="col-xs-2 control-label">订单</label>
                                            <div class="col-xs-10">
                                                <input id="order_id" name="detail.order_logistics.order_id" type="text" class="input-sm form-control" v-model.number="detail.order_logistics.order_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="address_id" class="col-xs-2 control-label">物流地址</label>
                                            <div class="col-xs-10">
                                                <input id="address_id" name="detail.order_logistics.address_id" type="text" class="input-sm form-control" v-model.number="detail.order_logistics.address_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="mode_id" class="col-xs-2 control-label">物流方式</label>
                                            <div class="col-xs-10">
                                                <input id="mode_id" name="detail.order_logistics.mode_id" type="text" class="input-sm form-control" v-model.number="detail.order_logistics.mode_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="fee_rate_id" class="col-xs-2 control-label">物流费率</label>
                                            <div class="col-xs-10">
                                                <input id="fee_rate_id" name="detail.order_logistics.fee_rate_id" type="text" class="input-sm form-control" v-model.number="detail.order_logistics.fee_rate_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="length" class="col-xs-2 control-label">长度</label>
                                            <div class="col-xs-10">
                                                <input id="length" name="detail.order_logistics.length" type="text" class="input-sm form-control" v-model.number="detail.order_logistics.length"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="width" class="col-xs-2 control-label">宽度</label>
                                            <div class="col-xs-10">
                                                <input id="width" name="detail.order_logistics.width" type="text" class="input-sm form-control" v-model.number="detail.order_logistics.width"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="height" class="col-xs-2 control-label">高度</label>
                                            <div class="col-xs-10">
                                                <input id="height" name="detail.order_logistics.height" type="text" class="input-sm form-control" v-model.number="detail.order_logistics.height"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="weight" class="col-xs-2 control-label">重量</label>
                                            <div class="col-xs-10">
                                                <input id="weight" name="detail.order_logistics.weight" type="text" class="input-sm form-control" v-model.number="detail.order_logistics.weight"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="total_fee" class="col-xs-2 control-label">物流费用</label>
                                            <div class="col-xs-10">
                                                <input id="total_fee" name="detail.order_logistics.total_fee" type="text" class="input-sm form-control" v-model.number="detail.order_logistics.total_fee"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="actual_fee" class="col-xs-2 control-label">实际费用</label>
                                            <div class="col-xs-10">
                                                <input id="actual_fee" name="detail.order_logistics.actual_fee" type="text" class="input-sm form-control" v-model.number="detail.order_logistics.actual_fee"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="pick_fee" class="col-xs-2 control-label">拣货费用</label>
                                            <div class="col-xs-10">
                                                <input id="pick_fee" name="detail.order_logistics.pick_fee" type="text" class="input-sm form-control" v-model.number="detail.order_logistics.pick_fee"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveOrderLogistics()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="logisticsCompanyExportOptionDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">订单物流详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="logisticsCompanyExportOptionForm">
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="export_stock_id" class="col-xs-2 control-label">仓库</label>
                                            <div class="col-xs-10">
                                                <select id="export_stock_id" name="logistics_company_export_option.stock_id" class="input-sm form-control" v-model.number="logistics_company_export_option.stock_id">
                                                    <template v-for="stock in logistics_company_export_option.stock_list">
                                                        <option :value="stock.id">{{stock.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="export_company_code" class="col-xs-2 control-label">物流公司</label>
                                            <div class="col-xs-10">
                                                <select id="export_company_code" name="logistics_company_export_option.company_code" class="input-sm form-control" v-model.number="logistics_company_export_option.company_code">
                                                    <template v-for="company in logistics_company_export_option.company_list">
                                                        <option :value="company.code">{{company.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                            <form id="formLogisticsCompanyExport" method="post" action='{%url "ErpOrderLogisticsCompanyExport.ExportExcel" %}'>
                                <input type="hidden" id="company_export_stock_id" name="stock_id"/>
                                <input type="hidden" id="company_export_company_code" name="company_code"/>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="exportOrderLogisticsCompany()">
                        <i class="ace-icon fa fa-floppy-o"></i>导出
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>取消
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">

    $(function () {
        $('#begin_time_query').datetimepicker({
            locale: "zh-cn"
        });

        $('#end_time_query').datetimepicker({
            locale: "zh-cn"
        });
    });

    var vm = new Vue({
        el: "#page",
        data: {
            "page": {
                "stock_id": 0,
                "stock_list": [],
                "logistics_company_id": 0,
                "logistics_company_list": [],
                "batch_code": 0,
                "batch_code_list": [],
                "order_code_query": "",
                "begin_time_query": "",
                "end_time_query": ""
            },
            "detail": {
                "order_logistics": {}
            },
            "logistics_company_export_option": {}
        },
        mounted: function () {
            var this_vm = this;

            //请求页面数据
            $.ajax({
                    url: '{%url "ErpOrderLogistics.PageData" %}',
                    type: "POST",
                    success: function (result) {
                        if (result.success === false) {
                            $.msg.error(result.message);
                            return;
                        }
                        this_vm.page = result;
                    }
                }
            );

            initDataTable(
                '#orderLogisticsList',
                {
                    "sAjaxSource": '{%url "ErpOrderLogistics.ListData"%}',
                    "aaSorting": [[0, "asc"]],
                    "iDisplayLength": 50,
                    "aoColumns": [
                        {
                            "mDataProp": "ol.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {
                            "mDataProp": "o.full_tran_id", "title": "订单代码", "bSearchable": true,
                            "render": function (data, type, row) {
                                var delivery_person = row.o.delivery_person;
                                if (delivery_person === "") {
                                    delivery_person = "--";
                                }
                                return "<div class='div_tran_id'><a href='/order/detail/" + row.o.id + "' target='_blank'>" + row.order_code + "</a></div><div>" + row.stock_name + "</div><div>" + delivery_person + "</div>";
                            }
                        },
                        {
                            "mDataProp": "stock_name",
                            "title": "发货仓库",
                            "bSearchable": false,
                            "bSortable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_stock_name'></div>"
                            }
                        },
                        {
                            "mDataProp": "o.delivery_person",
                            "title": "发货人员",
                            "bSearchable": false,
                            "bSortable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_delivery_person'></div>"
                            }
                        },

                        {
                            "mDataProp": "company_name", "title": "物流公司", "bSearchable": false, "bSortable": false,
                            "render": function (data, type, row) {
                                var waybill_number = row.o.waybill_number;
                                if (waybill_number === "") {
                                    waybill_number = "--";
                                }
                                return "<div class='div_company_name'>" + row.company_name + "</div><div>" + row.mode_name + "</div><div>" + waybill_number + "</div>";
                            }
                        },
                        {
                            "mDataProp": "mode_name",
                            "title": "物流方式",
                            "bSearchable": false,
                            "bSortable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_mode_name'></div>"
                            }
                        },
                        {
                            "mDataProp": "waybill_number",
                            "title": "货运单号",
                            "bSearchable": false,
                            "bSortable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_waybill_number'></div>"
                            }
                        },

                        {
                            "mDataProp": "ol.length", "title": "长度", "bSearchable": false,
                            "render": function (data, type, row) {
                                var length = "--";
                                if (row.ol.length !== "" && row.ol.length !== 0) {
                                    length = dtFormatFloat1(row.ol.length) + " cm";
                                }

                                var width = "--";
                                if (row.ol.width !== "" && row.ol.width !== 0) {
                                    width = dtFormatFloat1(row.ol.width) + " cm";
                                }

                                var height = "--";
                                if (row.ol.height !== "" && row.ol.height !== 0) {
                                    height = dtFormatFloat1(row.ol.height) + " cm";
                                }

                                return "<div class='div_lenght'>" + length + "</div><div>" + width + "</div><div>" + height + "</div>";
                            }
                        },
                        {
                            "mDataProp": "ol.width", "title": "宽度", "bSearchable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_width'></div>";
                            }
                        },
                        {
                            "mDataProp": "ol.height", "title": "高度", "bSearchable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_height'></div>";
                            }
                        },

                        {
                            "mDataProp": "ol.weight", "title": "实际重量", "bSearchable": false,
                            "render": function (data, type, row) {
                                var actual_weight = row.ol.weight;
                                if (actual_weight !== "" && actual_weight !== 0) {
                                    actual_weight = dtFormatFloat1(actual_weight) + " kg";
                                }
                                else {
                                    actual_weight = "--";
                                }

                                var dim_weight = row.ol.dim_weight;
                                if (dim_weight !== "" && dim_weight !== 0) {
                                    dim_weight = dtFormatFloat1(dim_weight) + " kg";
                                }
                                else {
                                    dim_weight = "--";
                                }

                                return "<div class='div_actual_weight'>" + actual_weight + "</div><div>" + dim_weight + "</div><div>" + row.sfkltjz + "</div>";
                            }
                        },
                        {
                            "mDataProp": "ol.dim_weight", "title": "体积重量", "bSearchable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_dim_weight'></div>"
                            }
                        },
                        {
                            "mDataProp": "ol.weight", "title": "考虑体积重", "bSearchable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_sfkltjz'></div>";
                            }
                        },

                        {
                            "mDataProp": "products", "title": "订单商品", "bSearchable": false,
                            "render": function (data, type, row) {
                                var products_desc = "";
                                if (data && data.length && data.length > 0) {
                                    for (var i = 0; i < data.length; i++) {
                                        products_desc = products_desc + "<div>" + data[i] + "</div>"
                                    }
                                }
                                return products_desc;
                            }
                        },

                        {
                            "mDataProp": "o.paid_time", "title": "支付时间", "bSearchable": false,
                            "render": function (data, type, row) {
                                var paid_time = "--";
                                if (row.o.paid_time) {
                                    paid_time = row.o.paid_time;
                                }
                                var update_time = "--";
                                if (row.o.update_time) {
                                    update_time = row.o.update_time;
                                }
                                var shipped_time = "--";
                                if (row.o.shipped_time) {
                                    shipped_time = row.o.shipped_time;
                                }

                                return "<div class='div_paid_time'>" + paid_time + "</div><div>" + update_time + "</div><div>" + shipped_time + "</div>";
                            }
                        },
                        {
                            "mDataProp": "ol.update_time", "title": "修改时间", "bSearchable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_update_time'></div>";
                            }
                        },
                        {
                            "mDataProp": "o.shipped_time", "title": "发货时间", "bSearchable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_shipped_time'></div>";
                            }
                        }
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'stock_id', 'value': this_vm.page.stock_id});
                        aoData.push({'name': 'logistics_company_id', 'value': this_vm.page.logistics_company_id});
                        aoData.push({'name': 'batch_code', 'value': this_vm.page.batch_code});
                        aoData.push({'name': 'order_code_query', 'value': this_vm.page.order_code_query});
                        aoData.push({'name': 'begin_time_query', 'value': this_vm.page.begin_time_query});
                        aoData.push({'name': 'end_time_query', 'value': this_vm.page.end_time_query});

                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                hideMask();

                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    return;
                                }

                                fnCallback(data);


                                $("#orderLogisticsList div.div_tran_id").parent().css("width", "120px");
                                $("#orderLogisticsList div.div_stock_name").parent().css("display", "none");
                                $("#orderLogisticsList div.div_delivery_person").parent().css("display", "none");

                                $("#orderLogisticsList div.div_company_name").parent().css("width", "150px");
                                $("#orderLogisticsList div.div_mode_name").parent().css("display", "none");
                                $("#orderLogisticsList div.div_waybill_number").parent().css("display", "none");

                                $("#orderLogisticsList div.div_lenght").parent().css("width", "100px");
                                $("#orderLogisticsList div.div_width").parent().css("display", "none");
                                $("#orderLogisticsList div.div_height").parent().css("display", "none");

                                $("#orderLogisticsList div.div_actual_weight").parent().css("width", "100px");
                                $("#orderLogisticsList div.div_dim_weight").parent().css("display", "none");
                                $("#orderLogisticsList div.div_sfkltjz").parent().css("display", "none");

                                $("#orderLogisticsList div.div_paid_time").parent().css("width", "120px");
                                $("#orderLogisticsList div.div_update_time").parent().css("display", "none");
                                $("#orderLogisticsList div.div_shipped_time").parent().css("display", "none");
                            }
                        });
                    }
                }
            );

            $("#th_tran_id").before("<th id='th_tran_id_ext'></th>");
            $("#th_tran_id").wrap("<div id='div_tran_id'></div>");
            $("#th_stock_name").wrap("<div id='div_stock_name'></div>");
            $("#th_delivery_person").wrap("<div id='div_delivery_person'></div>");
            $("#th_tran_id_ext").append($("#div_tran_id")).append($("#div_stock_name")).append($("#div_delivery_person"));

            $("#th_company_name").before("<th id='th_company_name_ext'></th>");
            $("#th_company_name").wrap("<div id='div_company_name'></div>");
            $("#th_mode_name").wrap("<div id='div_mode_name'></div>");
            $("#th_waybill_number").wrap("<div id='div_waybill_number'></div>");
            $("#th_company_name_ext").append($("#div_company_name")).append($("#div_mode_name")).append($("#div_waybill_number"));

            $("#th_length").before("<th id='th_length_ext'></th>");
            $("#th_length").wrap("<div id='div_length'></div>");
            $("#th_width").wrap("<div id='div_width'></div>");
            $("#th_height").wrap("<div id='div_height'></div>");
            $("#th_length_ext").append($("#div_length")).append($("#div_width")).append($("#div_height"));

            $("#th_actual_weight").before("<th id='th_actual_weight_ext'></th>");
            $("#th_actual_weight").wrap("<div id='div_actual_weight'></div>");
            $("#th_dim_weight").wrap("<div id='div_dim_weight'></div>");
            $("#th_sfkltjz").wrap("<div id='div_sfkltjz'></div>");
            $("#th_actual_weight_ext").append($("#div_actual_weight")).append($("#div_dim_weight")).append($("#div_sfkltjz"));

            $("#th_paid_time").before("<th id='th_paid_time_ext'></th>");
            $("#th_paid_time").wrap($("<div id='div_paid_time'></div>"));
            $("#th_modify_time").wrap($("<div id='div_modify_time'></div>"));
            $("#th_shipped_time").wrap($("<div id='div_shipped_time'></div>"));
            $("#th_paid_time_ext").append($("#div_paid_time")).append($("#div_modify_time")).append($("#div_shipped_time"));

        },
        methods: {
            reloadList: function () {
                reloadList('#orderLogisticsList');
            },
            refreshList: function () {
                refreshList('#orderLogisticsList');
            },
            showOrderLogisticsDetail: function (id) {
                showMask("加载中...");
                $("#orderLogisticsDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpOrderLogistics.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#orderLogisticsDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveOrderLogistics: function () {
                showMask("提交中...");
                var form = $("#orderLogisticsDetailForm");
                var valid = validate(form, {
                    'detail.order_logistics.order_id': {
                        required: true, digits: true
                    },
                    'detail.order_logistics.address_id': {
                        required: true, digits: true
                    },
                    'detail.order_logistics.mode_id': {
                        required: true, digits: true
                    },
                    'detail.order_logistics.fee_rate_id': {
                        required: true, digits: true
                    },
                    'detail.order_logistics.length': {
                        required: true, number: true
                    },
                    'detail.order_logistics.width': {
                        required: true, number: true
                    },
                    'detail.order_logistics.height': {
                        required: true, number: true
                    },
                    'detail.order_logistics.weight': {
                        required: true, number: true
                    },
                    'detail.order_logistics.total_fee': {
                        required: true, number: true
                    },
                    'detail.order_logistics.actual_fee': {
                        required: true, number: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpOrderLogistics.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#orderLogisticsDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteOrderLogistics: function () {
                var id_list = [];
                $('#orderLogisticsList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpOrderLogistics.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            },
            exportOrderLogistics1: function () {
                $("#formExport1").submit();
            },
            exportOrderLogistics2: function () {
                $("#formExport2").submit();
            },
            showExportOrderLogisticsCompany: function () {
                showMask("加载中...");
                $("#orderLogisticsDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpOrderLogisticsCompanyExport.ExportOptionData" %}',
                        type: "POST",
                        success: function (result) {
                            hideMask();
                            if (result.success === false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.logistics_company_export_option = result;
                            $('#logisticsCompanyExportOptionDialog').modal(modalOptions);
                        }
                    }
                );
            },
            exportOrderLogisticsCompany: function () {
                if ((!vm.logistics_company_export_option.stock_id) || (!vm.logistics_company_export_option.company_code)) {
                    $.msg.error("请选择要导出的仓库和物流公司！");
                }
                $("#company_export_stock_id").val(vm.logistics_company_export_option.stock_id);
                $("#company_export_company_code").val(vm.logistics_company_export_option.company_code);
                $("#formLogisticsCompanyExport").submit();
                $('#logisticsCompanyExportOptionDialog').modal('hide');
            },
            selectStock: function (selected_stock_id) {
                vm.page.stock_id = selected_stock_id;
                vm.refreshList();
            },
            selectLogisticsCompany: function (selected_logistics_company_id) {
                vm.page.logistics_company_id = selected_logistics_company_id;
                vm.refreshList();
            },
            showLogisticsImport: function () {
                window.location.href = '{%url "ErpOrderLogisticsImport.Index" %}';
            }
        }
    });
</script>
{%footer%}
