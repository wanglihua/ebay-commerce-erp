<div class="modal fade" id="sendMessageToCustomersDialog">
    <div class="modal-dialog" style="width: 480px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                <h4 class="modal-title">发送消息</h4>
            </div>
            <div class="modal-body clearfix">
                <div class="row">
                    <div class="col-xs-12">
                        <form class="form-horizontal" role="form" id="sendMessageToCustomersForm">

                            <div class="row">
                                <div class="col-xs-12">
                                    <div class="form-group">
                                        <label for="message_subject" class="col-xs-2 control-label">主题</label>
                                        <div class="col-xs-10">
                                            <input id="message_subject" name="message_subject" class="input-sm form-control"/>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-xs-12">
                                    <div class="form-group">
                                        <label for="message_body" class="col-xs-2 control-label">消息</label>
                                        <div class="col-xs-10">
                                            <textarea id="message_body" name="message_body" rows="3" class="input-sm form-control"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success btn-sm" onclick="sendMessageToCustomers()">
                    <i class="ace-icon fa fa-floppy-o"></i>发送
                </button>
                <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                    <i class="ace-icon fa fa-times"></i>取消
                </button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    function sendMessageToCustomers() {
        var id_list = [];
        $('#orderList tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                id_list.push($(this).val());
            }
        });

        if (id_list.length === 0) {
            $.msg.alert("请选择数据！");
            return;
        }

        var form = $("#sendMessageToCustomersForm");
        var valid = validate(form, {
            'message_subject': {
                required: true, minlength: 2, maxlength: 200
            },
            'message_body': {
                required: true, maxlength: 500
            }
        });

        if (valid) {
            $.msg.confirm('确认要群发消息吗？', function () {
                showMask("提交中...");

                $.ajax({
                    url: '{%url "ErpOrderMessage.Send" %}',
                    type: "POST",
                    data: {
                        "id_list": id_list,
                        "subject": $("#message_subject").val(),
                        "body": $("#message_body").val()
                    },
                    success: function (data) {
                        hideMask();
                        if (data.success === true) {
                            $.msg.show(data.message);
                            $("#sendMessageToCustomersDialog").modal('hide');
                            // return;
                        }
                        else {
                            $.msg.error(data.message);
                            //return;
                        }
                    }
                });
            });
        }
    }
</script>
