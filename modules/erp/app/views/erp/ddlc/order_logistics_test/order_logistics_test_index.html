{%header "订单物流" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddlc-menu">订单流程</li>
            <li class="active" data-menu="ddlc-order-logistics-test-menu">订单物流匹配调试</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12">
                <span style="color: red;">
                    注意，在这个界面上任何状态订单都可以进行匹配物流调试，而且匹配后订单的状态都会变为待配货。
                </span>
            </div>
            <div class="col-xs-12" style="padding: 0;">
                <label for="order_codes">订单编号</label>
                <input class="input-sm" id="order_codes" name="order_codes" placeholder="订单编号" type="text" v-model="page.order_codes" style="width: 250px;"/>
                <button class="btn btn-mini btn-primary" @click="matchLogistics()">
                    &nbsp;<i class="ace-icon fa fa-search"></i>匹配物流
                </button>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "page": {
                "order_codes": ""
            }
        },
        mounted: function () {
        },
        methods: {
            matchLogistics: function () {
                showMask("匹配物流中...");
                $.ajax({
                        url: '{%url "ErpOrderLogisticsTest.Match" %}',
                        type: "POST",
                        data: {"order_codes": vm.page.order_codes},
                        success: function (result) {
                            hideMask();
                            if (result.success === false) {
                                $.msg.error(result.message);
                            } else {
                                $.msg.show(result.message);
                            }
                        }
                    }
                );
            }
        }
    });
</script>
{%footer%}
