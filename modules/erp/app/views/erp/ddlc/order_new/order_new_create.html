{% site_header "订单创建" . %}
<div class="main-container" id="main-container">
    <form id="orderForm" action="#" method="post">
        <div id="order_detail" style="width: 1024px;margin-left: auto;margin-right: auto;">
            <!-- 订单信息 -->
            <div class="widget-box">
                <div class="widget-header">
                    <h4 class="smaller">订单信息</h4>
                </div>
                <div class="widget-body">
                    <div class="widget-main">
                        <div class="row">
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="order_code" class="col-xs-4 control-label">订单编号：</label>
                                    <div class="col-xs-8">
                                        <input id="order_code" name="detail.order.code" type="text" class="input-sm form-control" v-model="detail.order.code"/>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="order_created_time" class="col-xs-4 control-label">建单时间：</label>
                                    <div class="col-xs-8">
                                        <input id="order_created_time" name="detail.order.created_time" type="text" class="input-sm form-control" v-model="detail.order.created_time"/>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="order_status_id" class="col-xs-4 control-label">状态：</label>
                                    <div class="col-xs-8">
                                        <select id="order_status_id" name="detail.order.status_id" class="input-sm form-control" v-model.number="detail.order.status_id">
                                            <template v-for="status in create_data.status_list">
                                                <option :value="status.id">{{status.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="order_type_id" class="col-xs-4 control-label">订单类型：</label>
                                    <div class="col-xs-8">
                                        <select id="order_type_id" name="detail.order.type_id" class="input-sm form-control" v-model.number="detail.order.type_id">
                                            <template v-for="type in create_data.type_list">
                                                <option :value="type.id">{{type.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="order_number" class="col-xs-4 control-label">订单代码：</label>
                                    <div class="col-xs-8">
                                        <input id="order_number" name="detail.order.full_tran_id" type="text" class="input-sm form-control" v-model="detail.order.full_tran_id"/>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="order_paid_time" class="col-xs-4 control-label">支付时间：</label>
                                    <div class="col-xs-8">
                                        <input id="order_paid_time" name="detail.order.paid_time" type="text" class="input-sm form-control" v-model="detail.order.paid_time"/>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="order_hold_type_id" class="col-xs-4 control-label">hold类型：</label>
                                    <div class="col-xs-8">
                                        <select id="order_hold_type_id" name="detail.order.hold_type_id" class="input-sm form-control" v-model.number="detail.order.hold_type_id">
                                            <option :value="0">无Hold</option>
                                            <template v-for="hold_type in create_data.hold_type_list">
                                                <option :value="hold_type.id">{{hold_type.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="amount_paid" class="col-xs-4 control-label">收款澳币：</label>
                                    <div class="col-xs-8">
                                        <input id="amount_paid" name="detail.order.amount_paid" class="input-sm form-control" v-model.number="detail.order.amount_paid"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 客户信息 -->
            <div class="widget-box">
                <div class="widget-header">
                    <h4 class="smaller">客户信息</h4>
                </div>
                <div class="widget-body">
                    <div class="widget-main">
                        <div class="row">
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="order_shop_id" class="col-xs-4 control-label">客户来源：</label>
                                    <div class="col-xs-8">
                                        <select id="order_shop_id" name="detail.order.shop_id" class="input-sm form-control" v-model.number="detail.order.shop_id">
                                            <template v-for="shop in create_data.shop_list">
                                                <option :value="shop.id">{{shop.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="buyer_user_id" class="col-xs-4 control-label">买家帐号：</label>
                                    <div class="col-xs-8">
                                        <input id="buyer_user_id" name="detail.order.buyer_user_id" type="text" class="input-sm form-control" v-model="detail.order.buyer_user_id"/>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="buyer_user_name" class="col-xs-4 control-label">客户姓名：</label>
                                    <div class="col-xs-8">
                                        <input id="buyer_user_name" name="detail.order.buyer_user_name" type="text" class="input-sm form-control" v-model="detail.shipping_address.name"/>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="country" class="col-xs-4 control-label">国家代码：</label>
                                    <div class="col-xs-8">
                                        <input id="country" name="detail.shipping_address.country" type="text" class="input-sm form-control" v-model="detail.shipping_address.country"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="phone" class="col-xs-4 control-label">联系电话：</label>
                                    <div class="col-xs-8">
                                        <input id="phone" name="detail.shipping_address.phone" type="text" class="input-sm form-control" v-model="detail.shipping_address.phone"/>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-6">
                                <div class="form-group">
                                    <label for="order_buyer_email" class="col-xs-2 control-label">电子邮件：</label>
                                    <div class="col-xs-10">
                                        <input id="order_buyer_email" name="detail.order.buyer_email" class="input-sm form-control" type="text" v-model="detail.order.buyer_email"/>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="country_name" class="col-xs-4 control-label">国家名称：</label>
                                    <div class="col-xs-8">
                                        <input id="country_name" name="detail.shipping_address.country_name" type="text" class="input-sm form-control" v-model="detail.shipping_address.country_name"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="province" class="col-xs-4 control-label">State</label>
                                    <div class="col-xs-8">
                                        <input id="province" name="detail.shipping_address.province" type="text" class="input-sm form-control" v-model="detail.shipping_address.province"/>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="city_name" class="col-xs-4 control-label">City</label>
                                    <div class="col-xs-8">
                                        <input id="city_name" name="detail.shipping_address.city_name" type="text" class="input-sm form-control" v-model="detail.shipping_address.city_name"/>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-6">
                                <div class="form-group">
                                    <label for="street1" class="col-xs-2 control-label">Street1</label>
                                    <div class="col-xs-10">
                                        <input id="street1" name="detail.shipping_address.street1" type="text" class="input-sm form-control" v-model="detail.shipping_address.street1"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-xs-6">
                                <div class="form-group">
                                    <label for="street2" class="col-xs-2 control-label">Street2</label>
                                    <div class="col-xs-10">
                                        <input id="street2" name="detail.shipping_address.street2" type="text" class="input-sm form-control" v-model="detail.shipping_address.street2"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="postal_code" class="col-xs-4 control-label">Post Code</label>
                                    <div class="col-xs-8">
                                        <input id="postal_code" name="detail.shipping_address.postal_code" type="text" class="input-sm form-control" v-model="detail.shipping_address.postal_code"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PICK UP 信息 -->
            <div class="widget-box" v-if="detail.order.hold_type_id != 0">
                <div class="widget-header">
                    <h4 class="smaller">PICK UP 信息</h4>
                </div>
                <div class="widget-body">
                    <div class="widget-main">
                        <div class="row">
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="creator" class="col-xs-4 control-label">建单人员：</label>
                                    <div class="col-xs-8">
                                        <input id="creator" name="creator" type="text" class="input-sm form-control" disabled="disabled" v-model="create_data.creator"/>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="payee" class="col-xs-4 control-label">收款人员：</label>
                                    <div class="col-xs-8">
                                        <select id="payee" name="payee" class="input-sm form-control" v-model.number="detail.pickup_info.payee_id">
                                            <template v-for="user in create_data.user_list">
                                                <option :value="user.id">{{user.login_name}}（{{user.nick_name}}）</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="is_paid" class="col-xs-4 control-label">已收款：</label>
                                    <div class="col-xs-8">
                                        <select id="is_paid" name="is_paid" class="input-sm form-control" v-model.number="detail.pickup_info.is_paid">
                                            <option :value="0">否</option>
                                            <option :value="1">是</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="pay_method_id" class="col-xs-4 control-label">收款方式：</label>
                                    <div class="col-xs-8">
                                        <select id="pay_method_id" name="pay_method_id" class="input-sm form-control" v-model.number="detail.pickup_info.pay_method_id">
                                            <template v-for="pay_method in create_data.pickup_pay_method_list">
                                                <option :value="pay_method.id">{{pay_method.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="stock_id" class="col-xs-4 control-label">发货仓库：</label>
                                    <div class="col-xs-8">
                                        <select id="stock_id" name="stock_id" class="input-sm form-control" v-model.number="detail.stock_id">
                                            <template v-for="stock in create_data.stock_list">
                                                <option :value="stock.id">{{stock.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="widget-box" style="border-style:none;">
                <div class="widget-body">
                    <div class="widget-main">
                        <div class="wizard-actions">
                            <button class="btn btn-sm btn-primary" onclick="saveOrder();">
                                <i class="ace-icon fa fa-floppy-o"></i>
                                保存
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript">
    $(function () {
        $('#order_created_time').datetimepicker({
            locale: "zh-cn"
        });

        $('#order_paid_time').datetimepicker({
            locale: "zh-cn"
        });

        loadCreateData();
    });

    function loadCreateData() {
        $.ajax({
            "dataType": 'json',
            "url": '{% url "ErpOrderNew.CreateData"%}',
            "success": function (data) {
                if (data.success === false) {
                    $.msg.error(data.message);
                    return;
                }
                vm.create_data = data;
                vm.detail.stock_id = data.stock_id;
            }
        });
    }

    var vm = new Vue({
        el: "#order_detail",
        data: {
            "detail": {
                "order": {
                    "hold_type_id": 0
                },
                "shipping_address": {},
                "pickup_info": {},
                "stock_id": 0
            },
            "create_data": {
                "type_list": [],
                "status_list": [],
                "hold_type_list": [],
                "shop_list": [],
                "pickup_pay_method_list": [],
                "user_list": [],
                "creator": []
            }
        },
        methods: {
            format_amount: function (amount) {
                return dtFormatFloat(amount);
            }
        }
    });

    function saveOrder() {
        showMask("提交中...");
        var form = $("#orderForm");
        var valid = validate(form, {
            'detail.order.code': {
                required: true
            },
            'detail.order.created_time': {
                required: true
            },
            'detail.order.status_id': {
                required: true
            },
            'detail.order.type_id': {
                required: true
            },
            'detail.order.full_tran_id': {
                required: true
            },
            'detail.order.paid_time': {
                required: false
            },
            'detail.order.hold_type_id': {
                required: true
            },
            'detail.order.shop_id': {
                required: true
            },
            'detail.order.buyer_user_id': {
                required: false
            },
            'detail.order.amount_paid': {
                required: false, number: true
            },
            'detail.shipping_address.name': {
                required: true
            },
            'detail.shipping_address.country': {
                required: true
            },
            'detail.shipping_address.phone': {
                required: false
            },
            'detail.order.buyer_email': {
                required: false
            },
            'detail.shipping_address.country_name': {
                required: true
            },
            'detail.shipping_address.province': {
                required: true
            },
            'detail.shipping_address.city_name': {
                required: true
            },
            'detail.shipping_address.street1': {
                required: true
            },
            'detail.shipping_address.street2': {
                required: false
            },
            'detail.shipping_address.postal_code': {
                required: true
            }
        });

        if (!valid) {
            hideMask();
        } else {

            vm.detail.order.created_time = $("#order_created_time").val();
            vm.detail.order.paid_time = $("#order_paid_time").val();

            $.ajax({
                    url: '{%url "ErpOrderNew.Save"%}',
                    type: "POST",
                    processData: false,
                    contentType: 'application/json',
                    data: JSON.stringify(vm.detail),
                    success: function (data) {
                        hideMask();
                        if (data.success === false) {
                            $.msg.error(data.message);
                            //return;
                        }
                        else {
                            $.msg.show(data.message);
                            //重定向至 订单详细
                            //window.location.href = "/order/detail/" + data.order_id;
                            setTimeout(function () {
                                window.location.href = '/order/detail/' + data.order_id;
                            }, 1000);
                            //return;
                        }
                    }
                }
            );
        }
    }

</script>
{% site_footer %}
