{% site_header "订单创建" . %}
<div class="main-container" id="main-container">
    <div id="order_detail" style="width: 1024px;margin-left: auto;margin-right: auto;">
        <!-- 订单信息 -->
        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">订单信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="order_code" class="col-xs-4 control-label">订单编号：</label>
                                <div class="col-xs-8">
                                    <input id="order_code" name="order_code" type="text" class="input-sm form-control" v-model="detail.order.code"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="order_created_time" class="col-xs-4 control-label">建单时间：</label>
                                <div class="col-xs-8">
                                    <input id="order_created_time" name="created_time" type="text" class="input-sm form-control" v-model="detail.order.created_time"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="order_status_id" class="col-xs-4 control-label">状态：</label>
                                <div class="col-xs-8">
                                    <select id="order_status_id" name="order_status_id" class="input-sm form-control" v-model.number="detail.order.status_id">
                                        <template v-for="status in create_data.status_list">
                                            <option :value="status.id">{{status.name}}</option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="order_type_id" class="col-xs-4 control-label">订单类型：</label>
                                <div class="col-xs-8">
                                    <select id="order_type_id" name="order_type_id" class="input-sm form-control" v-model.number="detail.order.type_id">
                                        <template v-for="type in create_data.type_list">
                                            <option :value="type.id">{{type.name}}</option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="order_number" class="col-xs-4 control-label">订单代码：</label>
                                <div class="col-xs-8">
                                    <input id="order_number" name="order_number" type="text" class="input-sm form-control" v-model="detail.order.full_tran_id"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="order_paid_time" class="col-xs-4 control-label">支付时间：</label>
                                <div class="col-xs-8">
                                    <input id="order_paid_time" name="paid_time" type="text" class="input-sm form-control" v-model="detail.order.paid_time"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="order_hold_type_id" class="col-xs-4 control-label">hold类型：</label>
                                <div class="col-xs-8">
                                    <select id="order_hold_type_id" name="order_hold_type_id" class="input-sm form-control" v-model.number="detail.order.hold_type_id">
                                        <option :value="0">无Hold</option>
                                        <template v-for="hold_type in create_data.hold_type_list">
                                            <option :value="hold_type.id">{{hold_type.name}}</option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- 客户信息 -->
        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">客户信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="order_shop_id" class="col-xs-4 control-label">客户来源：</label>
                                <div class="col-xs-8">
                                    <select id="order_shop_id" name="order_shop_id" class="input-sm form-control" v-model.number="detail.order.shop_id">
                                        <template v-for="shop in create_data.shop_list">
                                            <option :value="shop.id">{{shop.name}}</option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="buyer_user_id" class="col-xs-4 control-label">买家帐号：</label>
                                <div class="col-xs-8">
                                    <input id="buyer_user_id" name="detail.order.buyer_user_id" type="text" class="input-sm form-control" v-model="detail.order.buyer_user_id"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="buyer_user_name" class="col-xs-4 control-label">客户姓名：</label>
                                <div class="col-xs-8">
                                    <input id="buyer_user_name" name="detail.order.buyer_user_name" type="text" class="input-sm form-control" v-model="detail.shipping_address.name"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="country" class="col-xs-4 control-label">国家代码：</label>
                                <div class="col-xs-8">
                                    <input id="country" name="detail.shipping_address.country" type="text" class="input-sm form-control" v-model="detail.shipping_address.country"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="phone" class="col-xs-4 control-label">联系电话：</label>
                                <div class="col-xs-8">
                                    <input id="phone" name="detail.shipping_address.country_name" type="text" class="input-sm form-control" v-model="detail.shipping_address.phone"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-6">
                            <div class="form-group">
                                <label for="order_buyer_email" class="col-xs-2 control-label">电子邮件：</label>
                                <div class="col-xs-10">
                                    <input id="order_buyer_email" name="order_buyer_email" class="input-sm form-control" type="text" v-model="detail.order.buyer_email"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="country_name" class="col-xs-4 control-label">国家名称：</label>
                                <div class="col-xs-8">
                                    <input id="country_name" name="detail.shipping_address.country_name" type="text" class="input-sm form-control" v-model="detail.shipping_address.country_name"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="province" class="col-xs-4 control-label">State</label>
                                <div class="col-xs-8">
                                    <input id="province" name="detail.shipping_address.province" type="text" class="input-sm form-control" v-model="detail.shipping_address.province"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="city_name" class="col-xs-4 control-label">City</label>
                                <div class="col-xs-8">
                                    <input id="city_name" name="detail.shipping_address.city_name" type="text" class="input-sm form-control" v-model="detail.shipping_address.city_name"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-6">
                            <div class="form-group">
                                <label for="street1" class="col-xs-2 control-label">Street1</label>
                                <div class="col-xs-10">
                                    <input id="street1" name="detail.shipping_address.street1" type="text" class="input-sm form-control" v-model="detail.shipping_address.street1"/>
                                </div>
                            </div>
                        </div>

                        <div class="col-xs-6">
                            <div class="form-group">
                                <label for="street2" class="col-xs-2 control-label">Street2</label>
                                <div class="col-xs-10">
                                    <input id="street2" name="detail.shipping_address.street2" type="text" class="input-sm form-control" v-model="detail.shipping_address.street2"/>
                                </div>
                            </div>
                        </div>

                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="postal_code" class="col-xs-4 control-label">Post Code</label>
                                <div class="col-xs-8">
                                    <input id="postal_code" name="detail.shipping_address.postal_code" type="text" class="input-sm form-control" v-model="detail.shipping_address.postal_code"/>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PICK UP 信息 -->
        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">PICK UP 信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="creator" class="col-xs-4 control-label">建单人员：</label>
                                <div class="col-xs-8">
                                    <input id="creator" name="creator" type="text" class="input-sm form-control" v-model="detail.pickup_info.creator"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="payee" class="col-xs-4 control-label">收款人员：</label>
                                <div class="col-xs-8">
                                    <input id="payee" name="payee" type="text" class="input-sm form-control" v-model="detail.pickup_info.payee"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="is_paid" class="col-xs-4 control-label">已收款：</label>
                                <div class="col-xs-8">
                                    <select id="is_paid" name="is_paid" class="input-sm form-control" v-model.number="detail.pickup_info.is_paid">
                                        <option :value="0">否</option>
                                        <option :value="1">是</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="pay_method_id" class="col-xs-4 control-label">收款方式：</label>
                                <div class="col-xs-8">
                                    <select id="pay_method_id" name="pay_method_id" class="input-sm form-control" v-model.number="detail.pickup_info.pay_method_id">
                                        <template v-for="pay_method in create_data.pay_method_list">
                                            <option :value="pay_method.id">{{pay_method.name}}</option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box" style="border-style:none;">
            <div class="widget-body">
                <div class="widget-main">
                    <div class="wizard-actions">
                        <button class="btn btn-sm btn-primary" onclick="">
                            <i class="ace-icon fa fa-floppy-o"></i>
                            保存
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $(function () {
        $('#order_created_time').datetimepicker({
            locale: "zh-cn"
        });

        $('#order_paid_time').datetimepicker({
            locale: "zh-cn"
        });

        loadCreateData();
    });

    function loadCreateData() {
        $.ajax({
            "dataType": 'json',
            "url": '{% url "ErpOrderNew.CreateData"%}',
            "success": function (data) {
                if (data.success === false) {
                    $.msg.error(data.message);
                    return;
                }
                vm.create_data = data;
            }
        });
    }

    var vm = new Vue({
        el: "#order_detail",
        data: {
            "detail": {
                "order": {},
                "shipping_address": {},
                "pickup_info": {}
            },
            "create_data": {
                "type_list": [],
                "status_list": [],
                "hold_type_list": [],
                "shop_list": []
            }
        },
        methods: {
            format_amount: function (amount) {
                return dtFormatFloat(amount);
            },
            show_address_edit: function () {
                $("#orderShippingAddressDetailDialog").modal(modalOptions);
            },
            saveOrderShippingAddress: function () {
                showMask("提交中...");
                var form = $("#orderShippingAddressDetailForm");
                var valid = validate(form, {
                    'detail.shipping_address.name': {
                        required: true
                    },
                    'detail.shipping_address.street1': {
                        required: true
                    },
                    'detail.shipping_address.city_name': {
                        required: true
                    },
                    'detail.shipping_address.province': {
                        required: true
                    },
                    'detail.shipping_address.country_name': {
                        required: true
                    },
                    'detail.shipping_address.postal_code': {
                        required: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpOrderShippingAddress.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail.shipping_address),
                            success: function (data) {
                                hideMask();
                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#orderShippingAddressDetailDialog').modal('hide');
                                    load_order_detail();
                                    //return;
                                }
                            }
                        }
                    );
                }
            }
        }
    });

</script>
{% site_footer %}
