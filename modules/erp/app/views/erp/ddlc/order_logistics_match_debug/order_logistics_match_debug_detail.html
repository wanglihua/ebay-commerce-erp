{%header "订单物流匹配调试" .%}
<div id="page">
   <div class="breadcrumbs" id="breadcrumbs">
       <ul class="breadcrumb">
           <li>
               <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
           </li>
           <li class="parent" data-menu="erp-menu">ERP</li>
           <li class="active" data-menu="erp-orderlogisticsmatchdebug-menu">订单物流匹配调试</li>
       </ul>
   </div>
   <div class="page-content">
       <div class="row">
           <div class="col-xs-12" style="padding: 0;">
               <div class="gridToolBar clearfix">
                   <button class="btn btn-primary btn-sm" @click="reloadList('#orderLogisticsMatchDebugList')">
                       <i class="ace-icon fa fa-refresh"></i>
                       刷新
                   </button>
                   <button class="btn btn-success btn-sm" @click="showOrderLogisticsMatchDebugDetail(0)">
                       <i class="ace-icon fa fa-plus"></i>
                       新增
                   </button>
                   <button class="btn btn-danger btn-sm" @click="deleteOrderLogisticsMatchDebug()">
                       <i class="ace-icon fa fa-trash-o"></i>
                       删除
                   </button>
               </div>
               <div>
                   <table id="orderLogisticsMatchDebugList" class="table table-striped table-bordered table-hover"></table>
               </div>
           </div>
       </div>
   </div>
    <div class="modal fade" id="orderLogisticsMatchDebugDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">订单物流匹配调试详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="orderLogisticsMatchDebugDetailForm">
                                <input id="order_logistics_match_debug_id" name="detail.match_debug.id" type="hidden" v-model.number="detail.match_debug.id"/>
                                <input id="order_logistics_match_debug_version" name="detail.match_debug.version" type="hidden" v-model.number="detail.match_debug.version"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="order_id" class="col-xs-2 control-label">订单</label>
                                            <div class="col-xs-10">
                                                <input id="order_id" name="detail.match_debug.order_id" type="text" class="input-sm form-control" v-model.number="detail.match_debug.order_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="order_code" class="col-xs-2 control-label">订单编号</label>
                                            <div class="col-xs-10">
                                                <input id="order_code" name="detail.match_debug.order_code" type="text" class="input-sm form-control" v-model="detail.match_debug.order_code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="address_id" class="col-xs-2 control-label">物流地址</label>
                                            <div class="col-xs-10">
                                                <input id="address_id" name="detail.match_debug.address_id" type="text" class="input-sm form-control" v-model.number="detail.match_debug.address_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="company_id" class="col-xs-2 control-label">物流公司</label>
                                            <div class="col-xs-10">
                                                <input id="company_id" name="detail.match_debug.company_id" type="text" class="input-sm form-control" v-model.number="detail.match_debug.company_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="stock_id" class="col-xs-2 control-label">发货仓库</label>
                                            <div class="col-xs-10">
                                                <input id="stock_id" name="detail.match_debug.stock_id" type="text" class="input-sm form-control" v-model.number="detail.match_debug.stock_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="mode_id" class="col-xs-2 control-label">物流方式</label>
                                            <div class="col-xs-10">
                                                <input id="mode_id" name="detail.match_debug.mode_id" type="text" class="input-sm form-control" v-model.number="detail.match_debug.mode_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="fee_rate_id" class="col-xs-2 control-label">物流费率</label>
                                            <div class="col-xs-10">
                                                <input id="fee_rate_id" name="detail.match_debug.fee_rate_id" type="text" class="input-sm form-control" v-model.number="detail.match_debug.fee_rate_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="total_fee" class="col-xs-2 control-label">物流费用</label>
                                            <div class="col-xs-10">
                                                <input id="total_fee" name="detail.match_debug.total_fee" type="text" class="input-sm form-control" v-model.number="detail.match_debug.total_fee"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="match_result" class="col-xs-2 control-label">匹配结果</label>
                                            <div class="col-xs-10">
                                                <input id="match_result" name="detail.match_debug.match_result" type="text" class="input-sm form-control" v-model="detail.match_debug.match_result"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="match_debug" class="col-xs-2 control-label">匹配调试信息</label>
                                            <div class="col-xs-10">
                                                <input id="match_debug" name="detail.match_debug.match_debug" type="text" class="input-sm form-control" v-model="detail.match_debug.match_debug"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveOrderLogisticsMatchDebug()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "match_debug": {}
            }
        },
        mounted: function () {
            initDataTable(
                    '#orderLogisticsMatchDebugList',
                    {
                        "sAjaxSource": '{%url "ErpOrderLogisticsMatchDebug.ListData"%}',
                        "aaSorting": [[1, "asc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "order_id", "title": "订单", "bSearchable": false },
                            {"mDataProp": "order_code", "title": "订单编号", "bSearchable": true },
                            {"mDataProp": "address_id", "title": "物流地址", "bSearchable": false },
                            {"mDataProp": "company_id", "title": "物流公司", "bSearchable": false },
                            {"mDataProp": "stock_id", "title": "发货仓库", "bSearchable": false },
                            {"mDataProp": "mode_id", "title": "物流方式", "bSearchable": false },
                            {"mDataProp": "fee_rate_id", "title": "物流费率", "bSearchable": false },
                            {"mDataProp": "total_fee", "title": "物流费用", "bSearchable": false },
                            {"mDataProp": "match_result", "title": "匹配结果", "bSearchable": true },
                            {"mDataProp": "match_debug", "title": "匹配调试信息", "bSearchable": true },
                            {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120 },
                            {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120 }
                        ]
                   }
            );

            $('#orderLogisticsMatchDebugList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showOrderLogisticsMatchDebugDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#orderLogisticsMatchDebugList');
            },
            showOrderLogisticsMatchDebugDetail: function (id) {
                showMask("加载中...");
                $("#orderLogisticsMatchDebugDetailForm").clearValidation();
                $.ajax({
                           url: '{%url "ErpOrderLogisticsMatchDebug.DetailData" %}',
                           type: "POST",
                           data: {
                               "id": id
                           },
                           success: function (result) {
                               hideMask();
                               if (result.success == false) {
                                   $.msg.error(result.message);
                                   return;
                               }
                               vm.detail = result;
                               $('#orderLogisticsMatchDebugDetailDialog').modal(modalOptions);
                           }
                       }
                );
            },
            saveOrderLogisticsMatchDebug: function () {
                showMask("提交中...");
                var form = $("#orderLogisticsMatchDebugDetailForm");
                var valid = validate(form, {  
                    'detail.match_debug.order_id': {
                        required: true, digits: true
                    },
                    'detail.match_debug.order_code': {
                        required: true
                    },
                    'detail.match_debug.address_id': {
                        required: true, digits: true
                    },
                    'detail.match_debug.company_id': {
                        required: true, digits: true
                    },
                    'detail.match_debug.stock_id': {
                        required: true, digits: true
                    },
                    'detail.match_debug.mode_id': {
                        required: true, digits: true
                    },
                    'detail.match_debug.fee_rate_id': {
                        required: true, digits: true
                    },
                    'detail.match_debug.total_fee': {
                        required: true, number: true
                    },
                    'detail.match_debug.match_result': {
                        required: true
                    },
                    'detail.match_debug.match_debug': {
                        required: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                               url: '{%url "ErpOrderLogisticsMatchDebug.Save"%}',
                               type: "POST",
                               processData: false,
                               contentType: 'application/json',
                               data: JSON.stringify(vm.detail),
                               success: function (data) {
                                   hideMask();
                                   if (data.success == false) {
                                       $.msg.error(data.message);
                                       //return;
                                   }
                                   else {
                                       $.msg.show(data.message);
                                       $('#orderLogisticsMatchDebugDetailDialog').modal('hide');
                                       vm.reloadList();
                                       //return;
                                   }
                               }
                           }
                    );
                }
            },
            deleteOrderLogisticsMatchDebug: function () {
                var id_list = [];
                $('#orderLogisticsMatchDebugList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                               url: '{%url "ErpOrderLogisticsMatchDebug.Delete"%}',
                               type: "POST",
                               data: {"id_list": id_list},
                               success: function (data) {
                                   if (data.success == false) {
                                       $.msg.error(data.message);
                                       return;
                                   }
                                   else {
                                       $.msg.show(data.message);
                                   }
                                   vm.reloadList();
                               }
                           });
                });
            }
        }
    });
</script>
{%footer%}
