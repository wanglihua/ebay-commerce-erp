{%header "订单物流匹配调试" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="erp-menu">订单流程</li>
            <li class="active" data-menu="erp-order-logistics-match-debug-menu">订单物流匹配调试</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#orderLogisticsMatchDebugList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div id="query" class="col-xs-12" style="line-height: 28px;">
                    <div class="col-xs-12" style="margin-top: 20px;margin-bottom: 20px;">
                        <div style="float: left;">
                            <label for="order_code_query">订单编号查询</label>
                            <input id="order_code_query" name="order_code_query" style="width: 180px;height:30px;"/>
                            <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" @click="search()">
                                &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                            </button>
                        </div>
                        <div style="clear: both;"></div>
                    </div>
                </div>
                <div>
                    <table id="orderLogisticsMatchDebugList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "match_debug": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#orderLogisticsMatchDebugList',
                {
                    "iDisplayLength": 100,
                    "sAjaxSource": '{%url "ErpOrderLogisticsMatchDebug.ListData"%}',
                    "aaSorting": [[7, "asc"]],
                    "aoColumns": [
                        {"mDataProp": "md.order_code", "title": "订单编号", "bSearchable": true, "width": 120},
                        {"mDataProp": "s.name", "title": "发货仓库", "bSearchable": true, "width": 120},
                        {"mDataProp": "osa.postal_code", "title": "地址邮编", "bSearchable": true, "width": 80},
                        {"mDataProp": "lc.name", "title": "物流公司", "bSearchable": true, "width": 90},
                        {"mDataProp": "lm.name", "title": "物流方式", "bSearchable": true, "width": 240},
                        {"mDataProp": "lfr.postcode", "title": "费率邮编", "bSearchable": true, "width": 100},
                        {"mDataProp": "md.total_fee", "title": "物流费用", "bSearchable": false, "width": 100},
                        {"mDataProp": "md.total_cost", "title": "成本费用", "bSearchable": false, "width": 100},
                        {"mDataProp": "md.match_result", "title": "匹配结果", "bSearchable": true},
                        {"mDataProp": "md.create_time", "title": "匹配时间", "bSearchable": false, "width": 120},
                        {
                            "mDataProp": "md.id", "title": "操作", "bSearchable": false, "width": 120,
                            "render": function (data, type, row) {
                                return "<a href='/erp/order/logistics/match/debug/detail/" + data + "'>查看详细</a>";
                            }
                        }
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");
                        aoData.push({'name': 'order_code_query', 'value': $("#order_code_query").val()});

                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                hideMask();

                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    return;
                                }

                                fnCallback(data);
                            }
                        });
                    }
                }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#orderLogisticsMatchDebugList');
            },
            search: function () {
                reloadList('#orderLogisticsMatchDebugList');
            }
        }
    });
</script>
{%footer%}
