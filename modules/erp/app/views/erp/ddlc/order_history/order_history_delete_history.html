{%header "订单删除日志" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddlc-menu">订单流程</li>
            <li class="active" data-menu="ddlc-order-import-menu"><a href='{% url "ErpOrderImport.Index" %}'>订单导入</a></li>
            <li>订单删除日志</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#orderHistoryList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div class="row" style="margin-top: 15px;margin-bottom: 5px;">
                    <div id="query" class="col-xs-12 query">
                        <label class="control-label no-padding-right" for="order_code_query">订单编号</label>
                        <input id="order_code_query" class="input-sm" name="order_code_query" placeholder="订单编号查询" type="text" style="width: 150px;"/>
                        <button class="btn btn-mini btn-primary" @click="refreshList()">
                            &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                        </button>
                    </div>
                </div>
                <div>
                    <table id="orderHistoryList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">

    $(function () {
        initDataTable(
            '#orderHistoryList',
            {
                "sAjaxSource": '{%url "ErpOrderHistory.DeleteHistoryListData"%}',
                "aaSorting": [[3, "desc"]],
                "aoColumns": [
                    {"mDataProp": "order_code", "title": "订单编码", "bSearchable": true, "bSortable": false, "width": 120},
                    {"mDataProp": "status_name", "title": "状态名称", "bSearchable": true, "bSortable": false, "width": 120},
                    {"mDataProp": "description", "title": "描述", "bSearchable": true, "bSortable": false},
                    {"mDataProp": "create_time", "title": "操作时间", "bSearchable": false, "width": 120}
                ],
                "fnServerData": function (sSource, aoData, fnCallback) {
                    showMask("数据加载中，请稍候");

                    aoData.push({'name': 'order_code_query', 'value': $("#order_code_query").val()});

                    $.ajax({
                        "dataType": 'json',
                        "url": sSource,
                        "data": aoData,
                        "success": function (data) {
                            hideMask();

                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }

                            fnCallback(data);
                        }
                    });
                }
            }
        );

    });

    var vm = new Vue({
        el: "#page",
        data: {},
        mounted: function () {
        },
        methods: {
            reloadList: function () {
                reloadList('#orderHistoryList');
            },
            refreshList: function () {
                refreshList('#orderHistoryList');
            }
        }
    });
</script>
{%footer%}
