{%header "Hold订单" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddlc-menu">订单流程</li>
            <li class="active" data-menu="ddlc-order-processed-hold-menu">已处理Hold订单</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#orderList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>

                    <button class="btn btn-purple btn-sm" @click="daiPeiHuo()">
                        <i class="ace-icon fa fa-shopping-basket"></i>
                        待配货
                    </button>

                    {% if .is_button_quxiao_visible %}
                    <button class="btn btn-warning btn-sm" @click="quXiao()">
                        <i class="ace-icon fa fa-calendar-times-o"></i>
                        取消
                    </button>
                    {% end %}
                    <button class="btn btn-info btn-sm" @click="exportOrderCode()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出订单编码代码
                    </button>

                    <div class="btn-group">
                        <button data-toggle="dropdown" class="btn btn-info btn-sm dropdown-toggle" aria-expanded="false" style="border-width: 4px;">
                            <i class="ace-icon fa fa-tag"></i><span id="dataFilter" data-status="0">应用标签</span>
                            <span class="ace-icon fa fa-caret-down icon-on-right"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-danger">
                            <li>
                                <a @click="apply_order_tag(0)" style="cursor: pointer;">取消标签</a>
                            </li>
                            <template v-for="order_tag in page.order_tag_list">
                                <li :style="'background-color:' + order_tag.bg_color + ';'">
                                    <a @click="apply_order_tag(order_tag.id)" style="cursor: pointer;">{{order_tag.name}}</a>
                                </li>
                            </template>
                        </ul>
                    </div>

                </div>
                <div class="row" style="margin-top: 20px;margin-bottom: 20px;">
                    <div id="query" class="col-xs-12" style="line-height: 28px;">
                        <div class="col-xs-12">
                            {%/*
                            <select id="hold_type_id" name="page.hold_type_id" v-model.number="page.hold_type_id" style="width: 120px;" @change="refreshList()">
                                <option :value="0">-Hold类型-</option>
                                <template v-for="hold_type in page.hold_type_list">
                                    <option :value="hold_type.id">{{hold_type.name}}</option>
                                </template>
                            </select>
                            */%}

                            <label class="control-label no-padding-right" for="batch_code">导入批次号</label>
                            <select id="batch_code" name="page.batch_code" class="input-sm" v-model.number="page.batch_code" style="width: 135px;" @change="refreshList()">
                                <option :value="0">-导入批次号-</option>
                                <template v-for="batch_code in page.batch_code_list">
                                    <option :value="batch_code">{{batch_code}}</option>
                                </template>
                            </select>
                            &nbsp;
                            <label class="control-label no-padding-right" for="order_code">订单编号</label>
                            <input id="order_code" name="page.order_code" type="text" class="input-sm" v-model="page.order_code" style="width: 135px;"/>
                            <input id="query_begin_time" name="query_begin_time" style="width: 135px;height:30px;" v-model="page.query_begin_time" placeholder="开始时间如2016-01-02"/>
                            <input id="query_end_time" name="query_end_time" style="width: 135px;height:30px;" v-model="page.query_end_time" placeholder="结束时间如2016-01-02"/>

                            <label class="control-label no-padding-right" for="order_tag_id">订单标签</label>
                            <select id="order_tag_id" name="order_tag_id" class="input-sm" v-model.number="page.order_tag_id" style="width: 135px;">
                                <option :value="0">选择标签查询</option>
                                <template v-for="order_tag in page.order_tag_list">
                                    <option :value="order_tag.id">{{order_tag.name}}</option>
                                </template>
                            </select>

                            <button class="btn btn-mini btn-primary" @click="refreshList()">
                                &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                            </button>
                        </div>

                        <div class="col-xs-12">
                            <label for="unlock_express">解锁快递：</label>
                            <select id="unlock_express" class="input-sm" style="width: 80px;">
                                <option :value="0">否</option>
                                <option :value="1">是</option>
                            </select>
                            &nbsp;<label for="prefer_stock">指定匹配仓库：</label>
                            <select id="prefer_stock" class="input-sm" style="width: 120px;" onchange="load_logistics_model_list()">
                                <option :value="0">当前不指定</option>
                                <template v-for="stock in page.au_stock_list">
                                    <option :value="stock.id">{{stock.name}}</option>
                                </template>
                            </select>
                            &nbsp;<label for="prefer_mode">指定物流方式：</label>
                            <select id="prefer_mode" class="input-sm" style="width: 120px;">
                                <option :value="0">当前不指定</option>
                                <template v-for="mode in logistics_mode_list">
                                    <option :value="mode.id">{{mode.name}}</option>
                                </template>
                            </select>
                            <button class="btn btn-mini btn-purple" onclick="rematch_order_logistics()">
                                重新匹配物流
                            </button>
                        </div>

                        <div class="col-xs-12">
                            <div class="link_query_list">
                                <a :class="page.hold_type_id == 0 ? 'selected' : ''" href="#" @click="selectHoldType(0)"><img style="border: none;height: 24px;" src="/static/images/icons/all_check.png" class="link_icon" alt="全部"/>全部</a>
                                <template v-for="hold_type in page.hold_type_list">
                                    <a :class="page.hold_type_id == hold_type.id ? 'selected' : ''" href="#" @click="selectHoldType(hold_type.id)">&nbsp;<img style="border: none;height: 24px;" v-if="hold_type.icon_file != ''" :src="'{%.icon_path%}/' + hold_type.icon_file" :alt="hold_type.name" class="link_icon"/>{{hold_type.name}}</a>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="orderList" class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>id</th>
                            <th id="th_order_code">订单编号</th>
                            <th id="th_status_name">订单状态</th>
                            <th id="th_type_name">订单类型</th>

                            <th id="th_store_name">店铺名</th>
                            <th id="th_store_code">店铺代码</th>
                            <th id="th_tran_id">交易代码</th>

                            <th id="th_buyer_user_id">客户id</th>
                            <th id="th_payment_methods">支付方式</th>
                            <th id="th_hold_type_name">Hold类型</th>

                            <th id="th_total_amount">原金额(AUD)</th>
                            <th id="th_total_amount_rmb">原金额(RMB)</th>
                            <th id="th_express_fee">原运费金额</th>

                            <th id="th_paid_time">支付时间</th>
                            <th id="th_shipped_time">发货时间</th>

                            <th id="th_logistics_company">货运公司</th>
                            <th id="th_logistics_mode">货运方式</th>

                            <th id="th_total_fee">预估运费</th>
                            <th id="th_actual_fee">实际运费</th>
                            <th id="th_fee_diff">运费偏差</th>

                            <th id="th_buyer_email">客户邮箱</th>
                            <th id="th_stock_name">发货仓库</th>

                            <th id="th_country_name">国家</th>
                            <th id="th_province">州</th>
                            <th id="th_postal_code">邮编</th>

                        </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "page": {
                "batch_code": "",
                "order_code": "",
                "hold_type_id": 0,
                "hold_type_list": [],
                "au_stock_list": [],
                "query_begin_time": "",
                "query_end_time": "",
                "order_tag_id": 0
            },
            "detail": {
                "order": {}
            },
            "logistics_mode_list": []
        },
        mounted: function () {
            var this_vm = this;

            $.ajax({
                url: '{%url "ErpOrderProcessedHold.PageData" %}',
                type: "POST",
                success: function (result) {
                    if (result.success === false) {
                        $.msg.error(result.message);
                        return;
                    }
                    this_vm.page = result;
                }
            });

            initDataTable(
                '#orderList',
                {
                    "sAjaxSource": '{%url "ErpOrderProcessedHold.ListData"%}',
                    "aaSorting": [[0, "desc"]],
                    "iDisplayLength": 50,
                    "aoColumns": [
                        {
                            "mDataProp": "o.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },

                        {
                            "mDataProp": "o.code", "title": "订单编号", "bSearchable": true, "sClass": "wrap-word",
                            "render": function (data, type, row) {
                                return "<div class='div_order_code'><a href='/order/detail/" + row.o.id + "' target='_blank'>" + data + "</a></div><div>" + row.status_name + "</div><div>" + row.type_name + "&nbsp;<span style='background-color:" + row.order_tag.bg_color + ";'>" + row.order_tag.name + "</span>" + "</div>";
                            }
                        },
                        {
                            "mDataProp": "s.name", "title": "订单状态", "bSearchable": false, "bSortable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_status_name'></div>";
                            }
                        },
                        {
                            "mDataProp": "ot.name", "title": "订单类型", "bSearchable": false, "bSortable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_type_name'></div>";
                            }
                        },
                        {
                            "mDataProp": "sa.name", "title": "店铺名", "bSearchable": false, "bSortable": false, "sClass": "wrap-word",
                            "render": function (data, type, row) {
                                var full_tran_id = row.o.full_tran_id;
                                if (full_tran_id === "") {
                                    full_tran_id = "--";
                                }
                                //return "<div class='div_store_name'>" + row.platform_name + " " + row.shop_name + "</div><div>" + row.shop_code + "</div><div>" + tran_id + "</div>";
                                return "<div class='div_store_name'>" + row.shop_name + "</div><div>" + full_tran_id + "</div>";
                            }
                        },
                        {
                            "mDataProp": "sa.name", "title": "店铺代码", "bSearchable": false, "bSortable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_store_code'></div>";
                            }
                        },
                        {
                            "mDataProp": "o.full_tran_id", "title": "交易号", "bSearchable": true,
                            "render": function (data, type, row) {
                                return "<div class='div_tran_id'></div>";
                            }
                        },
                        {
                            "mDataProp": "o.buyer_user_id", "title": "客户id", "bSearchable": true, "sClass": "wrap-word",
                            "render": function (data, type, row) {
                                var buy_user_id = row.o.buyer_user_id;
                                if (buy_user_id === "") {
                                    buy_user_id = "--"
                                }
                                var payment_methods = row.o.payment_methods;
                                if (payment_methods === "") {
                                    payment_methods = "--";
                                }
                                var hold_type_name = row.hold_type_name;
                                if (hold_type_name === "") {
                                    hold_type_name = "--";
                                }
                                return "<div class='div_buyer_user_id'>" + buy_user_id + "</div><div>" + payment_methods + "</div><div>" + hold_type_name + "</div>";
                            }
                        },
                        {
                            "mDataProp": "o.payment_methods", "title": "支付方式", "bSearchable": true,
                            "render": function (data, type, row) {
                                return "<div class='div_payment_methods'></div>";
                            }
                        },
                        {
                            "mDataProp": "hold_type_name", "title": "Hold类型", "bSearchable": false, "bSortable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_hold_type_name'></div>";
                            }
                        },

                        {
                            "mDataProp": "o.total_amount", "title": "原金额", "bSearchable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_total_amount'>" + row.o.total_amount_currency + " " + dtFormatFloat(row.o.total_amount) + "</div><div>RMB " + dtFormatFloat(row.o.total_amount_rmb) + "</div><div>AUD " + dtFormatFloat(row.o.express_fee) + "</div>";
                            }
                        },
                        {
                            "mDataProp": "o.total_amount_rmb", "title": "原金额", "bSearchable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_total_amount_rmb'></div>";
                            }
                        },
                        {
                            "mDataProp": "o.express_fee", "title": "原运费金额", "bSearchable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_express_fee'></div>";
                            }
                        },
                        {
                            "mDataProp": "o.paid_time", "title": "支付时间", "bSearchable": false,
                            "render": function (data, type, row) {
                                var order_paid_time = "--";
                                if (row.o.paid_time) {
                                    order_paid_time = row.o.paid_time;
                                }
                                var order_shipped_time = "--";
                                if (row.o.shipped_time) {
                                    order_shipped_time = row.o.shipped_time;
                                }

                                return '<div class="div_paid_time">' + order_paid_time + '</div><div>' + order_shipped_time + '</div>';
                            }
                        },
                        {
                            "mDataProp": "o.shipped_time", "title": "发货时间", "bSearchable": false,
                            "render": function (data, type, row) {
                                return '<div class="div_shipped_time"></div>';
                            }
                        },

                        {
                            "mDataProp": "o.company_name", "title": "货运公司", "bSearchable": false, "bSortable": false,
                            "render": function (data, type, row) {
                                return '<div class="div_logistics_company">' + row.company_name + '</div><div>' + row.mode_name + '</div>';
                            }
                        },
                        {
                            "mDataProp": "o.mode_name", "title": "货运方式", "bSearchable": false, "bSortable": false,
                            "render": function (data, type, row) {
                                return '<div class="div_logistics_mode"></div>';
                            }
                        },

                        {
                            "mDataProp": "o.ol.total_fee", "title": "预估运费", "bSearchable": false, "bSortable": false,
                            "render": function (data, type, row) {
                                return '<div class="div_total_fee">AUD ' + dtFormatFloat(row.ol.total_fee) + '</div><div>AUD ' + dtFormatFloat(row.ol.actual_fee) + '</div><div>AUD ' + dtFormatFloat(row.fee_diff) + '</div>';
                            }
                        },
                        {
                            "mDataProp": "o.ol.actual_fee", "title": "实际运费", "bSearchable": false, "bSortable": false,
                            "render": function (data, type, row) {
                                return '<div class="div_actual_fee"></div>';
                            }
                        },
                        {
                            "mDataProp": "o.ol.actual_fee", "title": "运费偏差", "bSearchable": false, "bSortable": false,
                            "render": function (data, type, row) {
                                return '<div class="div_fee_diff"></div>';
                            }
                        },

                        {
                            "mDataProp": "o.buyer_email", "title": "客户邮箱", "bSearchable": true, "sClass": "wrap-word",
                            "render": function (data, type, row) {
                                return '<div class="div_buyer_email">' + row.o.buyer_email + '</div><div>' + row.stock_name + '</div>';
                            }
                        },
                        {
                            "mDataProp": "stock_name", "title": "最佳发货仓库", "bSearchable": false, "bSortable": false,
                            "render": function (data, type, row) {
                                return '<div class="div_stock_name"></div>';
                            }
                        },


                        {
                            "mDataProp": "ad.country_name", "title": "国家", "bSearchable": false, "bSortable": false, "sClass": "wrap-word",
                            "render": function (data, type, row) {
                                return '<div class="div_country_name">' + row.ad.country_name + '</div><div>' + row.ad.province + '</div><div>' + row.ad.postal_code + '</div>';
                            }
                        },
                        {
                            "mDataProp": "ad.province", "title": "州", "bSearchable": false, "bSortable": false,
                            "render": function (data, type, row) {
                                return '<div class="div_province"></div>';
                            }
                        },
                        {
                            "mDataProp": "ad.postal_code", "title": "邮编", "bSearchable": false, "bSortable": false,
                            "render": function (data, type, row) {
                                return '<div class="div_postal_code"></div>';
                            }
                        }
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'batch_code', 'value': this_vm.page.batch_code});
                        aoData.push({'name': 'order_code', 'value': this_vm.page.order_code});
                        aoData.push({'name': 'status', 'value': status});
                        aoData.push({'name': 'shop_id', 'value': this_vm.page.shop_id});
                        aoData.push({'name': 'order_type_id', 'value': this_vm.page.order_type_id});
                        aoData.push({'name': 'status_id', 'value': this_vm.page.status_id});
                        aoData.push({'name': 'query_criteria_id', 'value': this_vm.page.query_criteria_id});
                        aoData.push({'name': 'query_criteria_value', 'value': this_vm.page.query_criteria_value});
                        aoData.push({'name': 'hold_type_id', 'value': this_vm.page.hold_type_id});
                        aoData.push({'name': 'query_begin_time', 'value': this_vm.page.query_begin_time});
                        aoData.push({'name': 'query_end_time', 'value': this_vm.page.query_end_time});
                        aoData.push({'name': 'order_tag_id', 'value': this_vm.page.order_tag_id});

                        //query_criteria_value

                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                hideMask();

                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    return;
                                }

                                fnCallback(data);

                                $("#orderList div.div_order_code").parent().css("width", "110px");
                                $("#orderList div.div_status_name").parent().css("display", "none");
                                $("#orderList div.div_type_name").parent().css("display", "none");

                                $("#orderList div.div_store_name").parent().css("width", "90px");
                                $("#orderList div.div_store_code").parent().css("display", "none");
                                $("#orderList div.div_tran_id").parent().css("display", "none");

                                $("#orderList div.div_buyer_user_id").parent().css("width", "120px");
                                $("#orderList div.div_payment_methods").parent().css("display", "none");
                                $("#orderList div.div_hold_type_name").parent().css("display", "none");

                                $("#orderList div.div_total_amount").parent().css("width", "100px");
                                $("#orderList div.div_total_amount_rmb").parent().css("display", "none");
                                $("#orderList div.div_express_fee").parent().css("display", "none");

                                $("#orderList div.div_paid_time").parent().css("width", "130px");
                                $("#orderList div.div_shipped_time").parent().css("display", "none");

                                $("#orderList div.div_logistics_company").parent().css("width", "100px");
                                $("#orderList div.div_logistics_mode").parent().css("display", "none");

                                $("#orderList div.div_total_fee").parent().css("width", "95px");
                                $("#orderList div.div_actual_fee").parent().css("display", "none");
                                $("#orderList div.div_fee_diff").parent().css("display", "none");

                                //$("#orderList div.div_buyer_email").parent().css("width", "150px");
                                $("#orderList div.div_stock_name").parent().css("display", "none");

                                $("#orderList div.div_country_name").parent().css("width", "105px");
                                $("#orderList div.div_province").parent().css("display", "none");
                                $("#orderList div.div_postal_code").parent().css("display", "none");
                            }
                        });
                    }
                }
            );
            $("#th_order_code").before("<th id='th_order_code_ext'></th>");
            $("#th_order_code").wrap("<div id='div_order_code'></div>");
            $("#th_status_name").wrap("<div id='div_status_name'></div>");
            $("#th_type_name").wrap("<div id='div_type_name'></div>");
            $("#th_order_code_ext").append($("#div_order_code")).append($("#div_status_name")).append($("#div_type_name"));

            $("#th_store_name").before("<th id='th_store_name_ext'></th>");
            $("#th_store_name").wrap("<div id='div_store_name'></div>");
            $("#th_store_code").wrap("<div id='div_store_code'></div>");
            $("#th_tran_id").wrap("<div id='div_tran_id'></div>");
            $("#th_store_name_ext").append($("#div_store_name")).append($("#div_store_code")).append($("#div_tran_id"));

            $("#th_buyer_user_id").before("<th id='th_buyer_user_id_ext'></th>");
            $("#th_buyer_user_id").wrap("<div id='div_buyer_user_id'></div>");
            $("#th_payment_methods").wrap("<div id='div_payment_methods'></div>");
            $("#th_hold_type_name").wrap("<div id='div_hold_type_name'></div>");
            $("#th_buyer_user_id_ext").append($("#div_buyer_user_id")).append($("#div_payment_methods")).append($("#div_hold_type_name"));

            $("#th_total_amount").before("<th id='th_total_paid_amount'></th>");
            $("#th_total_amount").wrap("<div id='div_total_amount'></div>");
            $("#th_total_amount_rmb").wrap("<div id='div_total_amount_rmb'></div>");
            $("#th_express_fee").wrap("<div id='div_express_fee'></div>");
            $("#th_total_paid_amount").append($("#div_total_amount")).append($("#div_total_amount_rmb")).append($("#div_express_fee"));

            $("#th_paid_time").before("<th id='th_paid_time_shipped_time'></th>");
            $("#th_paid_time").wrap("<div id='div_paid_time'></div>");
            $("#th_shipped_time").wrap("<div id='div_shipped_time'></div>");
            $("#th_paid_time_shipped_time").append($("#div_paid_time")).append($("#div_shipped_time"));

            $("#th_logistics_company").before("<th id='th_logistics_company_ext'></th>");
            $("#th_logistics_company").wrap("<div id='div_logistics_company'></div>");
            $("#th_logistics_mode").wrap("<div id='div_logistics_mode'></div>");
            $("#th_logistics_company_ext").append($("#div_logistics_company")).append($("#div_logistics_mode"));

            $("#th_total_fee").before("<th id='th_total_fee_ext'></th>");
            $("#th_total_fee").wrap("<div id='div_total_fee'></div>");
            $("#th_actual_fee").wrap("<div id='div_actual_fee'></div>");
            $("#th_fee_diff").wrap("<div id='div_fee_diff'></div>");
            $("#th_total_fee_ext").append($("#div_total_fee")).append($("#div_actual_fee")).append($("#div_fee_diff"));

            $("#th_buyer_email").before("<th id='th_buyer_email_ext'></th>");
            $("#th_buyer_email").wrap("<div id='div_buyer_email'></div>");
            $("#th_stock_name").wrap("<div id='div_stock_name'></div>");
            $("#th_buyer_email_ext").append($("#div_buyer_email")).append($("#div_stock_name"));

            $("#th_country_name").before("<th id='th_country_name_ext'></th>");
            $("#th_country_name").wrap("<div id='div_country_name'></div>");
            $("#th_province").wrap("<div id='div_province'></div>");
            $("#th_postal_code").wrap("<div id='div_postal_code'></div>");
            $("#th_country_name_ext").append($("#div_country_name")).append($("#div_province")).append($("#div_postal_code"));

            $('#orderList tbody').on('dblclick', 'tr', function () {
                var order_id = $(this).find('td:first-child input:checkbox').val();
                show_simple_detail_dialog(order_id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#orderList');
            },
            refreshList: function () {
                refreshList('#orderList');
            },
            selectHoldType: function (selected_hold_type_id) {
                vm.page.hold_type_id = selected_hold_type_id;
                vm.refreshList();
            },
            daiPeiHuo: function () {
                var id_list = [];
                $('#orderList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length === 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要把订单搬至待配货吗？", function () {
                    $.ajax({
                        url: '{%url "ErpOrder.DaiPeiHuo"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            },
            quXiao: function () {
                var id_list = [];
                $('#orderList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length === 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要取消订单吗？", function () {
                    $.ajax({
                        url: '{%url "ErpOrder.QuXiao"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            },
            exportOrderCode: function () {
                var params = $.param({
                    "status": "hold",
                    "batch_code": vm.page.batch_code,
                    "hold_type_id": vm.page.hold_type_id
                });
                var url = '{%url "ErpOrderExport.Export"%}' + "?" + params;
                $('<form method="post" action="' + url + '"></form>').appendTo('body').submit().remove();
            },
            apply_order_tag: function (order_tag_id) {
                var order_id_list = [];
                $('#orderList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        order_id_list.push($(this).val());
                    }
                });

                if (order_id_list.length === 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.ajax({
                    url: '{%url "ErpOrderTag.ApplyTag"%}',
                    type: "POST",
                    data: {
                        "order_id_list": order_id_list,
                        "order_tag_id": order_tag_id
                    },
                    success: function (data) {
                        if (data.success === false) {
                            $.msg.error(data.message);
                            return;
                        }
                        else {
                            $.msg.show(data.message);
                        }
                        vm.reloadList();
                    }
                });
            }
        }
    });

    function rematch_order_logistics() {
        var order_id_list = [];
        $('#orderList').find('tbody tr>td:first-child input:checkbox').each(function () {
            if (this.checked) {
                order_id_list.push($(this).val());
            }
        });

        if (order_id_list.length === 0) {
            $.msg.alert("请选择数据！");
            return;
        }

        $.msg.confirm("确认要重新匹配物流吗？", function () {
            $.ajax({
                "dataType": 'json',
                "url": '{% url "ErpOrder.ReMatchHoldOrderLogistics"%}',
                "data": {
                    "order_id_list": order_id_list,
                    "prefer_stock_id": $("#prefer_stock").val(),
                    "prefer_mode_id": $("#prefer_mode").val(),
                    "unlock_express": $("#unlock_express").val()
                },
                "success": function (data) {
                    if (data.success === false) {
                        $.msg.error(data.message);
                    }
                    else {
                        vm.refreshList();
                        $.msg.show(data.message);
                    }
                }
            });
        });
    }

    function load_logistics_model_list() {
        $.ajax({
            "dataType": 'json',
            "url": '{% url "ErpLogisticsMode.GetListByStock" %}',
            "data": {
                "stock_id": $("#prefer_stock").val()
            },
            "success": function (data) {
                if (data.success === false) {
                    $.msg.error(data.message);
                }
                else {
                    vm.logistics_mode_list = data.mode_list;
                }
            }
        });
    }

    function load_order_detail_data(order_id) {
        var detail_vm = new Vue({
            el: "#order_simple_detail_dialog",
            data: {
                "detail": {
                    "order": {},
                    "status": {},
                    "shop": {},
                    "order_type": {},
                    "order_hold_type": {},
                    "shipping_address": {},
                    "ebay_shipping_address": {},
                    "paypal_shipping_address": {},
                    "order_item_list": [],
                    "order_logistics": {},
                    "logistics_setting": {},
                    "au_stock_list": [],
                    "logistics_stock": {},
                    "logistics_mode": {},
                    "inventory_list": []
                }
            },
            methods: {
                format_amount: function (amount) {
                    return dtFormatFloat(amount);
                }
            }
        });

        $.ajax({
            url: '{%url "ErpOrder.DetailData" %}',
            type: "POST",
            data: {"id": order_id},
            success: function (result) {
                if (result.success === false) {
                    $.msg.error(result.message);
                    return;
                }
                detail_vm.detail = result;
            }
        });

    }

    function show_simple_detail_dialog(order_id) {
        $("#order_simple_detail_wrapper").html("");

        $.ajax({
            url: '{%url "ErpOrderSimpleDetail.Index" %}',
            type: "POST",
            data: {"order_id": order_id},
            success: function (result) {
                $("#order_simple_detail_wrapper").html(result);
                load_order_detail_data(order_id);
                $("#order_simple_detail_dialog").modal();
            }
        });
    }
</script>
<div id="order_simple_detail_wrapper"></div>
{%footer%}
