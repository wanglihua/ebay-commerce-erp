<div class="modal fade" id="order_print_order_by_option_dialog">
    <div class="modal-dialog" style="width: 480px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                <h4 class="modal-title">订单标签打印排序</h4>
            </div>
            <div class="modal-body clearfix">
                <div class="row">
                    <div class="col-xs-12">
                        <form class="form-horizontal" role="form" id="order_print_order_by_option_form">
                            <div class="row">
                                <div class="col-xs-12">
                                    <div class="form-group">
                                        <label for="order_by_code" class="col-xs-2 control-label">排序</label>
                                        <div class="col-xs-10">
                                            <select id="order_by_code" name="order_by_code" class="input-sm form-control">
                                                <option value="{% .order_by_sl_code %}">按库位排序</option>
                                                <option value="{% .order_by_sku_code %}">按SKU排序</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success btn-sm" onclick="print_waybill()">
                    <i class="ace-icon fa fa-floppy-o"></i>打印
                </button>
                <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                    <i class="ace-icon fa fa-times"></i>取消
                </button>
            </div>
        </div>
    </div>
</div>
