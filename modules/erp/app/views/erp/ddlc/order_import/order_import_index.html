{%header "订单导入" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddlc-menu">订单流程</li>
            <li class="active" data-menu="ddlc-order-import-menu">订单导入</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#orderList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button id="btnUpload" class="btn btn-success btn-sm">
                        <i class="ace-icon fa fa-plus"></i>
                        导入
                    </button>
                    <button class="btn btn-purple btn-sm" @click="matchLogistics()">
                        <i class="ace-icon fa fa-truck"></i>
                        匹配物流
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteImportOrder()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除订单
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteImportBatch()">
                        <i class="ace-icon fa fa-trash"></i>
                        删除批次
                    </button>
                </div>
                <div style="margin-top: 10px;">
                    <a href="/static/excel-template/order_import.xlsx">下载Excel模板</a>
                </div>
                <div class="row" style="margin-top: 20px;margin-bottom: 20px;">
                    <div id="query" class="col-xs-12" style="line-height: 28px;">
                        <div class="col-xs-12">
                            <select id="batch_code" name="page.batch_code" v-model.number="page.batch_code" style="width: 120px;" @change="refreshList()">
                                <option :value="0">-导入批次号-</option>
                                <template v-for="batch_code in page.batch_code_list">
                                    <option :value="batch_code">{{batch_code}}</option>
                                </template>
                            </select>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="orderList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="/static/lib/plupload/moxie.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/plupload.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/zh_CN.js"></script>

<script type="text/javascript">
    function init_uploader() {
        var uploader = new plupload.Uploader({
            runtimes: 'html5,flash,html4',
            multi_selection: false,

            browse_button: 'btnUpload',
            file_data_name: "excel_file",

            url: '{%url "ErpOrderImport.Upload"%}',
            max_file_size: '10000kb',

            filters: [
                {title: "Excel文件", extensions: "xlsx"}
            ],

            flash_swf_url: '/plupload/js/Moxie.swf',

            init: {
                FilesAdded: function () {
                    showMask("上传中，请稍候...");
                    uploader.start();
                },
                FileUploaded: function (up, file, response) {
                    hideMask();
                    var result = JSON.parse(response.response);
                    if (result.success != true) {
                        $.msg.error(result.message);
                    } else {
                        loadVmPageData();
                        reloadList('#orderList');
                        $.msg.show(result.message);
                    }
                },
                Error: function (up, err) {
                    $.msg.error("上传发生错误：" + err.code + ", " + err.message);
                }
            }
        });

        uploader.init();
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "page": {
                "batch_code": 0,
                "batch_code_list": []
            },
            "detail": {
                "order": {}
            }
        },
        mounted: function () {
            var this_vm = this;

            //请求页面数据
            loadPageData(this_vm);

            initDataTable(
                '#orderList',
                {
                    "sAjaxSource": '{%url "ErpOrderImport.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "o.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "ib.batch_code", "title": "导入批次", "bSearchable": false, "width": 180},
                        {
                            "mDataProp": "o.code", "title": "订单编号", "bSearchable": true, "width": 180,
                            "render": function (data, type, row) {
                                return "<a href='/erp/order/detail/" + row.o.id + "' target='_blank'>" + data + "</a>";
                            }
                        },
                        {"mDataProp": "ot.name", "title": "类型", "bSearchable": true},
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": true},
                        {"mDataProp": "sa.name", "title": "店铺", "bSearchable": true},
                        {"mDataProp": "o.buyer_user_id", "title": "买家用户id", "bSearchable": true},
                        {"mDataProp": "o.amount_paid_currency", "title": "支付金额货种", "bSearchable": true},
                        {"mDataProp": "o.amount_paid", "title": "支付金额", "bSearchable": false},
                        {"mDataProp": "o.total_amount_currency", "title": "总计金额币种", "bSearchable": true},
                        {"mDataProp": "o.total_amount", "title": "总计金额", "bSearchable": false},
                        {"mDataProp": "o.payment_methods", "title": "支付方式", "bSearchable": true},
                        {"mDataProp": "o.created_time", "title": "建单时间", "bSearchable": false, "width": 135},
                        {"mDataProp": "o.shipped_time", "title": "发货时间", "bSearchable": false, "width": 135}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'batch_code', 'value': this_vm.page.batch_code});
                        //query_criteria_value

                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                hideMask();

                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    return;
                                }

                                fnCallback(data);
                            }
                        });
                    }
                }
            );

            init_uploader();
        },
        methods: {
            reloadList: function () {
                reloadList('#orderList');
            },
            refreshList: function() {
                refreshList("#orderList");
            },
            deleteImportOrder: function () {
                var id_list = [];
                $('#orderList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length === 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpOrderImport.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            },
            deleteImportBatch: function () {
                if (vm.page.batch_code == 0) {
                    $.msg.error("请选择要删除的导入批次！");
                    return;
                }

                $.msg.confirm("确认要删除导入批次吗？", function () {
                    $.ajax({
                        url: '{%url "ErpOrderImport.BatchDelete"%}',
                        type: "POST",
                        data: {"batch_code": vm.page.batch_code},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }

                            //重新加载页面数据，更新批次下拉框
                           loadVmPageData();

                            vm.reloadList();
                        }
                    });
                });
            },
            matchLogistics: function () {
                if (vm.page.batch_code == 0) {
                    $.msg.error("请选择要匹配物流的导入批次！");
                    return;
                }

                $.msg.confirm("确认要匹配该批次的物流吗？", function () {
                    $.ajax({
                        url: '{%url "ErpOrderImport.MatchLogistics"%}',
                        type: "POST",
                        data: {"batch_code": vm.page.batch_code},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }

                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });

    function loadPageData(this_vm) {
        $.ajax({
                url: '{%url "ErpOrderImport.PageData" %}',
                type: "POST",
                success: function (result) {
                    if (result.success == false) {
                        $.msg.error(result.message);
                        return;
                    }
                    this_vm.page = result;
                }
            }
        );
    }

    function loadVmPageData() {
        loadPageData(vm);
    }
</script>
{%footer%}
