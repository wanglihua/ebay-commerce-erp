{%header .status_chinese_name .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddlc-menu">订单流程</li>
            {%.active_menu_html%}
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#orderList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showOrderDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                </div>
                <div class="row" style="margin-top: 20px;margin-bottom: 20px;">
                    <div id="query" class="col-xs-12" style="line-height: 28px;">
                        <div class="col-xs-12">
                            <select id="shop_id" name="page.shop_id" v-model.number="page.shop_id" style="width: 120px;">
                                <option value="0">-平台/店铺-</option>
                                <template v-for="shop in page.shop_list">
                                    <option :value="shop.id">{{shop.name}}</option>
                                </template>
                            </select>
                            <select id="order_type_id" name="page.order_type_id" v-model.number="page.order_type_id" style="width:120px;">
                                <option value="0">-订单类型-</option>
                                <template v-for="order_type in page.order_type_list">
                                    <option :value="order_type.id">{{order_type.name}}</option>
                                </template>
                            </select>
                            <select id="status_id" name="page.status_id" v-model.number="page.status_id" style="width:120px;">
                                <option value="0">-订单状态-</option>
                                <template v-for="status in page.status_list">
                                    <option :value="status.id">{{status.name}}</option>
                                </template>
                            </select>
                            <select id="query_criteria_id" name="page.query_criteria_id" v-model.number="page.query_criteria_id" style="width:120px;">
                                <option value="0">-查询条件-</option>
                                <template v-for="criteria in page.query_criteria_list">
                                    <option :value="criteria.id">{{criteria.name}}</option>
                                </template>
                            </select>
                            <input id="query_criteria_value" name="query_criteria_value" v-model="page.query_criteria_value" style="width: 120px;height:30px;"/>
                            <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" @click="search()">
                                &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="orderList" class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>id</th>
                            <th>订单编号</th>
                            <th id="th_status_name">订单状态</th>
                            <th id="th_type_name">订单类型</th>
                            <th id="th_store_name">店铺</th>
                            <th id="th_buyer_user">客户id</th>
                            <th id="th_total_amount">原金额</th>
                            <th id="th_total_amount_rmb">金额</th>
                            <th id="th_amount_paid_rmb">支付金额</th>
                            <th>支付方式</th>
                            <th id="th_created_time">建单时间</th>
                            <th id="th_shipped_time">发货时间</th>
                        </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{%template "erp/ddlc/order/order_index.var" .%}
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "page": {
                "shop_id": 0,
                "shop_list": [],
                "order_type_id": 0,
                "order_type_list": [],
                "status_id": 0,
                "status_list": [],
                "query_criteria_id": 0,
                "query_criteria_list": [],
                "query_criteria_value": ""
            },
            "detail": {
                "order": {}
            }
        },
        mounted: function () {
            var this_vm = this;
            //请求页面数据
            $.ajax({
                    url: '{%url "ErpOrder.PageData" %}',
                    type: "POST",
                    success: function (result) {
                        if (result.success == false) {
                            $.msg.error(result.message);
                            return;
                        }
                        vm.page = result;
                    }
                }
            );

            initDataTable(
                '#orderList',
                {
                    "sDom": "<'row'<'col-xs-12't>><'row'<'col-xs-6'i><'col-xs-6'p>>",
                    "sAjaxSource": '{%url "ErpOrder.ListData"%}',
                    "aaSorting": [[10, "desc"]],
                    "iDisplayLength": 50,
                    "aoColumns": [
                        {
                            "mDataProp": "o.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },

                        {
                            "mDataProp": "o.code", "title": "订单编号", "bSearchable": true, "width": 130,
                            "render": function (data, type, row) {
                                return "<a href='/erp/order/detail/" + row.o.id + "' target='_blank'>" + data + "</a>";
                            }
                        },
                        {
                            "mDataProp": "s.name", "title": "订单状态", "bSearchable": true,
                            "render": function (data, type, row) {
                                return "<div class='div_status_name'>" + row.s.name + "</div><div>" + row.ot.name + "</div>";
                            }
                        },
                        {
                            "mDataProp": "ot.name", "title": "订单类型", "bSearchable": true,
                            "render": function (data, type, row) {
                                return "<div class='div_type_name'></div>";
                            }
                        },

                        {
                            "mDataProp": "sa.name", "title": "店铺", "bSearchable": true,
                            "render": function (data, type, row) {
                                return "<div class='div_store_name'>" + row.pf.name + " " + row.sa.name + "</div><div>" + row.o.buyer_user_id + "</div>";
                            }
                        },
                        {
                            "mDataProp": "o.buyer_user_id", "title": "客户id", "bSearchable": true,
                            "render": function (data, type, row) {
                                return "<div class='div_buyer_user'></div>";
                            }
                        },
                        {
                            "mDataProp": "o.total_amount", "title": "原金额", "bSearchable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_total_amount'>" + row.o.total_amount_currency + " " + row.o.total_amount + "</div><div>RMB " + row.o.total_amount_rmb + "</div><div>RMB " + row.o.amount_paid_rmb + "</div>";
                            }
                        },
                        {
                            "mDataProp": "o.total_amount_rmb", "title": "金额", "bSearchable": false,
                            "render": function (data, type, row) {
                                //return "RMB " + data;
                                return "<div class='div_total_amount_rmb'></div>";
                            }
                        },
                        {
                            "mDataProp": "o.amount_paid_rmb", "title": "支付金额", "bSearchable": false,
                            "render": function (data, type, row) {
                                //return "RMB " + data;
                                return "<div class='div_amount_paid_rmb'></div>";
                            }
                        },

                        {"mDataProp": "o.payment_methods", "title": "支付方式", "bSearchable": true},
                        {
                            "mDataProp": "o.created_time", "title": "建单时间", "bSearchable": false, "width": 135,
                            "render": function (data, type, row) {
                                if (row.o.shipped_time) {
                                    return '<div class="div_created_time">' + row.o.created_time + '</div><div>' + row.o.shipped_time + '</div>';
                                } else {
                                    return '<div class="div_created_time">' + row.o.created_time + '</div><div>----------</div>';
                                }
                            }
                        },
                        {
                            "mDataProp": "o.shipped_time", "title": "发货时间", "bSearchable": false, "width": 135,
                            "render": function (data, type, row) {
                                return '<div class="div_shipped_time"></div>';
                            }
                        }
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        aoData.push({'name': 'status', 'value': status});
                        aoData.push({'name': 'shop_id', 'value': this_vm.page.shop_id});
                        aoData.push({'name': 'order_type_id', 'value': this_vm.page.order_type_id});
                        aoData.push({'name': 'status_id', 'value': this_vm.page.status_id});
                        aoData.push({'name': 'query_criteria_id', 'value': this_vm.page.query_criteria_id});
                        aoData.push({'name': 'query_criteria_value', 'value': this_vm.page.query_criteria_value});

                        //query_criteria_value

                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    return;
                                }

                                fnCallback(data);

                                $("#orderList div.div_store_name").parent().css("width", "135px");
                                $("#orderList div.div_buyer_user").parent().css("display", "none");

                                $("#orderList div.div_status_name").parent().css("width", "80px");
                                $("#orderList div.div_type_name").parent().css("display", "none");

                                $("#orderList div.div_total_amount").parent().css("width", "100px");
                                $("#orderList div.div_total_amount_rmb").parent().css("display", "none");
                                $("#orderList div.div_amount_paid_rmb").parent().css("display", "none");

                                $("#orderList div.div_created_time").parent().css("width", "135px");
                                $("#orderList div.div_shipped_time").parent().css("display", "none");
                            }
                        });
                    }
                }
            );

            $("#th_store_name").before("<th id='th_store_name_buyer_user'></th>");
            $("#th_store_name").wrap("<div id='div_store_name'></div>");
            $("#th_buyer_user").wrap("<div id='div_buyer_user'></div>");
            $("#th_store_name_buyer_user").append($("#div_store_name")).append($("#div_buyer_user"));

            $("#th_status_name").before("<th id='th_status_type_name'></th>");
            $("#th_status_name").wrap("<div id='div_status_name'></div>");
            $("#th_type_name").wrap("<div id='div_type_name'></div>");
            $("#th_status_type_name").append($("#div_status_name")).append($("#div_type_name"));

            $("#th_total_amount").before("<th id='th_total_paid_amount'></th>");
            $("#th_total_amount").wrap("<div id='div_total_amount'></div>");
            $("#th_total_amount_rmb").wrap("<div id='div_total_amount_rmb'></div>");
            $("#th_amount_paid_rmb").wrap("<div id='div_amount_paid_rmb'></div>");
            $("#th_total_paid_amount").append($("#div_total_amount")).append($("#div_total_amount_rmb")).append($("#div_amount_paid_rmb"));

            $("#th_created_time").before("<th id='th_created_time_shipped_time'></th>");
            $("#th_created_time").wrap("<div id='div_created_time'></div>");
            $("#th_shipped_time").wrap("<div id='div_shipped_time'></div>");
            $("#th_created_time_shipped_time").append($("#div_created_time")).append($("#div_shipped_time"));
        },
        methods: {
            reloadList: function () {
                reloadList('#orderList');
            },
            refreshList: function () {
                reloadList("#orderList");
            },
            search: function () {
                var tables = $("#orderList").dataTable().api();
                tables.draw(true);
            }
        }
    });
</script>
{%footer%}
