{% site_header "订单详情" . %}
<div class="main-container" id="main-container">
    <div id="order_detail" style="width: 1024px;margin-left: auto;margin-right: auto;">
        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">基本信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="order_code" class="col-xs-4 control-label">订单编号：</label>
                                <div class="col-xs-8">
                                    <input id="order_code" name="detail.inventory.stock_id" type="text" class="input-sm form-control" disabled="disabled" v-model="detail.order.code"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="created_time" class="col-xs-4 control-label">建单时间：</label>
                                <div class="col-xs-8">
                                    <input id="created_time" name="detail.inventory.stock_id" type="text" class="input-sm form-control" disabled="disabled" v-model="detail.order.created_time"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="status_name" class="col-xs-4 control-label">状态：</label>
                                <div class="col-xs-8">
                                    <input id="status_name" name="detail.inventory.stock_id" type="text" class="input-sm form-control" disabled="disabled" v-model="detail.status.name"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="order_type_name" class="col-xs-4 control-label">订单属性：</label>
                                <div class="col-xs-8">
                                    <input id="order_type_name" name="detail.inventory.stock_id" type="text" class="input-sm form-control" disabled="disabled" v-model="detail.order_type.name"/>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">客户信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="shop_name" class="col-xs-4 control-label">客户来源：</label>
                                <div class="col-xs-8">
                                    <input id="shop_name" name="detail.shop.name" type="text" class="input-sm form-control" disabled="disabled" v-model="detail.shop.name"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="buyer_user_id" class="col-xs-4 control-label">买家帐号：</label>
                                <div class="col-xs-8">
                                    <input id="buyer_user_id" name="detail.order.buyer_user_id" type="text" class="input-sm form-control" disabled="disabled" v-model="detail.order.buyer_user_id"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="buyer_user_name" class="col-xs-4 control-label">客户姓名：</label>
                                <div class="col-xs-8">
                                    <input id="buyer_user_name" name="detail.order.buyer_user_name" type="text" class="input-sm form-control" disabled="disabled" v-model="detail.shipping_address.name"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="country_name" class="col-xs-4 control-label">国家：</label>
                                <div class="col-xs-8">
                                    <input id="country_name" name="detail.order.country_name" type="text" class="input-sm form-control" disabled="disabled" v-model="detail.shipping_address.country_name"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="phone" class="col-xs-4 control-label">联系电话：</label>
                                <div class="col-xs-8">
                                    <input id="phone" name="detail.order.country_name" type="text" class="input-sm form-control" disabled="disabled" v-model="detail.shipping_address.phone"/>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-9" style="height: 32px;"></div>
                        <div class="col-xs-6">
                            <div class="form-group">
                                <label for="ebay_address" class="col-xs-2 control-label">平台地址：</label>
                                <div class="col-xs-10">
                                    <div id="ebay_address" class="address-box">
                                        <div>
                                            <label for="ebay_address_name">Name:</label>
                                            <input id="ebay_address_name" type="text" v-model="detail.shipping_address.name"/>
                                        </div>
                                        <div>
                                            <label for="ebay_address_street1">Address:</label>
                                            <input id="ebay_address_street1" type="text" v-model="detail.shipping_address.street1"/>
                                            <input id="ebay_address_street2" type="text" v-model="detail.shipping_address.street2"/>
                                        </div>
                                        <div>
                                            <label for="ebay_address_city">City:</label>
                                            <input id="ebay_address_city" type="text" v-model="detail.shipping_address.city_name"/>
                                        </div>
                                        <div>
                                            <label for="ebay_address_state">State:</label>
                                            <input id="ebay_address_state" type="text" v-model="detail.shipping_address.province"/>
                                        </div>
                                        <div>
                                            <label for="ebay_address_country">Country:</label>
                                            <input id="ebay_address_country" type="text" v-model="detail.shipping_address.country"/>
                                        </div>
                                        <div>
                                            <label for="ebay_address_country_name">Country Name:</label>
                                            <input id="ebay_address_country_name" type="text" v-model="detail.shipping_address.country_name"/>
                                        </div>
                                        <div>
                                            <label for="ebay_address_postal_code">Post Code:</label>
                                            <input id="ebay_address_postal_code" type="text" v-model="detail.shipping_address.postal_code"/>
                                        </div>
                                        <div>
                                            <label for="ebay_address_phone">Phone:</label>
                                            <input id="ebay_address_phone" type="text" v-model="detail.shipping_address.phone"/>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                        <div class="col-xs-6">
                            <div class="form-group">
                                <label for="paypal_address" class="col-xs-2 control-label">PayPal<br/>地址：</label>
                                <div class="col-xs-10">
                                    <div id="paypal_address" class="address-box">
                                        <div>
                                            <label for="paypal_address_name">Name:</label>
                                            <input id="paypal_address_name" type="text" value=""/>
                                        </div>
                                        <div>
                                            <label for="paypal_address_street1">Address:</label>
                                            <input id="paypal_address_street1" type="text" value=""/>
                                            <input id="paypal_address_street2" type="text" value=""/>
                                        </div>
                                        <div>
                                            <label for="paypal_address_city">City:</label>
                                            <input id="paypal_address_city" type="text" value=""/>
                                        </div>
                                        <div>
                                            <label for="paypal_address_state">State:</label>
                                            <input id="paypal_address_state" type="text" value=""/>
                                        </div>
                                        <div>
                                            <label for="paypal_address_country">Country:</label>
                                            <input id="paypal_address_country" type="text" value=""/>
                                        </div>
                                        <div>
                                            <label for="paypal_address_country_name">Country Name:</label>
                                            <input id="paypal_address_country_name" type="text" value=""/>
                                        </div>
                                        <div>
                                            <label for="paypal_address_postal_code">Post Code:</label>
                                            <input id="paypal_address_postal_code" type="text" value=""/>
                                        </div>
                                        <div>
                                            <label for="paypal_address_phone">Phone:</label>
                                            <input id="paypal_address_phone" type="text" value=""/>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-xs-12" style="padding-top:5px;">
                                    <div class="col-xs-9"></div>
                                    <div class="col-xs-3" style="text-align: right;">
                                        <button class="btn btn-minier btn-white btn-purple" @click="get_payal_address()">
                                            获取PayPal地址
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">订单信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">

                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">订单报表</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="order_price_report" class="table table-bordered">
                                <thead>
                                <tr>
                                    <th class="dtRight">结账信息</th>
                                    <th class="dtRight">结算汇率</th>
                                    <th class="dtRight">收款金额</th>
                                    <th class="dtRight">运费收入</th>
                                    <th class="dtRight">保险</th>
                                    <th class="dtRight">平台交易费</th>
                                    <th class="dtRight">付款交易费</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr>
                                    <td class="dtRight">收款货币</td>
                                    <td class="dtRight"></td>
                                    <td class="dtRight"></td>
                                    <td class="dtRight"></td>
                                    <td class="dtRight"></td>
                                    <td class="dtRight"></td>
                                    <td class="dtRight"></td>
                                </tr>
                                <tr>
                                    <td class="dtRight">结算人民币</td>
                                    <td class="dtRight"></td>
                                    <td class="dtRight"></td>
                                    <td class="dtRight"></td>
                                    <td class="dtRight"></td>
                                    <td class="dtRight"></td>
                                    <td class="dtRight"></td>
                                </tr>
                                </tbody>
                                <tfoot>
                                <tr>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td>商品成本</td>
                                    <td>物流成本</td>
                                    <td>毛利</td>
                                </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">订单详情</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="order_item_list" class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th class="center" style="width: 50px;">选择</th>
                                    <th class="center" style="width: 60px;">图片</th>
                                    <th style="width: 120px;">商品名称</th>
                                    <th class="center" style="width: 100px;">售价</th>
                                    <th class="center" style="width: 100px;">成本</th>
                                    <th class="center" style="width: 80px;">原始售价</th>
                                    <th class="center" style="width: 80px;">毛利</th>
                                    <th>留言</th>
                                </tr>
                                </thead>
                                <tbody>
                                <template v-for="order_item in detail.order_item_list">
                                    <tr>
                                        <td class="center">
                                            <label class="pos-rel">
                                                <input type="checkbox" class="ace" :value="order_item.oi.id"/>
                                                <span class="lbl"></span>
                                            </label>
                                        </td>
                                        <td class="center">
                                            <a :href="order_item.psi.view_item_url" target="_blank">
                                                <img :src="order_item.p.image_url" alt="" style="width: 60px;height: 60px;"/>
                                            </a>
                                        </td>
                                        <td>
                                            <div :title="order_item.p.name" style="width: 120px; overflow: hidden; text-overflow: ellipsis;white-space: nowrap;">
                                                {{order_item.oi.item_title}}
                                            </div>
                                            <div>
                                                <a :href="'/erp/product/detail/' + order_item.p.id" target="_blank">
                                                    {{order_item.p.sku}}
                                                </a>
                                            </div>
                                            <div>
                                                <a :href="order_item.p.view_item_url" target="_blank">
                                                    {{order_item.p.item_id}}
                                                </a>
                                            </div>
                                        </td>
                                        <td class="center">
                                            <div>RMB
                                                {{order_item.oi.transaction_price_rmb}} × {{order_item.oi.quantity}}
                                            </div>
                                            <div>=RMB
                                                {{order_item.oi.transaction_price_rmb * order_item.oi.quantity}}
                                            </div>
                                        </td>
                                        <td></td>
                                        <td class="center">
                                            {{order_item.oi.transaction_price_currency}}
                                            {{order_item.oi.transaction_price * order_item.oi.quantity}}
                                        </td>
                                        <td>
                                        </td>
                                        <td></td>
                                    </tr>
                                </template>
                                </tbody>
                                <tfoot>
                                <tr>
                                    <td colspan="8">
                                        Hello World!
                                    </td>
                                </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                    <hr/>
                    <div class="row">
                        <div class="col-xs-12">
                            <button class="btn btn-xs btn-info">添加</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">操作日志</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">

                </div>
            </div>
        </div>
    </div>
</div>
{%template "erp/ddlc/order/order_detail.var" .%}
<script type="text/javascript">
    var vm = new Vue({
        el: "#order_detail",
        data: {
            "detail": {
                "order": {},
                "status": {},
                "shop": {},
                "order_type": {},
                "order_hold_type": {},
                "shipping_address": {},
                "order_item_list": []
            }
        },
        mounted: function () {
            var this_vm = this;

            $.ajax(
                {
                    "dataType": 'json',
                    "url": '{% url "ErpOrder.DetailData"%}',
                    "data": {
                        "id": order_id
                    },
                    "success": function (data) {
                        if (data.success == false) {
                            $.msg.error(data.message);
                            return;
                        }
                        this_vm.detail = data;
                    }
                });
        },
        methods: {
            get_payal_address: function () {
                $.ajax(
                    {
                        "dataType": 'json',
                        "url": '{% url "ErpOrder.GetPaypalShippingAddress"%}',
                        "data": {
                            "order_id": order_id
                        },
                        "success": function (data) {
                            console.log(data);
                            alert(data);
                        }
                    });
            }
        }
    });
</script>
{% site_footer %}
