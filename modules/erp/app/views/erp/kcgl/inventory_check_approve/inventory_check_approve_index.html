{%header "盘点审批" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="kcgl-menu">库存管理</li>
            <li class="active" data-menu="kcgl-inventorycheck-approve-menu">盘点审批</li>
        </ul>
    </div>
    <div class="page-content">
        <div style="margin-left: -5px; margin-right: -5px;">
            <div class="col-xs-12">
                <fieldset>
                    <legend style="font-size: 14px;line-height: 28px;">
                        盘点单
                    </legend>
                </fieldset>
            </div>
            <div class="col-xs-12">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#inventoryCheckList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="approveInventoryCheck()">
                        <i class="ace-icon fa fa-check"></i>
                        核准
                    </button>
                    <button class="btn btn-yellow btn-sm" @click="backInventoryCheck()">
                        <i class="ace-icon fa fa-reply"></i>
                        驳回
                    </button>
                </div>
                <div>
                    <table id="inventoryCheckList" class="table table-striped table-bordered table-hover"></table>
                    <div class="todo">1、盘点单明细查看；2、记录库存变更历史。</div>
                </div>
            </div>
            <div class="col-xs-12" style="margin-top: 30px;">
                <fieldset>
                    <legend style="font-size: 14px;line-height: 28px;">
                        盘点单明细（批次号： {{bill_code}}）
                    </legend>
                </fieldset>
            </div>
            <div class="col-xs-12">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadEntryList('#inventoryCheckEntryList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div>
                    <table id="inventoryCheckEntryList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "bill_id": 0,
            "bill_code": ""
        },
        mounted: function () {
            var this_vm = this;

            // inventory check
            initDataTable(
                '#inventoryCheckList',
                {
                    "sAjaxSource": '{%url "ErpInventoryCheckApprove.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "ic.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "ic.code", "title": "批次号", "bSearchable": true, "width": 160},
                        {"mDataProp": "st.name", "title": "仓库", "bSearchable": false, "width": 160},
                        {"mDataProp": "ic.desc", "title": "备注", "bSearchable": true},
                        {"mDataProp": "ic.check_date", "title": "盘点日期", "bSearchable": false, "width": 85},
                        {"mDataProp": "cu.nick_name", "title": "盘点人", "bSearchable": true, "width": 75},
                        {"mDataProp": "au.nick_name", "title": "审批人", "bSearchable": true, "width": 75},
                        {"mDataProp": "ss.name", "title": "状态", "bSearchable": true, "width": 80},
                        {"mDataProp": "ic.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "ic.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#inventoryCheckList').on('click', 'tbody tr', function () {

                $("#inventoryCheckList").find('tbody tr').each(function () {
                    var tableRow = $(this).closest('tr');
                    var checkbox = tableRow.find('td:first-child input:checkbox')[0];
                    if (checkbox) {
                        checkbox.checked = false;
                        tableRow.removeClass('hilight');
                    }
                });

                var tableRow = $(this);
                var checkbox = tableRow.find('td:first-child input:checkbox')[0];
                if (checkbox) {
                    checkbox.checked = true;
                    tableRow.addClass('hilight');

                    var id = $(this).find('td:first-child input:checkbox').val();
                    vm.bill_id = id;
                    vm.reloadEntryList();
                }
            });

            // inventory check entry
            initDataTable(
                '#inventoryCheckEntryList',
                {
                    "sAjaxSource": '{%url "ErpInventoryCheckEntry.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "ice.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "sl.name", "title": "库位", "bSearchable": false, width: 120},
                        {"mDataProp": "p.sku", "title": "SKU", "bSearchable": false, width: 120},
                        {"mDataProp": "p.name", "title": "商品", "bSearchable": false},
                        {"mDataProp": "ice.pre_qty", "title": "盘点前库存", "bSearchable": false, width: 100},
                        {"mDataProp": "ice.check_qty", "title": "盘点库存", "bSearchable": false, width: 100},
                        {"mDataProp": "ice.qty_diff", "title": "库存差值", "bSearchable": false, width: 100},
                        {"mDataProp": "ice.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "ice.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'bill_id', 'value': this_vm.bill_id});

                        $.ajax(
                            {
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success == false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data.list_data);

                                    vm.bill_code = data.bill_code
                                }
                            });
                    }
                }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#inventoryCheckList');
            },
            reloadEntryList: function () {
                reloadList('#inventoryCheckEntryList');
            },
            approveInventoryCheck: function () {
                var id_list = [];
                $('#inventoryCheckList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length != 1) {
                    $.msg.alert("请选择一行数据！");
                    return;
                }

                showMask("提交中...");
                $.ajax({
                        url: '{%url "ErpInventoryCheckApprove.Approve"%}',
                        type: "POST",
                        contentType: 'application/json',
                        data: {
                            "check_id": id_list[0]
                        },
                        success: function (data) {
                            hideMask();
                            if (data.success == false) {
                                $.msg.error(data.message);
                                //return;
                            }
                            else {
                                $.msg.show(data.message);
                                vm.reloadList();
                                //return;
                            }
                        }
                    }
                );
            },
            backInventoryCheck: function () {
                var id_list = [];
                $('#inventoryCheckList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length != 1) {
                    $.msg.alert("请选择一行数据！");
                    return;
                }

                showMask("提交中...");
                $.ajax({
                        url: '{%url "ErpInventoryCheckApprove.Back"%}',
                        type: "POST",
                        contentType: 'application/json',
                        data: {
                            "check_id": id_list[0]
                        },
                        success: function (data) {
                            hideMask();
                            if (data.success == false) {
                                $.msg.error(data.message);
                                //return;
                            }
                            else {
                                $.msg.show(data.message);
                                vm.reloadList();
                                //return;
                            }
                        }
                    }
                );
            }
        }
    });
</script>
{%footer%}
