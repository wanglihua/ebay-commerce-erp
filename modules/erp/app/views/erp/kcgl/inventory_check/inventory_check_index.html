{%header "库存盘点" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="kcgl-menu">库存管理</li>
            <li class="active" data-menu="kcgl-inventorycheck-menu">库存盘点</li>
        </ul>
    </div>
    <div class="page-content">
        <div style="margin-left: -5px; margin-right: -5px;">
            <div class="col-xs-12">
                <fieldset>
                    <legend style="font-size: 14px;line-height: 28px;">
                        盘点单
                    </legend>
                </fieldset>
            </div>
            <div class="col-xs-12">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#inventoryCheckList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showInventoryCheckDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-purple btn-sm" @click="submitInventoryCheck()">
                        <i class="ace-icon fa fa-rotate-right"></i>
                        提交
                    </button>
                    <button class="btn btn-yellow btn-sm" @click="backInventoryCheck()">
                        <i class="ace-icon fa fa-rotate-left"></i>
                        回退
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteInventoryCheck()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="inventoryCheckList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
            <div class="col-xs-12" style="margin-top: 30px;">
                <fieldset>
                    <legend style="font-size: 14px;line-height: 28px;">
                        盘点单明细（批次号： {{bill_code}}）
                    </legend>
                </fieldset>
            </div>
            <div class="col-xs-12">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadEntryList('#inventoryCheckEntryList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showInventoryCheckEntryDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteInventoryCheckEntry()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="inventoryCheckEntryList" class="table table-striped table-bordered table-hover"></table>
                    <div class="todo">1、状态下拉过滤</div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="inventoryCheckDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">库存盘点详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="inventoryCheckDetailForm">
                                <input id="inventory_check_id" name="bill_detail.inventory_check.id" type="hidden" v-model.number="bill_detail.inventory_check.id"/>
                                <input id="inventory_check_version" name="bill_detail.inventory_check.version" type="hidden" v-model.number="bill_detail.inventory_check.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="code" class="col-xs-2 control-label">批次号</label>
                                            <div class="col-xs-10">
                                                <input id="code" name="bill_detail.inventory_check.code" type="text" readonly="readonly" class="input-sm form-control" v-model="bill_detail.inventory_check.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="stock_id" class="col-xs-2 control-label">仓库</label>
                                            <div class="col-xs-10">
                                                <select id="stock_id" name="bill_detail.inventory_check.stock_id" class="input-sm form-control" v-model.number="bill_detail.inventory_check.stock_id">
                                                    <template v-for="stock in bill_detail.stock_list">
                                                        <option :value="stock.id">{{stock.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="check_date" class="col-xs-2 control-label">盘点日期</label>
                                            <div class="col-xs-10">
                                                <input id="check_date" name="bill_detail.inventory_check.check_date" type="text" readonly="readonly" class="input-sm form-control" v-model="bill_detail.inventory_check.check_date"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-2 control-label">备注</label>
                                            <div class="col-xs-10">
                                                <textarea id="desc" name="bill_detail.inventory_check.desc" rows="2" class="input-sm form-control" v-model="bill_detail.inventory_check.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveInventoryCheck()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="inventoryCheckEntryDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">库存盘点明细详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="inventoryCheckEntryDetailForm">
                                <input id="inventory_check_entry_id" name="entry_detail.check_entry.id" type="hidden" v-model.number="entry_detail.check_entry.id"/>
                                <input id="inventory_check_entry_version" name="entry_detail.check_entry.version" type="hidden" v-model.number="entry_detail.check_entry.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="check_code" class="col-xs-2 control-label">盘点批次</label>
                                            <div class="col-xs-10">
                                                <input id="check_id" name="entry_detail.check_entry.check_id" type="hidden" class="input-sm form-control" v-model.number="entry_detail.check_entry.check_id"/>
                                                <input id="check_code" name="entry_detail.inventory_check.code" type="text" readonly="readonly" class="input-sm form-control" v-model="entry_detail.inventory_check.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="stock_name" class="col-xs-2 control-label">仓库</label>
                                            <div class="col-xs-10">
                                                <input id="stock_name" name="entry_detail.stock_name" type="text" readonly="readonly" class="input-sm form-control" v-model="entry_detail.stock_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="storage_loc_id" class="col-xs-2 control-label">库位</label>
                                            <div class="col-xs-10">
                                                <select id="storage_loc_id" name="entry_detail.check_entry.storage_loc_id" class="input-sm form-control" v-model.number="entry_detail.check_entry.storage_loc_id">
                                                    <template v-for="storage_loc in entry_detail.storage_loc_list">
                                                        <option :value="storage_loc.id">{{storage_loc.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="product_name" class="col-xs-2 control-label">商品</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="product_id" name="entry_detail.check_entry.product_id" type="hidden" class="input-sm form-control" v-model.number="entry_detail.check_entry.product_id"/>
                                                    <input id="product_name" name="entry_detail.product_name" type="text" class="input-sm form-control" readonly="readonly" v-model="entry_detail.product_name"/>
                                                    <span class="input-group-btn">
                                                        <button type="button" class="btn btn-purple btn-sm" @click="showProductSelect()">
                                                            <span class="ace-icon fa fa-search icon-on-right"></span>&nbsp;选择
                                                        </button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="pre_qty" class="col-xs-2 control-label">盘点前库存</label>
                                            <div class="col-xs-10">
                                                <input id="pre_qty" name="entry_detail.check_entry.pre_qty" type="text" class="input-sm form-control" v-model.number="entry_detail.check_entry.pre_qty"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="check_qty" class="col-xs-2 control-label">盘点库存</label>
                                            <div class="col-xs-10">
                                                <input id="check_qty" name="entry_detail.check_entry.check_qty" type="text" class="input-sm form-control" v-model.number="entry_detail.check_entry.check_qty"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="qty_diff" class="col-xs-2 control-label">库存差值</label>
                                            <div class="col-xs-10">
                                                <input id="qty_diff" name="entry_detail.check_entry.qty_diff" type="text" class="input-sm form-control" v-model.number="entry_detail.check_entry.qty_diff"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveInventoryCheckEntry()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="productSelectDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">产品选择</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="productList" class="table table-striped table-bordered table-hover"></table>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="acceptProductSelect()">
                        <i class="ace-icon fa fa-floppy-o"></i>选择
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "bill_id": 0,
            "bill_code": "",
            "bill_detail": {
                "inventory_check": {}
            },
            "entry_detail": {
                "inventory_check": {},
                "check_entry": {
                    "product_id": 0
                },
                "product_name": "",
                "stock_name": ""
            }
        },
        mounted: function () {
            var this_vm = this;

            // inventory check
            initDataTable(
                '#inventoryCheckList',
                {
                    "sAjaxSource": '{%url "ErpInventoryCheck.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "ic.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "ic.code", "title": "批次号", "bSearchable": true, "width": 160},
                        {"mDataProp": "st.name", "title": "仓库", "bSearchable": true, "width": 160},
                        {"mDataProp": "ic.desc", "title": "备注", "bSearchable": true},
                        {"mDataProp": "ic.check_date", "title": "盘点日期", "bSearchable": false, "width": 85},
                        {"mDataProp": "cu.nick_name", "title": "盘点人", "bSearchable": true, "width": 75},
                        {"mDataProp": "au.nick_name", "title": "审批人", "bSearchable": true, "width": 75},
                        {"mDataProp": "ss.name", "title": "状态", "bSearchable": true, "width": 80},
                        {"mDataProp": "ic.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "ic.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#inventoryCheckList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showInventoryCheckDetail(id);
            });

            $('#inventoryCheckList').on('click', 'tbody tr', function () {

                $("#inventoryCheckList").find('tbody tr').each(function () {
                    var tableRow = $(this).closest('tr');
                    var checkbox = tableRow.find('td:first-child input:checkbox')[0];
                    if (checkbox) {
                        checkbox.checked = false;
                        tableRow.removeClass('hilight');
                    }
                });

                var tableRow = $(this);
                var checkbox = tableRow.find('td:first-child input:checkbox')[0];
                if (checkbox) {
                    checkbox.checked = true;
                    tableRow.addClass('hilight');

                    var id = $(this).find('td:first-child input:checkbox').val();
                    vm.bill_id = id;
                    vm.reloadEntryList();
                }
            });

            // inventory check entry
            initDataTable(
                '#inventoryCheckEntryList',
                {
                    "sAjaxSource": '{%url "ErpInventoryCheckEntry.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "ice.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "sl.name", "title": "库位", "bSearchable": false, width: 120},
                        {"mDataProp": "p.sku", "title": "SKU", "bSearchable": false, width: 120},
                        {"mDataProp": "p.name", "title": "商品", "bSearchable": false},
                        {"mDataProp": "ice.pre_qty", "title": "盘点前库存", "bSearchable": false, width: 100},
                        {"mDataProp": "ice.check_qty", "title": "盘点库存", "bSearchable": false, width: 100},
                        {"mDataProp": "ice.qty_diff", "title": "库存差值", "bSearchable": false, width: 100},
                        {"mDataProp": "ice.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "ice.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'bill_id', 'value': this_vm.bill_id});

                        $.ajax(
                            {
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success == false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data.list_data);

                                    vm.bill_code = data.bill_code
                                }
                            });
                    }
                }
            );

            $('#inventoryCheckEntryList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showInventoryCheckEntryDetail(id);
            });

            // Product
            initSingleSelectDataTable(
                '#productList',
                {
                    "sAjaxSource": '{%url "ErpInventoryCheckEntry.ProductSelectListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "prd.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "prd.sku", "title": "SKU", "bSearchable": true},
                        {"mDataProp": "prd.name", "title": "商品名称", "bSearchable": true},
                        {"mDataProp": "prd.desc", "title": "备注", "bSearchable": true},
                        {"mDataProp": "st.name", "title": "状态", "bSearchable": false, "width": 60}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");
                        $.ajax(
                            {
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success == false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data);
                                }
                            }
                        );
                    }
                }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#inventoryCheckList');
            },
            showInventoryCheckDetail: function (id) {
                showMask("加载中...");
                $("#inventoryCheckDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpInventoryCheck.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.bill_detail = result;
                            $('#inventoryCheckDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveInventoryCheck: function () {
                showMask("提交中...");
                var form = $("#inventoryCheckDetailForm");
                var valid = validate(form, {
                    'bill_detail.inventory_check.code': {
                        required: false
                    },
                    'bill_detail.inventory_check.stock_id': {
                        required: true, digits: true
                    },
                    'bill_detail.inventory_check.desc': {
                        required: false, minlength: 2, maxlength: 400
                    },
                    'bill_detail.inventory_check.check_date': {
                        required: true
                    },
                    'bill_detail.inventory_check.status_id': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpInventoryCheck.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.bill_detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#inventoryCheckDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteInventoryCheck: function () {
                var id_list = [];
                $('#inventoryCheckList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpInventoryCheck.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            },
            reloadEntryList: function () {
                reloadList('#inventoryCheckEntryList');
            },
            showInventoryCheckEntryDetail: function (id) {
                showMask("加载中...");
                $("#inventoryCheckEntryDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpInventoryCheckEntry.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id,
                            "bill_id": vm.bill_id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.entry_detail = result;
                            $('#inventoryCheckEntryDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveInventoryCheckEntry: function () {
                showMask("提交中...");
                var form = $("#inventoryCheckEntryDetailForm");
                var valid = validate(form, {
                    'entry_detail.check_entry.check_id': {
                        required: true, digits: true
                    },
                    'entry_detail.check_entry.storage_loc_id': {
                        required: true, digits: true
                    },
                    'entry_detail.check_entry.product_id': {
                        required: true, digits: true
                    },
                    'entry_detail.check_entry.pre_qty': {
                        required: true, digits: true
                    },
                    'entry_detail.check_entry.check_qty': {
                        required: true, digits: true
                    },
                    'entry_detail.check_entry.qty_diff': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpInventoryCheckEntry.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.entry_detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#inventoryCheckEntryDetailDialog').modal('hide');
                                    vm.reloadEntryList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteInventoryCheckEntry: function () {
                var id_list = [];
                $('#inventoryCheckEntryList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpInventoryCheckEntry.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadEntryList();
                        }
                    });
                });
            },
            showProductSelect: function () {
                $('#productSelectDialog').modal(modalOptions);
            },
            acceptProductSelect: function () {
                var id_list = [];
                $('#productList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0 || id_list.length > 1) {
                    $.msg.alert("请选择一行数据！");
                    return;
                }

                var product_id = parseInt(id_list[0]);
                vm.entry_detail.check_entry.product_id = product_id;

                $.ajax({
                    url: '{%url "ErpProduct.GetProductInfo"%}',
                    type: "POST",
                    data: {"product_id": product_id},
                    success: function (data) {
                        vm.entry_detail.product_name = data.product.sku + "  " + data.product.name;
                    }
                });

                $('#productSelectDialog').modal('hide');
            },
            submitInventoryCheck: function () {
                var id_list = [];
                $('#inventoryCheckList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0 || id_list.length > 1) {
                    $.msg.alert("请选择一行数据！");
                    return;
                }

                $.msg.confirm("确认要提交吗？", function () {
                    $.ajax({
                            url: '{%url "ErpInventoryCheck.Submit"%}',
                            type: "POST",
                            data: {
                                "check_id": id_list[0]
                            },
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    vm.bill_code = "请先单击盘点单行";
                                    vm.reloadList();
                                    vm.reloadEntryList();
                                    //return;
                                }
                            }
                        }
                    );
                });
            },
            backInventoryCheck: function () {
                var id_list = [];
                $('#inventoryCheckList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0 || id_list.length > 1) {
                    $.msg.alert("请选择一行数据！");
                    return;
                }

                $.msg.confirm("确认要回退吗？", function () {
                    $.ajax({
                            url: '{%url "ErpInventoryCheck.Back"%}',
                            type: "POST",
                            data: {
                                "check_id": id_list[0]
                            },
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    vm.bill_code = "请先单击盘点单行";
                                    vm.reloadList();
                                    vm.reloadEntryList();
                                    //return;
                                }
                            }
                        }
                    );
                });
            }
        }
    });
</script>
