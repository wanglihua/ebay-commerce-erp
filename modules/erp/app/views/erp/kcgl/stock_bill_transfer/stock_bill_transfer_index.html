{%header "分仓调拨" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="kcgl-menu">库存管理</li>
            <li class="active" data-menu="kcgl-stockbill-transfer-menu">分仓调拨</li>
        </ul>
    </div>
    <div class="page-content">
        <div style="margin-left: -5px; margin-right: -5px;">
            <div class="col-xs-12">
                <fieldset>
                    <legend style="font-size: 14px;line-height: 28px;">
                        调拨单
                    </legend>
                </fieldset>
            </div>
            <div class="col-xs-12">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#stockBillList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showStockBillDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteStockBill()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="stockBillList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
            <div class="col-xs-12" style="margin-top: 30px;">
                <fieldset>
                    <legend style="font-size: 14px;line-height: 28px;">
                        调拨单明细（批次号：{{bill_code}}）
                    </legend>
                </fieldset>
            </div>
            <div class="col-xs-12">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#stockBillEntryList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showStockBillEntryDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteStockBillEntry()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="stockBillEntryList" class="table table-striped table-bordered table-hover"></table>
                    <div class="todo">1、调拨单明细等。</div>
                </div>
            </div>
            <div class="col-xs-12">

            </div>
        </div>
    </div>
    <div class="modal fade" id="stockBillDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">分仓调拨单详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="stockBillDetailForm">
                                <input id="stock_bill_id" name="bill_detail.stock_bill.id" type="hidden" v-model.number="bill_detail.stock_bill.id"/>
                                <input id="stock_bill_version" name="bill_detail.stock_bill.version" type="hidden" v-model.number="bill_detail.stock_bill.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="code" class="col-xs-2 control-label">批次号</label>
                                            <div class="col-xs-10">
                                                <input id="code" name="bill_detail.stock_bill.code" type="text" disabled="disabled" class="input-sm form-control" v-model="bill_detail.stock_bill.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="src_stock_id" class="col-xs-2 control-label">调出仓库</label>
                                            <div class="col-xs-10">
                                                <select id="src_stock_id" name="bill_detail.stock_bill.src_stock_id" class="input-sm form-control" v-model.number="bill_detail.stock_bill.src_stock_id">
                                                    <template v-for="stock in bill_detail.stock_list">
                                                        <option :value="stock.id">{{stock.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="stock_id" class="col-xs-2 control-label">调入仓库</label>
                                            <div class="col-xs-10">
                                                <select id="stock_id" name="bill_detail.stock_bill.stock_id" class="input-sm form-control" v-model.number="bill_detail.stock_bill.stock_id">
                                                    <template v-for="stock in bill_detail.stock_list">
                                                        <option :value="stock.id">{{stock.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-2 control-label">备注</label>
                                            <div class="col-xs-10">
                                                <textarea id="desc" name="bill_detail.stock_bill.desc" rows="2" class="input-sm form-control" v-model="bill_detail.stock_bill.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="date" class="col-xs-2 control-label">日期</label>
                                            <div class="col-xs-10">
                                                <input id="date" name="bill_detail.stock_bill.date" type="text" disabled="disabled" class="input-sm form-control" v-model="bill_detail.stock_bill.date"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveStockBill()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="stockBillEntryDetailDialog">
        <div class="modal-dialog" style="width: 420px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">调拨单明细详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="stockBillEntryDetailForm">
                                <input id="stock_bill_entry_id" name="entry_detail.id" type="hidden" v-model.number="entry_detail.id"/>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="storage_loc_id" class="col-xs-3 control-label">仓位</label>
                                            <div class="col-xs-9">
                                                <input id="storage_loc_id" name="entry_detail.storage_loc_id" type="text" class="input-sm form-control" v-model.number="entry_detail.storage_loc_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="product_id" class="col-xs-3 control-label">商品</label>
                                            <div class="col-xs-9">
                                                <input id="product_id" name="entry_detail.product_id" type="text" class="input-sm form-control" v-model.number="entry_detail.product_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="qty" class="col-xs-3 control-label">调拨数量</label>
                                            <div class="col-xs-9">
                                                <input id="qty" name="entry_detail.qty" type="text" class="input-sm form-control" v-model.number="entry_detail.qty"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="price" class="col-xs-3 control-label">单价</label>
                                            <div class="col-xs-9">
                                                <input id="price" name="entry_detail.price" type="text" class="input-sm form-control" v-model.number="entry_detail.price"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveStockBillEntry()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "bill_id": 0,
            "bill_code": "",
            "bill_detail": {
                "stock_bill": {}
            },
            "entry_detail": {
                "bill": {},
                "bill_entry": {
                    "product_id": 0
                },
                "product_name": ""
            }
        },
        mounted: function () {
            var this_vm = this;

            // stock bill
            initDataTable(
                '#stockBillList',
                {
                    "sAjaxSource": '{%url "ErpStockBillTransfer.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "sb.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "sb.code", "title": "批次号", "bSearchable": true, "width": 160},
                        {"mDataProp": "sc.name", "title": "调出仓库", "bSearchable": true, "width": 160},
                        {"mDataProp": "dc.name", "title": "调入仓库", "bSearchable": true, "width": 160},
                        {"mDataProp": "sb.desc", "title": "备注", "bSearchable": true},
                        {"mDataProp": "sb.date", "title": "日期", "bSearchable": false, "width": 85},
                        {"mDataProp": "u.nick_name", "title": "操作人", "bSearchable": true, "width": 75},
                        {"mDataProp": "sb.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "sb.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#stockBillList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showStockBillDetail(id);
            });

            $('#stockBillList').on('click', 'tbody tr', function () {

                $("#stockBillList").find('tbody tr').each(function () {
                    var tableRow = $(this).closest('tr');
                    var checkbox = tableRow.find('td:first-child input:checkbox')[0];
                    if (checkbox) {
                        checkbox.checked = false;
                        tableRow.removeClass('hilight');
                    }
                });

                var tableRow = $(this);
                var checkbox = tableRow.find('td:first-child input:checkbox')[0];
                if (checkbox) {
                    checkbox.checked = true;
                    tableRow.addClass('hilight');

                    var id = $(this).find('td:first-child input:checkbox').val();
                    vm.bill_id = id;
                    vm.reloadEntryList();
                }
            });

            // stock bill entry
            initDataTable(
                '#stockBillEntryList',
                {
                    "sDom": "<'row'<'col-xs-12't>>",
                    "sAjaxSource": '{%url "ErpStockBillTransferEntry.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "bPaginate": false,
                    "aoColumns": [
                        {
                            "mDataProp": "id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "bill_id", "title": "批次", "bSearchable": false},
                        {"mDataProp": "storage_loc_id", "title": "仓位", "bSearchable": false},
                        {"mDataProp": "product_id", "title": "商品", "bSearchable": false},
                        {"mDataProp": "pre_qty", "title": "当前库存", "bSearchable": false},
                        {"mDataProp": "qty", "title": "调拨数量", "bSearchable": false},
                        {"mDataProp": "price", "title": "单价", "bSearchable": false},
                        {"mDataProp": "amount", "title": "金额", "bSearchable": false}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'bill_id', 'value': this_vm.bill_id});

                        $.ajax(
                            {
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success == false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data.list_data);

                                    vm.bill_code = data.bill_code
                                }
                            });
                    }
                }
            );

            $('#stockBillEntryList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showStockBillEntryDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#stockBillList');
            },
            showStockBillDetail: function (id) {
                showMask("加载中...");
                $("#stockBillDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpStockBillTransfer.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.bill_detail = result;
                            $('#stockBillDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveStockBill: function () {
                showMask("提交中...");
                var form = $("#stockBillDetailForm");
                var valid = validate(form, {
                    'bill_detail.stock_bill.code': {
                        required: false
                    },
                    'bill_detail.stock_bill.src_stock_id': {
                        required: true, digits: true
                    },
                    'bill_detail.stock_bill.stock_id': {
                        required: true, digits: true
                    },
                    'bill_detail.stock_bill.desc': {
                        required: false, minlength: 2, maxlength: 400
                    },
                    'bill_detail.stock_bill.date': {
                        required: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpStockBillTransfer.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.bill_detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#stockBillDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteStockBill: function () {
                var id_list = [];
                $('#stockBillList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpStockBillTransfer.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            },
            reloadEntryList: function () {
                reloadList('#stockBillEntryList');
            },
            showStockBillEntryDetail: function (id) {
                showMask("加载中...");
                $("#stockBillEntryDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpStockBillTransferEntry.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#stockBillEntryDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveStockBillEntry: function () {
                showMask("提交中...");
                var form = $("#stockBillEntryDetailForm");
                var valid = validate(form, {
                    'entry_detail.bill_id': {
                        required: true, digits: true
                    },
                    'entry_detail.storage_loc_id': {
                        required: true, digits: true
                    },
                    'entry_detail.product_id': {
                        required: true, digits: true
                    },
                    'entry_detail.pre_qty': {
                        required: true, digits: true
                    },
                    'entry_detail.qty': {
                        required: true, digits: true
                    },
                    'entry_detail.price': {
                        required: false, digits: true
                    },
                    'entry_detail.amount': {
                        required: false, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpStockBillTransferEntry.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#stockBillEntryDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteStockBillEntry: function () {
                var id_list = [];
                $('#stockBillEntryList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpStockBillTransferEntry.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
