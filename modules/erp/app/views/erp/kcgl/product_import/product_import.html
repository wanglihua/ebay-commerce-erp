{%header "商品导入" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="kcgl-menu">库存管理</li>
            <li class="active" data-menu="kcgl-product-import-menu">商品导入导出</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList()">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button id="btnImport" class="btn btn-purple btn-sm">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导入
                    </button>
                    <button class="btn btn-purple btn-sm" @click="exportProduct()">
                        <i class="ace-icon fa fa-file-excel-o"></i>
                        导出
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteImportProduct()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除商品
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteImportBatch()">
                        <i class="ace-icon fa fa-trash"></i>
                        删除批次
                    </button>
                    {%/*
                    <button class="btn btn-success btn-sm" @click="confirmProductImport()">
                        <i class="ace-icon fa fa-floppy-o"></i>
                        确认
                    </button>
                    <button class="btn btn-danger btn-sm" @click="clearProductImport()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        清空
                    </button>
                    */%}
                    <div style="margin-top: 10px;">
                        <a href="/static/excel-template/product_import.xlsx">下载Excel模板</a>
                    </div>
                    <div class="row" style="margin-top: 15px;margin-bottom: 5px;">
                        <div id="query" class="col-xs-12 query">
                            <label class="control-label no-padding-right" for="batch_code">导入批次号</label>
                            <select id="batch_code" name="page.batch_code" v-model.number="page.batch_code" style="width: 135px;" @change="refreshList()">
                                <option :value="0">-导入批次号-</option>
                                <template v-for="batch_code in page.batch_code_list">
                                    <option :value="batch_code">{{batch_code}}</option>
                                </template>
                            </select>
                            <label class="control-label no-padding-right" for="product_sku_query">商品编号</label>
                            <input id="product_sku_query" class="input-sm" name="product_sku_query" placeholder="商品SKU查询" type="text" v-model="page.product_sku_query" style="width: 100px;"/>
                            <button class="btn btn-mini btn-primary" @click="refreshList()">
                                &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="productList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/static/lib/plupload/moxie.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/plupload.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/zh_CN.js"></script>

<script type="text/javascript">

    function initUploader() {
        var uploader = new plupload.Uploader({
            runtimes: 'html5,flash,html4',
            multi_selection: false,

            browse_button: 'btnImport',
            file_data_name: "excel_file",

            url: '{%url "ErpProductImport.Upload"%}',
            max_file_size: '10000kb',

            filters: [
                {title: "Excel文件", extensions: "xlsx"}
            ],

            flash_swf_url: '/plupload/js/Moxie.swf',

            init: {
                FilesAdded: function () {
                    showMask("上传中，请稍候...");
                    uploader.start();
                },
                FileUploaded: function (up, file, response) {
                    hideMask();
                    var result = JSON.parse(response.response);
                    if (result.success !== true) {
                        $.msg.error(result.message);
                    } else {
                        loadVmPageData();
                        reloadList('#productList');
                        $.msg.show(result.message);
                    }
                },
                Error: function (up, err) {
                    $.msg.error("上传发生错误：" + err.code + ", " + err.message);
                }
            }
        });

        uploader.init();
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "page": {
                "batch_code": 0,
                "product_sku_query": ""
            },
            "detail": {
                "product_import": {}
            }
        },
        mounted: function () {
            var this_vm = this;

            loadPageData(this_vm);

            initDataTable(
                '#productList',
                {
                    "sAjaxSource": '{%url "ErpProductImport.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "prd.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "prd.sku", "title": "商品SKU", "bSearchable": true, "width": 150},
                        {"mDataProp": "prd.cn_name", "title": "商品名称", "bSearchable": true},
                        {
                            "mDataProp": "prd.cost_price", "title": "成本价", "bSearchable": false, "width": 80,
                            "render": function (data, type, row) {
                                if (data !== 0) {
                                    return "RMB " + data;
                                }
                                else {
                                    return "";
                                }
                            }
                        },
                        {
                            "mDataProp": "prd.length", "title": "长度", "bSearchable": false, "width": 80,
                            "render": function (data, type, row) {
                                if (data !== 0) {
                                    return data + " cm";
                                }
                                else {
                                    return "";
                                }
                            }
                        },
                        {
                            "mDataProp": "prd.width", "title": "宽度", "bSearchable": false, "width": 80,
                            "render": function (data, type, row) {
                                if (data !== 0) {
                                    return data + " cm";
                                }
                                else {
                                    return "";
                                }
                            }
                        },
                        {
                            "mDataProp": "prd.height", "title": "高度", "bSearchable": false, "width": 80,
                            "render": function (data, type, row) {
                                if (data !== 0) {
                                    return data + " cm";
                                }
                                else {
                                    return "";
                                }
                            }
                        },
                        {
                            "mDataProp": "prd.weight", "title": "重量", "bSearchable": false, "width": 80,
                            "render": function (data, type, row) {
                                if (data !== 0) {
                                    return data + " kg";
                                }
                                else {
                                    return "";
                                }
                            }
                        },
                        {"mDataProp": "st.name", "title": "状态", "bSearchable": true, "width": 80},
                        {"mDataProp": "prd.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "prd.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'batch_code', 'value': this_vm.page.batch_code});
                        aoData.push({'name': 'product_sku_query', 'value': this_vm.page.product_sku_query});

                        $.ajax(
                            {
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();

                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data);
                                }
                            });
                    }
                }
            );

            initUploader();
        },
        methods: {
            reloadList: function () {
                reloadList('#productList');
            },
            refreshList: function () {
                refreshList('#productList');
            },
            deleteImportProduct: function () {
                var id_list = [];
                $('#productList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length === 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpProductImport.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            },
            deleteImportBatch: function () {
                if (vm.page.batch_code === 0) {
                    $.msg.error("请选择要删除的导入批次！");
                    return;
                }

                $.msg.confirm("确认要删除导入批次吗？", function () {
                    $.ajax({
                        url: '{%url "ErpProductImport.BatchDelete"%}',
                        type: "POST",
                        data: {"batch_code": vm.page.batch_code},
                        success: function (data) {
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }

                            //重新加载页面数据，更新批次下拉框
                            loadVmPageData();

                            vm.page.batch_code = 0;
                            vm.refreshList();
                        }
                    });
                });
            },
            exportProduct: function () {
                var params = $.param({"batch_code": page.batch_code});
                var url = '{%url "ErpProductExport.Export"%}' + "?" + params;
                $('<form method="post" action="' + url + '"></form>').appendTo('body').submit().remove();
            }
        }
    });

    function loadPageData(this_vm) {
        $.ajax({
                url: '{%url "ErpProductImport.PageData" %}',
                type: "POST",
                success: function (result) {
                    if (result.success === false) {
                        $.msg.error(result.message);
                        return;
                    }
                    this_vm.page = result;
                }
            }
        );
    }

    function loadVmPageData() {
        loadPageData(vm);
    }
</script>
{%footer%}
