{% site_header "商品详情" . %}
<div class="main-container" id="main-container">
    <div id="product_detail" style="width: 1024px;margin-left: auto;margin-right: auto;">
        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">图片信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div id="product_image_list" class="row">
                        <div class="col-xs-12">
                            <template v-for="product_image in detail.product_image_list">
                                <a :href="product_image.url" target="_blank"><img :src="product_image.url" alt="" style="width:80px;height:80px;"/></a>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">商品信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <form class="form-horizontal" role="form" id="productDetailForm">
                        <div class="row">

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_sku" class="col-xs-4 control-label">SKU：</label>
                                    <div class="col-xs-8">
                                        <input id="product_sku" name="detail.product.sku" type="text" class="input-sm form-control" v-model="detail.product.sku"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_cnname" class="col-xs-4 control-label">名称：</label>
                                    <div class="col-xs-8">
                                        <input id="product_cnname" name="detail.product.cn_name" type="text" class="input-sm form-control" v-model="detail.product.cn_name"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-6">
                                <div class="form-group">
                                    <label for="product_english_name" class="col-xs-2 control-label">英文名称：</label>
                                    <div class="col-xs-10">
                                        <input id="product_english_name" name="detail.product.name" type="text" class="input-sm form-control" v-model="detail.product.name"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_cate_id" class="col-xs-4 control-label">商品类别：</label>
                                    <div class="col-xs-8">
                                        <select id="product_cate_id" name="detail.product.cate_id" class="input-sm form-control" v-model.number="detail.product.cate_id">
                                            <option value=""></option>
                                            <template v-for="cate in detail.product_cate_list">
                                                <option :value="cate.cate_id">{{cate.cate_name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_supplier_id" class="col-xs-4 control-label">供应商：</label>
                                    <div class="col-xs-8">
                                        <select id="product_supplier_id" name="detail.product.supplier_id" class="input-sm form-control" v-model.number="detail.product.supplier_id">
                                            <option value=""></option>
                                            <template v-for="supplier in detail.supplier_list">
                                                <option :value="supplier.id">{{supplier.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_package_mateiral_id" class="col-xs-4 control-label">包材类型：</label>
                                    <div class="col-xs-8">
                                        <select id="product_package_mateiral_id" name="detail.product.pkg_mtrl_id" class="input-sm form-control" v-model.number="detail.product.pkg_mtrl_id">
                                            <option value=""></option>
                                            <template v-for="package_material in detail.package_material_list">
                                                <option :value="package_material.id">{{package_material.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_cost_price" class="col-xs-4 control-label">成本价：</label>
                                    <div class="col-xs-8">
                                        <input id="product_cost_price" name="detail.product.cost_price" type="text" class="input-sm form-control" v-model="detail.product.cost_price"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_status_id" class="col-xs-4 control-label">状态：</label>
                                    <div class="col-xs-8">
                                        <select id="product_status_id" name="detail.product.status_id" class="input-sm form-control" v-model.number="detail.product.status_id">
                                            <template v-for="status in detail.status_list">
                                                <option :value="status.id">{{status.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-xs-6">
                                <div class="form-group">
                                    <label for="product_desc" class="col-xs-2 control-label">描述：</label>
                                    <div class="col-xs-10">
                                        <textarea id="product_desc" name="detail.product.desc" rows="3" class="input-sm form-control" v-model="detail.product.desc"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                    <hr/>
                    <div class="row">
                        <div class="col-xs-12" style="text-align: right;">
                            <button type="button" class="btn btn-success btn-sm" @click="saveProduct">
                                <i class="ace-icon fa fa-floppy-o"></i>保存
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">商品库存</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="product_inventory_list" class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th class="center" style="width: 100px;">SKU</th>
                                    <th class="center">商品名称</th>
                                    <th class="center" style="width: 120px;">仓库</th>
                                    <th class="center" style="width: 120px;">库位</th>
                                    <th class="center" style="width: 100px;">库存</th>
                                </tr>
                                </thead>
                                <tbody>
                                <template v-for="inventory in detail.inventory_list">
                                    <tr>
                                        <td class="center">
                                            {{inventory.p.sku}}
                                        </td>
                                        <td>
                                            {{inventory.p.name}}
                                        </td>
                                        <td class="center">
                                            {{inventory.st.name}}
                                        </td>
                                        <td class="center">
                                            {{inventory.sl.name}}
                                        </td>
                                        <td class="center">
                                            {{inventory.nvt.qty}}
                                        </td>
                                    </tr>
                                </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller widget-title">订单记录</h4>
                <div class="widget-toolbar">
                    <label>
                        <small>
                            <a href='{% url "ErpProduct.ProductOrderList" .product_id %}' target="_blank">MORE++</a>
                        </small>
                    </label>
                </div>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="product_order_item_list" class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th class="center" style="width: 50px;">编号</th>
                                    <th class="center">订单编号</th>
                                    <th class="center">Item ID</th>
                                    <th class="center">数量</th>
                                    <th class="center">售价</th>
                                    <th class="center" style="width:120px;">下单时间</th>
                                    <th class="center" style="width:120px;">发货时间</th>
                                    <th class="center">成交店铺</th>
                                    <th class="center" style="width:60px;">状态</th>
                                </tr>
                                </thead>
                                <tbody>
                                <template v-for="(order_item, index) in detail.order_item_list">
                                    <tr>
                                        <td class="center">{{index + 1}}</td>
                                        <td class="center">{{order_item.o.code}}</td>
                                        <td class="center">{{order_item.oi.item_id}}</td>
                                        <td class="center">{{order_item.oi.quantity}}</td>
                                        <td class="center">{{order_item.oi.transaction_price_currency}}&nbsp;{{order_item.oi.transaction_price}}</td>
                                        <td class="center">{{order_item.o.created_time}}</td>
                                        <td class="center">{{order_item.o.shipped_time}}</td>
                                        <td class="center">{{order_item.pf.name}}&nbsp;{{order_item.sa.name}}</td>
                                        <td class="center">{{order_item.s.name}}</td>
                                    </tr>
                                </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller widget-title">消息记录</h4>
                <div class="widget-toolbar">
                    <label>
                        <small>
                            <a href='{% url "ErpProduct.ProductMessageList" .product_id %}' target="_blank">MORE++</a>
                        </small>
                    </label>
                </div>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="message_list" class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th class="center" style="width:50px;">编号</th>
                                    <th style="width: 100px;">店铺</th>
                                    <th class="center" style="width:120px;">时间</th>
                                    <th>内容</th>
                                    <th class="center" style="width:60px;">状态</th>
                                </tr>
                                </thead>
                                <tbody>
                                <template v-for="(message, index) in detail.message_list">
                                    <tr>
                                        <td class="center">{{index + 1}}</td>
                                        <td>
                                            {{message.pf.name}}<br/>{{message.sa.name}}
                                        </td>
                                        <td class="center">{{message.msg.creation_date}}</td>
                                        <td>
                                            <div style="min-width: 280px;white-space:normal; word-break: break-all; word-wrap:break-word;">
                                                {{message.msg.subject}}<br/><br/>
                                                {{message.msg.body}}
                                            </div>
                                        </td>
                                        <td class="center">{{message.s.name}}</td>
                                    </tr>
                                </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller widget-title">操作日志</h4>
                <div class="widget-toolbar">
                    <label>
                        <small>
                            <a href='{% url "ErpProduct.ProductLogList" .product_id %}' target="_blank">MORE++</a>
                        </small>
                    </label>
                </div>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="product_log_list" class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th class="center" style="width: 100px;">编号</th>
                                    <th>操作描述</th>
                                    <th class="center" style="width: 100px;">操作工号</th>
                                    <th class="center" style="width: 120px;">操作时间</th>
                                </tr>
                                </thead>
                                <tbody>
                                <template v-for="(product_log, index) in detail.product_log_list">
                                    <tr>
                                        <td class="center">{{index + 1}}</td>
                                        <td>
                                            <div style="min-width: 280px;white-space:normal;word-break: break-all;word-wrap:break-word;">
                                                {{product_log.operation}}
                                            </div>
                                        </td>
                                        <td class="center">{{product_log.login_name}}</td>
                                        <td class="center">{{product_log.create_time}}</td>
                                    </tr>
                                </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{%template "erp/kcgl/product/product_detail.var" .%}
<script type="text/javascript">
    var vm = new Vue({
        el: "#product_detail",
        data: {
            "detail": {
                "product": {},
                "product_image_list": [],
                "order_item_list": [],
                "message_list": [],
                "product_log_list": []
            }
        },
        mounted: function () {
            var this_vm = this;

            $.ajax(
                {
                    "type": "POST",
                    "dataType": 'json',
                    "url": '{% url "ErpProduct.DetailData"%}',
                    "data": {
                        "id": product_id
                    },
                    "success": function (data) {
                        if (data.success == false) {
                            $.msg.error(data.message);
                            return;
                        }
                        this_vm.detail = data;
                    }
                });
        },
        methods: {
            saveProduct: function () {
                showMask("提交中...");
                var form = $("#productDetailForm");
                var valid = validate(form, {
                    'detail.product.sku': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.product.cn_name': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.product.name': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.product.cate_id': {
                        required: false, digits: true
                    },
                    'detail.product.cost_price': {
                        required: true, number: true
                    },
                    'detail.product.weight': {
                        required: true, number: true
                    },
                    'detail.product.supplier_id': {
                        required: false, digits: true
                    },
                    'detail.product.pkg_mtrl_id': {
                        required: false, digits: true
                    },
                    'detail.product.status_id': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpProduct.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail.product),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    vm.detail.product = data.product;
                                    $.msg.show(data.message);
                                    if (data.is_create == true) {
                                        setTimeout("window.location.href='/erp/product/detail/" + data.product.id + "'", 1000) //重新打开已保存好的商品的详细页面
                                    }
                                    //return;
                                }
                            }
                        }
                    );
                }
            }
        }
    });
</script>
{% site_footer %}
