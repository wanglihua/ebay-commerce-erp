{% site_header "商品详情" . %}
<div class="main-container" id="main-container">
    <div id="product_detail" style="width: 1024px;margin-left: auto;margin-right: auto;">
        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">图片信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div id="product_image_list" class="row">
                        <div class="col-xs-12">
                            <template v-for="product_image in detail.product_image_list">
                                <a :href="product_image.url" target="_blank"><img :src="product_image.url" alt="" style="width:80px;height:80px;"/></a>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">商品信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">

                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="product_sku" class="col-xs-4 control-label">SKU：</label>
                                <div class="col-xs-8">
                                    <input id="product_sku" name="detail.product.sku" type="text" class="input-sm form-control" v-model="detail.product.sku"/>
                                </div>
                            </div>
                        </div>

                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="product_cnname" class="col-xs-4 control-label">名称：</label>
                                <div class="col-xs-8">
                                    <input id="product_cnname" name="detail.product.cn_name" type="text" class="input-sm form-control" v-model="detail.product.cn_name"/>
                                </div>
                            </div>
                        </div>

                        <div class="col-xs-6">
                            <div class="form-group">
                                <label for="product_english_name" class="col-xs-2 control-label">英文名称：</label>
                                <div class="col-xs-10">
                                    <input id="product_english_name" name="detail.product.name" type="text" class="input-sm form-control" v-model="detail.product.name"/>
                                </div>
                            </div>
                        </div>

                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="product_status_id" class="col-xs-4 control-label">状态：</label>
                                <div class="col-xs-8">
                                    <select id="product_status_id" name="detail.product.status_id" class="input-sm form-control" v-model.number="detail.product.status_id">
                                        <template v-for="status in detail.status_list">
                                            <option :value="status.id">{{status.name}}</option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="product_supplier_id" class="col-xs-4 control-label">供应商：</label>
                                <div class="col-xs-8">
                                    <select id="product_supplier_id" name="detail.product.supplier_id" class="input-sm form-control" v-model.number="detail.product.supplier_id">
                                        <option id=""></option>
                                        <template v-for="supplier in detail.supplier_list">
                                            <option :value="supplier.id">{{supplier.name}}</option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">商品库存</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="product_inventory_list" class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th class="center" style="width: 100px;">SKU</th>
                                    <th class="center">商品名称</th>
                                    <th class="center" style="width: 120px;">仓库</th>
                                    <th class="center" style="width: 120px;">库位</th>
                                    <th class="center" style="width: 100px;">库存</th>
                                </tr>
                                </thead>
                                <tbody>
                                <template v-for="inventory in detail.inventory_list">
                                    <tr>
                                        <td class="center">
                                            {{inventory.p.sku}}
                                        </td>
                                        <td>
                                            {{inventory.p.name}}
                                        </td>
                                        <td class="center">
                                            {{inventory.st.name}}
                                        </td>
                                        <td class="center">
                                            {{inventory.sl.name}}
                                        </td>
                                        <td class="center">
                                            {{inventory.nvt.qty}}
                                        </td>
                                    </tr>
                                </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller widget-title">订单记录</h4>
                <div class="widget-toolbar">
                    <label>
                        <small>
                            <a href='{% url "ErpProduct.ProductOrderList" .product_id %}' target="_blank">MORE++</a>
                        </small>
                    </label>
                </div>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="product_order_item_list" class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th class="center">编号</th>
                                    <th class="center">订单编号</th>
                                    <th class="center">Item ID</th>
                                    <th class="center">数量</th>
                                    <th class="center">售价</th>
                                    <th class="center">下单时间</th>
                                    <th class="center">发货时间</th>
                                    <th class="center">成交店铺</th>
                                    <th class="center">状态</th>
                                </tr>
                                </thead>
                                <tbody>
                                <template v-for="(order_item, index) in detail.order_item_list">
                                    <tr>
                                        <td class="center" style="width: 100px;">{{index + 1}}</td>
                                        <td class="center">{{order_item.o.code}}</td>
                                        <td class="center">{{order_item.oi.item_id}}</td>
                                        <td class="center">{{order_item.oi.quantity}}</td>
                                        <td class="center">{{order_item.oi.transaction_price_currency}}&nbsp;{{order_item.oi.transaction_price}}</td>
                                        <td class="center">{{order_item.o.created_time}}</td>
                                        <td class="center">{{order_item.o.shipped_time}}</td>
                                        <td class="center">{{order_item.pf.name}}&nbsp;{{order_item.sa.name}}</td>
                                        <td class="center">{{order_item.s.name}}</td>
                                    </tr>
                                </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller widget-title">消息记录</h4>
                <div class="widget-toolbar">
                    <label>
                        <small>
                            <a href='{% url "ErpProduct.ProductMessageList" .product_id %}' target="_blank">MORE++</a>
                        </small>
                    </label>
                </div>
            </div>
            <div class="widget-body">
                <div class="widget-main">

                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller widget-title">操作日志</h4>
                <div class="widget-toolbar">
                    <label>
                        <small>
                            <a href='{% url "ErpProduct.ProductLogList" .product_id %}' target="_blank">MORE++</a>
                        </small>
                    </label>
                </div>
            </div>
            <div class="widget-body">
                <div class="widget-main">

                </div>
            </div>
        </div>
    </div>
</div>
{%template "erp/kcgl/product/product_detail.var" .%}
<script type="text/javascript">
    var vm = new Vue({
        el: "#product_detail",
        data: {
            "detail": {
                "product_image_list": [],
                "product": {}
            }
        },
        mounted: function () {
            var this_vm = this;

            $.ajax(
                {
                    "dataType": 'json',
                    "url": '{% url "ErpProduct.DetailData"%}',
                    "data": {
                        "id": product_id
                    },
                    "success": function (data) {
                        if (data.success == false) {
                            $.msg.error(data.message);
                            return;
                        }
                        this_vm.detail = data;
                    }
                });
        },
        methods: {}
    });
</script>
{% site_footer %}
