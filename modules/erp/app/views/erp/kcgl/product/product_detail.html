{% site_header "商品详情" . %}
<div class="main-container" id="main-container">
    <div id="product_detail" style="width: 1024px;margin-left: auto;margin-right: auto;">
        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">图片信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div id="product_image_list" class="row">
                        <div class="col-xs-12">
                            <template v-for="product_image in detail.product_image_list">
                                <a :href="product_image.url" target="_blank"><img :src="product_image.url" alt="" style="width:80px;height:80px;"/></a>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">商品信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">

                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="product_sku" class="col-xs-4 control-label">SKU：</label>
                                <div class="col-xs-8">
                                    <input id="product_sku" name="detail.product.sku" type="text" class="input-sm form-control" v-model="detail.product.sku"/>
                                </div>
                            </div>
                        </div>

                        <div class="col-xs-6">
                            <div class="form-group">
                                <label for="product_english_name" class="col-xs-2 control-label">英文名称：</label>
                                <div class="col-xs-10">
                                    <input id="product_english_name" name="detail.product.name" type="text" class="input-sm form-control" v-model="detail.product.name"/>
                                </div>
                            </div>
                        </div>

                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="product_status_id" class="col-xs-4 control-label">状态：</label>
                                <div class="col-xs-8">
                                    <select id="product_status_id" name="detail.product.status_id" class="input-sm form-control" v-model.number="detail.product.status_id">
                                        <template v-for="status in detail.status_list">
                                            <option :value="status.id">{{status.name}}</option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="product_supplier_id" class="col-xs-4 control-label">供应商：</label>
                                <div class="col-xs-8">
                                    <select id="product_supplier_id" name="detail.product.supplier_id" class="input-sm form-control" v-model.number="detail.product.supplier_id">
                                        <option id=""></option>
                                        <template v-for="supplier in detail.supplier_list">
                                            <option :value="supplier.id">{{supplier.name}}</option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">商品库存</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="order_item_list" class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th class="center" style="width: 50px;">选择</th>
                                    <th class="center" style="width: 60px;">商品图片</th>
                                    <th style="width: 120px;">商品名称</th>
                                    <th class="center" style="width: 100px;">售价</th>
                                    <th class="center" style="width: 100px;">成本</th>
                                    <th class="center" style="width: 80px;">原始售价</th>
                                    <th class="center" style="width: 80px;">毛利</th>
                                    <th>留言</th>
                                </tr>
                                </thead>
                                <tbody>
                                <template v-for="order_item in detail.order_item_list">
                                    <tr>
                                        <td class="center">
                                            <label class="pos-rel">
                                                <input type="checkbox" class="ace" :value="order_item.oi.id"/>
                                                <span class="lbl"></span>
                                            </label>
                                        </td>
                                        <td class="center">
                                            <a :href="order_item.p.view_item_url" target="_blank">
                                                <img :src="order_item.p.image_url" alt="" style="width: 60px;height: 60px;"/>
                                            </a>
                                        </td>
                                        <td>
                                            <div :title="order_item.p.name" style="width: 120px; overflow: hidden; text-overflow: ellipsis;white-space: nowrap;">
                                                {{order_item.p.name}}
                                            </div>
                                            <div>
                                                <a :href="'/erp/product/detail/' + order_item.p.id" target="_blank">
                                                    {{order_item.p.sku}}
                                                </a>
                                            </div>
                                            <div>
                                                <a :href="order_item.p.view_item_url" target="_blank">
                                                    {{order_item.p.item_id}}
                                                </a>
                                            </div>
                                        </td>
                                        <td class="center">
                                            <div>{{order_item.oi.transaction_price_currency}}&nbsp;{{order_item.oi.transaction_price}}
                                                × {{order_item.oi.quantity}}
                                            </div>
                                            <div>={{order_item.oi.transaction_price_currency}}&nbsp;{{order_item.oi.transaction_price
                                                * order_item.oi.quantity}}
                                            </div>
                                        </td>
                                        <td></td>
                                        <td class="center">{{order_item.oi.transaction_price_currency}}&nbsp;{{order_item.oi.transaction_price}}</td>
                                        <td>
                                        </td>
                                        <td></td>
                                    </tr>
                                </template>
                                </tbody>
                                <tfoot>
                                <tr>
                                    <td colspan="8">
                                        Hello World!
                                    </td>
                                </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">操作日志</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">

                </div>
            </div>
        </div>
    </div>
</div>
{%template "erp/kcgl/product/product_detail.var" .%}
<script type="text/javascript">
    var vm = new Vue({
        el: "#product_detail",
        data: {
            "detail": {
                "product_image_list": [],
                "product": {}
            }
        },
        mounted: function () {
            var this_vm = this;

            $.ajax(
                {
                    "dataType": 'json',
                    "url": '{% url "ErpProduct.DetailData"%}',
                    "data": {
                        "id": product_id
                    },
                    "success": function (data) {
                        if (data.success == false) {
                            $.msg.error(data.message);
                            return;
                        }
                        this_vm.detail = data;
                    }
                });
        },
        methods: {}
    });
</script>
{% site_footer %}
