{% site_header "商品详情" . %}
<div class="main-container" id="main-container">
    <div id="product_detail" style="width: 1024px;margin-left: auto;margin-right: auto;">
        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">图片信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div id="product_image_list" class="row">
                        <div class="col-xs-12">
                            <template v-for="product_image in detail.product_image_list">
                                <a :href="product_image.url" target="_blank"><img :src="product_image.url" alt="" style="width:80px;height:80px;"/></a>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">商品信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <form class="form-horizontal" role="form" id="productDetailForm">

                        <div class="row">
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_sku" class="col-xs-4 control-label">SKU：</label>
                                    <div class="col-xs-8">
                                        <input id="product_sku" name="detail.product.sku" type="text" class="input-sm form-control" v-model="detail.product.sku" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_cnname" class="col-xs-4 control-label">名称：</label>
                                    <div class="col-xs-8">
                                        <input id="product_cnname" name="detail.product.cn_name" type="text" class="input-sm form-control" v-model="detail.product.cn_name" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-6">
                                <div class="form-group">
                                    <label for="product_english_name" class="col-xs-2 control-label">英文名称：</label>
                                    <div class="col-xs-10">
                                        <input id="product_english_name" name="detail.product.name" type="text" class="input-sm form-control" v-model="detail.product.name" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_cate_id" class="col-xs-4 control-label">商品目录：</label>
                                    <div class="col-xs-8">
                                        <select id="product_cate_id" name="detail.product.cate_id" class="input-sm form-control" v-model.number="detail.product.cate_id" disabled="disabled">
                                            <option value=""></option>
                                            <template v-for="cate in detail.product_cate_list">
                                                <option :value="cate.cate_id">{{cate.cate_name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_supplier_id" class="col-xs-4 control-label">供应商：</label>
                                    <div class="col-xs-8">
                                        <select id="product_supplier_id" name="detail.product.supplier_id" class="input-sm form-control" v-model.number="detail.product.supplier_id" disabled="disabled">
                                            <option value=""></option>
                                            <template v-for="supplier in detail.supplier_list">
                                                <option :value="supplier.id">{{supplier.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_package_mateiral_id" class="col-xs-4 control-label">包材类型：</label>
                                    <div class="col-xs-8">
                                        <select id="product_package_mateiral_id" name="detail.product.pkg_mtrl_id" class="input-sm form-control" v-model.number="detail.product.pkg_mtrl_id" disabled="disabled">
                                            <option value=""></option>
                                            <template v-for="package_material in detail.package_material_list">
                                                <option :value="package_material.id">{{package_material.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_cost_price" class="col-xs-4 control-label">中国采购价：</label>
                                    <div class="col-xs-8">
                                        <input id="product_cost_price" name="detail.product.cost_price" type="text" class="input-sm form-control" v-model.number="detail.product.cost_price" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <div class="row">

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_brand_id" class="col-xs-4 control-label">商品品牌：</label>
                                    <div class="col-xs-8">
                                        <select id="product_brand_id" name="detail.product.brand_id" class="input-sm form-control" v-model.number="detail.product.brand_id" disabled="disabled">
                                            <option value=""></option>
                                            <template v-for="brand in detail.product_brand_list">
                                                <option :value="brand.id">{{brand.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_cert1_id" class="col-xs-4 control-label">商品认证1：</label>
                                    <div class="col-xs-8">
                                        <select id="product_cert1_id" name="detail.product.cert1_id" class="input-sm form-control" v-model.number="detail.product.cert1_id" disabled="disabled">
                                            <option value=""></option>
                                            <template v-for="cert in detail.product_cert_list">
                                                <option :value="cert.id">{{cert.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_cert2_id" class="col-xs-4 control-label">商品认证2：</label>
                                    <div class="col-xs-8">
                                        <select id="product_cert2_id" name="detail.product.cert2_id" class="input-sm form-control" v-model.number="detail.product.cert2_id" disabled="disabled">
                                            <option value=""></option>
                                            <template v-for="cert in detail.product_cert_list">
                                                <option :value="cert.id">{{cert.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_cert3_id" class="col-xs-4 control-label">商品认证3：</label>
                                    <div class="col-xs-8">
                                        <select id="product_cert3_id" name="detail.product.cert3_id" class="input-sm form-control" v-model.number="detail.product.cert3_id" disabled="disabled">
                                            <option value=""></option>
                                            <template v-for="cert in detail.product_cert_list">
                                                <option :value="cert.id">{{cert.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="length" class="col-xs-4 control-label">长(cm)</label>
                                    <div class="col-xs-8">
                                        <input id="length" name="detail.product.length" type="text" class="input-sm form-control" v-model.number="detail.product.length" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="width" class="col-xs-4 control-label">宽(cm)</label>
                                    <div class="col-xs-8">
                                        <input id="width" name="detail.product.width" type="text" class="input-sm form-control" v-model.number="detail.product.width" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="height" class="col-xs-4 control-label">高(cm)</label>
                                    <div class="col-xs-8">
                                        <input id="height" name="detail.product.height" type="text" class="input-sm form-control" v-model.number="detail.product.height" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="weight" class="col-xs-4 control-label">重量(kg)</label>
                                    <div class="col-xs-8">
                                        <input id="weight" name="detail.product.weight" type="text" class="input-sm form-control" v-model.number="detail.product.weight" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="purchase_days" class="col-xs-4 control-label">采购天数</label>
                                    <div class="col-xs-8">
                                        <input id="purchase_days" name="detail.product.purchase_days" type="text" class="input-sm form-control" v-model.number="detail.product.purchase_days" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="stock_alert_days" class="col-xs-4 control-label">库存警戒天数</label>
                                    <div class="col-xs-8">
                                        <input id="stock_alert_days" name="detail.product.stock_alert_days" type="text" class="input-sm form-control" v-model.number="detail.product.stock_alert_days" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="daily_mean_sales" class="col-xs-4 control-label">日均销量</label>
                                    <div class="col-xs-8">
                                        <input id="daily_mean_sales" name="detail.product.daily_mean_sales" type="text" class="input-sm form-control" v-model.number="detail.product.daily_mean_sales" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="stock_alert_qty" class="col-xs-4 control-label">警戒库存</label>
                                    <div class="col-xs-8">
                                        <input id="stock_alert_qty" name="detail.product.stock_alert_qty" type="text" class="input-sm form-control" v-model.number="detail.product.stock_alert_qty" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <div class="row">

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="sale_user" class="col-xs-4 control-label">销售负责人</label>
                                    <div class="col-xs-8">
                                        <input id="sale_user" name="detail.product.sale_user" type="text" class="input-sm form-control" v-model.number="detail.product.sale_user" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="service_user" class="col-xs-4 control-label">客服负责人</label>
                                    <div class="col-xs-8">
                                        <input id="service_user" name="detail.product.service_user" type="text" class="input-sm form-control" v-model.number="detail.product.service_user" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="dev_user" class="col-xs-4 control-label">开发负责人</label>
                                    <div class="col-xs-8">
                                        <input id="dev_user" name="detail.product.dev_user" type="text" class="input-sm form-control" v-model.number="detail.product.dev_user" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <!--
                                    <label for="stock_alert_qty" class="col-xs-4 control-label">日均销量</label>
                                    <div class="col-xs-8">
                                        <input id="stock_alert_qty" name="detail.product.stock_alert_qty" type="text" class="input-sm form-control" v-model.number="detail.product.stock_alert_qty" disabled="disabled"/>
                                    </div>
                                    -->
                                </div>
                            </div>

                        </div>

                        <div class="row">

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_style_id" class="col-xs-4 control-label">商品款式：</label>
                                    <div class="col-xs-8">
                                        <select id="product_style_id" name="detail.product.style_id" class="input-sm form-control" v-model.number="detail.product.style_id" disabled="disabled">
                                            <option value=""></option>
                                            <template v-for="style in detail.product_style_list">
                                                <option :value="style.id">{{style.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="product_status_id" class="col-xs-4 control-label">状态：</label>
                                    <div class="col-xs-8">
                                        <select id="product_status_id" name="detail.product.status_id" class="input-sm form-control" v-model.number="detail.product.status_id" disabled="disabled">
                                            <template v-for="status in detail.status_list">
                                                <option :value="status.id">{{status.name}}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="need_invoice" class="col-xs-4 control-label">是否开票：</label>
                                    <div class="col-xs-8">
                                        <select id="need_invoice" name="detail.product.need_invoice" class="input-sm form-control" v-model.number="detail.product.need_invoice" disabled="disabled">
                                            <option :value="0">否</option>
                                            <option :value="1">是</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="volume" class="col-xs-4 control-label">体积 m<sup>3</sup></label>
                                    <div class="col-xs-8">
                                        <input id="volume" name="detail.product.volume" type="text" class="input-sm form-control" v-model.number="detail.product.volume" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">

                            <div class="col-xs-6">
                                <div class="form-group">
                                    <label for="product_desc" class="col-xs-2 control-label">备注：</label>
                                    <div class="col-xs-10">
                                        <textarea id="product_desc" name="detail.product.desc" rows="3" class="input-sm form-control" v-model="detail.product.desc" disabled="disabled"></textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-6">
                                <div class="form-group">
                                    <label for="postage_url" class="col-xs-2 control-label">Postage URL：</label>
                                    <div class="col-xs-10">
                                        <input id="postage_url" name="postage_url" type="text" class="input-sm form-control" :value="'https://freight.iepoch.com.au/postage/' + detail.product.id" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">商品库存</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="product_inventory_list" class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th class="center" style="width: 100px;">SKU</th>
                                    <th class="center">商品名称</th>
                                    <th class="center" style="width: 120px;">仓库</th>
                                    <th class="center" style="width: 120px;">库位</th>
                                    <th class="center" style="width: 100px;">库存</th>
                                    <th class="center" style="width: 80px;">成本价格</th>
                                </tr>
                                </thead>
                                <tbody>
                                <template v-for="inventory in detail.inventory_list">
                                    <tr>
                                        <td class="center" style="vertical-align: middle">
                                            {{inventory.p.sku}}
                                        </td>
                                        <td class="wrap-word" style="vertical-align: middle">
                                            <div>
                                                {{inventory.p.cn_name}}
                                            </div>
                                        </td>
                                        <td class="center" style="vertical-align: middle">
                                            {{inventory.st.name}}
                                        </td>
                                        <td class="center" style="vertical-align: middle">
                                            {{inventory.sl.name}}
                                        </td>
                                        <td class="center" style="vertical-align: middle">
                                            {{inventory.nvt.qty}}
                                        </td>
                                        <td class="center" style="vertical-align: middle">
                                            {{inventory.nvt.cost_price}}
                                        </td>
                                    </tr>
                                </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller widget-title">订单记录</h4>
                <div class="widget-toolbar">
                    <label>
                        <small>
                            <a href='{% url "ErpProduct.ProductOrderList" .product_id %}' target="_blank">MORE++</a>
                        </small>
                    </label>
                </div>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="product_order_item_list" class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th class="center" style="width: 50px;">编号</th>
                                    <th class="center">订单编号</th>
                                    <th class="center">数量</th>
                                    <th class="center">售价</th>
                                    <th class="center">
                                        <div>毛利</div>
                                        <div>毛利率</div>
                                    </th>
                                    <th class="center" style="width:120px;">
                                        <div>下单时间</div>
                                        <div>发货时间</div>
                                    </th>
                                    <th class="center" style="width:120px;">发货仓库</th>
                                    <th class="center">成交店铺</th>
                                    <th class="center" style="width:60px;">状态</th>
                                </tr>
                                </thead>
                                <tbody>
                                <template v-for="(order_item, index) in detail.order_item_list">
                                    <tr>
                                        <td class="center" style="vertical-align: middle;">{{index + 1}}</td>
                                        <td class="center" style="vertical-align: middle;"><a :href='"/order/detail/" + order_item.o.id' target="order_detail">{{order_item.o.code}}</a></td>
                                        <td class="center" style="vertical-align: middle;">{{order_item.oi.quantity}}</td>
                                        <td class="center" style="vertical-align: middle;">{{order_item.oi.transaction_price_currency}}&nbsp;{{order_item.oi.transaction_price}}</td>
                                        <td class="center" style="vertical-align: middle;">
                                            <div>{{order_item.oi.transaction_price_currency}}&nbsp;{{format_float(order_item.oi.gross_profit)}}</div>
                                            <div>{{format_float(order_item.oi.gross_profit / order_item.oi.transaction_price * 100)}}%</div>
                                        </td>
                                        <td class="center" style="vertical-align: middle;">
                                            <div v-if="order_item.o.paid_time != null">{{order_item.o.paid_time}}</div>
                                            <div v-else>---</div>
                                            <div v-if="order_item.o.shipped_time != null">{{order_item.o.shipped_time}}</div>
                                            <div v-else>---</div>
                                        </td>
                                        <td class="center" style="vertical-align: middle;">{{order_item.st.name}}</td>
                                        <td class="center" style="vertical-align: middle;">{{order_item.pf.name}}&nbsp;{{order_item.sa.name}}</td>
                                        <td class="center" style="vertical-align: middle;">{{order_item.s.name}}</td>
                                    </tr>
                                </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller widget-title">采购记录</h4>
                <div class="widget-toolbar">
                    <label>
                        <small>
                            <a href='{% url "ErpProduct.ProductPurchaseList" .product_id %}' target="_blank">MORE++</a>
                        </small>
                    </label>
                </div>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="product_purchase_data_list" class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th class="center" style="width: 100px;">批次号</th>
                                    <th class="center">采购单价</th>
                                    <th class="center">中国仓成本价</th>
                                    <th class="center">数量</th>
                                    <th class="center">是否开票</th>
                                    <th class="center" style="width:60px;">状态</th>
                                    <th class="center" style="width:120px;">采购时间</th>
                                    <th class="center" style="width:120px;">付款时间</th>
                                    <th class="center" style="width:120px;">入库时间</th>
                                </tr>
                                </thead>
                                <tbody>
                                <template v-for="(product_purchase, index) in detail.product_purchase_list">
                                    <tr>
                                        <td class="center" style="vertical-align: middle;">{{product_purchase.pb.code}}</td>
                                        <td class="center" style="vertical-align: middle;">{{product_purchase.pbe.price}}</td>
                                        <td class="center" style="vertical-align: middle;">{{product_purchase.pbe.inventory_cost}}</td>
                                        <td class="center" style="vertical-align: middle;">{{product_purchase.pbe.qty}}</td>
                                        <td class="center" style="vertical-align: middle;">
                                            <span v-if="product_purchase.pbe.need_invoice == 0">
                                                否
                                            </span>
                                            <span v-else>
                                                是
                                            </span>
                                        </td>
                                        <td class="center" style="vertical-align: middle;">{{product_purchase.s.name}}</td>
                                        <td class="center" style="vertical-align: middle;">{{product_purchase.pb.apply_time}}</td>
                                        <td class="center" style="vertical-align: middle;">{{product_purchase.pb.pay_time}}</td>
                                        <td class="center" style="vertical-align: middle;">{{product_purchase.pbe.checkin_time}}</td>
                                    </tr>
                                </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller widget-title">消息记录</h4>
                <div class="widget-toolbar">
                    <label>
                        <small>
                            <a href='{% url "ErpProduct.ProductMessageList" .product_id %}' target="_blank">MORE++</a>
                        </small>
                    </label>
                </div>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="message_list" class="table table-striped table-bordered">
                                <thead>
                                <tr>

{%template "erp/kcgl/product/product_detail.var" .%}
<script type="text/javascript">

    var vm = new Vue({
        el: "#product_detail",
        data: {
            "detail": {
                "product": {},
                "product_image_list": [],
                "order_item_list": [],
                "product_purchase_list": [],
                "message_list": [],
                "product_log_list": [],
                "product_style_list": [],
                "product_cert_list": []
            }
        },
        mounted: function () {
            var this_vm = this;

            $.ajax({
                "type": "POST",
                "dataType": 'json',
                "url": '{% url "ErpProduct.DetailData"%}',
                "data": {
                    "id": product_id
                },
                "success": function (data) {
                    if (data.success === false) {
                        $.msg.error(data.message);
                        return;
                    }
                    this_vm.detail = data;

                    this_vm.detail.product.length = parseFloat(dtFormatFloat(this_vm.detail.product.length));
                    this_vm.detail.product.width = parseFloat(dtFormatFloat(this_vm.detail.product.width));
                    this_vm.detail.product.height = parseFloat(dtFormatFloat(this_vm.detail.product.height));
                    this_vm.detail.product.weight = parseFloat(dtFormatFloat(this_vm.detail.product.weight));
                    this_vm.detail.product.cost_price = parseFloat(dtFormatFloat(this_vm.detail.product.cost_price));
                    this_vm.detail.product.daily_mean_sales = parseFloat(dtFormatFloat(this_vm.detail.product.daily_mean_sales));
                }
            });
        },
        methods: {
            format_float: function (data) {
                return $.formatNumber(data, {format: "###0.00", locale: "cn"});
            }
        }
    });
</script>
