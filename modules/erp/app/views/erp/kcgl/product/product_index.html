{%header "商品列表" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="kcgl-menu">库存管理</li>
            <li class="active" data-menu="kcgl-product-menu">商品列表</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#productList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showProductDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteProduct()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                    <button class="btn btn-info btn-sm" @click="showProductLog()">
                        <i class="ace-icon fa fa-book"></i>
                        操作日志
                    </button>
                </div>

                <div class="row" style="margin-top: 15px;margin-bottom: 5px;">
                    <div id="query" class="col-xs-12 query">
                        <label class="control-label no-padding-right" for="product_cate_query">商品目录</label>
                        <select id="product_cate_query" class="input-sm" name="product_cate_query" style="width: 100px;">
                            <option value="0">--商品目录--</option>
                            {% range .product_cate_list %}
                            <option value="{%.CateId%}">{%.CateName%}</option>
                            {% end %}
                        </select>
                        <label class="control-label no-padding-right" for="product_sku_query">SKU</label>
                        <input class="input-sm" id="product_sku_query" name="product_sku_query" placeholder="SKU查询" type="text" style="width: 130px;"/>
                        <label class="control-label no-padding-right" for="product_name_query">商品名称</label>
                        <input class="input-sm" id="product_name_query" name="product_name_query" placeholder="商品名称查询" type="text" style="width: 130px;"/>
                        <button class="btn btn-mini btn-primary" @click="refreshList()">
                            &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                        </button>
                    </div>
                </div>

                <div>
                    <table id="productList" class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr>
                            <th></th>
                            <th></th>
                            <th id="thSku">SKU</th>
                            <th id="thProductName">商品名称</th>
                            <th id="thSupplier">供应商</th>
                            <th>商品目录</th>
                            <th>中国仓成本(RMB)</th>
                            <th>库存</th>
                            <th>备注</th>
                            <th>状态</th>
                            <th id="thCreateTime">创建时间</th>
                            <th id="thUpdateTime">修改时间</th>
                        </tr>
                        </thead>
                    </table>
                    <div class="todo">1、不同权限的人员只能看到自己的信息，比如有的不能看到成本价等. 2、商品库存等</div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "product": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#productList',
                {
                    "sAjaxSource": '{%url "ErpProduct.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "prd.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {
                            "mDataProp": "prd.image_url",
                            "title": "图片",
                            "bSearchable": false,
                            "width": 80,
                            "bSortable": false,
                            "render": function (data, type, row) {
                                if (data !== null) {
                                    return '<a href="' + data + '" target="_blank"><img style="width:60px;height:60px;" src="' + data + '" alt="" /></a>';
                                }
                                else {
                                    return '<img style="width:60px;height:60px;" src="/static/images/no_img.jpg" alt="no image" />';
                                }
                            }
                        },
                        {
                            "mDataProp": "prd.sku", "title": "SKU", "bSearchable": true,
                            "render": function (data, type, row) {
                                var sup_name = "暂无供应商";
                                if (row.sup.name !== "") {
                                    sup_name = row.sup.name;
                                }
                                return '<div class="tdSkuNameSup"><a href="/product/detail/' + row.prd.id + '" target="_blank">' + row.prd.sku + '</a></div><div>' + row.prd.cn_name + '</div><div>' + sup_name + '</div>';
                            }
                        },
                        {
                            "mDataProp": "prd.name", "title": "商品名称", "bSearchable": true,
                            "render": function (data, type, row) {
                                return '<span class="spanProductName"></span>';
                            }
                        },
                        {
                            "mDataProp": "sup.name", "title": "供应商", "bSearchable": false,
                            "render": function (data, type, row) {
                                return '<span class="spanSupName"></span>';
                            }
                        },
                        {"mDataProp": "cate.full_name", "title": "商品目录", "bSearchable": false, "width": 150},
                        {
                            "mDataProp": "prd.cost_price",
                            "title": "中国仓<br/>采购价(RMB)",
                            "bSearchable": false,
                            "width": 130,
                            "render": function (data, type, row) {
                                return dtFormatFloat(data);
                            }
                        },
                        {
                            "mDataProp": "prd.id",
                            "title": "库存",
                            "bSearchable": false,
                            "bSortable": false,
                            "width": 200,
                            "render": function (data, type, row) {
                                var inventory_list = row.inventory_list;
                                if (inventory_list.length === 0) {
                                    return "";
                                }

                                var inventory_desc = "<table class='inline-inventory'><tbody>";
                                for (var index in inventory_list) {
                                    inventory_desc += "<tr>";
                                    var inventory = inventory_list[index];
                                    inventory_desc += "<td class='sl'>" + inventory.st.name + " " + inventory.sl.name + "</td><td class='qty'>" + inventory.nvt.qty  + "</td><td class='pending-qty'>" + inventory.nvt.pending_qty + "</td><td class='price'>" + dtFormatFloat(inventory.nvt.cost_price) + "</td>";
                                    inventory_desc += "</tr>";
                                }
                                inventory_desc += "</tbody></table>";
                                return inventory_desc;
                            }
                        },
                        {"mDataProp": "prd.desc", "title": "备注", "bSearchable": true},
                        {"mDataProp": "st.name", "title": "状态", "bSearchable": false, "width": 60},
                        {
                            "mDataProp": "prd.create_time", "title": "创建时间", "bSearchable": false,
                            "render": function (data, type, row) {
                                return '<div class="tdCreateTime">' + row.prd.create_time + '</div><div>' + row.prd.update_time + '</div>';
                            }
                        },
                        {
                            "mDataProp": "prd.update_time", "title": "修改时间", "bSearchable": false,
                            "render": function (data, type, row) {
                                return '<span class="spanUpdateTime"></span>';
                            }
                        }
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'product_cate_query', 'value': $('#product_cate_query').val()});
                        aoData.push({'name': 'product_sku_query', 'value': $('#product_sku_query').val()});
                        aoData.push({'name': 'product_name_query', 'value': $('#product_name_query').val()});

                        $.ajax(
                            {
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();

                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data);

                                    $(".spanProductName").parent().css("display", "none");
                                    $(".spanSupName").parent().css("display", "none");
                                    $(".tdSkuNameSup").parent().css("width", "200px");

                                    $(".spanUpdateTime").parent().css("display", "none");
                                    $(".tdCreateTime").parent().css("width", "120px");
                                }
                            });
                    }
                }
            );

            $("#thSku").before("<th id='thSkuNameSup'></th>");
            $("#thSku").wrap("<div id='divSku'></div>");
            $("#thProductName").wrap("<div id='divProductName'></div>");
            $("#thSupplier").wrap("<div id='divSupplier'></div>");

            var thSkuNameSup = $("#thSkuNameSup");
            thSkuNameSup.append($("#divSku"));
            thSkuNameSup.append($("#divProductName"));
            thSkuNameSup.append($("#divSupplier"));

            $("#thCreateTime").before("<th id='thCreateUpdateTime'></th>");
            $("#thCreateTime").wrap("<div id='divCreateTime'></div>");
            $("#thUpdateTime").wrap("<div id='divUpdateTime'></div>");

            $("#thCreateUpdateTime").append($("#divCreateTime")).append($("#divUpdateTime"));
        },
        methods: {
            reloadList: function () {
                reloadList('#productList');
            },
            refreshList: function () {
                refreshList("#productList");
            },
            showProductDetail: function (product_id) {
                var url = '{% url "ErpProduct.Detail" 0 %}';
                window.open(url, "_blank");
            },
            showProductLog: function () {
                window.location.href = "/product/log";
            },
            saveProduct: function () {
                showMask("提交中...");
                var form = $("#productDetailForm");
                var valid = validate(form, {
                    'detail.product.sku': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.product.name': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.product.cate_id': {
                        required: false, digits: true
                    },
                    'detail.product.cost_price': {
                        required: true, number: true
                    },
                    'detail.product.weight': {
                        required: true, number: true
                    },
                    'detail.product.supplier_id': {
                        required: false, digits: true
                    },
                    'detail.product.pkg_mtrl_id': {
                        required: false, digits: true
                    },
                    'detail.product.status_id': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpProduct.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#productDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteProduct: function () {
                var id_list = [];
                $('#productList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length === 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpProduct.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
