{%header "商品列表" .%}
<div id="page">
   <div class="breadcrumbs" id="breadcrumbs">
       <ul class="breadcrumb">
           <li>
               <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
           </li>
           <li class="parent" data-menu="kcgl-menu">库存管理</li>
           <li class="active" data-menu="kcgl-product-menu">商品列表</li>
       </ul>
   </div>
   <div class="page-content">
       <div class="row">
           <div class="col-xs-12" style="padding: 0;">
               <div class="gridToolBar clearfix">
                   <button class="btn btn-primary btn-sm" @click="reloadList('#productList')">
                       <i class="ace-icon fa fa-refresh"></i>
                       刷新
                   </button>
                   <button class="btn btn-success btn-sm" @click="showProductDetail(0)">
                       <i class="ace-icon fa fa-plus"></i>
                       新增
                   </button>
                   <button class="btn btn-danger btn-sm" @click="deleteProduct()">
                       <i class="ace-icon fa fa-trash-o"></i>
                       删除
                   </button>
               </div>
               <div>
                   <table id="productList" class="table table-striped table-bordered table-hover"></table>
                   <div class="todo">1、只是初步的；2、不同权限的人员只能看到自己的信息，比如有的不能看到成本价等</div>
               </div>
           </div>
       </div>
   </div>
    <div class="modal fade" id="productDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">商品详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="productDetailForm">
                                <input id="product_id" name="detail.product.id" type="hidden" v-model.number="detail.product.id"/>
                                <input id="product_version" name="detail.product.version" type="hidden" v-model.number="detail.product.version"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="sku" class="col-xs-2 control-label no-padding-right">SKU</label>
                                            <div class="col-xs-10">
                                                <input id="sku" name="detail.product.sku" type="text" class="input-sm form-control" v-model="detail.product.sku"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="name" class="col-xs-2 control-label no-padding-right">名称</label>
                                            <div class="col-xs-10">
                                                <input id="name" name="detail.product.name" type="text" class="input-sm form-control" v-model="detail.product.name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="english_name" class="col-xs-2 control-label no-padding-right">英文名称</label>
                                            <div class="col-xs-10">
                                                <input id="english_name" name="detail.product.english_name" type="text" class="input-sm form-control" v-model="detail.product.english_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="stock_name" class="col-xs-2 control-label no-padding-right">库存名称</label>
                                            <div class="col-xs-10">
                                                <input id="stock_name" name="detail.product.stock_name" type="text" class="input-sm form-control" v-model="detail.product.stock_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="brand_id" class="col-xs-2 control-label no-padding-right">品牌</label>
                                            <div class="col-xs-10">
                                                <input id="brand_id" name="detail.product.brand_id" type="text" class="input-sm form-control" v-model.number="detail.product.brand_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="cate_id" class="col-xs-2 control-label no-padding-right">商品目录</label>
                                            <div class="col-xs-10">
                                                <input id="cate_id" name="detail.product.cate_id" type="text" class="input-sm form-control" v-model.number="detail.product.cate_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="retail_price" class="col-xs-2 control-label no-padding-right">零售价</label>
                                            <div class="col-xs-10">
                                                <input id="retail_price" name="detail.product.retail_price" type="text" class="input-sm form-control" v-model.number="detail.product.retail_price"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="cost_price" class="col-xs-2 control-label no-padding-right">成本价</label>
                                            <div class="col-xs-10">
                                                <input id="cost_price" name="detail.product.cost_price" type="text" class="input-sm form-control" v-model.number="detail.product.cost_price"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="quantity" class="col-xs-2 control-label no-padding-right">库存</label>
                                            <div class="col-xs-10">
                                                <input id="quantity" name="detail.product.quantity" type="text" class="input-sm form-control" v-model.number="detail.product.quantity"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="weight" class="col-xs-2 control-label no-padding-right">重量</label>
                                            <div class="col-xs-10">
                                                <input id="weight" name="detail.product.weight" type="text" class="input-sm form-control" v-model.number="detail.product.weight"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="stock_id" class="col-xs-2 control-label no-padding-right">仓库</label>
                                            <div class="col-xs-10">
                                                <input id="stock_id" name="detail.product.stock_id" type="text" class="input-sm form-control" v-model.number="detail.product.stock_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="storage_loc_id" class="col-xs-2 control-label no-padding-right">仓位</label>
                                            <div class="col-xs-10">
                                                <input id="storage_loc_id" name="detail.product.storage_loc_id" type="text" class="input-sm form-control" v-model.number="detail.product.storage_loc_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="supplier_id" class="col-xs-2 control-label no-padding-right">默认供应商</label>
                                            <div class="col-xs-10">
                                                <input id="supplier_id" name="detail.product.supplier_id" type="text" class="input-sm form-control" v-model.number="detail.product.supplier_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="supplier_price" class="col-xs-2 control-label no-padding-right">供应商报价</label>
                                            <div class="col-xs-10">
                                                <input id="supplier_price" name="detail.product.supplier_price" type="text" class="input-sm form-control" v-model.number="detail.product.supplier_price"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="producing_area" class="col-xs-2 control-label no-padding-right">产地</label>
                                            <div class="col-xs-10">
                                                <input id="producing_area" name="detail.product.producing_area" type="text" class="input-sm form-control" v-model="detail.product.producing_area"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="status_id" class="col-xs-2 control-label no-padding-right">状态</label>
                                            <div class="col-xs-10">
                                                <input id="status_id" name="detail.product.status_id" type="text" class="input-sm form-control" v-model.number="detail.product.status_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="zxcgl" class="col-xs-2 control-label no-padding-right">最小采购量</label>
                                            <div class="col-xs-10">
                                                <input id="zxcgl" name="detail.product.zxcgl" type="text" class="input-sm form-control" v-model.number="detail.product.zxcgl"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="kcjjts" class="col-xs-2 control-label no-padding-right">库存警戒天数</label>
                                            <div class="col-xs-10">
                                                <input id="kcjjts" name="detail.product.kcjjts" type="text" class="input-sm form-control" v-model.number="detail.product.kcjjts"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="cgts" class="col-xs-2 control-label no-padding-right">采购天数</label>
                                            <div class="col-xs-10">
                                                <input id="cgts" name="detail.product.cgts" type="text" class="input-sm form-control" v-model.number="detail.product.cgts"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="cgsx" class="col-xs-2 control-label no-padding-right">采购上限</label>
                                            <div class="col-xs-10">
                                                <input id="cgsx" name="detail.product.cgsx" type="text" class="input-sm form-control" v-model.number="detail.product.cgsx"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="cgy_id" class="col-xs-2 control-label no-padding-right">采购员</label>
                                            <div class="col-xs-10">
                                                <input id="cgy_id" name="detail.product.cgy_id" type="text" class="input-sm form-control" v-model.number="detail.product.cgy_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="xsy_id" class="col-xs-2 control-label no-padding-right">销售员</label>
                                            <div class="col-xs-10">
                                                <input id="xsy_id" name="detail.product.xsy_id" type="text" class="input-sm form-control" v-model.number="detail.product.xsy_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="phy_id" class="col-xs-2 control-label no-padding-right">配货员</label>
                                            <div class="col-xs-10">
                                                <input id="phy_id" name="detail.product.phy_id" type="text" class="input-sm form-control" v-model.number="detail.product.phy_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="xsxx" class="col-xs-2 control-label no-padding-right">销售信息</label>
                                            <div class="col-xs-10">
                                                <input id="xsxx" name="detail.product.xsxx" type="text" class="input-sm form-control" v-model="detail.product.xsxx"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="ywmjl" class="col-xs-2 control-label no-padding-right">英文名记录</label>
                                            <div class="col-xs-10">
                                                <input id="ywmjl" name="detail.product.ywmjl" type="text" class="input-sm form-control" v-model="detail.product.ywmjl"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="zjbz" class="col-xs-2 control-label no-padding-right">质检标准</label>
                                            <div class="col-xs-10">
                                                <input id="zjbz" name="detail.product.zjbz" type="text" class="input-sm form-control" v-model="detail.product.zjbz"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="bzxx" class="col-xs-2 control-label no-padding-right">备注信息</label>
                                            <div class="col-xs-10">
                                                <input id="bzxx" name="detail.product.bzxx" type="text" class="input-sm form-control" v-model="detail.product.bzxx"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveProduct()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "product": {}
            }
        },
        mounted: function () {
            initDataTable(
                    '#productList',
                    {
                        "sAjaxSource": '{%url "ErpProduct.ListData"%}',
                        "aaSorting": [[1, "asc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "sku", "title": "SKU", "bSearchable": true },
                            {"mDataProp": "name", "title": "名称", "bSearchable": true },
                            {"mDataProp": "english_name", "title": "英文名称", "bSearchable": true },
                            {"mDataProp": "stock_name", "title": "库存名称", "bSearchable": true },
                            {"mDataProp": "brand_id", "title": "品牌", "bSearchable": false },
                            {"mDataProp": "cate_id", "title": "商品目录", "bSearchable": false },
                            {"mDataProp": "retail_price", "title": "零售价", "bSearchable": false },
                            {"mDataProp": "cost_price", "title": "成本价", "bSearchable": false },
                            {"mDataProp": "quantity", "title": "库存", "bSearchable": false },
                            {"mDataProp": "weight", "title": "重量", "bSearchable": false },
                            {"mDataProp": "stock_id", "title": "仓库", "bSearchable": false },
                            {"mDataProp": "storage_loc_id", "title": "仓位", "bSearchable": false },
                            {"mDataProp": "supplier_id", "title": "默认供应商", "bSearchable": false },
                            {"mDataProp": "supplier_price", "title": "供应商报价", "bSearchable": false },
                            {"mDataProp": "producing_area", "title": "产地", "bSearchable": true },
                            {"mDataProp": "status_id", "title": "状态", "bSearchable": false },
                            {"mDataProp": "zxcgl", "title": "最小采购量", "bSearchable": false },
                            {"mDataProp": "kcjjts", "title": "库存警戒天数", "bSearchable": false },
                            {"mDataProp": "cgts", "title": "采购天数", "bSearchable": false },
                            {"mDataProp": "cgsx", "title": "采购上限", "bSearchable": false },
                            {"mDataProp": "cgy_id", "title": "采购员", "bSearchable": false },
                            {"mDataProp": "xsy_id", "title": "销售员", "bSearchable": false },
                            {"mDataProp": "phy_id", "title": "配货员", "bSearchable": false },
                            {"mDataProp": "xsxx", "title": "销售信息", "bSearchable": true },
                            {"mDataProp": "ywmjl", "title": "英文名记录", "bSearchable": true },
                            {"mDataProp": "zjbz", "title": "质检标准", "bSearchable": true },
                            {"mDataProp": "bzxx", "title": "备注信息", "bSearchable": true },
                            {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120 },
                            {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120 }
                        ]
                   }
            );

            $('#productList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showProductDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#productList');
            },
            showProductDetail: function (id) {
                showMask("加载中...");
                $("#productDetailForm").clearValidation();
                $.ajax({
                           url: '{%url "ErpProduct.DetailData" %}',
                           type: "POST",
                           data: {
                               "id": id
                           },
                           success: function (result) {
                               hideMask();
                               if (result.success == false) {
                                   $.msg.error(result.message);
                                   return;
                               }
                               vm.detail = result;
                               $('#productDetailDialog').modal(modalOptions);
                           }
                       }
                );
            },
            saveProduct: function () {
                showMask("提交中...");
                var form = $("#productDetailForm");
                var valid = validate(form, {  
                    'detail.product.sku': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.product.name': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.product.english_name': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.product.stock_name': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.product.brand_id': {
                        required: false, digits: true
                    },
                    'detail.product.cate_id': {
                        required: false, digits: true
                    },
                    'detail.product.retail_price': {
                        required: true, number: true
                    },
                    'detail.product.cost_price': {
                        required: true, number: true
                    },
                    'detail.product.quantity': {
                        required: true, digits: true
                    },
                    'detail.product.weight': {
                        required: true, number: true
                    },
                    'detail.product.stock_id': {
                        required: false, digits: true
                    },
                    'detail.product.storage_loc_id': {
                        required: false, digits: true
                    },
                    'detail.product.supplier_id': {
                        required: false, digits: true
                    },
                    'detail.product.supplier_price': {
                        required: true, number: true
                    },
                    'detail.product.producing_area': {
                        required: false, maxlength: 100
                    },
                    'detail.product.status_id': {
                        required: true, digits: true
                    },
                    'detail.product.zxcgl': {
                        required: false, digits: true
                    },
                    'detail.product.kcjjts': {
                        required: false, digits: true
                    },
                    'detail.product.cgts': {
                        required: false, digits: true
                    },
                    'detail.product.cgsx': {
                        required: false, digits: true
                    },
                    'detail.product.cgy_id': {
                        required: false, digits: true
                    },
                    'detail.product.xsy_id': {
                        required: false, digits: true
                    },
                    'detail.product.phy_id': {
                        required: false, digits: true
                    },
                    'detail.product.xsxx': {
                        required: false, maxlength: 500
                    },
                    'detail.product.ywmjl': {
                        required: false, maxlength: 500
                    },
                    'detail.product.zjbz': {
                        required: false, maxlength: 500
                    },
                    'detail.product.bzxx': {
                        required: false, maxlength: 500
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                               url: '{%url "ErpProduct.Save"%}',
                               type: "POST",
                               processData: false,
                               contentType: 'application/json',
                               data: JSON.stringify(vm.detail),
                               success: function (data) {
                                   hideMask();
                                   if (data.success == false) {
                                       $.msg.error(data.message);
                                       //return;
                                   }
                                   else {
                                       $.msg.show(data.message);
                                       $('#productDetailDialog').modal('hide');
                                       vm.reloadList();
                                       //return;
                                   }
                               }
                           }
                    );
                }
            },
            deleteProduct: function () {
                var id_list = [];
                $('#productList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                               url: '{%url "ErpProduct.Delete"%}',
                               type: "POST",
                               data: {"id_list": id_list},
                               success: function (data) {
                                   if (data.success == false) {
                                       $.msg.error(data.message);
                                       return;
                                   }
                                   else {
                                       $.msg.show(data.message);
                                   }
                                   vm.reloadList();
                               }
                           });
                });
            }
        }
    });
</script>
{%footer%}
