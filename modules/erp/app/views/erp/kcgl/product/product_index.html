{%header "商品列表" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="kcgl-menu">库存管理</li>
            <li class="active" data-menu="kcgl-product-menu">商品列表</li>
        </ul>
    </div>
    <div class="modal fade" id="productDetailDialog">
        <div class="modal-dialog" style="width: 520px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">商品详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="productDetailForm">
                                <input id="product_id" name="detail.product.id" type="hidden" v-model.number="detail.product.id"/>
                                <input id="product_version" name="detail.product.version" type="hidden" v-model.number="detail.product.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="sku" class="col-xs-2 control-label">SKU</label>
                                            <div class="col-xs-10">
                                                <input id="sku" name="detail.product.sku" type="text" class="input-sm form-control" v-model="detail.product.sku"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="name" class="col-xs-2 control-label">名称</label>
                                            <div class="col-xs-10">
                                                <input id="name" name="detail.product.name" type="text" class="input-sm form-control" v-model="detail.product.name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="cate_id" class="col-xs-2 control-label">商品目录</label>
                                            <div class="col-xs-10">
                                                <select id="cate_id" name="detail.product.cate_id" class="input-sm form-control" v-model.number="detail.product.cate_id">
                                                    <template v-for="product_cate in detail.product_cate_list">
                                                        <option :value="product_cate.cate_id">
                                                            {{product_cate.cate_name}}
                                                        </option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="cost_price" class="col-xs-2 control-label">成本价(RMB)</label>
                                            <div class="col-xs-10">
                                                <input id="cost_price" name="detail.product.cost_price" type="text" class="input-sm form-control" v-model.number="detail.product.cost_price"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="weight" class="col-xs-2 control-label">重量(kg)</label>
                                            <div class="col-xs-10">
                                                <input id="weight" name="detail.product.weight" type="text" class="input-sm form-control" v-model.number="detail.product.weight"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="supplier_id" class="col-xs-2 control-label">供应商</label>
                                            <div class="col-xs-10">
                                                <select id="supplier_id" name="detail.product.supplier_id" class="input-sm form-control" v-model.number="detail.product.supplier_id">
                                                    <option value=""></option>
                                                    <template v-for="supplier in detail.supplier_list">
                                                        <option :value="supplier.id">{{supplier.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="supplier_id" class="col-xs-2 control-label">包材类型</label>
                                            <div class="col-xs-10">
                                                <select id="package_material_id" name="detail.product.pkg_mtrl_id" class="input-sm form-control" v-model.number="detail.product.pkg_mtrl_id">
                                                    <option value=""></option>
                                                    <template v-for="package_material in detail.package_material_list">
                                                        <option :value="package_material.id">{{package_material.name}}
                                                        </option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-2 control-label">备注</label>
                                            <div class="col-xs-10">
                                                <textarea id="desc" name="detail.product.desc" rows="2" class="input-sm form-control" v-model="detail.product.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="status_id" class="col-xs-2 control-label">状态</label>
                                            <div class="col-xs-10">
                                                <select id="status_id" name="detail.product.status_id" class="input-sm form-control" v-model.number="detail.product.status_id">
                                                    <template v-for="status in detail.status_list">
                                                        <option :value="status.id">{{status.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveProduct()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#productList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showProductDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteProduct()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="productList" class="table table-striped table-bordered table-hover">
                        <!--SKU	名称	商品目录	成本价(RMB)	重量(kg)	供应商	包材	备注	状态	创建时间	修改时间-->
                        <thead>
                        <tr>
                            <th rowspan="2"></th>
                            <th id="thSkuNameSup" colspan="3">
                                <div id="headerSku"></div>
                                <div id="headerName"></div>
                                <div id="headerSupplier"></div>
                            </th>
                            <th rowspan="2">商品目录</th>
                            <th rowspan="2">成本价(RMB)</th>
                            <th rowspan="2">重量(kg)</th>
                            <th rowspan="2">包材</th>
                            <th rowspan="2">备注</th>
                            <th rowspan="2">状态</th>
                            <th id="thTime" colspan="2">
                                <div id="headerCreateTime"></div>
                                <div id="headerModifyTime"></div>
                            </th>
                        </tr>
                        <tr>
                            <th id="thSku">SKU</th>
                            <th id="thProductName">商品名称</th>
                            <th id="thSupplier">供应商</th>
                            <th id="thCreateTime">创建时间</th>
                            <th id="thModifyTime">修改时间</th>
                        </tr>
                        </thead>

                    </table>
                    <div class="todo">1、不同权限的人员只能看到自己的信息，比如有的不能看到成本价等；2、图片的展示。</div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "product": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#productList',
                {
                    "sAjaxSource": '{%url "ErpProduct.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "prd.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {
                            "mDataProp": "prd.sku", "title": "SKU", "bSearchable": true,
                            "render": function (data, type, row) {
                                var sup_name = "暂无供应商";
                                if (row.sup.name != "") {
                                    sup_name = row.sup.name;
                                }
                                return '<div class="tdSkuNameSup">' + row.prd.sku + '</div><div>' + row.prd.name + '</div><div>' + sup_name + '</div>';
                            }
                        },
                        {
                            "mDataProp": "prd.name", "title": "商品名称", "bSearchable": true,
                            "render": function (data, type, row) {
                                return '<span class="spanProductName"></span>';
                            }
                        },
                        {
                            "mDataProp": "sup.name", "title": "供应商", "bSearchable": false,
                            "render": function (data, type, row) {
                                return '<span class="spanSupName"></span>';
                            }
                        },
                        {"mDataProp": "cate.full_name", "title": "商品目录", "bSearchable": false},
                        {"mDataProp": "prd.cost_price", "title": "成本价(RMB)", "bSearchable": false},
                        {"mDataProp": "prd.weight", "title": "重量(kg)", "bSearchable": false},
                        {"mDataProp": "pm.name", "title": "包材", "bSearchable": false},
                        {"mDataProp": "prd.desc", "title": "备注", "bSearchable": true},
                        {"mDataProp": "st.name", "title": "状态", "bSearchable": false},
                        {
                            "mDataProp": "prd.create_time", "title": "创建时间", "bSearchable": false,
                            "render": function (data, type, row) {
                                return '<div class="tdCreateTime">' + row.prd.create_time + '</div><div>' + row.prd.update_time + '</div>';
                            }
                        },
                        {
                            "mDataProp": "prd.update_time", "title": "修改时间", "bSearchable": false,
                            "render": function (data, type, row) {
                                return '<span class="spanUpdateTime"></span>';
                            }
                        }
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");
                        $.ajax(
                            {
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success == false) {
                                        $.msg.error(data.message);
                                        return;
                                    }
                                    fnCallback(data);

                                    $(".spanProductName").parent().html("").css("width", "0").css("padding", "0").css("border-style", "none");
                                    $(".spanSupName").parent().html("").css("width", "0").css("padding", "0").css("border-style", "none");
                                    $(".tdSkuNameSup").parent().css("width", "200px");

                                    $(".spanUpdateTime").parent().css("display", "none");
                                    $(".tdCreateTime").parent().css("width", "120px");
                                }
                            });
                    }
                }
            );

            $("#headerSku").append($("#thSku"));
            $("#headerName").append($("#thProductName"));
            $("#headerSupplier").append($("#thSupplier"));

            $("#headerCreateTime").append($("#thCreateTime"));
            $("#headerModifyTime").append($("#thModifyTime"));

            $('#productList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showProductDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#productList');
            },
            showProductDetail: function (id) {
                showMask("加载中...");
                $("#productDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpProduct.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#productDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveProduct: function () {
                showMask("提交中...");
                var form = $("#productDetailForm");
                var valid = validate(form, {
                    'detail.product.sku': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.product.name': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.product.cate_id': {
                        required: false, digits: true
                    },
                    'detail.product.cost_price': {
                        required: true, number: true
                    },
                    'detail.product.weight': {
                        required: true, number: true
                    },
                    'detail.product.supplier_id': {
                        required: false, digits: true
                    },
                    'detail.product.pkg_mtrl_id': {
                        required: false, digits: true
                    },
                    'detail.product.status_id': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpProduct.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#productDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteProduct: function () {
                var id_list = [];
                $('#productList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpProduct.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
