{% site_header "商品操作日志" . %}
<div class="main-container" id="main-container">
    <div id="product_log" style="width: 1024px;margin-left: auto;margin-right: auto;">

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller widget-title">操作日志（{{ page.product.sku }}，{{ page.product.cn_name }}）</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="product_log_list" class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th class="center" style="width: 100px;">编号</th>
                                    <th>操作描述</th>
                                    <th class="center" style="width: 100px;">操作工号</th>
                                    <th class="center" style="width: 120px;">操作时间</th>
                                </tr>
                                </thead>
                                <tbody>
                                <template v-for="(product_log, index) in page.product_log_list">
                                    <tr>
                                        <td class="center">{{index + 1}}</td>
                                        <td>
                                            <div style="min-width: 280px;white-space:normal;word-break: break-all;word-wrap:break-word;">
                                                {{product_log.operation}}
                                            </div>
                                        </td>
                                        <td class="center">{{product_log.login_name}}</td>
                                        <td class="center">{{product_log.create_time}}</td>
                                    </tr>
                                </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{%template "erp/kcgl/product/product_detail.var" .%}
<script type="text/javascript">
    var vm = new Vue({
        el: "#product_log",
        data: {
            "page": {
                "product": {},
                "product_log_list": []
            }
        },
        mounted: function () {
            var this_vm = this;

            $.ajax(
                {
                    "type": "POST",
                    "dataType": 'json',
                    "url": '{% url "ErpProduct.ProductLogListData" %}',
                    "data": {
                        "id": product_id
                    },
                    "success": function (data) {
                        if (data.success === false) {
                            $.msg.error(data.message);
                            return;
                        }
                        this_vm.page = data;
                    }
                });
        },
        methods: {}
    });
</script>
{% site_footer %}
