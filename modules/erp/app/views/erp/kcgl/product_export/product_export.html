{%header "商品导出" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="kcgl-menu">库存管理</li>
            <li class="active" data-menu="kcgl-product-export-menu">商品导出</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="row" style="margin-top: 15px;margin-bottom: 5px;">
                    <div id="query" class="col-xs-12 query">
                        <label for="code_query" class="control-label no-padding-right">商品编号</label>
                        <input id="code_query" type="text" class="input-sm" placeholder="商品编号查询" style="width: 130px;"/>
                        <label for="storage_loc_query" class="control-label">仓位</label>
                        <input id="storage_loc_query" type="text" class="input-sm" placeholder="仓位查询" style="width: 130px;"/>
                        <button class="btn btn-mini btn-primary" @click="queryProduct()">
                            <i class="ace-icon fa fa-search"></i>
                            查询
                        </button>
                        <button class="btn btn-success btn-sm" @click="exportProduct()">
                            <i class="ace-icon fa fa-file-excel-o"></i>
                            导出
                        </button>
                    </div>
                </div>
                <div>
                    <table id="productList" class="table table-striped table-bordered table-hover"></table>
                    <div class="todo">1、只是做个示例，后续确定查询条件和导出字段；2、导出字段和字段顺序可以灵活选择，可以参考马帮界面；3、字段和字段顺序可以按用户保存</div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "product": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#productList',
                {
                    "sDom": "<'row'<'col-xs-12't>><'row'<'col-xs-6'i><'col-xs-6'p>>",
                    "sAjaxSource": '{%url "ErpProductExport.ListData"%}',
                    "aaSorting": [[0, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "id",
                            "bSortable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "sku", "title": "SKU", "bSortable": false},
                        {"mDataProp": "name", "title": "名称", "bSortable": false},
                        {"mDataProp": "cate_id", "title": "商品目录", "bSortable": false},
                        {"mDataProp": "cost_price", "title": "成本价", "bSortable": false},
                        {"mDataProp": "supplier_id", "title": "供应商", "bSortable": false},
                        {"mDataProp": "status_id", "title": "状态", "bSortable": false}
                    ]
                }
            );
        },
        methods: {
            queryProduct: function () {
                refreshList('#productList');
            },
            exportProduct: function () {
                var id_list = [];
                $('#productList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                var params = $.param({
                    "id_list": id_list
                });
                var url = '{%url "ErpProductExport.Export"%}' + "?" + params;
                $('<form method="post" action="' + url + '"></form>').appendTo('body').submit().remove();
            }
        }
    });
</script>
{%footer%}
