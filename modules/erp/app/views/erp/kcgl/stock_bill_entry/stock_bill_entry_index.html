{%header "出入库单明细" .%}
<style type="text/css">
    .dataTables_wrapper {
        margin-top: 15px;
        border-top: 0;
        border-bottom: 0;
    }
</style>
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="kcgl-menu">库存管理</li>
            {% .breadcrumb_nav %}
            <li>{% .bill_type %}明细（批次号：{% .stock_bill.Code %}）</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#stockBillEntryList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showStockBillEntryDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteStockBillEntry()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div class="row" style="margin-top: 20px;margin-bottom: 20px;">
                    <div id="query" class="col-xs-12" style="line-height: 28px;">
                        <fieldset>
                            <legend style="font-size: 14px;">
                                {% .bill_type %}&nbsp;<span style="color: #A5A5A5;">（批次号：{% .stock_bill.Code %}，日期：{% .stock_bill.Date %}，仓库：{% .stock_name %}）</span>
                            </legend>
                            <div class="col-xs-12">
                                <form class="form-horizontal" role="form" id="stockBillEntryAddForm">
                                    <div class="row">
                                        <div class="col-xs-3">
                                            <div class="form-group">
                                                <label for="storage_loc_name" class="col-xs-2 control-label no-padding-right">仓位</label>
                                                <div class="col-xs-10">
                                                    <input id="storage_loc_name" name="bill_entry_add.storage_loc_name" type="text" class="input-sm form-control" placeholder="输入新增商品仓库{%.stock_name%}的仓位" v-model.number="bill_entry_add.storage_loc_name"/>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-xs-3">
                                            <div class="form-group">
                                                <label for="product_sku" class="col-xs-2 control-label no-padding-right">SKU</label>
                                                <div class="col-xs-10">
                                                    <input id="product_sku" name="bill_entry_add.product_sku" type="text" class="input-sm form-control" placeholder="输入新增商品SKU" v-model.number="bill_entry_add.product_sku"/>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-xs-3">
                                            <div class="form-group">
                                                <label for="add_qty" class="col-xs-2 control-label no-padding-right">数量</label>
                                                <div class="col-xs-10">
                                                    <input id="add_qty" name="bill_entry_add.qty" type="text" class="input-sm form-control" placeholder="输入新增商品数量" v-model.number="bill_entry_add.qty"/>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-xs-3">
                                            <div class="form-group">
                                                <label for="add_price" class="col-xs-2 control-label no-padding-right">单价</label>
                                                <div class="col-xs-10">
                                                    <input id="add_price" name="bill_entry_add.price" type="text" class="input-sm form-control" placeholder="输入新增商品单价（可选）" v-model.number="bill_entry_add.price"/>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                </form>
                            </div>

                        </fieldset>
                    </div>
                </div>
                <div>
                    <table id="stockBillEntryList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="stockBillEntryDetailDialog">
        <div class="modal-dialog" style="width: 520px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">{% .bill_type %}明细详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="stockBillEntryDetailForm">
                                <input id="stock_bill_entry_id" name="detail.bill_entry.id" type="hidden" v-model.number="detail.bill_entry.id"/>
                                <input id="stock_bill_entry_version" name="detail.bill_entry.version" type="hidden" v-model.number="detail.bill_entry.version"/>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="storage_loc_id" class="col-xs-2 control-label no-padding-right">仓位</label>
                                            <div class="col-xs-10">
                                                <input id="storage_loc_id" name="detail.bill_entry_add.storage_loc_id" type="text" class="input-sm form-control" v-model.number="detail.bill_entry.storage_loc_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="product_id" class="col-xs-2 control-label no-padding-right">商品</label>
                                            <div class="col-xs-10">
                                                <input id="product_id" name="detail.bill_entry.product_id" type="text" class="input-sm form-control" v-model.number="detail.bill_entry.product_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="qty" class="col-xs-2 control-label no-padding-right">出入库数量</label>
                                            <div class="col-xs-10">
                                                <input id="qty" name="detail.bill_entry.qty" type="text" class="input-sm form-control" v-model.number="detail.bill_entry.qty"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="price" class="col-xs-2 control-label no-padding-right">单价</label>
                                            <div class="col-xs-10">
                                                <input id="price" name="detail.bill_entry.price" type="text" class="input-sm form-control" v-model.number="detail.bill_entry.price"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveStockBillEntry()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "bill_entry": {}
            },
            "bill_entry_add": {}
        },
        mounted: function () {
            initDataTable(
                '#stockBillEntryList',
                {
                    "sDom": "<'row'<'col-xs-12't>>",
                    "sAjaxSource": '{%url "ErpStockBillEntry.ListData" .stock_bill.Id %}',
                    "aaSorting": [[1, "asc"]],
                    "bPaginate": false,
                    "aoColumns": [
                        {
                            "mDataProp": "id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "bill_id", "title": "批次", "bSearchable": false},
                        {"mDataProp": "storage_loc_id", "title": "仓位", "bSearchable": false},
                        {"mDataProp": "product_id", "title": "商品", "bSearchable": false},
                        {"mDataProp": "pre_qty", "title": "当前库存", "bSearchable": false},
                        {"mDataProp": "qty", "title": "出入库数量", "bSearchable": false},
                        {"mDataProp": "price", "title": "单价", "bSearchable": false},
                        {"mDataProp": "amount", "title": "金额", "bSearchable": false},
                        {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#stockBillEntryList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showStockBillEntryDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#stockBillEntryList');
            },
            showStockBillEntryDetail: function (id) {
                showMask("加载中...");
                $("#stockBillEntryDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpStockBillEntry.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#stockBillEntryDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveStockBillEntry: function () {
                showMask("提交中...");
                var form = $("#stockBillEntryDetailForm");
                var valid = validate(form, {
                    'detail.bill_entry.bill_id': {
                        required: true, digits: true
                    },
                    'detail.bill_entry.storage_loc_id': {
                        required: true, digits: true
                    },
                    'detail.bill_entry.product_id': {
                        required: true, digits: true
                    },
                    'detail.bill_entry.pre_qty': {
                        required: true, digits: true
                    },
                    'detail.bill_entry.qty': {
                        required: true, digits: true
                    },
                    'detail.bill_entry.price': {
                        required: false, digits: true
                    },
                    'detail.bill_entry.amount': {
                        required: false, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpStockBillEntry.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#stockBillEntryDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteStockBillEntry: function () {
                var id_list = [];
                $('#stockBillEntryList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpStockBillEntry.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
