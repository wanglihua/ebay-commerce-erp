{%header "特殊SKU" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="kcgl-menu">库存管理</li>
            <li class="active" data-menu="kcgl-special-product-menu">特殊SKU</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#specialProductList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="addSpecialProduct()">
                        <i class="ace-icon fa fa-plus"></i>
                        添加
                    </button>
                    <button class="btn btn-success btn-sm" @click="showBatchAddSpecialProduct()">
                        <i class="ace-icon fa fa-plus"></i>
                        批量添加
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteSpecialProduct()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        移除
                    </button>
                </div>
                <div>
                    <table id="specialProductList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="specialProductDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">特殊SKU详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="specialProductDetailForm">

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="sku" class="col-xs-2 control-label">SKU</label>
                                            <div class="col-xs-10">
                                                <input id="sku" name="detail.sku" type="text" class="input-sm form-control" v-model="detail.sku"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="description" class="col-xs-2 control-label">描述</label>
                                            <div class="col-xs-10">
                                                <textarea id="description" name="detail.special_product.description" rows="4" class="input-sm form-control" v-model="detail.special_product.description"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveSpecialProduct()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="specialProductBatchAddDialog">
        <div class="modal-dialog" style="width: 580px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">特殊SKU批量添加</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="specialProductBatchAddForm">

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="sku_list" class="col-xs-2 control-label">添加SKU列表</label>
                                            <div class="col-xs-10">
                                                <textarea id="sku_list" name="detail.sku_list" rows="3" class="input-sm form-control" v-model="detail.sku_list"></textarea>
                                                <div class="help-block">多个SKU之间用；分割</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="batchAddSpecialProduct()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "special_product": {},
                "sku_list": "" //用户批量添加时
            }
        },
        mounted: function () {
            initDataTable(
                '#specialProductList',
                {
                    "sAjaxSource": '{%url "ErpSpecialProduct.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "sp.id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "p.sku", "title": "商品SKU", "bSearchable": true, "width": 150},
                        {
                            "mDataProp": "p.cn_name", "title": "商品名称", "bSearchable": true, "width": 350, "sClass": "wrap-word",
                            "render": function (data, type, row) {
                                return "<div>" + data + "</div>";
                            }
                        },
                        {
                            "mDataProp": "sp.description", "title": "描述", "bSearchable": true, "sClass": "wrap-word",
                            "render": function (data, type, row) {
                                return "<div>" + data + "</div>";
                            }
                        },
                        {"mDataProp": "sp.create_time", "title": "添加时间", "bSearchable": false, "width": 120}
                    ]
                }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#specialProductList');
            },
            addSpecialProduct: function () {
                showMask("加载中...");
                $("#specialProductDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpSpecialProduct.DetailData" %}',
                        type: "POST",
                        success: function (result) {
                            hideMask();
                            if (result.success === false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#specialProductDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveSpecialProduct: function () {
                showMask("提交中...");
                var form = $("#specialProductDetailForm");
                var valid = validate(form, {
                    'detail.sku': {
                        required: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpSpecialProduct.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#specialProductDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            showBatchAddSpecialProduct: function () {
                showMask("加载中...");
                $("#specialProductBatchAddForm").clearValidation();
                vm.detail.sku_list = "";
                $('#specialProductBatchAddDialog').modal(modalOptions);
            },
            batchAddSpecialProduct: function () {
                showMask("提交中...");
                var form = $("#specialProductBatchAddForm");
                var valid = validate(form, {
                    'detail.sku_list': {
                        required: truse
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpSpecialProduct.BatchAdd"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#specialProductBatchAddDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteSpecialProduct: function () {
                var id_list = [];
                $('#specialProductList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length === 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpSpecialProduct.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
