{%header "绑定商品" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="kcgl-menu">库存管理</li>
            <li class="active" data-menu="kcgl-productbind-menu">绑定商品</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#productBindList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showProductBindDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteProductBind()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                    <button class="btn btn-info btn-sm" @click="showProductBindLog()">
                        <i class="ace-icon fa fa-book"></i>
                        操作日志
                    </button>
                </div>
                <div>
                    <table id="productBindList" class="table table-striped table-bordered table-hover"></table>
                    <div class="todo">1、操作日志；2、导入绑定商品；3、如果绑定的商品，当时是验证正确的。但是后来绑定的子商品被删除掉了，怎么办？相当于这时绑定的商品已经无效了。</div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="productBindDetailDialog">
        <div class="modal-dialog" style="width: 580px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">绑定商品详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="productBindDetailForm">
                                <input id="product_bind_id" name="detail.product_bind.id" type="hidden" v-model.number="detail.product_bind.id"/>
                                <input id="product_bind_version" name="detail.product_bind.version" type="hidden" v-model.number="detail.product_bind.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="code" class="col-xs-2 control-label">编号</label>
                                            <div class="col-xs-10">
                                                <input id="code" name="detail.product_bind.code" type="text" class="input-sm form-control" v-model="detail.product_bind.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="name" class="col-xs-2 control-label">名称</label>
                                            <div class="col-xs-10">
                                                <input id="name" name="detail.product_bind.name" type="text" class="input-sm form-control" v-model="detail.product_bind.name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="bind_list" class="col-xs-2 control-label">捆绑商品列表</label>
                                            <div class="col-xs-10">
                                                <textarea id="bind_list" name="detail.product_bind.bind_list" rows="2" class="input-sm form-control" v-model="detail.product_bind.bind_list"></textarea>
                                                <div class="help-block">
                                                    *多个商品，以逗号为间隔,如果某个商品有多个写成*数量，如果只有一个也要写*1。例：xxx*1,xxx*3,xxx*4
                                                    (后面的*数字为必需加上的)
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-2 control-label">描述</label>
                                            <div class="col-xs-10">
                                                <textarea id="desc" name="detail.product_bind.desc" rows="2" class="input-sm form-control" v-model="detail.product_bind.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="status_id" class="col-xs-2 control-label">状态</label>
                                            <div class="col-xs-10">
                                                <select id="status_id" name="detail.product_bind.status_id" class="input-sm form-control" v-model.number="detail.product_bind.status_id">
                                                    <template v-for="status in detail.status_list">
                                                        <option :value="status.id">{{status.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveProductBind()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "product_bind": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#productBindList',
                {
                    "sAjaxSource": '{%url "ErpProductBind.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "b.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "b.code", "title": "编号", "bSearchable": true, "width": 120},
                        {"mDataProp": "b.name", "title": "名称", "bSearchable": true, "width": 180},
                        {"mDataProp": "b.bind_list", "title": "捆绑商品列表", "bSearchable": true},
                        //{"mDataProp": "b.bind_list", "title": "捆绑商品列表", "bSearchable": true, "width": 250},
                        //{"mDataProp": "b.desc", "title": "描述", "bSearchable": true},
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": true, "width": 80},
                        {"mDataProp": "b.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "b.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#productBindList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showProductBindDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#productBindList');
            },
            showProductBindDetail: function (id) {
                showMask("加载中...");
                $("#productBindDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpProductBind.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#productBindDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            showProductBindLog: function () {
                window.location.href = "/erp/product/bind/log";
            },
            saveProductBind: function () {
                showMask("提交中...");
                var form = $("#productBindDetailForm");
                var valid = validate(form, {
                    'detail.product_bind.code': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.product_bind.name': {
                        required: true, minlength: 2, maxlength: 200
                    },
                    'detail.product_bind.bind_list': {
                        required: true, minlength: 1, maxlength: 500
                    },
                    'detail.product_bind.pkg_mtrl_id': {
                        required: true, digits: true
                    },
                    'detail.product_bind.status_id': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpProductBind.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#productBindDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteProductBind: function () {
                var id_list = [];
                $('#productBindList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpProductBind.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
