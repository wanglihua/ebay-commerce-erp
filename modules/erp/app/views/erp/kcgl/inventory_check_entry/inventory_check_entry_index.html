{%header "库存盘点明细" .%}
<div id="page">
   <div class="breadcrumbs" id="breadcrumbs">
       <ul class="breadcrumb">
           <li>
               <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
           </li>
           <li class="parent" data-menu="erp-menu">ERP</li>
           <li class="active" data-menu="erp-inventorycheckentry-menu">库存盘点明细</li>
       </ul>
   </div>
   <div class="page-content">
       <div class="row">
           <div class="col-xs-12" style="padding: 0;">
               <div class="gridToolBar clearfix">
                   <button class="btn btn-primary btn-sm" @click="reloadList('#inventoryCheckEntryList')">
                       <i class="ace-icon fa fa-refresh"></i>
                       刷新
                   </button>
                   <button class="btn btn-success btn-sm" @click="showInventoryCheckEntryDetail(0)">
                       <i class="ace-icon fa fa-plus"></i>
                       新增
                   </button>
                   <button class="btn btn-danger btn-sm" @click="deleteInventoryCheckEntry()">
                       <i class="ace-icon fa fa-trash-o"></i>
                       删除
                   </button>
               </div>
               <div>
                   <table id="inventoryCheckEntryList" class="table table-striped table-bordered table-hover"></table>
               </div>
           </div>
       </div>
   </div>
    <div class="modal fade" id="inventoryCheckEntryDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">库存盘点明细详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="inventoryCheckEntryDetailForm">
                                <input id="inventory_check_entry_id" name="detail.check_entry.id" type="hidden" v-model.number="detail.check_entry.id"/>
                                <input id="inventory_check_entry_version" name="detail.check_entry.version" type="hidden" v-model.number="detail.check_entry.version"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="check_id" class="col-xs-2 control-label no-padding-right">盘点批次</label>
                                            <div class="col-xs-10">
                                                <input id="check_id" name="detail.check_entry.check_id" type="text" class="input-sm form-control" v-model.number="detail.check_entry.check_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="storage_loc_id" class="col-xs-2 control-label no-padding-right">库位</label>
                                            <div class="col-xs-10">
                                                <input id="storage_loc_id" name="detail.check_entry.storage_loc_id" type="text" class="input-sm form-control" v-model.number="detail.check_entry.storage_loc_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="product_id" class="col-xs-2 control-label no-padding-right">商品</label>
                                            <div class="col-xs-10">
                                                <input id="product_id" name="detail.check_entry.product_id" type="text" class="input-sm form-control" v-model.number="detail.check_entry.product_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="pre_qty" class="col-xs-2 control-label no-padding-right">盘点前库存</label>
                                            <div class="col-xs-10">
                                                <input id="pre_qty" name="detail.check_entry.pre_qty" type="text" class="input-sm form-control" v-model.number="detail.check_entry.pre_qty"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="check_qty" class="col-xs-2 control-label no-padding-right">盘点库存</label>
                                            <div class="col-xs-10">
                                                <input id="check_qty" name="detail.check_entry.check_qty" type="text" class="input-sm form-control" v-model.number="detail.check_entry.check_qty"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="qty_diff" class="col-xs-2 control-label no-padding-right">库存差值</label>
                                            <div class="col-xs-10">
                                                <input id="qty_diff" name="detail.check_entry.qty_diff" type="text" class="input-sm form-control" v-model.number="detail.check_entry.qty_diff"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveInventoryCheckEntry()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "check_entry": {}
            }
        },
        mounted: function () {
            initDataTable(
                    '#inventoryCheckEntryList',
                    {
                        "sAjaxSource": '{%url "ErpInventoryCheckEntry.ListData"%}',
                        "aaSorting": [[1, "asc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "check_id", "title": "盘点批次", "bSearchable": false },
                            {"mDataProp": "storage_loc_id", "title": "库位", "bSearchable": false },
                            {"mDataProp": "product_id", "title": "商品", "bSearchable": false },
                            {"mDataProp": "pre_qty", "title": "盘点前库存", "bSearchable": false },
                            {"mDataProp": "check_qty", "title": "盘点库存", "bSearchable": false },
                            {"mDataProp": "qty_diff", "title": "库存差值", "bSearchable": false },
                            {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120 },
                            {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120 }
                        ]
                   }
            );

            $('#inventoryCheckEntryList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showInventoryCheckEntryDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#inventoryCheckEntryList');
            },
            showInventoryCheckEntryDetail: function (id) {
                showMask("加载中...");
                $("#inventoryCheckEntryDetailForm").clearValidation();
                $.ajax({
                           url: '{%url "ErpInventoryCheckEntry.DetailData" %}',
                           type: "POST",
                           data: {
                               "id": id
                           },
                           success: function (result) {
                               hideMask();
                               if (result.success == false) {
                                   $.msg.error(result.message);
                                   return;
                               }
                               vm.detail = result;
                               $('#inventoryCheckEntryDetailDialog').modal(modalOptions);
                           }
                       }
                );
            },
            saveInventoryCheckEntry: function () {
                showMask("提交中...");
                var form = $("#inventoryCheckEntryDetailForm");
                var valid = validate(form, {  
                    'detail.check_entry.check_id': {
                        required: true, digits: true
                    },
                    'detail.check_entry.storage_loc_id': {
                        required: true, digits: true
                    },
                    'detail.check_entry.product_id': {
                        required: true, digits: true
                    },
                    'detail.check_entry.pre_qty': {
                        required: true, digits: true
                    },
                    'detail.check_entry.check_qty': {
                        required: true, digits: true
                    },
                    'detail.check_entry.qty_diff': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                               url: '{%url "ErpInventoryCheckEntry.Save"%}',
                               type: "POST",
                               processData: false,
                               contentType: 'application/json',
                               data: JSON.stringify(vm.detail),
                               success: function (data) {
                                   hideMask();
                                   if (data.success == false) {
                                       $.msg.error(data.message);
                                       //return;
                                   }
                                   else {
                                       $.msg.show(data.message);
                                       $('#inventoryCheckEntryDetailDialog').modal('hide');
                                       vm.reloadList();
                                       //return;
                                   }
                               }
                           }
                    );
                }
            },
            deleteInventoryCheckEntry: function () {
                var id_list = [];
                $('#inventoryCheckEntryList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                               url: '{%url "ErpInventoryCheckEntry.Delete"%}',
                               type: "POST",
                               data: {"id_list": id_list},
                               success: function (data) {
                                   if (data.success == false) {
                                       $.msg.error(data.message);
                                       return;
                                   }
                                   else {
                                       $.msg.show(data.message);
                                   }
                                   vm.reloadList();
                               }
                           });
                });
            }
        }
    });
</script>
{%footer%}
