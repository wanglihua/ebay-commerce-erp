{%header "商品销售趋势分析" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="spbb-menu">商品报表</li>
            <li class="active" data-menu="spbb-product-sale-rank-menu"><a href='{% url "ErpProductSaleRank.Index"%}'>商品销售排名</a></li>
            <li>商品销售趋势分析</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" onclick="refreshChartData()">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div>
                    <div style="padding: 10px 0;font-weight: bold;line-height: 20px;">
                        {% range $index, $product_name := .product_name_list %}
                        {% $product_name %}<br/>
                        {% end %}
                    </div>
                    <div id="chart" style="width:800px;height:600px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/static/lib/echarts/echarts.min.js"></script>
<script type="text/javascript">

    $(function () {
        refreshChartData();
    });

    function refreshChartData() {
        var url = '{% url "ErpProductSaleTrend.ListData"%}';

        var chart = echarts.init(document.getElementById('chart'));

        showMask("数据加载中，请稍候");
        $.ajax({
            "dataType": 'json',
            "url": url,
            "data": {
                'product_ids': '{% .product_id_strs %}'
            },
            "success": function (data) {
                hideMask();

                if (data.success === false) {
                    $.msg.error(data.message);
                    return;
                }

                chart.setOption(data);
            }
        });
    }

</script>
{%footer%}
