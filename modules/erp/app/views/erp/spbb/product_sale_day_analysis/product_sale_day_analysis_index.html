{%header "商品销售日统计" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="spbb-menu">商品报表</li>
            <li class="active" data-menu="spbb-product-sale-day-analysis-menu">商品销售日统计</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#productSaleDayAnalysisList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-pink btn-sm" @click="analyze()">
                        <i class="ace-icon fa fa-refresh"></i>
                        立即分析销售情况
                    </button>
                </div>
                <div id="query" class="col-xs-12" style="line-height: 28px;">
                    <div class="col-xs-12" style="margin-top: 20px;margin-bottom: 20px;">
                        <div style="float: left;">
                            <label for="analysis_type_id">统计类型</label>
                            <select id="analysis_type_id" name="analysis_type_id" style="width: 150px;" @change="reloadList()">
                                <option :value="0">统计类型</option>
                                <template v-for="analysis_type in page.analysis_type_list">
                                    <option :value="analysis_type.id">{{analysis_type.name}}</option>
                                </template>
                            </select>&nbsp;&nbsp;
                            <label for="stock_id">仓库</label>
                            <select id="stock_id" name="stock_id" style="width: 150px;" @change="reloadList()">
                                <option :value="0">仓库查询</option>
                                <template v-for="stock in page.stock_list">
                                    <option :value="stock.id">{{stock.name}}</option>
                                </template>
                            </select>&nbsp;&nbsp;
                            <label for="sku_query">商品编号查询</label>
                            <input id="sku_query" name="sku_query" style="width: 180px;height:30px;"/>
                            <label class="control-label no-padding-right" for="begin_time_query">日期开始</label>
                            <input class="input-sm" id="begin_time_query" name="begin_time_query" placeholder="日期开始" type="text" style="width: 80px;"/>
                            <label class="control-label no-padding-right" for="end_time_query">日期结束</label>
                            <input class="input-sm" id="end_time_query" name="end_time_query" placeholder="日期结束" type="text" style="width: 80px;"/>
                            <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" @click="refreshList()">
                                &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                            </button>
                        </div>
                        <div style="clear: both;"></div>
                    </div>
                </div>
                <div>
                    <table id="productSaleDayAnalysisList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">

    $(function () {
        $('#begin_time_query').datetimepicker({
            locale: "zh-cn"
        });

        $('#end_time_query').datetimepicker({
            locale: "zh-cn"
        });
    });

    var vm = new Vue({
        el: "#page",
        data: {
            "page": {
                "analysis_type_list": []
            }
        },
        mounted: function () {
            initDataTable(
                    '#productSaleDayAnalysisList',
                    {
                        "sAjaxSource": '{%url "ErpProductSaleDayAnalysis.ListData"%}',
                        "aaSorting": [[1, "asc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "da.type", "title": "统计类型", "bSearchable": false, "sClass": "center", "width": 120,
                                "render": function (data, type, row) {
                                    return row.da.type_name;
                                }
                            },
                            {"mDataProp": "s.name", "title": "仓库", "bSearchable": true, "sClass": "center", "width": 200},
                            {
                                "mDataProp": "da.sku", "title": "SKU", "bSearchable": true, "width": 200,
                                "render": function (data, type, row) {
                                    return '<a href="/product/detail/' + row.da.product_id + '" target="product_detail">' + row.da.sku + '</a>';
                                }
                            },
                            {"mDataProp": "da.day", "title": "日期", "bSearchable": false, "sClass": "center", "width": 120},
                            {"mDataProp": "da.qty", "title": "销售数量", "bSearchable": false, "sClass": "center", "width": 80},
                            {"mDataProp": "da.product_name", "title": "商品名称", "bSearchable": false, "bSortable": false}
                        ],
                        "fnServerData": function (sSource, aoData, fnCallback) {
                            showMask("数据加载中，请稍候");
                            aoData.push({'name': 'sku_query', 'value': $("#sku_query").val()});
                            aoData.push({'name': 'analysis_type_id', 'value': $("#analysis_type_id").val()});
                            aoData.push({'name': 'stock_id', 'value': $("#stock_id").val()});
                            aoData.push({'name': 'begin_time_query', 'value': $("#begin_time_query").val()});
                            aoData.push({'name': 'end_time_query', 'value': $("#end_time_query").val()});

                            $.ajax({
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();

                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }

                                    fnCallback(data);
                                }
                            });
                        }
                    }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#productSaleDayAnalysisList');
            },
            refreshList: function () {
                refreshList('#productSaleDayAnalysisList');
            },
            analyze: function () {
                $.msg.confirm("将立即启动销售后台分析任务！", function () {
                    $.ajax({
                        "dataType": 'json',
                        "url": '{% url "ErpProductSaleDayAnalysis.Analyze" %}',
                        "success": function (data) {

                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                                return;
                            }
                        }
                    });
                });
            }
        }
    });

    function loadPageData() {
        $.ajax({
            "dataType": 'json',
            "url": '{% url "ErpProductSaleDayAnalysis.PageData" %}',
            "success": function (data) {

                if (data.success === false) {
                    $.msg.error(data.message);
                    return;
                }

                vm.page = data;
            }
        });
    }

    $(function () {
        loadPageData();
    });
</script>
{%footer%}
