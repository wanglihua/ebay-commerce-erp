{%header "商品目录操作日志" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="sppz-menu">商品配置</li>
            <li class="parent" data-menu="sppz-menu"><a href='{% url "ErpProductCate.Index" %}'>商品目录</a></li>
            <li class="active" data-menu="sppz-productcatelog-menu">操作日志</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#productCateLogList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div>
                    <table id="productCateLogList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "cate_log": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#productCateLogList',
                {
                    "sAjaxSource": '{%url "ErpProductCateLog.ListData"%}',
                    "aaSorting": [[0, "desc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "id",
                            "title": '编号',
                            "bSearchable": false,
                            "orderable": true,
                            "sClass": "center",
                            "width": 50
                        },
                        {"mDataProp": "name", "title": "名称", "bSearchable": true, "width": 180},
                        {"mDataProp": "desc", "title": "操作", "bSearchable": true},
                        {"mDataProp": "login_name", "title": "工号", "bSearchable": true, "width": 120},
                        {"mDataProp": "create_time", "title": "操作时间", "bSearchable": false, "width": 120}
                    ]
                }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#productCateLogList');
            }
        }
    });
</script>
{%footer%}
