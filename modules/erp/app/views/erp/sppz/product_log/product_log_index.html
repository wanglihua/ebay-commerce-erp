{%header "商品修改日志" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="sppz-menu">ERP</li>
            <li class="active" data-menu="sppz-productlog-menu">商品修改日志</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#productLogList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div class="row" style="margin-top: 20px;margin-bottom: 20px;">
                    <div id="query" class="col-xs-12" style="line-height: 28px;">
                        <fieldset>
                            <legend style="font-size: 14px;">
                                查询&nbsp;<span style="color: #D5D5D5;">(输入查询条件后点击 刷新 按钮)</span>
                            </legend>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label class="col-xs-3 control-label no-padding-right" for="product_code_query">商品编号</label>
                                    <div class="col-xs-8">
                                        <input class="input-sm form-control" id="product_code_query" onkeydown="queryOnKeyDown(event);" onchange="reloadProductLogList();" name="product_code_query" placeholder="商品编号查询" type="text">
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label class="col-xs-3 control-label no-padding-right" for="login_name_query">操作员</label>
                                    <div class="col-xs-8">
                                        <input class="input-sm form-control" id="login_name_query" onkeydown="queryOnKeyDown(event);" onchange="reloadProductLogList();" name="login_name_query" placeholder="操作员工号查询" type="text">
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label class="col-xs-3 control-label no-padding-right" for="begin_time_query">开始时间</label>
                                    <div class="col-xs-8">
                                        <input class="input-sm form-control" id="begin_time_query" onkeydown="queryOnKeyDown(event);" onchange="reloadProductLogList();" name="begin_time_query" placeholder="时间格式2018-08-08 08:08:08" type="text"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label class="col-xs-3 control-label no-padding-right" for="end_time_query">结束时间</label>
                                    <div class="col-xs-8">
                                        <input class="input-sm form-control" id="end_time_query" onkeydown="queryOnKeyDown(event);" onchange="reloadProductLogList();" name="end_time_query" placeholder="时间格式2018-08-28 08:28:28" type="text"/>
                                    </div>
                                </div>
                            </div>

                        </fieldset>
                    </div>
                </div>
                <div>
                    <table id="productLogList" class="table table-striped table-bordered table-hover"></table>
                    <div class="todo">1、添加时间段查询， 商品编号查询，操作员查询；2、在商品修改时记录修改</div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">

    function queryOnKeyDown(e) {
        var ev = window.event || e;
        if (ev.keyCode == 13) {
            reloadProductLogList();
        }
    }

    function reloadProductLogList() {
        reloadList('#productLogList');
    }

    $(function () {
        /*
         $('#begin_time_query').datetimepicker({
         locale: "zh-cn"
         }).on("dp.change", function (e) {
         reloadProductLogList();
         });

         $('#end_time_query').datetimepicker({
         locale: "zh-cn"
         }).on("dp.change", function (e) {
         reloadProductLogList();
         });
         */
        $('#begin_time_query').datetimepicker({
            locale: "zh-cn"
        });

        $('#end_time_query').datetimepicker({
            locale: "zh-cn"
        });
    });

    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "product_log": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#productLogList',
                {
                    "sAjaxSource": '{%url "ErpProductLog.ListData"%}',
                    "aaSorting": [[0, "desc"]],
                    "aoColumns": [
                        {"mDataProp": "id", "title": "记录编号", "bSearchable": false, "width": 80},
                        {"mDataProp": "product_code", "title": "商品编号", "bSearchable": true, "width": 150},
                        {"mDataProp": "create_time", "title": "操作时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "login_name", "title": "操作员", "bSearchable": true, "width": 120},
                        {"mDataProp": "operation", "title": "操作", "bSearchable": true}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        aoData.push({'name': 'product_code_query', 'value': $('#product_code_query').val()});
                        aoData.push({'name': 'login_name_query', 'value': $('#login_name_query').val()});
                        aoData.push({'name': 'begin_time_query', 'value': $('#begin_time_query').val()});
                        aoData.push({'name': 'end_time_query', 'value': $('#end_time_query').val()});

                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    return;
                                }

                                fnCallback(data);
                            }
                        });
                    }
                }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#productLogList');
            }
        }
    });
</script>
{%footer%}
