{%header "仓库拣货人员" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="sppz-menu">商品配置</li>
            <li class="active" data-menu="sppz-stock-menu"><a href='{%url "ErpStock.Index" %}'>仓库</a></li>
            <li>仓库拣货人员</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#stockPickCrewList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showStockPickCrewDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteStockPickCrew()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div class="row" style="margin-top: 20px;margin-bottom: 20px;">
                    <div id="query" class="col-xs-12 query" style="line-height: 28px;">
                        <div class="col-xs-12">
                            <label for="stock_id_query" class="control-label no-padding-right">仓库</label>
                            <select id="stock_id_query" name="page.stock_id_query" v-model.number="page.stock_id_query" style="width: 120px;">
                                <option value="0">-仓库-</option>
                                <template v-for="stock in page.stock_list">
                                    <option :value="stock.id">{{stock.name}}</option>
                                </template>
                            </select>
                            <label for="login_name_query" class="control-label no-padding-right">工号</label>
                            <input id="login_name_query" name="login_name_query" v-model="page.login_name_query" style="width: 120px;height:30px;" placeholder="工号"/>
                            <label for="nick_name_query" class="control-label no-padding-right">用户名</label>
                            <input id="nick_name_query" name="nick_name_query" v-model="page.nick_name_query" style="width: 120px;height:30px;" placeholder="用户名"/>
                            <label for="is_manager_query" class="control-label no-padding-right">是否管理员</label>
                            <select id="is_manager_query" name="page.is_manager_query" v-model.number="page.is_manager_query" style="width: 120px;">
                                <option :value="0">-是否管理员-</option>
                                <option :value="1">是</option>
                                <option :value="-1">否</option>
                            </select>
                            <button class="btn btn-mini btn-primary" style="margin-bottom:3px;height: 30px;" @click="refreshList()">
                                &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="stockPickCrewList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="stockPickCrewDetailDialog">
        <div class="modal-dialog" style="width: 540px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">仓库拣货人员详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="stockPickCrewDetailForm">
                                <input id="stock_pick_crew_id" name="detail.stock_pick_crew.id" type="hidden" v-model.number="detail.stock_pick_crew.id"/>
                                <input id="stock_pick_crew_version" name="detail.stock_pick_crew.version" type="hidden" v-model.number="detail.stock_pick_crew.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="stock_id" class="col-xs-2 control-label">仓库</label>
                                            <div class="col-xs-10">
                                                <select id="stock_id" name="detail.stock_pick_crew.stock_id" class="input-sm form-control" v-model.number="detail.stock_pick_crew.stock_id">
                                                    <option value="0">-仓库-</option>
                                                    <template v-for="stock in page.stock_list">
                                                        <option :value="stock.id">{{stock.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="user_login_name" class="col-xs-2 control-label">用户</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="user_id" name="detail.stock_pick_crew.user_id" type="hidden" v-model.number="detail.stock_pick_crew.user_id"/>
                                                    <input id="user_login_name" name="detail.user_login_name" type="text" readonly="readonly" class="input-sm form-control" v-model="detail.user_login_name"/>
                                                    <span class="input-group-btn">
                                                        <button class="btn btn-sm btn-purple" type="button" @click="showSelectUser()">
                                                            <i class="ace-icon fa fa-hand-pointer-o"></i>选择
                                                        </button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="is_manager" class="col-xs-2 control-label">是否管理员</label>
                                            <div class="col-xs-10">
                                                <select id="is_manager" name="detail.stock_pick_crew.is_manager" class="input-sm form-control" v-model.number="detail.stock_pick_crew.is_manager">
                                                    <option :value="0">-是否管理员-</option>
                                                    <option :value="1">是</option>
                                                    <option :value="-1">否</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveStockPickCrew()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="selectUserDialog">
        <div class="modal-dialog" style="width: 780px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">选择用户</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <table id="userList" class="table table-striped table-bordered table-hover"></table>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" onclick="selectUser()">
                        <i class="ace-icon fa fa-floppy-o"></i>选择
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "page": {
                "stock_id_query": 0,
                "stock_list": [],
                "login_name_query": "",
                "nick_name_query": "",
                "is_manager_query": 0
            },
            "detail": {
                "stock_pick_crew": {},
                "stock_list": []
            }
        },
        mounted: function () {
            var this_vm = this;

            // 请求页面数据
            $.ajax({
                    url: '{%url "ErpStockPickCrew.PageData" %}',
                    type: "POST",
                    success: function (result) {
                        if (result.success == false) {
                            $.msg.error(result.message);
                            return;
                        }
                        vm.page = result;
                    }
                }
            );

            initDataTable(
                '#stockPickCrewList',
                {
                    "sAjaxSource": '{%url "ErpStockPickCrew.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "spc.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "s.name", "title": "仓库", "bSearchable": true, "width": 130},
                        {"mDataProp": "u.login_name", "title": "工号", "bSearchable": true, "width": 130},
                        {"mDataProp": "u.nick_name", "title": "用户", "bSearchable": true, "width": 130},
                        {
                            "mDataProp": "spc.is_manager", "title": "是否管理员", "bSearchable": false,
                            "render": function (data, type, row) {
                                if (data === 1) {
                                    return "是";
                                }
                                else if (data === -1) {
                                    return "否";
                                }
                                else {
                                    return "";
                                }
                            }
                        },
                        {"mDataProp": "spc.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "spc.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'stock_id_query', 'value': this_vm.page.stock_id_query});
                        aoData.push({'name': 'login_name_query', 'value': this_vm.page.login_name_query});
                        aoData.push({'name': 'nick_name_query', 'value': this_vm.page.nick_name_query});
                        aoData.push({'name': 'is_manager_query', 'value': this_vm.page.is_manager_query});

                        //query_criteria_value

                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                hideMask();

                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    return;
                                }

                                fnCallback(data);
                            }
                        });
                    }
                }
            );

            $('#stockPickCrewList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showStockPickCrewDetail(id);
            });

            initSingleSelectDataTable(
                '#userList',
                {
                    "sAjaxSource": '{%url "ErpStockPickCrew.SelectUserListData"%}',
                    "bAutoWidth": false,
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace user_id" value="' + data + '"/><span class="lbl"></span>'
                                    + '<input type="hidden" class="user_login_name" value="' + row.login_name + '" />';
                            }
                        },
                        {"mDataProp": "login_name", "title": "工号", "bSearchable": true},
                        {"mDataProp": "nick_name", "title": "姓名", "bSearchable": true},
                        {"mDataProp": "sex", "title": "性别", "bSearchable": true},
                        {"mDataProp": "phone", "title": "联系电话", "bSearchable": true},
                        {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#userList tbody').on('dblclick', 'tr', function () {
                selectUser();
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#stockPickCrewList');
            },
            refreshList: function () {
                refreshList("#stockPickCrewList");
            },
            showStockPickCrewDetail: function (id) {
                showMask("加载中...");
                $("#stockPickCrewDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpStockPickCrew.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#stockPickCrewDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveStockPickCrew: function () {
                showMask("提交中...");
                var form = $("#stockPickCrewDetailForm");
                var valid = validate(form, {
                    'detail.stock_pick_crew.stock_id': {
                        required: true, digits: true
                    },
                    'detail.stock_pick_crew.user_id': {
                        required: true, digits: true
                    },
                    'detail.stock_pick_crew.is_manager': {
                        required: true, number: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpStockPickCrew.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#stockPickCrewDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteStockPickCrew: function () {
                var id_list = [];
                $('#stockPickCrewList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpStockPickCrew.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            },
            showSelectUser: function () {
                $('#selectUserDialog').modal(modalOptions);
            }
        }
    });

    function selectUser() {
        var user_id = $('#userList tbody tr>td:first-child input:checkbox:checked').closest("td").find("input.user_id").val();
        var user_login_name = $('#userList tbody tr>td:first-child input:checkbox:checked').closest("td").find("input.user_login_name").val();
        vm.detail.stock_pick_crew.user_id = parseInt(user_id);
        vm.detail.user_login_name = user_login_name;
        $('#selectUserDialog').modal("hide");
    }
</script>
{%footer%}
