{%header "订单修改日志" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddpz-menu">订单配置</li>
            <li class="active" data-menu="ddpz-orderlog-menu">订单修改日志</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#orderLogList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div>
                    <table id="orderLogList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "order_log": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#orderLogList',
                {
                    "sAjaxSource": '{%url "ErpOrderLog.ListData"%}',
                    "aaSorting": [[0, "asc"]],
                    "aoColumns": [
                        {"mDataProp": "id", "title": "记录编号", "bSearchable": false, "width": 80},
                        {"mDataProp": "order_code", "title": "订单编号", "bSearchable": true, "width": 150},
                        {"mDataProp": "trans_code", "title": "交易编号", "bSearchable": true, "width": 150},
                        {"mDataProp": "login_name", "title": "操作工号", "bSearchable": true, "width": 120},
                        {"mDataProp": "create_time", "title": "操作时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "operation", "title": "操作描述", "bSearchable": true}
                    ]
                }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#orderLogList');
            }
        }
    });
</script>
{%footer%}
