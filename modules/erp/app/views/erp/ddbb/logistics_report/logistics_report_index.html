{%header "物流报表" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddbb-menu">订单报表</li>
            <li class="active" data-menu="ddbb-logistics-report-menu">物流报表</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <button class="btn btn-primary btn-sm" @click="reloadList('#logisticsReportList')">
                                <i class="ace-icon fa fa-refresh"></i>
                                刷新
                            </button>
                        </div>
                    </div>
                    <div class="row" style="margin-top: 10px;margin-bottom: 20px;">
                        <div id="query" class="col-xs-12 query" style="line-height: 28px;">
                            <div class="col-xs-12">

                                <select id="stock_id" name="page.stock_id" v-model.number="page.stock_id" style="width: 120px;" @change="reloadList()">
                                    <option :value="0">-发货仓库-</option>
                                    <template v-for="stock in page.stock_list">
                                        <option :value="stock.id">{{stock.name}}</option>
                                    </template>
                                </select>

                                <select id="logistics_company_id" name="page.logistics_company_id" v-model.number="page.logistics_company_id" style="width: 120px;" @change="reloadList()">
                                    <option :value="0">-物流公司-</option>
                                    <template v-for="logistics_company in page.logistics_company_list">
                                        <option :value="logistics_company.id">{{logistics_company.name}}</option>
                                    </template>
                                </select>

                                <label class="control-label no-padding-right" for="postalcode_query">邮编</label>
                                <input class="input-sm" id="postalcode_query" name="postalcode_query" placeholder="多个邮编逗号隔开" type="text" v-model="page.postalcode_query" style="width: 200px;"/>
                                <label class="control-label no-padding-right" for="begin_time_query">开始时间</label>
                                <input class="input-sm" id="begin_time_query" name="begin_time_query" placeholder="发货开始时间查询" type="text" v-model="page.begin_time_query" style="width: 130px;"/>
                                <label class="control-label no-padding-right" for="end_time_query">结束时间</label>
                                <input class="input-sm" id="end_time_query" name="end_time_query" placeholder="发货结束时间查询" type="text" v-model="page.end_time_query" style="width: 130px;"/>
                                <button class="btn btn-mini btn-primary" @click="refreshList()">
                                    &nbsp;<i class="ace-icon fa fa-search"></i>查&nbsp;询&nbsp;
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="logisticsReportList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "page": {
                "stock_id": 0,
                "stock_list": [],
                "logistics_company_id": 0,
                "logistics_company_list": [],
                "begin_time_query": "",
                "end_time_query": ""
            }
        },
        methods: {
            reloadList: function () {
                reloadList('#logisticsReportList');
            },
            refreshList: function () {
                refreshList('#logisticsReportList');
            }
        }
    });

    function loadPageData() {
        $.ajax({
            url: '{%url "ErpLogisticsReport.PageData" %}',
            type: "POST",
            success: function (result) {
                if (result.success === false) {
                    $.msg.error(result.message);
                    return;
                }

                vm.page = result;
            }
        });
    }

    function initGrid() {
        initDataTable(
                '#logisticsReportList',
                {
                    "sAjaxSource": '{%url "ErpLogisticsReport.ListData"%}',
                    "aaSorting": [[0, "asc"]],
                    "iDisplayLength": 50,
                    "aoColumns": [
                        {
                            "mDataProp": "ol.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },

                        {
                            "mDataProp": "o.code", "title": "订单编码", "bSearchable": true, "width": 120, "bSortable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_order_code'><a href='/order/detail/" + row.o.id + "' target='_blank'>" + row.o.code + "</a></div>";
                            }
                        },

                        {
                            "mDataProp": "company_name", "title": "发货仓库<br/>物流公司<br/>物流方式", "bSearchable": false, "bSortable": false,
                            "render": function (data, type, row) {
                                return "<div class='div_stock'>" + row.stock_name + "</div><div class='div_company_name'>" + row.company_name + "</div><div>" + row.mode_name + "</div>";
                            }
                        },

                        {
                            "mDataProp": "ol.length", "title": "长/宽/高", "bSearchable": false, "width": 90, "bSortable": false,
                            "render": function (data, type, row) {
                                var length = "--";
                                if (row.ol.length !== "" && row.ol.length !== 0) {
                                    length = dtFormatFloat1(row.ol.length) + " cm";
                                }

                                var width = "--";
                                if (row.ol.width !== "" && row.ol.width !== 0) {
                                    width = dtFormatFloat1(row.ol.width) + " cm";
                                }

                                var height = "--";
                                if (row.ol.height !== "" && row.ol.height !== 0) {
                                    height = dtFormatFloat1(row.ol.height) + " cm";
                                }

                                return "<div class='div_lenght'>" + length + "</div><div>" + width + "</div><div>" + height + "</div>";
                            }
                        },

                        {
                            "mDataProp": "ol.weight", "title": "实际重量<br/>体积重量<br/>考虑体积重", "bSearchable": false, "width": 120, "bSortable": false,
                            "render": function (data, type, row) {
                                var actual_weight = row.ol.weight;
                                if (actual_weight !== "" && actual_weight !== 0) {
                                    actual_weight = dtFormatFloat1(actual_weight) + " kg";
                                }
                                else {
                                    actual_weight = "--";
                                }

                                var dim_weight = row.ol.dim_weight;
                                if (dim_weight !== "" && dim_weight !== 0) {
                                    dim_weight = dtFormatFloat1(dim_weight) + " kg";
                                }
                                else {
                                    dim_weight = "--";
                                }

                                return "<div class='div_actual_weight'>" + actual_weight + "</div><div>" + dim_weight + "</div><div>" + row.sfkltjz + "</div>";
                            }
                        },

                        {
                            "mDataProp": "ol.weight", "title": "预估费用<br/>实际费用", "bSearchable": false, "width": 100, "bSortable": false,
                            "render": function (data, type, row) {
                                var total_fee = dtFormatFloat(row.ol.total_fee);

                                var actual_fee = "--";
                                if (row.ol.actual_fee && row.ol.actual_fee !== 0) {
                                    actual_fee = dtFormatFloat(row.ol.actual_fee);
                                }

                                return "<div class='div_total_fee'>" + total_fee + "</div><div class='div_actual_fee'>" + actual_fee + "</div>";
                            }
                        },

                        {
                            "mDataProp": "o.shipped_time", "title": "发货时间", "bSearchable": false, "width": 120,
                            "render": function (data, type, row) {
                                var shipped_time = "--";
                                if (row.o.shipped_time) {
                                    shipped_time = row.o.shipped_time;
                                }

                                return "<div>" + shipped_time + "</div>";
                            }
                        }
                    ],
                    "fnServerData": function (sSource, aoData, fnCallback) {
                        showMask("数据加载中，请稍候");

                        aoData.push({'name': 'stock_id', 'value': vm.page.stock_id});
                        aoData.push({'name': 'logistics_company_id', 'value': vm.page.logistics_company_id});
                        aoData.push({'name': 'postalcode_query', 'value': vm.page.postalcode_query});
                        aoData.push({'name': 'begin_time_query', 'value': vm.page.begin_time_query});
                        aoData.push({'name': 'end_time_query', 'value': vm.page.end_time_query});

                        $.ajax({
                            "dataType": 'json',
                            "url": sSource,
                            "data": aoData,
                            "success": function (data) {
                                hideMask();

                                if (data.success === false) {
                                    $.msg.error(data.message);
                                    return;
                                }

                                fnCallback(data);
                            }
                        });
                    }
                }
        );
    }

    function initDateTimePicker() {

        $('#begin_time_query').datetimepicker({
            locale: "zh-cn"
        }).on('dp.change', function (ev) {
            vm.page.begin_time_query = $("#begin_time_query").val();
        });

        $('#end_time_query').datetimepicker({
            locale: "zh-cn"
        }).on('dp.change', function (ev) {
            vm.page.end_time_query = $("#end_time_query").val();
        });

    }

    $(function () {
        initDateTimePicker();
        loadPageData();
        initGrid();
    });


</script>
{%footer%}
