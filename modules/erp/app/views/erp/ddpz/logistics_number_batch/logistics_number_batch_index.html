{%header "订单运单号" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddpz-menu">订单配置</li>
            <li class="active" data-menu="ddpz-logisticsnumberbatch-menu">订单运单号</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#logisticsNumberBatchList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showLogisticsNumberBatchDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteLogisticsNumberBatch()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="logisticsNumberBatchList" class="table table-striped table-bordered table-hover"></table>
                    <div class="todo">1、如何使用这些号码；2、操作日志。</div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="logisticsNumberBatchDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">订单运单号详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="logisticsNumberBatchDetailForm">
                                <input id="logistics_number_batch_id" name="detail.number_batch.id" type="hidden" v-model.number="detail.number_batch.id"/>
                                <input id="logistics_number_batch_version" name="detail.number_batch.version" type="hidden" v-model.number="detail.number_batch.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="mode_id" class="col-xs-2 control-label">物流方式</label>
                                            <div class="col-xs-10">
                                                <select id="mode_id" name="detail.number_batch.mode_id" class="input-sm form-control" v-model.number="detail.number_batch.mode_id">
                                                    <template v-for="mode in detail.logistics_mode_list">
                                                        <option :value="mode.id">{{mode.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="prefix" class="col-xs-2 control-label">单号前缀</label>
                                            <div class="col-xs-10">
                                                <input id="prefix" name="detail.number_batch.prefix" type="text" class="input-sm form-control" v-model="detail.number_batch.prefix"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="begin_num" class="col-xs-2 control-label">开始号段</label>
                                            <div class="col-xs-10">
                                                <input id="begin_num" name="detail.number_batch.begin_num" type="text" class="input-sm form-control" v-model.number="detail.number_batch.begin_num"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="end_num" class="col-xs-2 control-label">结束号段</label>
                                            <div class="col-xs-10">
                                                <input id="end_num" name="detail.number_batch.end_num" type="text" class="input-sm form-control" v-model.number="detail.number_batch.end_num"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="suffix" class="col-xs-2 control-label">单号后缀</label>
                                            <div class="col-xs-10">
                                                <input id="suffix" name="detail.number_batch.suffix" type="text" class="input-sm form-control" v-model="detail.number_batch.suffix"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="status_id" class="col-xs-2 control-label">状态</label>
                                            <div class="col-xs-10">
                                                <select id="status_id" name="detail.number_batch.status_id" class="input-sm form-control" v-model.number="detail.number_batch.status_id">
                                                    <template v-for="status in detail.status_list">
                                                        <option :value="status.id">{{status.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveLogisticsNumberBatch()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "number_batch": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#logisticsNumberBatchList',
                {
                    "sAjaxSource": '{%url "ErpLogisticsNumberBatch.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "b.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "m.name", "title": "物流方式", "bSearchable": true},
                        {"mDataProp": "b.prefix", "title": "单号前缀", "bSearchable": true, "bVisible": false},
                        {"mDataProp": "b.suffix", "title": "单号后缀", "bSearchable": true, "bVisible": false},
                        {
                            "mDataProp": "b.begin_num", "title": "开始号段", "bSearchable": false, "width": 200,
                            "render": function (data, type, row) {
                                return row.b.prefix + data + row.b.suffix;
                            }
                        },
                        {
                            "mDataProp": "b.end_num", "title": "结束号段", "bSearchable": false, "width": 200,
                            "render": function (data, type, row) {
                                return row.b.prefix + data + row.b.suffix;
                            }
                        },
                        {"mDataProp": "b.cur_num", "title": "已使用号段", "bSearchable": false, "width": 120},
                        {"mDataProp": "b.remind", "title": "剩余号段", "bSearchable": false, "width": 80},
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": true, "width": 80},
                        {"mDataProp": "b.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "b.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#logisticsNumberBatchList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showLogisticsNumberBatchDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#logisticsNumberBatchList');
            },
            showLogisticsNumberBatchDetail: function (id) {
                showMask("加载中...");
                $("#logisticsNumberBatchDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpLogisticsNumberBatch.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#logisticsNumberBatchDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveLogisticsNumberBatch: function () {
                showMask("提交中...");
                var form = $("#logisticsNumberBatchDetailForm");
                var valid = validate(form, {
                    'detail.number_batch.mode_id': {
                        required: true, digits: true
                    },
                    'detail.number_batch.prefix': {
                        required: true
                    },
                    'detail.number_batch.suffix': {
                        required: true
                    },
                    'detail.number_batch.begin_num': {
                        required: true, digits: true
                    },
                    'detail.number_batch.end_num': {
                        required: true, digits: true
                    },
                    'detail.number_batch.cur_num': {
                        required: true, digits: true
                    },
                    'detail.number_batch.remind': {
                        required: true, digits: true
                    },
                    'detail.number_batch.status_id': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpLogisticsNumberBatch.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#logisticsNumberBatchDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteLogisticsNumberBatch: function () {
                var id_list = [];
                $('#logisticsNumberBatchList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpLogisticsNumberBatch.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
