{%header "订单Hold类型" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddpz-menu">订单配置</li>
            <li class="active" data-menu="ddpz-orderholdtype-menu">订单Hold类型</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#orderHoldTypeList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div>
                    <table id="orderHoldTypeList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="orderHoldTypeDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">订单Hold类型详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="orderHoldTypeDetailForm">
                                <input id="order_hold_type_id" name="detail.order_hold_type.id" type="hidden" v-model.number="detail.order_hold_type.id"/>
                                <input id="order_hold_type_version" name="detail.order_hold_type.version" type="hidden" v-model.number="detail.order_hold_type.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="name" class="col-xs-2 control-label">名称</label>
                                            <div class="col-xs-10">
                                                <input id="name" name="detail.order_hold_type.name" type="text" class="input-sm form-control" v-model="detail.order_hold_type.name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-2 control-label">备注</label>
                                            <div class="col-xs-10">
                                                <textarea id="desc" name="detail.order_hold_type.desc" rows="3" class="input-sm form-control" v-model="detail.order_hold_type.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="icon_file" class="col-xs-2 control-label">图标</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="icon_file" name="detail.order_hold_type.icon_file" type="text" class="input-sm form-control" readonly="readonly" v-model="detail.order_hold_type.icon_file"/>
                                                    <span class="input-group-btn">
                                                        <button class="btn btn-sm btn-purple" type="button" @click="showSelectIcon()">
                                                            <i class="ace-icon fa fa-hand-pointer-o"></i>选择
                                                        </button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="ord" class="col-xs-2 control-label">排序</label>
                                            <div class="col-xs-10">
                                                <input id="ord" name="detail.order_hold_type.ord" type="text" class="input-sm form-control" v-model.number="detail.order_hold_type.ord"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveOrderHoldType()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="selectIconDialog">
        <div class="modal-dialog" style="width: 720px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">选择图标</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12" style="padding: 0;">
                            <div>
                                <table id="selectIconList" class="table table-striped table-bordered table-hover"></table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="selectLittleCateIcon()">
                        <i class="ace-icon fa fa-hand-pointer-o"></i>选择
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "order_hold_type": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#orderHoldTypeList',
                {
                    "sAjaxSource": '{%url "ErpOrderHoldType.ListData"%}',
                    "aaSorting": [[4, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {
                            "mDataProp": "icon_file",
                            "title": "图标",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 60,
                            "render": function (data, type, row) {
                                if (data == "") {
                                    return '<img src="/static/images/icons/noimg.png"  alt="" />'
                                } else {
                                    return '<img src="{% .icon_path %}/' + data + '"  alt="" />'
                                }
                            }
                        },
                        {"mDataProp": "name", "title": "名称", "bSearchable": true, "width": 150},
                        {
                            "mDataProp": "desc", "title": "备注", "bSearchable": true,
                            "render": function (data, type, row) {
                                return "<div style='min-width: 280px;white-space:normal; word-break: break-all; word-wrap:break-word;'>" + data + "</div>";
                            }
                        },
                        {"mDataProp": "ord", "title": "排序", "bSearchable": false, "sClass": "center", "width": 60},
                        {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#orderHoldTypeList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showOrderHoldTypeDetail(id);
            });

            initSingleSelectDataTable(
                '#selectIconList',
                {
                    "sAjaxSource": '{%url "ErpLittleIcon.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>'
                                    + '<input type="hidden" class="icon-file-data" value="' + row.icon_file + '"/>';
                            }
                        },
                        {
                            "mDataProp": "icon_file", "title": "图标", "bSearchable": true,
                            "render": function (data, type, row) {
                                return '<img style="width:20px;height:20px;" src="{%.icon_path%}/' + data + '" alt="' + data + '" />&nbsp;&nbsp;' + data;
                            }
                        },
                        {
                            "mDataProp": "create_time",
                            "title": "创建时间",
                            "bSearchable": false,
                            "width": 120
                        }
                    ]
                }
            );

            $('#selectIconList tbody').on('dblclick', 'tr', function () {
                selectLittleCateIcon();
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#orderHoldTypeList');
            },
            showOrderHoldTypeDetail: function (id) {
                showMask("加载中...");
                $("#orderHoldTypeDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpOrderHoldType.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#orderHoldTypeDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveOrderHoldType: function () {
                showMask("提交中...");
                var form = $("#orderHoldTypeDetailForm");
                var valid = validate(form, {
                    'detail.order_hold_type.name': {
                        required: true
                    },
                    'detail.order_hold_type.desc': {
                        required: true
                    },
                    'detail.order_hold_type.icon_file': {
                        required: false
                    },
                    'detail.order_hold_type.ord': {
                        required: false, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpOrderHoldType.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#orderHoldTypeDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            showSelectIcon: function () {
                $('#selectIconDialog').modal(modalOptions);
            },
            selectLittleCateIcon: function () {
                var icon_file = $('#selectIconList tbody tr>td:first-child input:checkbox:checked').closest("td").find("input.icon-file-data").val();
                vm.detail.order_hold_type.icon_file = icon_file;
                $('#selectIconDialog').modal("hide");
            }
        }
    });
</script>
{%footer%}
