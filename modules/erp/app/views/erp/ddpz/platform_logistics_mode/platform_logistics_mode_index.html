{%header "电商平台物流方式" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddpz-menu">订单配置</li>
            <li class="active" data-menu="ddpz-platformlogisticsmode-menu">电商平台物流方式</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#platformLogisticsModeList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showPlatformLogisticsModeDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deletePlatformLogisticsMode()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="platformLogisticsModeList" class="table table-striped table-bordered table-hover"></table>
                    <div class="todo">与平台对接</div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="platformLogisticsModeDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">电商平台物流方式详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="platformLogisticsModeDetailForm">
                                <input id="platform_logistics_mode_id" name="detail.platform_logistics_mode.id" type="hidden" v-model.number="detail.platform_logistics_mode.id"/>
                                <input id="platform_logistics_mode_version" name="detail.platform_logistics_mode.version" type="hidden" v-model.number="detail.platform_logistics_mode.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="platform_id" class="col-xs-2 control-label no-padding-right">电商平台</label>
                                            <div class="col-xs-10">
                                                <select id="platform_id" name="detail.platform_logistics_mode.platform_id" class="input-sm form-control" v-model.number="detail.platform_logistics_mode.platform_id">
                                                    <template v-for="platform in detail.platform_list">
                                                        <option :value="platform.id">{{platform.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="name" class="col-xs-2 control-label no-padding-right">名称</label>
                                            <div class="col-xs-10">
                                                <input id="name" name="detail.platform_logistics_mode.name" type="text" class="input-sm form-control" v-model="detail.platform_logistics_mode.name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-2 control-label no-padding-right">描述</label>
                                            <div class="col-xs-10">
                                                <textarea id="desc" name="detail.platform_logistics_mode.desc" rows="2" class="input-sm form-control" v-model="detail.platform_logistics_mode.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="savePlatformLogisticsMode()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "platform_logistics_mode": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#platformLogisticsModeList',
                {
                    "sAjaxSource": '{%url "ErpPlatformLogisticsMode.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "m.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "p.name", "title": "电商平台", "bSearchable": true, "width": 200},
                        {"mDataProp": "m.name", "title": "名称", "bSearchable": true, "width": 200},
                        {"mDataProp": "m.desc", "title": "描述", "bSearchable": true},
                        {"mDataProp": "m.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "m.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#platformLogisticsModeList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showPlatformLogisticsModeDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#platformLogisticsModeList');
            },
            showPlatformLogisticsModeDetail: function (id) {
                showMask("加载中...");
                $("#platformLogisticsModeDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpPlatformLogisticsMode.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#platformLogisticsModeDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            savePlatformLogisticsMode: function () {
                showMask("提交中...");
                var form = $("#platformLogisticsModeDetailForm");
                var valid = validate(form, {
                    'detail.platform_logistics_mode.platform_id': {
                        required: true, digits: true
                    },
                    'detail.platform_logistics_mode.name': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.platform_logistics_mode.desc': {
                        required: false, maxlength: 500
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpPlatformLogisticsMode.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#platformLogisticsModeDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deletePlatformLogisticsMode: function () {
                var id_list = [];
                $('#platformLogisticsModeList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpPlatformLogisticsMode.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
