{%header "信封费率" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddpz-menu">订单配置</li>
            <li class="active" data-menu="ddpz-envelopefeerate-menu">信封费率</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#envelopeFeeRateList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showEnvelopeFeeRateDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteEnvelopeFeeRate()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="envelopeFeeRateList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="envelopeFeeRateDetailDialog">
        <div class="modal-dialog" style="width: 780px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">信封费率详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="envelopeFeeRateDetailForm">
                                <input id="envelope_fee_rate_id" name="detail.envelope_fee_rate.id" type="hidden" v-model.number="detail.envelope_fee_rate.id"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="name" class="col-xs-4 control-label">信封名称</label>
                                            <div class="col-xs-8">
                                                <input id="name" name="detail.envelope_fee_rate.name" type="text" class="input-sm form-control" v-model="detail.envelope_fee_rate.name"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="fee" class="col-xs-4 control-label">费用（澳币）</label>
                                            <div class="col-xs-8">
                                                <input id="fee" name="detail.envelope_fee_rate.fee" type="text" class="input-sm form-control" v-model.number="detail.envelope_fee_rate.fee"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="length" class="col-xs-4 control-label">信封长度（cm）</label>
                                            <div class="col-xs-8">
                                                <input id="length" name="detail.envelope_fee_rate.length" type="text" class="input-sm form-control" v-model.number="detail.envelope_fee_rate.length"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="width" class="col-xs-4 control-label">信封宽度（cm）</label>
                                            <div class="col-xs-8">
                                                <input id="width" name="detail.envelope_fee_rate.width" type="text" class="input-sm form-control" v-model.number="detail.envelope_fee_rate.width"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="height" class="col-xs-4 control-label">信封高度（cm）</label>
                                            <div class="col-xs-8">
                                                <input id="height" name="detail.envelope_fee_rate.height" type="text" class="input-sm form-control" v-model.number="detail.envelope_fee_rate.height"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="weight" class="col-xs-4 control-label">信封重量（kg）</label>
                                            <div class="col-xs-8">
                                                <input id="weight" name="detail.envelope_fee_rate.weight" type="text" class="input-sm form-control" v-model.number="detail.envelope_fee_rate.weight"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveEnvelopeFeeRate()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "envelope_fee_rate": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#envelopeFeeRateList',
                {
                    "sAjaxSource": '{%url "ErpEnvelopeFeeRate.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "name", "title": "信封名称", "bSearchable": true},
                        {"mDataProp": "fee", "title": "费用（澳币）", "bSearchable": false, "width": 120},
                        {"mDataProp": "length", "title": "信封长度（cm）", "bSearchable": false, "width": 120},
                        {"mDataProp": "width", "title": "信封宽度（cm）", "bSearchable": false, "width": 120},
                        {"mDataProp": "height", "title": "信封高度（cm）", "bSearchable": false, "width": 120},
                        {"mDataProp": "weight", "title": "信封重量（kg）", "bSearchable": false, "width": 120},
                        {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#envelopeFeeRateList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showEnvelopeFeeRateDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#envelopeFeeRateList');
            },
            showEnvelopeFeeRateDetail: function (id) {
                showMask("加载中...");
                $("#envelopeFeeRateDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpEnvelopeFeeRate.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#envelopeFeeRateDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveEnvelopeFeeRate: function () {
                showMask("提交中...");
                var form = $("#envelopeFeeRateDetailForm");
                var valid = validate(form, {
                    'detail.envelope_fee_rate.name': {
                        required: true
                    },
                    'detail.envelope_fee_rate.length': {
                        required: true, number: true
                    },
                    'detail.envelope_fee_rate.width': {
                        required: true, number: true
                    },
                    'detail.envelope_fee_rate.height': {
                        required: true, number: true
                    },
                    'detail.envelope_fee_rate.weight': {
                        required: true, number: true
                    },
                    'detail.envelope_fee_rate.fee': {
                        required: true, number: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpEnvelopeFeeRate.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#envelopeFeeRateDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteEnvelopeFeeRate: function () {
                var id_list = [];
                $('#envelopeFeeRateList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpEnvelopeFeeRate.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
