{%header "订单自定义类型" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddpz-menu">订单配置</li>
            <li class="active" data-menu="ddpz-ordercustomtype-menu">订单自定义类型</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#orderCustomTypeList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showOrderCustomTypeDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteOrderCustomType()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="orderCustomTypeList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="orderCustomTypeDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">订单自定义类型详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="orderCustomTypeDetailForm">
                                <input id="order_custom_type_id" name="detail.order_type.id" type="hidden" v-model.number="detail.order_type.id"/>
                                <input id="order_custom_type_version" name="detail.order_type.version" type="hidden" v-model.number="detail.order_type.version"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="code" class="col-xs-2 control-label no-padding-right">编号</label>
                                            <div class="col-xs-10">
                                                <input id="code" name="detail.order_type.code" type="text" class="input-sm form-control" v-model="detail.order_type.code"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="name" class="col-xs-2 control-label no-padding-right">名称</label>
                                            <div class="col-xs-10">
                                                <input id="name" name="detail.order_type.name" type="text" class="input-sm form-control" v-model="detail.order_type.name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="color" class="col-xs-2 control-label no-padding-right">颜色</label>
                                            <div class="col-xs-10">
                                                <input id="color" name="detail.order_type.color" type="text" class="input-sm form-control" v-model="detail.order_type.color"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-2 control-label no-padding-right">描述</label>
                                            <div class="col-xs-10">
                                                <input id="desc" name="detail.order_type.desc" type="text" class="input-sm form-control" v-model="detail.order_type.desc"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="status_id" class="col-xs-2 control-label no-padding-right">状态</label>
                                            <div class="col-xs-10">
                                                <input id="status_id" name="detail.order_type.status_id" type="text" class="input-sm form-control" v-model.number="detail.order_type.status_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveOrderCustomType()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "order_type": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#orderCustomTypeList',
                {
                    "sAjaxSource": '{%url "ErpOrderCustomType.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "t.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "t.code", "title": "编号", "bSearchable": true, "width": 100},
                        {"mDataProp": "t.name", "title": "名称", "bSearchable": true, "width": 120},
                        {
                            "mDataProp": "t.color", "title": "颜色", "bSearchable": true, "width": 100,
                            "render": function (data, type, row) {
                                return "<span style='display: inline-block; width: 10px; height: 1em; background-color: " + data + "'></span><span style='display: inline-block;'>&nbsp;" + data + "</span>";
                            }
                        },
                        {"mDataProp": "t.desc", "title": "描述", "bSearchable": true},
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": false, "width": 80},
                        {"mDataProp": "t.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "t.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#orderCustomTypeList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showOrderCustomTypeDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#orderCustomTypeList');
            },
            showOrderCustomTypeDetail: function (id) {
                showMask("加载中...");
                $("#orderCustomTypeDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpOrderCustomType.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#orderCustomTypeDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveOrderCustomType: function () {
                showMask("提交中...");
                var form = $("#orderCustomTypeDetailForm");
                var valid = validate(form, {
                    'detail.order_type.code': {
                        required: true
                    },
                    'detail.order_type.name': {
                        required: true
                    },
                    'detail.order_type.color': {
                        required: true
                    },
                    'detail.order_type.desc': {
                        required: false, maxlength: 500
                    },
                    'detail.order_type.status_id': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpOrderCustomType.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#orderCustomTypeDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteOrderCustomType: function () {
                var id_list = [];
                $('#orderCustomTypeList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpOrderCustomType.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
