{%header "城市邮编" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddpz-menu">ERP</li>
            <li class="active" data-menu="ddpz-citypostcode-menu">城市邮编</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#cityPostcodeList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showCityPostcodeDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteCityPostcode()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="cityPostcodeList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="cityPostcodeDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">城市邮编详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="cityPostcodeDetailForm">
                                <input id="city_postcode_id" name="detail.city_postcode.id" type="hidden" v-model.number="detail.city_postcode.id"/>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="city_id" class="col-xs-2 control-label">城市</label>
                                            <div class="col-xs-10">
                                                <select id="city_id" name="detail.city_postcode.city_id" class="input-sm form-control" v-model.number="detail.city_postcode.city_id">
                                                    <option value="{% .city_id_mel %}">MEL</option>
                                                    <option value="{% .city_id_bne %}">BNE</option>
                                                    <option value="{% .city_id_syd %}">SYD</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="postcode" class="col-xs-2 control-label">邮编</label>
                                            <div class="col-xs-10">
                                                <input id="postcode" name="detail.city_postcode.postcode" type="text" class="input-sm form-control" v-model="detail.city_postcode.postcode"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveCityPostcode()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "city_postcode": {}
            }
        },
        mounted: function () {
            initDataTable(
                    '#cityPostcodeList',
                    {
                        "sAjaxSource": '{%url "ErpCityPostcode.ListData"%}',
                        "aaSorting": [[1, "asc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "city_name", "title": "城市名称", "bSearchable": true, "width": 220},
                            {"mDataProp": "postcode", "title": "邮编", "bSearchable": true},
                            {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                            {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                        ]
                    }
            );

            $('#cityPostcodeList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showCityPostcodeDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#cityPostcodeList');
            },
            showCityPostcodeDetail: function (id) {
                showMask("加载中...");
                $("#cityPostcodeDetailForm").clearValidation();
                $.ajax({
                    url: '{%url "ErpCityPostcode.DetailData" %}',
                    type: "POST",
                    data: {
                        "id": id
                    },
                    success: function (result) {
                        hideMask();
                        if (result.success == false) {
                            $.msg.error(result.message);
                            return;
                        }
                        vm.detail = result;
                        $('#cityPostcodeDetailDialog').modal(modalOptions);
                    }
                });
            },
            saveCityPostcode: function () {
                showMask("提交中...");
                var form = $("#cityPostcodeDetailForm");
                var valid = validate(form, {
                    'detail.city_postcode.city_id': {
                        required: true, digits: true
                    },
                    'detail.city_postcode.postcode': {
                        required: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                        url: '{%url "ErpCityPostcode.Save"%}',
                        type: "POST",
                        processData: false,
                        contentType: 'application/json',
                        data: JSON.stringify(vm.detail),
                        success: function (data) {
                            hideMask();
                            if (data.success == false) {
                                $.msg.error(data.message);
                                //return;
                            }
                            else {
                                $.msg.show(data.message);
                                $('#cityPostcodeDetailDialog').modal('hide');
                                vm.reloadList();
                                //return;
                            }
                        }
                    });
                }
            },
            deleteCityPostcode: function () {
                var id_list = [];
                $('#cityPostcodeList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpCityPostcode.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
