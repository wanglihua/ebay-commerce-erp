{%header "物流方式" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddpz-menu">商品配置</li>
            <li class="active" data-menu="ddpz-logisticsmode-menu">物流方式</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#logisticsModeList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showLogisticsModeDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteLogisticsMode()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                    <button id="btnImport" class="btn btn-success btn-sm">
                        <i class="ace-icon fa fa-plus"></i>
                        导入
                    </button>
                    <div style="margin-top: 10px;">
                        <a href="/static/excel-template/logistics_mode_import.xlsx">下载Excel模板</a>
                    </div>
                </div>
                <div>
                    <div style="margin-top:10px;">双击列表项查看更多详细物流参数</div>
                    <table id="logisticsModeList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="logisticsModeDetailDialog">
        <div class="modal-dialog" style="width: 760px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">物流方式详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="logisticsModeDetailForm">
                                <input id="logistics_mode_id" name="detail.logistics_mode.id" type="hidden" v-model.number="detail.logistics_mode.id"/>
                                <input id="logistics_mode_version" name="detail.logistics_mode.version" type="hidden" v-model.number="detail.logistics_mode.version"/>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="company_id" class="col-xs-6 control-label">物流公司</label>
                                            <div class="col-xs-6">
                                                <select id="company_id" name="detail.logistics_mode.company_id" class="input-sm form-control" v-model.number="detail.logistics_mode.company_id">
                                                    <template v-for="company in detail.logistics_company_list">
                                                        <option :value="company.id">{{company.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="stock_id" class="col-xs-6 control-label">仓库</label>
                                            <div class="col-xs-6">
                                                <select id="stock_id" name="detail.logistics_mode.stock_id" class="input-sm form-control" v-model.number="detail.logistics_mode.stock_id">
                                                    <template v-for="stock in detail.stock_list">
                                                        <option :value="stock.id">{{stock.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="name" class="col-xs-3 control-label">物流方式名称</label>
                                            <div class="col-xs-9">
                                                <input id="name" name="detail.logistics_mode.name" type="text" class="input-sm form-control" v-model="detail.logistics_mode.name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="sfkltjz" class="col-xs-6 control-label">是否考虑体积重</label>
                                            <div class="col-xs-6">
                                                <select id="sfkltjz" name="detail.logistics_mode.sfkltjz" class="input-sm form-control" v-model.number="detail.logistics_mode.sfkltjz">
                                                    <option :value="1">是</option>
                                                    <option :value="0">否</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="tjzgs" class="col-xs-6 control-label">体积重公式分母</label>
                                            <div class="col-xs-6">
                                                <input id="tjzgs" name="detail.logistics_mode.tjzgs" type="text" class="input-sm form-control" v-model.number="detail.logistics_mode.tjzgs" placeholder="x*y*z/4000 就填 4000"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="tjzxs" class="col-xs-6 control-label">体积重系数</label>
                                            <div class="col-xs-6">
                                                <input id="tjzxs" name="detail.logistics_mode.tjzxs" type="text" class="input-sm form-control" v-model.number="detail.logistics_mode.tjzxs"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="tjzysjzqx" class="col-xs-6 control-label">体积重与实际重取向</label>
                                            <div class="col-xs-6">
                                                <select id="tjzysjzqx" name="detail.logistics_mode.tjzysjzqx" class="input-sm form-control" v-model.number="detail.logistics_mode.tjzysjzqx">
                                                    <option :value="1">取大</option>
                                                    <option :value="2">取小</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="zlsfybzyq" class="col-xs-6 control-label">体积重与实际重是否有比值要求</label>
                                            <div class="col-xs-6">
                                                <select id="zlsfybzyq" name="detail.logistics_mode.zlsfybzyq" class="input-sm form-control" v-model.number="detail.logistics_mode.zlsfybzyq">
                                                    <option :value="1">是</option>
                                                    <option :value="0">否</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="tjzsjzbz" class="col-xs-6 control-label">体积重/实际重比值</label>
                                            <div class="col-xs-6">
                                                <input id="tjzsjzbz" name="detail.logistics_mode.tjzsjzbz" type="text" class="input-sm form-control" v-model.number="detail.logistics_mode.tjzsjzbz"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="zcbsfyxz" class="col-xs-6 control-label">最长边是否有限制</label>
                                            <div class="col-xs-6">
                                                <select id="zcbsfyxz" name="detail.logistics_mode.zcbsfyxz" class="input-sm form-control" v-model.number="detail.logistics_mode.zcbsfyxz">
                                                    <option :value="1">是</option>
                                                    <option :value="0">否</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="zcbxzcd" class="col-xs-6 control-label">最长边限制长度（cm)</label>
                                            <div class="col-xs-6">
                                                <input id="zcbxzcd" name="detail.logistics_mode.zcbxzcd" type="text" class="input-sm form-control" v-model.number="detail.logistics_mode.zcbxzcd"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="zlsfyxz" class="col-xs-6 control-label">重量是否有限制</label>
                                            <div class="col-xs-6">
                                                <select id="zlsfyxz" name="detail.logistics_mode.zlsfyxz" class="input-sm form-control" v-model.number="detail.logistics_mode.zlsfyxz">
                                                    <option :value="1">是</option>
                                                    <option :value="0">否</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="zlbncg" class="col-xs-6 control-label">重量不能超过（Kg)</label>
                                            <div class="col-xs-6">
                                                <input id="zlbncg" name="detail.logistics_mode.zlbncg" type="text" class="input-sm form-control" v-model.number="detail.logistics_mode.zlbncg"/>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="sfyxcc" class="col-xs-6 control-label">是否允许超长</label>
                                            <div class="col-xs-6">
                                                <select id="sfyxcc" name="detail.logistics_mode.sfyxcc" class="input-sm form-control" v-model.number="detail.logistics_mode.sfyxcc">
                                                    <option :value="1">是</option>
                                                    <option :value="0">否</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="ccjsyf" class="col-xs-6 control-label">超长加收多少运费（澳币）</label>
                                            <div class="col-xs-6">
                                                <input id="ccjsyf" name="detail.logistics_mode.ccjsyf" type="text" class="input-sm form-control" v-model.number="detail.logistics_mode.ccjsyf"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6"></div>
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="ccsfjt" class="col-xs-6 control-label">超长收费阶梯（cm）</label>
                                            <div class="col-xs-6">
                                                <input id="ccsfjt" name="detail.logistics_mode.czjsyf" type="text" class="input-sm form-control" v-model.number="detail.logistics_mode.ccsfjt"/>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="sfyxcz" class="col-xs-6 control-label">是否允许超重</label>
                                            <div class="col-xs-6">
                                                <select id="sfyxcz" name="detail.logistics_mode.sfyxcz" class="input-sm form-control" v-model.number="detail.logistics_mode.sfyxcz">
                                                    <option :value="1">是</option>
                                                    <option :value="0">否</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="czjsyf" class="col-xs-6 control-label">超重加收多少运费（澳币）</label>
                                            <div class="col-xs-6">
                                                <input id="czjsyf" name="detail.logistics_mode.czjsyf" type="text" class="input-sm form-control" v-model.number="detail.logistics_mode.czjsyf"/>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-3 control-label">描述</label>
                                            <div class="col-xs-9">
                                                <textarea id="desc" name="detail.logistics_mode.desc" rows="2" class="input-sm form-control" v-model="detail.logistics_mode.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveLogisticsMode()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="/static/lib/plupload/moxie.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/plupload.min.js"></script>
<script type="text/javascript" src="/static/lib/plupload/zh_CN.js"></script>

<script type="text/javascript">

    function init_uploader() {
        var uploader = new plupload.Uploader({
            runtimes: 'html5,flash,html4',
            multi_selection: false,

            browse_button: 'btnImport',
            file_data_name: "excel_file",

            url: '{%url "ErpLogisticsMode.Import"%}',
            max_file_size: '10000kb',

            filters: [
                {title: "Excel文件", extensions: "xlsx"}
            ],

            flash_swf_url: '/plupload/js/Moxie.swf',

            init: {
                FilesAdded: function () {
                    uploader.start();
                },
                FileUploaded: function (up, file, response) {
                    var result = JSON.parse(response.response);
                    if (result.success != true) {
                        $.msg.error(result.message);
                    } else {
                        reloadList('#logisticsModeList');
                        $.msg.show(result.message);
                    }
                },
                Error: function (up, err) {
                    $.msg.error("上传发生错误：" + err.code + ", " + err.message);
                }
            }
        });

        uploader.init();
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "logistics_mode": {},
                "logistics_company_list": []
            }
        },
        mounted: function () {
            initDataTable(
                '#logisticsModeList',
                {
                    "sAjaxSource": '{%url "ErpLogisticsMode.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "m.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "c.name", "title": "物流公司", "bSearchable": true, "width": 160},
                        {"mDataProp": "s.name", "title": "仓库", "bSearchable": true, "width": 160},
                        {"mDataProp": "m.name", "title": "物流方式名称", "bSearchable": true},
                        {
                            "mDataProp": "m.sfkltjz", "title": "考虑体积重", "bSearchable": false, "width": 120,
                            "render": function (data, type, row) {
                                if (data == 0) {
                                    return "否";
                                }
                                else {
                                    return "是";
                                }
                            }
                        },
                        {
                            "mDataProp": "m.zcbsfyxz", "title": "最长边是否有限制", "bSearchable": false, "width": 130,
                            "render": function (data, type, row) {
                                if (data == 0) {
                                    return "否";
                                }
                                else {
                                    return "是";
                                }
                            }
                        },
                        {
                            "mDataProp": "m.zlsfyxz", "title": "重量是否有限制", "bSearchable": false, "width": 120,
                            "render": function (data, type, row) {
                                if (data == 0) {
                                    return "否";
                                }
                                else {
                                    return "是";
                                }
                            }
                        },
                        {
                            "mDataProp": "m.sfyxcc", "title": "是否允许超长", "bSearchable": false, "width": 120,
                            "render": function (data, type, row) {
                                if (data == 0) {
                                    return "否";
                                }
                                else {
                                    return "是";
                                }
                            }
                        },
                        {
                            "mDataProp": "m.sfyxcz", "title": "是否允许超重", "bSearchable": false, "width": 120,
                            "render": function (data, type, row) {
                                if (data == 0) {
                                    return "否";
                                }
                                else {
                                    return "是";
                                }
                            }
                        },

                        /*
                         {"mDataProp": "m.tjzgs", "title": "体积重公式", "bSearchable": false },
                         {"mDataProp": "m.tjzxs", "title": "体积重系数", "bSearchable": false },
                         {"mDataProp": "m.tjzysjzqx", "title": "体积重与实际重取向", "bSearchable": false },
                         {"mDataProp": "m.sfkltjz", "title": "体积重与实际重是否有比值要求", "bSearchable": false },
                         {"mDataProp": "m.tjzsjzbz", "title": "体积重/实际重比值", "bSearchable": false },
                         {"mDataProp": "m.zlbncg", "title": "重量不能超过（Kg)", "bSearchable": false },
                         {"mDataProp": "m.ccjsyf", "title": "超长加收多少运费（澳币）", "bSearchable": false },
                         {"mDataProp": "m.czjsyf", "title": "超重加收多少运费（澳币）", "bSearchable": false },
                         {"mDataProp": "m.desc", "title": "描述", "bSearchable": true},
                         */

                        {"mDataProp": "m.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "m.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#logisticsModeList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showLogisticsModeDetail(id);
            });

            init_uploader();
        },
        methods: {
            reloadList: function () {
                reloadList('#logisticsModeList');
            },
            showLogisticsModeDetail: function (id) {
                showMask("加载中...");
                $("#logisticsModeDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpLogisticsMode.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#logisticsModeDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveLogisticsMode: function () {
                showMask("提交中...");
                var form = $("#logisticsModeDetailForm");
                var valid = validate(form, {
                    'detail.logistics_mode.company_id': {
                        required: true, digits: true
                    },
                    'detail.logistics_mode.name': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.logistics_mode.sfkltjz': {
                        required: true, number: true
                    },
                    'detail.logistics_mode.tjzgs': {
                        required: true, number: true
                    },
                    'detail.logistics_mode.tjzxs': {
                        required: true, number: true
                    },
                    'detail.logistics_mode.tjzysjzqx': {
                        required: true, digits: true
                    },
                    'detail.logistics_mode.zlsfybzyq': {
                        required: true, number: true
                    },
                    'detail.logistics_mode.tjzsjzbz': {
                        required: true, number: true
                    },
                    'detail.logistics_mode.zcbsfyxz': {
                        required: true, number: true
                    },
                    'detail.logistics_mode.zlsfyxz': {
                        required: true, number: true
                    },
                    'detail.logistics_mode.zlbncg': {
                        required: true, number: true
                    },
                    'detail.logistics_mode.sfyxcc': {
                        required: true, number: true
                    },
                    'detail.logistics_mode.ccjsyf': {
                        required: true, number: true
                    },
                    'detail.logistics_mode.sfyxcz': {
                        required: true, number: true
                    },
                    'detail.logistics_mode.czjsyf': {
                        required: true, number: true
                    },
                    'detail.logistics_mode.desc': {
                        required: false, maxlength: 500
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpLogisticsMode.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#logisticsModeDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteLogisticsMode: function () {
                var id_list = [];
                $('#logisticsModeList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("将同时删除关联的费率数据，确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpLogisticsMode.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
