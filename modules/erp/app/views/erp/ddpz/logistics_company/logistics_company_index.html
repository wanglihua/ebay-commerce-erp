{%header "物流公司" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="ddpz-menu">订单配置</li>
            <li class="active" data-menu="ddpz-logisticscompany-menu">物流公司</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#logisticsCompanyList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showLogisticsCompanyDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteLogisticsCompany()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="logisticsCompanyList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="logisticsCompanyDetailDialog">
        <div class="modal-dialog" style="width: 640px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">物流公司详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="logisticsCompanyDetailForm">
                                <input id="logistics_company_id" name="detail.logistics_company.id" type="hidden" v-model.number="detail.logistics_company.id"/>
                                <input id="logistics_company_version" name="detail.logistics_company.version" type="hidden" v-model.number="detail.logistics_company.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="name" class="col-xs-2 control-label">名称</label>
                                            <div class="col-xs-10">
                                                <input id="name" name="detail.logistics_company.name" type="text" class="input-sm form-control" v-model="detail.logistics_company.name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-2 control-label">描述</label>
                                            <div class="col-xs-10">
                                                <textarea id="desc" name="detail.logistics_company.desc" rows="3" class="input-sm form-control" v-model="detail.logistics_company.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="address_special_word" class="col-xs-2 control-label">地址特殊字段</label>
                                            <div class="col-xs-10">
                                                <select id="address_special_word" name="detail.logistics_company.address_special_word" class="input-sm form-control" v-model.number="detail.logistics_company.address_special_word">
                                                    <option :value="0">否</option>
                                                    <option :value="1">是</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="status_id" class="col-xs-2 control-label">状态</label>
                                            <div class="col-xs-10">
                                                <select id="status_id" name="detail.logistics_company.status_id" class="input-sm form-control" v-model.number="detail.logistics_company.status_id">
                                                    <template v-for="status in detail.status_list">
                                                        <option :value="status.id">{{status.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="icon_file" class="col-xs-2 control-label">图标</label>
                                            <div class="col-xs-10">
                                                <div class="input-group">
                                                    <input id="icon_file" name="detail.logistics_company.icon_file" type="text" class="input-sm form-control" readonly="readonly" v-model="detail.logistics_company.icon_file"/>
                                                    <span class="input-group-btn">
                                                        <button class="btn btn-sm btn-purple" type="button" @click="showSelectIcon()">
                                                            <i class="ace-icon fa fa-hand-pointer-o"></i>选择
                                                        </button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="ord" class="col-xs-2 control-label">排序</label>
                                            <div class="col-xs-10">
                                                <input id="ord" name="detail.logistics_company.ord" type="text" class="input-sm form-control" v-model.number="detail.logistics_company.ord"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveLogisticsCompany()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="selectIconDialog">
        <div class="modal-dialog" style="width: 720px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">选择图标</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12" style="padding: 0;">
                            <div>
                                <table id="selectIconList" class="table table-striped table-bordered table-hover"></table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="selectLittleIcon()">
                        <i class="ace-icon fa fa-hand-pointer-o"></i>选择
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "logistics_company": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#logisticsCompanyList',
                {
                    "sAjaxSource": '{%url "ErpLogisticsCompany.ListData"%}',
                    "aaSorting": [[6, "asc"], [1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "lc.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "lc.name", "title": "名称", "bSearchable": true, "width": 250},
                        {"mDataProp": "lc.desc", "title": "描述", "bSearchable": true},
                        {
                            "mDataProp": "lc.address_special_word",
                            "title": "地址特殊字段",
                            "bSearchable": true,
                            "width": 110,
                            "render": function (data, type, row) {
                                if (data == 1) {
                                    return "是";
                                }
                                return "否";
                            }
                        },
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": true, "width": 80},
                        {
                            "mDataProp": "lc.icon_file",
                            "title": "图标",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 120,
                            "render": function (data, type, row) {
                                if (data == "") {
                                    return '<img style="height:24px;" src="/static/images/icons/noimg.png"  alt="" />'
                                } else {
                                    return '<img style="height:24px;" src="{% .icon_path %}/' + data + '"  alt="" />'
                                }
                            }
                        },
                        {"mDataProp": "lc.ord", "title": "排序", "bSearchable": false, "sClass": "center", "width": 60},
                        {"mDataProp": "lc.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "lc.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#logisticsCompanyList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showLogisticsCompanyDetail(id);
            });

            initSingleSelectDataTable(
                '#selectIconList',
                {
                    "sAjaxSource": '{%url "ErpLittleIcon.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>'
                                    + '<input type="hidden" class="icon-file-data" value="' + row.icon_file + '"/>';
                            }
                        },
                        {
                            "mDataProp": "icon_file", "title": "图标", "bSearchable": true,
                            "render": function (data, type, row) {
                                return '<img style="height:24px;" src="{%.icon_path%}/' + data + '" alt="' + data + '" />&nbsp;&nbsp;' + data;
                            }
                        },
                        {
                            "mDataProp": "create_time",
                            "title": "创建时间",
                            "bSearchable": false,
                            "width": 120
                        }
                    ]
                }
            );

            $('#selectIconList tbody').on('dblclick', 'tr', function () {
                selectLittleIcon();
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#logisticsCompanyList');
            },
            showLogisticsCompanyDetail: function (id) {
                showMask("加载中...");
                $("#logisticsCompanyDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpLogisticsCompany.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#logisticsCompanyDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveLogisticsCompany: function () {
                showMask("提交中...");
                var form = $("#logisticsCompanyDetailForm");
                var valid = validate(form, {
                    'detail.logistics_company.name': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.logistics_company.desc': {
                        required: false, maxlength: 500
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpLogisticsCompany.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#logisticsCompanyDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteLogisticsCompany: function () {
                var id_list = [];
                $('#logisticsCompanyList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpLogisticsCompany.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            },
            showSelectIcon: function () {
                $('#selectIconDialog').modal(modalOptions);
            },
            selectLittleIcon: function () {
                var icon_file = $('#selectIconList tbody tr>td:first-child input:checkbox:checked').closest("td").find("input.icon-file-data").val();
                vm.detail.logistics_company.icon_file = icon_file;
                $('#selectIconDialog').modal("hide");
            }
        }
    });
</script>
{%footer%}
