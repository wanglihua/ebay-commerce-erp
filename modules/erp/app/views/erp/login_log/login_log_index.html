{%header "系统日志" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xtpz-menu">系统配置</li>
            <li class="active" data-menu="xtpz-loginlog-menu">系统日志</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#loginLogList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div>
                    <table id="loginLogList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "login_log": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#loginLogList',
                {
                    "sAjaxSource": '{%url "ErpLoginLog.ListData"%}',
                    "aaSorting": [[2, "desc"]],
                    "aoColumns": [
                        {"mDataProp": "login_name", "title": "工号", "bSearchable": true, "width": 150},
                        {"mDataProp": "ip_address", "title": "IP", "bSearchable": true, "width": 150},
                        {"mDataProp": "create_time", "title": "操作时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "content", "title": "内容", "bSearchable": true, "width": 200},
                        {"mDataProp": "desc", "title": "描述", "bSearchable": true}
                    ]
                }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#loginLogList');
            }
        }
    });
</script>
{%footer%}
