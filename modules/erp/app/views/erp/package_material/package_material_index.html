{%header "包材类型" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="sppz-menu">商品配置</li>
            <li class="active" data-menu="sppz-packagematerial-menu">包材类型</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#packageMaterialList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showPackageMaterialDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deletePackageMaterial()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="packageMaterialList" class="table table-striped table-bordered table-hover"></table>
                    <div class="todo">包材修改日志</div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="packageMaterialDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">包材详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="packageMaterialDetailForm">
                                <input id="package_material_id" name="detail.package_material.id" type="hidden" v-model.number="detail.package_material.id"/>
                                <input id="package_material_version" name="detail.package_material.version" type="hidden" v-model.number="detail.package_material.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="name" class="col-xs-1 control-label no-padding-right">名称</label>
                                            <div class="col-xs-11">
                                                <input id="name" name="detail.package_material.name" type="text" class="input-sm form-control" v-model="detail.package_material.name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="desc" class="col-xs-1 control-label no-padding-right">描述</label>
                                            <div class="col-xs-11">
                                                <textarea id="desc" name="detail.package_material.desc" rows="2" class="input-sm form-control" v-model="detail.package_material.desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="level" class="col-xs-2 control-label no-padding-right">级别</label>
                                            <div class="col-xs-10">
                                                <select id="level" name="detail.package_material.level" class="input-sm form-control" v-model.number="detail.package_material.level">
                                                    <option :value="1">1</option>
                                                    <option :value="2">2</option>
                                                    <option :value="3">3</option>
                                                    <option :value="4">4</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="length" class="col-xs-2 control-label no-padding-right">长(cm)</label>
                                            <div class="col-xs-10">
                                                <input id="length" name="detail.package_material.length" type="text" class="input-sm form-control" v-model.number="detail.package_material.length"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="width" class="col-xs-2 control-label no-padding-right">宽(cm)</label>
                                            <div class="col-xs-10">
                                                <input id="width" name="detail.package_material.width" type="text" class="input-sm form-control" v-model.number="detail.package_material.width"/>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="height" class="col-xs-2 control-label no-padding-right">高(cm)</label>
                                            <div class="col-xs-10">
                                                <input id="height" name="detail.package_material.height" type="text" class="input-sm form-control" v-model.number="detail.package_material.height"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="weight" class="col-xs-2 control-label no-padding-right">重量(克)</label>
                                            <div class="col-xs-10">
                                                <input id="weight" name="detail.package_material.weight" type="text" class="input-sm form-control" v-model.number="detail.package_material.weight"/>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="price" class="col-xs-2 control-label no-padding-right">价格(元)</label>
                                            <div class="col-xs-10">
                                                <input id="price" name="detail.package_material.price" type="text" class="input-sm form-control" v-model.number="detail.package_material.price"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="status_id" class="col-xs-2 control-label no-padding-right">状态</label>
                                            <div class="col-xs-10">
                                                <select id="status_id" name="detail.package_material.status_id" class="input-sm form-control" v-model.number="detail.package_material.status_id">
                                                    <template v-for="status in detail.status_list">
                                                        <option :value="status.id">{{status.name}}</option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="savePackageMaterial()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "package_material": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#packageMaterialList',
                {
                    "sAjaxSource": '{%url "ErpPackageMaterial.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "p.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "p.name", "title": "名称", "bSearchable": true, "width": 130},
                        {"mDataProp": "p.desc", "title": "描述", "bSearchable": true},
                        {"mDataProp": "p.level", "title": "级别", "bSearchable": false, "width": 60},
                        {"mDataProp": "p.length", "title": "长(cm)", "bSearchable": false, "width": 80},
                        {"mDataProp": "p.width", "title": "宽(cm)", "bSearchable": false, "width": 80},
                        {"mDataProp": "p.height", "title": "高(cm)", "bSearchable": false, "width": 80},
                        {"mDataProp": "p.weight", "title": "重量(克)", "bSearchable": false, "width": 80},
                        {"mDataProp": "p.price", "title": "价格(元)", "bSearchable": false, "width": 80},
                        {"mDataProp": "s.name", "title": "状态", "bSearchable": false, "width": 80},
                        {"mDataProp": "p.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "p.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#packageMaterialList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showPackageMaterialDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#packageMaterialList');
            },
            showPackageMaterialDetail: function (id) {
                showMask("加载中...");
                $("#packageMaterialDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "ErpPackageMaterial.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#packageMaterialDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            savePackageMaterial: function () {
                showMask("提交中...");
                var form = $("#packageMaterialDetailForm");
                var valid = validate(form, {
                    'detail.package_material.name': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.package_material.desc': {
                        required: false, maxlength: 500
                    },
                    'detail.package_material.level': {
                        required: true, digits: true
                    },
                    'detail.package_material.length': {
                        required: true, number: true
                    },
                    'detail.package_material.width': {
                        required: true, number: true
                    },
                    'detail.package_material.height': {
                        required: true, number: true
                    },
                    'detail.package_material.weight': {
                        required: true, number: true
                    },
                    'detail.package_material.price': {
                        required: true, number: true
                    },
                    'detail.package_material.status_id': {
                        required: true, digits: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "ErpPackageMaterial.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#packageMaterialDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deletePackageMaterial: function () {
                var id_list = [];
                $('#packageMaterialList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "ErpPackageMaterial.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
