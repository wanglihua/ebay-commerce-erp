{%header "消息" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xxgl-menu">消息管理</li>
            <li class="active" data-menu="xxgl-all-message-menu">所有消息</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#messageList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div class="row" style="margin-top: 20px;margin-bottom: 20px;">
                    <div id="query" class="col-xs-12" style="line-height: 28px;">
                        <div class="col-xs-12">
                            <label class="control-label no-padding-right" for="item_id_query">Item Id</label>
                            <input class="input-sm" id="item_id_query" name="item_id_query" placeholder="Item Id" type="text" style="width: 130px;"/>

                            <label class="control-label no-padding-right" for="sku_query">SKU</label>
                            <input class="input-sm" id="sku_query" name="sku_query" placeholder="SKU" type="text" style="width: 130px;"/>

                            <label for="service_user_id_query">客服负责人</label>
                            <select id="service_user_id_query" name="service_user_id_query" style="height: 30px; width: 130px;">
                                <option value="0">--客服负责人--</option>
                                {% range $index, $user := .service_user_list %}
                                <option value="{% $user.Id %}">{% $user.LoginName %}（{% $user.NickName %}）</option>
                                {% end %}
                            </select>

                            <label class="control-label no-padding-right" for="sender_id_query">发送者</label>
                            <input class="input-sm" id="sender_id_query" name="sender_id_query" placeholder="发送者" type="text" style="width: 130px;"/>

                            <label class="control-label no-padding-right" for="recipient_id_query">接收者</label>
                            <input class="input-sm" id="recipient_id_query" name="recipient_id_query" placeholder="接收者" type="text" style="width: 130px;"/>

                            <button class="btn btn-primary btn-sm" @click="refreshList();">
                                <i class="ace-icon fa fa-search"></i>
                                查询
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <table id="messageList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="messageReplyDialogWrapper"></div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {},
        mounted: function () {
            var this_vm = this;

            initDataTable(
                    '#messageList',
                    {
                        "sAjaxSource": '{%url "ErpMessage.ListData"%}',
                        "aaSorting": [[1, "desc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "msg.id",
                                "bSearchable": false,
                                "orderable": false,
                                "sClass": "center",
                                "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {
                                "mDataProp": "msg.last_modified_date", "title": "店铺/item id/sku/ <br />销售负责人/创建/修改时间", "bSearchable": false, "bSortable": false, "sClass": "center", "width": 120,
                                "render": function (data, type, row) {
                                    var view_item_url = row.psi.view_item_url;

                                    var psu_name = "--------";
                                    if (row.psu && row.psu.nick_name && row.psu.login_name) {
                                        psu_name = row.psu.nick_name + "(" + row.psu.login_name + ")";
                                    }

                                    if (view_item_url === "") {
                                        return "<div>" + row.pf.name + "&nbsp;" + row.sa.name + "</div><div>" + row.msg.item_id + "</div><div><a href='/product/detail/" + row.p.id + "' target='product_detail'>" + row.msg.sku + "</a></div><div>" + psu_name + "</div><div>" + row.msg.creation_date + "</div><div>" + row.msg.last_modified_date + "</div>";
                                    } else {
                                        return "<div>" + row.pf.name + "&nbsp;" + row.sa.name + "</div><div><a href='" + view_item_url + "' target='_blank'>" + row.msg.item_id + "</a></div><div><a href='/product/detail/" + row.p.id + "' target='product_detail'>" + row.msg.sku + "</a></div><div>" + psu_name + "</div><div>" + row.msg.creation_date + "</div><div>" + row.msg.last_modified_date + "</div>";
                                    }
                                }
                            },
                            {
                                "mDataProp": "msg.subject", "title": "主题/内容", "bSearchable": true, "bSortable": false,
                                "render": function (data, type, row) {
                                    return "<div style='min-width: 280px;white-space:normal; word-break: break-all; word-wrap:break-word;'>" + row.msg.subject + "<br/><br/>" + row.msg.body + "</div>";
                                }
                            },
                            {
                                "mDataProp": "s.name", "title": "状态<br/>发送者/接收者", "bSearchable": true, "sClass": "center", "width": 120,
                                "render": function (data, type, row) {
                                    return "<div>" + row.s.name + "&nbsp;<a class='btn btn-xs btn-info btn-inline' onclick='showReply(" + row.msg.id + ");' ><i class='ace-icon fa fa-reply'></i>回复</a></div><div>" + row.msg.sender_id + "</div><div>" + row.msg.recipient_id + "</div>";
                                }
                            }
                        ],
                        "fnServerData": function (sSource, aoData, fnCallback) {
                            aoData.push({'name': 'shop_id_query', 'value': $("#shop_id_query").val()});
                            aoData.push({'name': 'item_id_query', 'value': $("#item_id_query").val()});
                            aoData.push({'name': 'sku_query', 'value': $("#sku_query").val()});
                            aoData.push({'name': 'service_user_id_query', 'value': $("#service_user_id_query").val()});
                            aoData.push({'name': 'sender_id_query', 'value': $("#sender_id_query").val()});
                            aoData.push({'name': 'recipient_id_query', 'value': $("#recipient_id_query").val()});

                            showMask("数据加载中，请稍候");
                            $.ajax({
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }

                                    fnCallback(data);
                                }
                            });
                        }
                    }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#messageList');
            },
            refreshList: function () {
                refreshList('#messageList');
            }
        }
    });

    function showReply(message_id) {
        $.ajax({
            "url": '{% url "ErpMessage.ShowReply" %}',
            "data": {
                "message_id": message_id
            },
            "success": function (data) {
                if (data.success === false) {
                    $.msg.error(data.message);
                    return;
                }

                var messageReplyDialogWrapper = $("#messageReplyDialogWrapper");
                messageReplyDialogWrapper.html("");
                messageReplyDialogWrapper.html(data);

                $("#messageReplyDialog").modal(modalOptions);
            }
        });
    }

    function reply() {
        var message_id = $("#message_id").val();
        var message_body = $("#message_body").val();

        $.ajax({
            "dataType": 'json',
            "url": '{% url "ErpMessage.Reply" %}',
            "data": {
                "message_id": message_id,
                "message_body": message_body
            },
            "success": function (data) {
                if (data.success === false) {
                    $.msg.error(data.message);
                    return;
                }
                else {
                    $("#messageReplyDialog").modal("hide");
                    vm.reloadList();
                    $.msg.show(data.message);
                    return;
                }
            }
        });
    }

</script>
{%footer%}
