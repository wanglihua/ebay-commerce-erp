{%header "消息" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="xxgl-menu">消息管理</li>
            <li class="active" data-menu="xxgl-all-message-menu">所有消息</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#messageList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                </div>
                <div>
                    <table id="messageList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "page": {
                "shop_id_query": 0
            },
            "detail": {
                "message": {}
            }
        },
        mounted: function () {
            var this_vm = this;

            initDataTable(
                    '#messageList',
                    {
                        "sAjaxSource": '{%url "ErpMessage.ListData"%}',
                        "aaSorting": [[1, "desc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "msg.id",
                                "bSearchable": false,
                                "orderable": false,
                                "sClass": "center",
                                "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {
                                "mDataProp": "msg.last_modified_date", "title": "店铺/item id/sku<br/>创建/修改时间", "bSearchable": false, "bSortable": false, "sClass": "center", "width": 120,
                                "render": function (data, type, row) {
                                    return "<div>" + row.pf.name + "&nbsp;" + row.sa.name + "</div><div><a href='" + row.psi.view_item_url + "' target='_blank'>" + row.msg.item_id + "</a></div><div><a href='/product/detail/" + row.p.id + "' target='product_detail'>" + row.msg.sku + "</a></div>" + row.msg.creation_date + "</div><div>" + row.msg.last_modified_date + "</div>";
                                }
                            },
                            {
                                "mDataProp": "msg.subject", "title": "主题/内容", "bSearchable": true, "bSortable": false,
                                "render": function (data, type, row) {
                                    return "<div style='min-width: 280px;white-space:normal; word-break: break-all; word-wrap:break-word;'>" + row.msg.subject + "<br/><br/>" + row.msg.body + "</div>";
                                }
                            },
                            {
                                "mDataProp": "s.name", "title": "状态<br/>发送者/接收者", "bSearchable": true, "sClass": "center", "width": 120,
                                "render": function (data, type, row) {
                                    return "<div>" + row.s.name + "</div><div>" + row.msg.sender_id + "</div><div>" + row.msg.recipient_id + "</div>";
                                }
                            }
                        ],
                        "fnServerData": function (sSource, aoData, fnCallback) {
                            aoData.push({'name': 'shop_id_query', 'value': this_vm.page.shop_id_query});
                            aoData.push({'name': 'item_id_query', 'value': this_vm.page.item_id_query});
                            aoData.push({'name': 'sku_query', 'value': this_vm.page.sku_query});
                            aoData.push({'name': 'sender_id_query', 'value': this_vm.page.sender_id_query});
                            aoData.push({'name': 'recipient_id_query', 'value': this_vm.page.recipient_id_query});

                            showMask("数据加载中，请稍候");
                            $.ajax({
                                "dataType": 'json',
                                "url": sSource,
                                "data": aoData,
                                "success": function (data) {
                                    hideMask();
                                    if (data.success === false) {
                                        $.msg.error(data.message);
                                        return;
                                    }

                                    fnCallback(data.gridData);
                                }
                            });
                        }
                    }
            );
        },
        methods: {
            reloadList: function () {
                reloadList('#messageList');
            }
        }
    });


</script>
{%footer%}
