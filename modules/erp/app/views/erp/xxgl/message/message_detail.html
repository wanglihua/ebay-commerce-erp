{% site_header "消息详细" . %}

<style type="text/css">
    label.control-label {
        height: 28px;
        line-height: 18px;
        padding: 5px 4px;
        text-align: right;
    }

    a.data_link {
        height: 28px;
        line-height: 28px;
        text-decoration: underline;
    }
</style>
<div class="main-container" id="main-container">
    <div id="message_detail" style="width: 1024px;margin-left: auto;margin-right: auto;">

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="smaller">消息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <form class="form-horizontal" role="form" id="messageReplyForm">
                        <input id="message_id" name="message_id" type="hidden" value="{% .message.Message.Id %}"/>
                        <div class="row">
                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="sender_id" class="col-xs-4 control-label">发送者：</label>
                                    <div class="col-xs-8">
                                        <input id="sender_id" name="sender_id" type="text" class="input-sm form-control" value="{% .message.Message.SenderId %}" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="recipient_id" class="col-xs-4 control-label">接收者：</label>
                                    <div class="col-xs-8">
                                        <input id="recipient_id" name="recipient_id" type="text" class="input-sm form-control" value="{% .message.Message.RecipientId %}" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="last_modified_date" class="col-xs-4 control-label">消息时间：</label>
                                    <div class="col-xs-8">
                                        <input id="last_modified_date" name="last_modified_date" type="text" class="input-sm form-control" value="{% .message.MsgLastModifyDate %}" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xs-3">
                                <div class="form-group">
                                    <label for="status_name" class="col-xs-4 control-label">状态：</label>
                                    <div class="col-xs-8">
                                        <input id="status_name" name="status_name" type="text" class="input-sm form-control" value="{% .message.Status.Name %}" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-xs-12">
                                <div class="form-group">
                                    <label for="subject" class="col-xs-1 control-label">主题：</label>
                                    <div class="col-xs-11">
                                        <textarea id="subject" name="subject" class="input-sm form-control" disabled="disabled"> {%.message.Message.Subject%}</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-xs-12">
                                <div class="form-group">
                                    <label for="msg_body" class="col-xs-1 control-label">正文：</label>
                                    <div class="col-xs-11">
                                        <textarea id="msg_body" name="msg_body" class="input-sm form-control" disabled="disabled"> {%.message.Message.Body%}</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-xs-12">
                                <div class="form-group">
                                    <label for="msg_reply" class="col-xs-1 control-label">回复：</label>
                                    <div class="col-xs-11">
                                        <textarea id="msg_reply" name="msg_reply" rows="3" class="input-sm form-control"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-xs-12" style="text-align: right;">
                                <button type="button" class="btn btn-success btn-sm" onclick="reply()">
                                    <i class="ace-icon fa fa-floppy-o"></i>回复
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="widget-box" style="margin-top: 20px;">
            <div class="widget-header">
                <h4 class="smaller">商品信息</h4>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <div class="row">
                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="shop_name" class="col-xs-4 control-label">店铺：</label>
                                <div class="col-xs-8">
                                    <input id="shop_name" name="shop_name" type="text" class="input-sm form-control" value="{% .message.ECommercePlatform.Name %} {% .message.ShopAccount.Name %}" disabled="disabled"/>
                                </div>
                            </div>
                        </div>

                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="item_id" class="col-xs-4 control-label">Item ID：</label>
                                <div class="col-xs-8">
                                    <a id="item_id" class="data_link" href="{% .message.ProductStoreItem.ViewItemUrl %}" target="ebay_item">{% .message.Message.ItemId %}</a>
                                </div>
                            </div>
                        </div>

                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="product_sku" class="col-xs-4 control-label">SKU：</label>
                                <div class="col-xs-8">
                                    <a id="product_sku" class="data_link" href="/product/detail/{% .message.Product.Id %}" target="product_detail">{% .message.Product.Sku %}</a>
                                </div>
                            </div>
                        </div>

                        <div class="col-xs-3">
                            <div class="form-group">
                                <label for="product_status" class="col-xs-4 control-label">状态：</label>
                                <div class="col-xs-8">
                                    <input id="product_status" name="status_name" type="text" class="input-sm form-control" value="" disabled="disabled"/>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-xs-12">
                            <div class="form-group">
                                <label for="subject" class="col-xs-1 control-label">主题：</label>
                                <div class="col-xs-11">
                                    <textarea id="subject" name="subject" class="input-sm form-control" disabled="disabled"> {%.message.Message.Subject%}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-xs-12">
                            <div class="form-group">
                                <label for="msg_body" class="col-xs-1 control-label">正文：</label>
                                <div class="col-xs-11">
                                    <textarea id="msg_body" name="msg_body" class="input-sm form-control" disabled="disabled"> {%.message.Message.Body%}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">

    function reply() {

        var form = $("#messageReplyForm");
        var valid = validate(form, {
            'message_body': {
                required: true, minlength: 2
            }
        });

        if (!valid) {
            return;
        }

        var message_id = $("#message_id").val();
        var message_body = $("#message_body").val();

        showMask("操作进行中，请稍候");

        $.ajax({
            "dataType": 'json',
            "url": '{% url "ErpMessage.Reply" %}',
            "data": {
                "message_id": message_id,
                "message_body": message_body
            },
            "success": function (data) {
                hideMask();

                if (data.success === false) {
                    $.msg.error(data.message);
                    return;
                }
                else {
                    $("#messageReplyDialog").modal("hide");
                    vm.reloadList();
                    $.msg.show(data.message);
                    return;
                }
            }
        });
    }
</script>
{% site_footer %}
