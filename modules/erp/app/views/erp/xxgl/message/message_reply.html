<div class="modal fade" id="messageReplyDialog">
    <div class="modal-dialog" style="width: 680px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                <h4 class="modal-title">消息回复</h4>
            </div>
            <div class="modal-body clearfix">
                <div class="row">
                    <div class="col-xs-12">
                        <form class="form-horizontal" role="form" id="messageReplyForm">
                            <input id="message_id" name="message_id" type="hidden" value="{% .message.Message.Id %}"/>
                            <div class="row">
                                <div class="col-xs-12">
                                    <label class="control-label">原消息</label>
                                    <div style="line-height: 18px;">
                                        <div>
                                            {%.message.Message.Subject%}
                                        </div>
                                        <div>
                                            {%.message.Message.Body%}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-xs-12">
                                    <div class="form-group">
                                        <div class="col-xs-12">
                                            <label for="message_body" class="control-label">回复</label>
                                            <textarea id="message_body" name="message_body" rows="3" class="input-sm form-control"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success btn-sm" onclick="reply()">
                    <i class="ace-icon fa fa-floppy-o"></i>回复
                </button>
                <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                    <i class="ace-icon fa fa-times"></i>关闭
                </button>
            </div>
        </div>
    </div>
</div>
