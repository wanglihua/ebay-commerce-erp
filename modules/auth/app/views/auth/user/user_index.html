{%header "用户管理" .%}

<div class="breadcrumbs" id="breadcrumbs">
    <ul class="breadcrumb">
        <li>
            <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
        </li>
        <li class="parent" data-menu="auth-menu">权限管理</li>
        <li class="active" data-menu="auth-user-menu">用户管理</li>
    </ul>
</div>
<div class="page-content">
    <div class="row">
        <div class="col-xs-12" style="padding: 0;">
            <div class="gridToolBar clearfix">
                <button class="btn btn-primary btn-sm" onclick="reloadList('#userList')">
                    <i class="ace-icon fa fa-refresh"></i>
                    刷新
                </button>
                <button class="btn btn-success btn-sm" onclick="showUserDetail(0)">
                    <i class="ace-icon fa fa-plus"></i>
                    新增
                </button>
                <button class="btn btn-purple btn-sm" onclick="showUserPassRes()">
                    <i class="ace-icon fa fa-gavel"></i>
                    权限
                </button>
                <button class="btn btn-danger btn-sm" onclick="deleteUser()">
                    <i class="ace-icon fa fa-trash-o"></i>
                    删除
                </button>
            </div>
            <div>
                <table id="userList" class="table table-striped table-bordered table-hover">
                    <thead>
                    <tr>
                        <th rowspan="2"></th>
                        <th rowspan="2">工号</th>
                        <th rowspan="2">姓名</th>
                        <th rowspan="2">性别</th>
                        <th rowspan="2">联系电话</th>
                        <th id="thTime" colspan="2">
                            <div id="headerCreateTime"></div>
                            <div id="headerModifyTime"></div>
                        </th>
                    </tr>
                    <tr>
                        <th id="thCreateTime">创建时间</th>
                        <th id="thModifyTime">修改时间</th>
                    </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
            <div id="userDetailDialogWrapper"></div>
            <script type="text/javascript">
                function showUserDetail(id) {
                    $.ajax({
                            url: '{%url "AuthUser.Detail" %}',
                            type: "POST",
                            data: {
                                "id": id
                            },
                            success: function (result) {
                                if (result.success == false) {
                                    $.msg.error(result.message);
                                    return;
                                }
                                $("#userDetailDialogWrapper").html(result);
                                $('#userDetailDialog').modal(modalOptions);
                            }
                        }
                    );
                }

                function showUserPassRes() {
                    var user_list = [];
                    $('#userList').find('tbody tr>td:first-child input:checkbox').each(function () {
                        if (this.checked) {
                            //user_list.push($(this).val());
                            user_list.push("user[]=" + $(this).val());
                        }
                    });

                    if (user_list.length == 0) {
                        $.msg.alert("请选择数据！");
                        return;
                    }

                    //AuthUserPassRes.Index
                    var url = '{%url "AuthUserPassRes.Index" %}?';
                    url = url + user_list.join("&");
                    //window.location.href = url;
                    window.open(url, "_blank");
                }

                function deleteUser() {
                    var id_list = [];
                    $('#userList').find('tbody tr>td:first-child input:checkbox').each(function () {
                        if (this.checked) {
                            id_list.push($(this).val());
                        }
                    });

                    if (id_list.length == 0) {
                        $.msg.alert("请选择数据！");
                        return;
                    }

                    $.msg.confirm("确认要删除吗？", function () {
                        $.ajax({
                            url: '{%url "AuthUser.Delete"%}',
                            type: "POST",
                            data: {"id_list": id_list},
                            success: function (data) {
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    return;
                                }
                                else {
                                    $.msg.show(data.message);
                                }
                                reloadList('#userList');
                            }
                        });
                    });
                }

                $(function () {
                    initDataTable(
                        '#userList',
                        {
                            "sAjaxSource": '{%url "AuthUser.ListData"%}',
                            "aaSorting": [[1, "asc"]],
                            "aoColumns": [
                                {
                                    "mDataProp": "id",
                                    "bSearchable": false,
                                    "orderable": false,
                                    "sClass": "center",
                                    "width": 50,
                                    "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                    "render": function (data, type, row) {
                                        return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                    }
                                },
                                {"mDataProp": "login_name", "bSearchable": true, "width": 120},
                                {"mDataProp": "nick_name", "bSearchable": true, "width": 120},
                                {"mDataProp": "sex", "bSearchable": true, "width": 70},
                                {"mDataProp": "phone", "bSearchable": true},
                                {
                                    "mDataProp": "create_time",
                                    "bSearchable": false,
                                    "render": function (data, type, row) {
                                        return '<div class="tdCreateTime">' + row.create_time + '</div><div>' + row.update_time + '</div>';
                                    }
                                },
                                {
                                    "mDataProp": "update_time",
                                    "bSearchable": false,
                                    "render": function (data, type, row) {
                                        return '<span class="spanUpdateTime"></span>';
                                    }
                                }
                            ],
                            "fnServerData": function (sSource, aoData, fnCallback) {
                                showMask("数据加载中，请稍候");
                                $.ajax(
                                    {
                                        "dataType": 'json',
                                        "url": sSource,
                                        "data": aoData,
                                        "success": function (data) {
                                            hideMask();
                                            if (data.success == false) {
                                                $.msg.error(data.message);
                                                return;
                                            }
                                            fnCallback(data);

                                            $(".spanUpdateTime").parent().css("display", "none");
                                            $(".tdCreateTime").parent().css("width", "120px");
                                        }
                                    });
                            }
                        }
                    );

                    $("#headerCreateTime").append($("#thCreateTime"));
                    $("#headerModifyTime").append($("#thModifyTime"));

                    $('#userList tbody').on('dblclick', 'tr', function () {
                        var id = $(this).find('td:first-child input:checkbox').val();
                        showUserDetail(id);
                    });
                });
            </script>

        </div>
    </div>
</div>
{%footer%}
