{%header "缺陷附件" .%}
<div id="page">
   <div class="breadcrumbs" id="breadcrumbs">
       <ul class="breadcrumb">
           <li>
               <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
           </li>
           <li class="parent" data-menu="track-menu">缺陷跟踪</li>
           <li class="active" data-menu="track-issueattach-menu">缺陷附件</li>
       </ul>
   </div>
   <div class="page-content">
       <div class="row">
           <div class="col-xs-12" style="padding: 0;">
               <div class="gridToolBar clearfix">
                   <button class="btn btn-primary btn-sm" @click="reloadList('#issueAttachList')">
                       <i class="ace-icon fa fa-refresh"></i>
                       刷新
                   </button>
                   <button class="btn btn-success btn-sm" @click="showIssueAttachDetail(0)">
                       <i class="ace-icon fa fa-plus"></i>
                       新增
                   </button>
                   <button class="btn btn-danger btn-sm" @click="deleteIssueAttach()">
                       <i class="ace-icon fa fa-trash-o"></i>
                       删除
                   </button>
               </div>
               <div>
                   <table id="issueAttachList" class="table table-striped table-bordered table-hover"></table>
               </div>
           </div>
       </div>
   </div>
    <div class="modal fade" id="issueAttachDetailDialog">
        <div class="modal-dialog" style="width: 680px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">缺陷附件详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="issueAttachDetailForm">
                                <input id="issue_attach_id" name="detail.issue_attach.id" type="hidden" v-model.number="detail.issue_attach.id"/>
                                <input id="issue_attach_version" name="detail.issue_attach.version" type="hidden" v-model.number="detail.issue_attach.version"/>
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="issue_id" class="col-xs-2 control-label">缺陷id</label>
                                            <div class="col-xs-10">
                                                <input id="issue_id" name="detail.issue_attach.issue_id" type="text" class="input-sm form-control" v-model="detail.issue_attach.issue_id"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="type" class="col-xs-2 control-label">类型</label>
                                            <div class="col-xs-10">
                                                <input id="type" name="detail.issue_attach.type" type="text" class="input-sm form-control" v-model="detail.issue_attach.type"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="dir_name" class="col-xs-2 control-label">路径名</label>
                                            <div class="col-xs-10">
                                                <input id="dir_name" name="detail.issue_attach.dir_name" type="text" class="input-sm form-control" v-model="detail.issue_attach.dir_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="file_name" class="col-xs-2 control-label">文件名</label>
                                            <div class="col-xs-10">
                                                <input id="file_name" name="detail.issue_attach.file_name" type="text" class="input-sm form-control" v-model="detail.issue_attach.file_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="status" class="col-xs-2 control-label">状态</label>
                                            <div class="col-xs-10">
                                                <input id="status" name="detail.issue_attach.status" type="text" class="input-sm form-control" v-model="detail.issue_attach.status"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="create_time" class="col-xs-2 control-label">Create_time</label>
                                            <div class="col-xs-10">
                                                <input id="create_time" name="detail.issue_attach.create_time" type="text" class="input-sm form-control" v-model="detail.issue_attach.create_time"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="form-group">
                                            <label for="update_time" class="col-xs-2 control-label">Update_time</label>
                                            <div class="col-xs-10">
                                                <input id="update_time" name="detail.issue_attach.update_time" type="text" class="input-sm form-control" v-model="detail.issue_attach.update_time"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveIssueAttach()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "issue_attach": {}
            }
        },
        mounted: function () {
            initDataTable(
                    '#issueAttachList',
                    {
                        "sAjaxSource": '{%url "TrackIssueAttach.ListData"%}',
                        "aaSorting": [[1, "asc"]],
                        "aoColumns": [
                            {
                                "mDataProp": "id", "bSearchable": false, "orderable": false, "sClass": "center", "width": 50,
                                "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                                "render": function (data, type, row) {
                                    return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                                }
                            },
                            {"mDataProp": "issue_id", "title": "缺陷id", "bSearchable": true },
                            {"mDataProp": "type", "title": "类型", "bSearchable": true },
                            {"mDataProp": "dir_name", "title": "路径名", "bSearchable": true },
                            {"mDataProp": "file_name", "title": "文件名", "bSearchable": true },
                            {"mDataProp": "status", "title": "状态", "bSearchable": true },
                            {"mDataProp": "create_time", "title": "Create_time", "bSearchable": false },
                            {"mDataProp": "update_time", "title": "Update_time", "bSearchable": false },
                            {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120 },
                            {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120 }
                        ]
                   }
            );

            $('#issueAttachList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showIssueAttachDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#issueAttachList');
            },
            showIssueAttachDetail: function (id) {
                showMask("加载中...");
                $("#issueAttachDetailForm").clearValidation();
                $.ajax({
                           url: '{%url "TrackIssueAttach.DetailData" %}',
                           type: "POST",
                           data: {
                               "id": id
                           },
                           success: function (result) {
                               hideMask();
                               if (result.success == false) {
                                   $.msg.error(result.message);
                                   return;
                               }
                               vm.detail = result;
                               $('#issueAttachDetailDialog').modal(modalOptions);
                           }
                       }
                );
            },
            saveIssueAttach: function () {
                showMask("提交中...");
                var form = $("#issueAttachDetailForm");
                var valid = validate(form, {  
                    'detail.issue_attach.issue_id': {
                        required: true
                    },
                    'detail.issue_attach.type': {
                        required: true
                    },
                    'detail.issue_attach.dir_name': {
                        required: true
                    },
                    'detail.issue_attach.file_name': {
                        required: true
                    },
                    'detail.issue_attach.status': {
                        required: true
                    },
                    'detail.issue_attach.create_time': {
                        required: true
                    },
                    'detail.issue_attach.update_time': {
                        required: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                               url: '{%url "TrackIssueAttach.Save"%}',
                               type: "POST",
                               processData: false,
                               contentType: 'application/json',
                               data: JSON.stringify(vm.detail),
                               success: function (data) {
                                   hideMask();
                                   if (data.success == false) {
                                       $.msg.error(data.message);
                                       //return;
                                   }
                                   else {
                                       $.msg.show(data.message);
                                       $('#issueAttachDetailDialog').modal('hide');
                                       vm.reloadList();
                                       //return;
                                   }
                               }
                           }
                    );
                }
            },
            deleteIssueAttach: function () {
                var id_list = [];
                $('#issueAttachList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                               url: '{%url "TrackIssueAttach.Delete"%}',
                               type: "POST",
                               data: {"id_list": id_list},
                               success: function (data) {
                                   if (data.success == false) {
                                       $.msg.error(data.message);
                                       return;
                                   }
                                   else {
                                       $.msg.show(data.message);
                                   }
                                   vm.reloadList();
                               }
                           });
                });
            }
        }
    });
</script>
{%footer%}
