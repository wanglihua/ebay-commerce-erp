{%header "软件缺陷" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="track-menu">缺陷跟踪</li>
            <li class="active" data-menu="track-issue-menu">软件缺陷</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#issueList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showIssueAdd()">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteIssue()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="issueList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">

    function reloadIssueList() {
        reloadList('#issueList');
    }

    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "issue": {}
            }
        },
        mounted: function () {
            initSingleSelectDataTable(
                '#issueList',
                {
                    "sAjaxSource": '{%url "TrackIssue.ListData"%}',
                    "aaSorting": [[8, "desc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "ti.id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {
                            "mDataProp": "ti.id", "title": "编号", "bSearchable": false, "width": 80,
                            "render": function (data, type, row) {
                                return "#" + data;
                            }
                        },
                        {"mDataProp": "tit.type_name", "title": "类型", "bSearchable": true, "width": 100},
                        {
                            "mDataProp": "ti.title", "title": "标题", "bSearchable": true,
                            "render": function (data, type, row) {
                                return "<div style='min-width: 280px;white-space:normal; word-break: break-all; word-wrap:break-word;'><a target='_blank' href='/track/issue/" + row.ti.id + "'>" + data + "</a></div>";
                            }
                        },
                        {"mDataProp": "tic.cate_name", "title": "类别", "bSearchable": true, "width": 180},
                        {"mDataProp": "ti.submit_user_name", "title": "提报人", "bSearchable": true, "width": 100},
                        {"mDataProp": "ti.enter_user_name", "title": "录入人", "bSearchable": true, "width": 100},
                        {"mDataProp": "tis.status_name", "title": "状态", "bSearchable": true, "width": 100},
                        {"mDataProp": "ti.create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "ti.update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#issueList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showIssueDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#issueList');
            },
            showIssueAdd: function () {
                window.open('{%url "TrackIssue.Add" %}');
            },
            deleteIssue: function () {
                var id_list = [];
                $('#issueList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length === 0) {
                    $.msg.alert("请选择一条数据！");
                    return;
                }

                if (id_list.length > 1) {
                    $.msg.alert("请选择一条数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "TrackIssue.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success === false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
