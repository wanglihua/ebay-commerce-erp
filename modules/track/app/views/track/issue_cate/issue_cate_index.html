{%header "缺陷类别" .%}
<div id="page">
    <div class="breadcrumbs" id="breadcrumbs">
        <ul class="breadcrumb">
            <li>
                <a href='{%url "Home.Index"%}'><i class="ace-icon fa fa-home home-icon"></i></a>
            </li>
            <li class="parent" data-menu="track-menu">缺陷跟踪</li>
            <li class="active" data-menu="track-issuecate-menu">缺陷类别</li>
        </ul>
    </div>
    <div class="page-content">
        <div class="row">
            <div class="col-xs-12" style="padding: 0;">
                <div class="gridToolBar clearfix">
                    <button class="btn btn-primary btn-sm" @click="reloadList('#issueCateList')">
                        <i class="ace-icon fa fa-refresh"></i>
                        刷新
                    </button>
                    <button class="btn btn-success btn-sm" @click="showIssueCateDetail(0)">
                        <i class="ace-icon fa fa-plus"></i>
                        新增
                    </button>
                    <button class="btn btn-danger btn-sm" @click="deleteIssueCate()">
                        <i class="ace-icon fa fa-trash-o"></i>
                        删除
                    </button>
                </div>
                <div>
                    <table id="issueCateList" class="table table-striped table-bordered table-hover"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="issueCateDetailDialog">
        <div class="modal-dialog" style="width: 480px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="True">&times;</button>
                    <h4 class="modal-title">缺陷类别详细</h4>
                </div>
                <div class="modal-body clearfix">
                    <div class="row">
                        <div class="col-xs-12">
                            <form class="form-horizontal" role="form" id="issueCateDetailForm">
                                <input id="issue_cate_id" name="detail.issue_cate.id" type="hidden" v-model.number="detail.issue_cate.id"/>
                                <input id="issue_cate_version" name="detail.issue_cate.version" type="hidden" v-model.number="detail.issue_cate.version"/>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="cate_name" class="col-xs-2 control-label">名称</label>
                                            <div class="col-xs-10">
                                                <input id="cate_name" name="detail.issue_cate.cate_name" type="text" class="input-sm form-control" v-model="detail.issue_cate.cate_name"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="form-group">
                                            <label for="cate_desc" class="col-xs-2 control-label">描述</label>
                                            <div class="col-xs-10">
                                                <textarea id="cate_desc" name="detail.issue_cate.cate_desc" rows="3"  class="input-sm form-control" v-model="detail.issue_cate.cate_desc"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" @click="saveIssueCate()">
                        <i class="ace-icon fa fa-floppy-o"></i>保存
                    </button>
                    <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">
                        <i class="ace-icon fa fa-times"></i>关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var vm = new Vue({
        el: "#page",
        data: {
            "detail": {
                "issue_cate": {}
            }
        },
        mounted: function () {
            initDataTable(
                '#issueCateList',
                {
                    "sAjaxSource": '{%url "TrackIssueCate.ListData"%}',
                    "aaSorting": [[1, "asc"]],
                    "aoColumns": [
                        {
                            "mDataProp": "id",
                            "bSearchable": false,
                            "orderable": false,
                            "sClass": "center",
                            "width": 50,
                            "title": '<input type="checkbox" class="ace checkall"/><span class="lbl"></span>',
                            "render": function (data, type, row) {
                                return '<input type="checkbox" class="ace" value="' + data + '"/><span class="lbl"></span>';
                            }
                        },
                        {"mDataProp": "cate_name", "title": "名称", "bSearchable": true, "width": 180},
                        {"mDataProp": "cate_desc", "title": "描述", "bSearchable": true},
                        {"mDataProp": "create_time", "title": "创建时间", "bSearchable": false, "width": 120},
                        {"mDataProp": "update_time", "title": "修改时间", "bSearchable": false, "width": 120}
                    ]
                }
            );

            $('#issueCateList tbody').on('dblclick', 'tr', function () {
                var id = $(this).find('td:first-child input:checkbox').val();
                vm.showIssueCateDetail(id);
            });
        },
        methods: {
            reloadList: function () {
                reloadList('#issueCateList');
            },
            showIssueCateDetail: function (id) {
                showMask("加载中...");
                $("#issueCateDetailForm").clearValidation();
                $.ajax({
                        url: '{%url "TrackIssueCate.DetailData" %}',
                        type: "POST",
                        data: {
                            "id": id
                        },
                        success: function (result) {
                            hideMask();
                            if (result.success == false) {
                                $.msg.error(result.message);
                                return;
                            }
                            vm.detail = result;
                            $('#issueCateDetailDialog').modal(modalOptions);
                        }
                    }
                );
            },
            saveIssueCate: function () {
                showMask("提交中...");
                var form = $("#issueCateDetailForm");
                var valid = validate(form, {
                    'detail.issue_cate.cate_name': {
                        required: true, minlength: 2, maxlength: 100
                    },
                    'detail.issue_cate.cate_desc': {
                        required: true, minlength: 2, maxlength: 4000
                    },
                    'detail.issue_cate.create_time': {
                        required: true
                    },
                    'detail.issue_cate.update_time': {
                        required: true
                    }
                });

                if (!valid) {
                    hideMask();
                } else {
                    $.ajax({
                            url: '{%url "TrackIssueCate.Save"%}',
                            type: "POST",
                            processData: false,
                            contentType: 'application/json',
                            data: JSON.stringify(vm.detail),
                            success: function (data) {
                                hideMask();
                                if (data.success == false) {
                                    $.msg.error(data.message);
                                    //return;
                                }
                                else {
                                    $.msg.show(data.message);
                                    $('#issueCateDetailDialog').modal('hide');
                                    vm.reloadList();
                                    //return;
                                }
                            }
                        }
                    );
                }
            },
            deleteIssueCate: function () {
                var id_list = [];
                $('#issueCateList tbody tr>td:first-child input:checkbox').each(function () {
                    if (this.checked) {
                        id_list.push($(this).val());
                    }
                });

                if (id_list.length == 0) {
                    $.msg.alert("请选择数据！");
                    return;
                }

                $.msg.confirm("确认要删除吗？", function () {
                    $.ajax({
                        url: '{%url "TrackIssueCate.Delete"%}',
                        type: "POST",
                        data: {"id_list": id_list},
                        success: function (data) {
                            if (data.success == false) {
                                $.msg.error(data.message);
                                return;
                            }
                            else {
                                $.msg.show(data.message);
                            }
                            vm.reloadList();
                        }
                    });
                });
            }
        }
    });
</script>
{%footer%}
